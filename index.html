  background:linear-gradient(90deg,var(--gold),var(--goldL));
  width:0%;transition:width .3s;}
.rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.rp-label{font-size:12px;opacity:.75;letter-spacing:3px;}

/* ============== Hamburger (mobile) ============== */
#sbToggle{display:none;position:fixed;left:14px;top:14px;z-index:101;
  width:42px;height:42px;border-radius:50%;border:0;
  background:var(--sbBg);color:var(--gold);font-size:20px;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.3);}

/* ============== Main ============== */
.main{max-width:1100px;margin:0 auto;padding:0 32px 80px;}

/* ============== Hero ============== */
.site-hero{
  background:linear-gradient(135deg,#1e1a14 0%,#2a2218 50%,#1e1a14 100%);
  color:#fff;padding:90px 40px 80px;margin:0 -32px 0;
  text-align:center;position:relative;overflow:hidden;
  border-bottom:3px solid var(--gold);}
.site-hero::before{
  content:&quot;般若&quot;;position:absolute;
  font-size:480px;font-weight:900;color:#fff;opacity:.025;
  top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:&quot;Noto Serif TC&quot;,serif;letter-spacing:60px;pointer-events:none;}
.site-hero::after{
  content:&quot;曇無竭&quot;;position:absolute;bottom:30px;right:40px;
  font-size:160px;font-weight:900;color:var(--gold);opacity:.04;
  font-family:&quot;Noto Serif TC&quot;,serif;pointer-events:none;}
.hero-meta{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:18px;
  letter-spacing:6px;color:var(--goldL);opacity:.85;margin-bottom:12px;}
.hero-title{font-size:56px;font-weight:900;letter-spacing:8px;
  color:#fff;margin-bottom:16px;line-height:1.3;}
.hero-sub{font-size:18px;letter-spacing:3px;color:var(--goldL);
  margin-bottom:24px;font-family:&quot;Noto Sans TC&quot;,sans-serif;}
.hero-eng{font-size:14px;letter-spacing:4px;color:#bfa56b;
  opacity:.7;font-style:italic;margin-bottom:30px;
  font-family:Georgia,serif;}
.hero-byline{font-size:17px;color:#d4c4a8;opacity:.88;
  letter-spacing:2px;line-height:2;}
.hero-byline span{display:inline-block;margin:0 14px;}
.hero-range{margin-top:30px;display:inline-block;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:17px;letter-spacing:3px;
  border:1px solid var(--gold);color:var(--gold);
  padding:8px 24px;border-radius:30px;}

/* ============== Preface ============== */
.preface{margin:50px auto 0;max-width:920px;padding:32px 36px;
  background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:12px;box-shadow:0 3px 14px rgba(91,58,41,.08);}
.preface-title{font-size:30px;color:var(--accent);font-weight:700;
  letter-spacing:4px;margin-bottom:20px;text-align:center;
  position:relative;padding-bottom:14px;}
.preface-title::after{content:&quot;&quot;;position:absolute;bottom:0;left:50%;
  transform:translateX(-50%);width:60px;height:2px;background:var(--gold);}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);
  margin-bottom:14px;text-indent:2em;}
.preface p:last-child{margin-bottom:0;}

/* ============== TOC ============== */
.toc-section{margin:50px auto;max-width:1100px;padding:0;}
.toc-title{font-size:34px;color:var(--accent);font-weight:700;
  letter-spacing:8px;text-align:center;margin-bottom:14px;
  position:relative;padding-bottom:16px;}
.toc-title::after{content:&quot;&quot;;position:absolute;bottom:0;left:50%;
  transform:translateX(-50%);width:80px;height:2px;background:var(--gold);}
.toc-desc{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:17px;
  letter-spacing:3px;color:var(--text-muted);text-align:center;margin-bottom:36px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));
  gap:18px;padding:0 8px;}
.toc-card{background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:20px 22px;
  display:flex;align-items:center;gap:18px;
  text-decoration:none;color:var(--text);
  transition:all .3s;cursor:pointer;
  box-shadow:0 2px 8px rgba(91,58,41,.06);}
.toc-card:hover{transform:translateY(-3px);
  box-shadow:0 6px 18px rgba(184,134,11,.18);
  border-color:var(--gold);}
.toc-num{flex-shrink:0;width:42px;height:42px;border-radius:50%;
  background:var(--gold);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:18px;font-weight:700;
  box-shadow:0 2px 6px rgba(184,134,11,.3);}
.toc-name{font-size:19.5px;font-weight:600;color:var(--text);
  line-height:1.55;flex:1;}
.toc-name .toc-sub{display:block;font-size:14px;color:var(--text-muted);
  font-weight:400;margin-top:3px;letter-spacing:1px;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;}

/* ============== Chapter ============== */
.chapter{margin:60px 0 0;scroll-margin-top:30px;}
.ch-head{background:var(--headGrad);color:#fff;
  padding:50px 40px;border-radius:14px 14px 0 0;
  text-align:center;position:relative;overflow:hidden;
  border-bottom:3px solid var(--gold);}
.ch-head::before{
  content:&quot;&quot;;position:absolute;top:-20px;right:-20px;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,var(--gold) 0%,transparent 70%);
  opacity:.15;pointer-events:none;}
.ch-num{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:18px;
  letter-spacing:5px;color:var(--goldL);opacity:.9;margin-bottom:14px;}
.ch-name{font-size:34px;font-weight:900;letter-spacing:4px;
  color:#fff;line-height:1.4;margin-bottom:14px;}
.ch-sub{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:17px;
  letter-spacing:2.5px;color:var(--goldL);opacity:.92;line-height:1.7;}
.ch-body{background:var(--card);
  border:1px solid var(--border);border-top:0;
  border-radius:0 0 14px 14px;
  padding:46px 50px;max-width:980px;margin:0 auto;}

/* ============== H2, H3, etc. ============== */
.ch-body h2{font-size:30px;color:var(--accent);font-weight:700;
  letter-spacing:3px;margin:36px 0 18px;
  padding:10px 0 10px 20px;border-left:4px solid var(--gold);
  background:linear-gradient(90deg,rgba(184,134,11,.08),transparent);
  line-height:1.5;}
.ch-body h2:first-child{margin-top:0;}
.ch-body h3{font-size:23.5px;color:var(--accent);font-weight:600;
  margin:28px 0 12px;padding-bottom:6px;
  border-bottom:1px solid var(--border-light);letter-spacing:2px;}
.ch-body h4{font-size:20px;color:var(--text2);font-weight:600;
  margin:20px 0 10px;letter-spacing:1.5px;}
.ch-body h5{font-size:18.5px;color:var(--gold);font-weight:600;
  margin:14px 0 8px;letter-spacing:1px;}
.ch-body p{margin:0 0 12px;line-height:1.9;font-size:20px;
  color:var(--text);}
.ch-body p:last-child{margin-bottom:0;}
.ch-body strong,.ch-body b{color:var(--accent-red);font-weight:700;}

/* ============== Classical Text ============== */
.classical-text{
  background:#FFFDF5;border:1px solid #E8E0D0;border-radius:10px;
  padding:22px 28px;margin:18px 0;line-height:2.1;font-size:20px;
  color:#3a2c1c;position:relative;}
.text-label{display:inline-block;background:var(--accent);color:#fff;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:13.5px;
  padding:4px 14px;border-radius:14px;letter-spacing:3px;
  margin-bottom:14px;font-weight:500;}
.classical-text p{font-size:20px;line-height:2.1;color:#3a2c1c;
  margin-bottom:10px;text-indent:2em;}
.classical-text p.no-indent{text-indent:0;}

/* ============== Verse / Gatha ============== */
.verse,.gatha,blockquote{
  background:var(--verseBg);border-left:4px solid var(--verseBd);
  padding:18px 26px;margin:16px 0;line-height:2.2;font-size:22px;
  white-space:normal;text-align:center;color:var(--text);
  border-radius:0 8px 8px 0;}

/* ============== QA ============== */
.qa{margin:20px 0;}
.qa .q{background:#f0f5fa;border-left:4px solid #5a8db5;
  padding:14px 22px;margin-bottom:8px;border-radius:0 8px 8px 0;
  color:#2a4a6a;font-size:20px;line-height:1.9;}
.qa .a{background:#faf3e8;border-left:4px solid var(--accent);
  padding:14px 22px;border-radius:0 8px 8px 0;
  color:var(--text);font-size:20px;line-height:1.9;}
.qa .q strong,.qa .a strong{display:inline-block;margin-right:6px;}

/* ============== Card / Insight ============== */
.card,.insight,.commentary,.note{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:18px 24px;margin:16px 0;
  box-shadow:0 1px 3px rgba(0,0,0,.08);}
.card-title,.insight-title{font-size:21.5px;color:var(--accent);
  font-weight:600;margin-bottom:10px;letter-spacing:1.5px;}
.card-content,.insight-content{font-size:20px;line-height:1.9;color:var(--text);}
.insight{border-left:5px solid var(--gold);
  background:linear-gradient(135deg,#fffdf5,#f9f1de);}
.note{border-left:5px solid var(--accentL);}

/* ============== Flow ============== */
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:10px;margin:20px 0;padding:18px;
  background:#fdfaf2;border:1px dashed var(--border);border-radius:10px;}
.flow.flow-v{flex-direction:column;}
.flow-box,.flow-step{background:var(--card);border:1.5px solid var(--gold);
  border-radius:8px;padding:14px 18px;text-align:center;
  min-width:160px;max-width:300px;font-size:17.5px;color:var(--text);
  box-shadow:0 2px 6px rgba(184,134,11,.12);line-height:1.55;}
.flow-box small,.flow-step small{display:block;font-size:13.5px;
  color:var(--text-muted);margin-top:4px;letter-spacing:1px;}
.flow-box.flow-emph,.flow-step.flow-emph{background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;border-color:var(--gold);box-shadow:0 3px 10px rgba(184,134,11,.3);}
.flow-box.flow-emph small,.flow-step.flow-emph small{color:rgba(255,255,255,.92);}
.flow-arrow{font-size:24px;color:var(--gold);font-weight:700;}

/* ============== Spectrum ============== */
.spectrum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;
  margin:22px 0;border-radius:10px;overflow:hidden;
  border:1px solid var(--border);}
.sp-node{padding:20px 16px;text-align:center;font-size:15.5px;
  line-height:1.6;color:var(--text);background:var(--card);}
.sp-left{background:linear-gradient(135deg,#e8f0f8,#d0deed);color:#2a4a6a;}
.sp-mid{background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;}
.sp-mid h5,.sp-mid *{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.25);}
.sp-mid small{color:rgba(255,255,255,.92);}
.sp-right{background:linear-gradient(135deg,#f8ece0,#edd6c0);color:#7a4a20;}
.sp-node h5{font-size:18.5px;margin-bottom:8px;font-weight:700;letter-spacing:1px;}
.sp-node small{display:block;font-size:13.5px;margin-top:6px;opacity:.85;}

/* ============== Four-Grid ============== */
.four-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0;}
.four-grid .cell{background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:18px 22px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);}
.four-grid .cell-title{font-size:19px;color:var(--accent);
  font-weight:700;margin-bottom:8px;letter-spacing:1px;}
.four-grid .cell-content{font-size:19px;line-height:1.85;color:var(--text);}

/* ============== Triangle Diagram ============== */
.triangle-diagram{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;
  margin:24px 0;padding:22px 14px;
  background:#fdfaf2;border:1px solid var(--border);border-radius:12px;}
.tri-node{background:var(--card);border:1.5px solid var(--accentL);
  border-radius:50%;aspect-ratio:1/1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:18px;text-align:center;
  font-size:17px;line-height:1.55;color:var(--text);
  box-shadow:0 2px 8px rgba(184,134,11,.12);}
.tri-node h5{font-size:17.5px;color:var(--accent);
  font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.tri-node small{font-size:13px;color:var(--text-muted);}
.tri-conclusion{grid-column:1/-1;background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;padding:16px 22px;border-radius:10px;text-align:center;
  font-size:18.5px;font-weight:600;letter-spacing:2px;
  box-shadow:0 3px 10px rgba(184,134,11,.25);}

/* ============== Two/Three Col ============== */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px 0;}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin:22px 0;}
.col-card{background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:20px 22px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.col-card.left-blue{border-left:4px solid #5a8db5;}
.col-card.right-brown{border-left:4px solid var(--accentL);}
.col-title{font-size:21.5px;color:var(--accent);font-weight:700;
  margin-bottom:10px;letter-spacing:1.5px;}
.col-content{font-size:19px;line-height:1.9;color:var(--text);}

/* ============== Comparison Table ============== */
.compare-table{width:100%;border-collapse:collapse;margin:22px 0;
  border:1px solid var(--border);border-radius:10px;overflow:hidden;
  background:var(--card);}
.compare-table th{background:linear-gradient(135deg,#2a2218,#3d3225);
  color:var(--goldL);padding:14px 18px;font-size:18px;
  font-weight:700;letter-spacing:2px;text-align:left;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;}
.compare-table td{padding:14px 18px;font-size:18px;line-height:1.75;
  color:var(--text);border-top:1px solid var(--border-light);
  vertical-align:top;}
.compare-table tr:nth-child(even){background:#fdfaf2;}
.compare-table .col-label{color:var(--accent);font-weight:700;
  letter-spacing:1px;white-space:nowrap;}

/* ============== Phase Badge ============== */
.phase-badge{display:inline-block;background:var(--gold);color:#fff;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:14px;letter-spacing:2px;
  padding:5px 14px;border-radius:14px;margin:0 6px 6px 0;
  text-shadow:0 1px 2px rgba(0,0,0,.2);font-weight:500;}

/* ============== HR ============== */
hr{border:0;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);
  margin:30px 0;}

/* ============== Mnemonic Quote ============== */
.mnemonic{background:linear-gradient(135deg,#2a2218,#3d3225);
  color:var(--goldL);padding:24px 30px;margin:22px 0;
  border-radius:12px;text-align:center;
  border:1px solid var(--gold);position:relative;}
.mnemonic::before{content:&quot;記 憶 口 訣&quot;;position:absolute;
  top:-12px;left:50%;transform:translateX(-50%);
  background:var(--gold);color:#fff;padding:3px 16px;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:13px;
  letter-spacing:3px;border-radius:12px;}
.mnemonic p{font-size:22px;line-height:2;color:#fff;
  font-family:&quot;Noto Serif TC&quot;,serif;letter-spacing:3px;
  margin:6px 0;}

/* ============== Back to Top ============== */
#backTop{position:fixed;right:24px;bottom:80px;
  width:44px;height:44px;border-radius:50%;border:0;
  background:var(--accent);color:#fff;font-size:18px;cursor:pointer;
  display:none;z-index:50;box-shadow:0 3px 10px rgba(0,0,0,.25);
  transition:all .25s;}
#backTop:hover{background:var(--gold);transform:translateY(-2px);}
#backTop.show{display:block;}

/* ============== Footer ============== */
.site-footer{margin:60px -32px 0;padding:36px 40px;
  background:#2a2218;color:#bfa56b;text-align:center;
  border-top:3px solid var(--gold);font-size:15px;
  line-height:2;letter-spacing:2px;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;}
.site-footer .footer-title{font-size:18px;color:var(--goldL);
  letter-spacing:4px;margin-bottom:10px;font-weight:600;}

/* ============== Section Anchor ============== */
section[id]{scroll-margin-top:20px;}

/* ============== Responsive ============== */
@media (max-width:900px){
  body{padding-left:0;}
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);}
  #sbToggle{display:block;}
  .main{padding:0 18px 60px;}
  .site-hero{padding:60px 20px 50px;margin:0 -18px;}
  .hero-title{font-size:38px;letter-spacing:4px;}
  .ch-body{padding:30px 22px;}
  .ch-head{padding:36px 20px;}
  .ch-name{font-size:26px;}
  .toc-grid{grid-template-columns:1fr;}
  .four-grid,.two-col,.three-col,.spectrum,.triangle-diagram{
    grid-template-columns:1fr;}
  body{font-size:18px;}
}
@media (max-width:600px){
  body{font-size:16px;}
  .ch-body p,.ch-body{font-size:17.5px;}
  .hero-title{font-size:30px;letter-spacing:3px;}
  .ch-name{font-size:22px;}
  .ch-body h2{font-size:23px;}
}

<div class=&quot;preface&quot;>
<h2 class=&quot;preface-title&quot;>編 者 前 言</h2>
<p>《大智度論》卷九十九第四品「曇無竭品」是般若部「常啼東求」一段敘事的論釋總結——薩陀波崙菩薩跋涉至眾香城曇無竭法師處，先聞「諸佛無來無去」之說，後以「七歲不坐不臥、刺血灑地」之極端行儀求法。此一敘事在表面上充滿戲劇張力，亦留下四個看似矛盾的節點：說法者何以日沒入宮？人身軟弱何能站立七年？導師若應廣宣般若，何以入定沉默七歲？供養理應清淨，何以以血腥之軀供奉法座？</p>
<p>本品論釋（即龍樹菩薩的九組「問曰答曰」），正是對這四個節點逐一解構。本卷將之與當代論文《Madhyamaka Narrative Dialectics》之十一模塊解析合併重組，按「卷 → 品 → 章 → 節」的層級體系，分作八章，把每組辯證從「學者疑問 → 中觀解局 → 心法提煉」三層遞進呈現，並透過光譜、適應曲線、攻擊向量、心物階層等視覺化結構，將神話敘事還原為「空性演算法」的精確運算。</p>
<p>讀者若能順此八章脈絡讀完，將不只看見「流血與苦行」的故事，而是看見一套能重塑時空、防護心智、改變物質性質的菩薩道心智模型——這正是《大智度論》在敘事背後埋藏的般若知識論建構（The Epistemological Blueprint of Prajñā）。</p>
</div>

<section class=&quot;chapter&quot; id=&quot;chapter-1&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第四品 · 第一章</div>
<h2 class=&quot;ch-name&quot;>超 越 神 話 敘 事</h2>
<div class=&quot;ch-sub&quot;>重構般若求法的知識論建構 · The Epistemological Setup</div>
</div>
<div class=&quot;ch-body&quot;>
<h2 id=&quot;s1-1&quot;>第一節　為何需要重讀《大智度論》卷九十九</h2>
<p>《大智度論》卷九十九所釋之「曇無竭品」，在《大品般若》中通常被當作一段感人的求法故事——薩陀波崙菩薩東行眾香城，受長者女、五百侍女供養，奉七寶車獻師，七年立而不臥，魔蔽水源後復刺血灑地。然而，如果只把它讀作神話敘事或宗教傳奇，便會錯失龍樹菩薩在文末以九組「問曰、答曰」織成的真正論意：<b>這不是一則激情故事，而是一套精確的菩薩道心智運算模型</b>。</p>
<p>本品的特殊性在於：表面敘事看似充滿戲劇張力，內裡卻處處布置了「故意製造的矛盾節點」——說法者休息／弟子立候、人身軟弱／七歲不臥、廣宣般若／沉默入定、供養清淨／血腥灑地——四組對立其實是龍樹刻意保留下來，給讀者以中觀辯證的方式逐一解構的「問題裝置」。</p>
<div class=&quot;insight&quot;>
<div class=&quot;insight-title&quot;>本品的三層讀法</div>
<div class=&quot;insight-content&quot;>
<p>第一層 · <b>知識論</b>：將「四重矛盾」視為哲學上的反例（counter-example），考察「般若 / 方便」二法如何在極端情境下仍保持自洽。</p>
<p>第二層 · <b>深層解構</b>：以二諦（世俗 / 第一義）與緣起空性為解碼鑰匙，逐一拆解表層矛盾。</p>
<p>第三層 · <b>心智運算</b>：把整段敘事還原為「以慈悲 / 精進兩軸所驅動的極限壓力測試」，提煉成可記憶、可應用的修行口訣。</p>
</div>
</div>
<h2 id=&quot;s1-2&quot;>第二節　解碼鑰匙 · 二諦與緣起的雙軸</h2>
<p>《大智度論》通過中觀雙軸，將表面上極端的行為收攝於中道。<b>世俗諦</b>處理「現象界」的度眾機制——如「日沒應息」「言行承諾」等隨順世間因緣的權巧示現；<b>第一義諦</b>處理「本體界」的解脫機制——如「七歲如日」「四大本空」等超越時空與身見的空性實證。兩諦並非對立，而是同一菩薩行的兩面。</p>
<div class=&quot;spectrum&quot;>
<div class=&quot;sp-node sp-left&quot;>
<h5>世俗諦</h5>
<small>隨順世間因緣的權巧示現</small>
<small style=&quot;margin-top:6px&quot;>如：日沒應息、言行承諾</small>
<small style=&quot;margin-top:6px;font-style:italic;opacity:.75&quot;>解決「現象界」的度眾機制</small>
</div>
<div class=&quot;sp-node sp-mid&quot;>
<h5>中 道</h5>
<small>緣起即空 · 空不離緣起</small>
<small style=&quot;margin-top:6px&quot;>悲智雙運 · 二諦圓融</small>
</div>
<div class=&quot;sp-node sp-right&quot;>
<h5>第一義諦</h5>
<small>超越時空與身見的空性實證</small>
<small style=&quot;margin-top:6px&quot;>如：七歲如日、四大本空</small>
<small style=&quot;margin-top:6px;font-style:italic;opacity:.75&quot;>解決「本體界」的解脫機制</small>
</div>
</div>
<p>讀懂這張雙軸圖，本品所有看似怪異的行為都會立刻歸位：曇無竭日沒入宮屬於世俗諦的方便施設，薩陀波崙七年立候屬於第一義諦的空性實證——兩者並不矛盾，而是中道的兩翼。</p>
<h2 id=&quot;s1-3&quot;>第三節　四重辯證框架總覽</h2>
<p>本品中，龍樹刻意安排了四個「中觀辯證節點」，每一節點都由「世俗表象」與「第一義實證」兩端拉扯而成。讀者只要把握住這四個節點所對應的中觀解局，後續九組問答便如綱舉目張，自然清晰。</p>
<div class=&quot;four-grid&quot;>
<div class=&quot;cell&quot;>
<div class=&quot;cell-title&quot;>第一重 · 行儀矛盾</div>
<div class=&quot;cell-content&quot;><b>入宮受樂 vs. 不坐不臥</b><br/>
          師於「日沒應息」隨世人法；徒於「常住二威儀」立大欲精進。問曰：何以說法者貪圖五欲休息，而初學弟子卻承受極端肉體折磨？</div>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;cell-title&quot;>第二重 · 時空矛盾</div>
<div class=&quot;cell-content&quot;><b>人身軟弱 vs. 七歲立姿</b><br/>
          脆弱的肉身，何能完成超越生物學極限的苦行？問曰：在知識論上，如何證成這長達七年「不疲極」的合理性？</div>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;cell-title&quot;>第三重 · 說法矛盾</div>
<div class=&quot;cell-content&quot;><b>言說般若 vs. 入定七歲</b><br/>
          應當廣宣般若波羅蜜的導師，何以長達七年絕對沉默？問曰：對極度渴求聽法的初學菩薩，這是否違背了慈悲度眾的本誓？</div>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;cell-title&quot;>第四重 · 淨穢矛盾</div>
<div class=&quot;cell-content&quot;><b>魔蔽水源 vs. 刺血灑地</b><br/>
          供養理應清淨，何以視為「腥臭」的肉身之血來淹塵？問曰：這種看似瘋狂的自殘行為在中觀邏輯中如何被證成為「清淨的無分別智」？</div>
</div>
</div>
<p>下文第二、三章先呈現《大智度論》本品的經文原典——前者為「諸佛無來無去 · 五大譬喻」（卷首聖言段），後者為「七歲求法 · 四節敘事段」（即本品四重辯證的事相發生場）。第四至第七章對應龍樹的九組問答（按四重辯證歸組），逐一解構表面矛盾。第八章為終極統合，將四重辯證收束為「悲智雙運 · 空性演算法」的整體心法。</p>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-2&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第四品 · 第二章</div>
<h2 class=&quot;ch-name&quot;>諸 佛 無 來 無 去 · 五 大 譬 喻</h2>
<div class=&quot;ch-sub&quot;>經文原典上 · The Five Similes of Buddha-Body</div>
</div>
<div class=&quot;ch-body&quot;>
<p>本章呈現本品卷首聖言段：曇無竭菩薩答薩陀波崙「諸佛從何來，去至何所」一問。曇無竭以「諸佛無所從來、去亦無所至」開示，後連用<b>焰、幻、夢、海寶、箜篌</b>五大譬喻，徹底闡明「諸法緣合則有，緣離則滅，本無來去生滅相」的中觀法義。此段為下文七歲求法的「義理底盤」——若不先理解「諸佛即諸法如」「一如無分別」，後續對「七歲苦行 / 自刺供養」的解讀便會落入身見與時間執著。</p>
<h2 id=&quot;s2-1&quot;>第一節　諸佛無所從來，去亦無所至</h2>
<div class=&quot;classical-text&quot;>
<div class=&quot;text-label&quot;>原 典</div>
<p>爾時，曇無竭菩薩摩訶薩語薩陀波崙菩薩言：「善男子！諸佛無所從來，去亦無所至。何以故？諸法如不動相，諸法如即是佛。善男子！無生法無來無去，無生法即是佛；無滅法無來無去，無滅法即是佛；實際法無來無去，實際法即是佛；空無來無去，空即是佛。善男子！無染無來無去，無染即是佛；寂滅無來無去，寂滅即是佛；虛空性無來無去，虛空性即是佛。善男子！離是諸法更無佛；諸佛如、諸法如，一如無分別。善男子！是如常一，無二、無三，出諸數法，無所有故。」</p>
</div>
<div class=&quot;insight&quot;>
<div class=&quot;insight-title&quot;>本節法義</div>
<div class=&quot;insight-content&quot;>曇無竭先以「<b>諸法如不動相，諸法如即是佛</b>」一句立宗：諸佛之所以無來無去，是因為一切法在勝義上本即「如」（tathatā），如不動相，本無方所可言「來」、「去」。隨後列舉「無生 / 無滅 / 實際 / 空 / 無染 / 寂滅 / 虛空性」七種勝義異名，皆無來無去而即是佛。最後收束於「諸佛如、諸法如，一如無分別」——這正是中觀<b>緣起即空</b>之核心：佛身非身、法身非法，唯是一如。</div>
</div>
<h2 id=&quot;s2-2&quot;>第二節　焰 喻 · 春末渴鹿逐焰</h2>
<div class=&quot;classical-text&quot;>
<div class=&quot;text-label&quot;>原 典</div>
<p>「譬如春末月，日中熱時，有人見焰動，逐之求水望得。於汝意云何？是水從何池、何山、何泉來？今何所去？若入東海、西海、南海、北海耶？」薩陀波崙言：「大師！焰中尚無水，云何當有來處、去處？」曇無竭言：「善男子！愚夫無智，為熱渴所逼，見焰動，無水生水想。若有人分別諸佛有來有去，當知是人皆是愚夫。何以故？諸佛不可以色身見，諸佛法身無來無去。」</p>
</div>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>焰喻所破：色身執</div>
<div class=&quot;card-content&quot;>渴鹿逐焰，焰中本無水。同理，若有人以「色身相」分別諸佛有來有去，便如渴鹿執焰為水，皆是<b>愚夫無智之數</b>。佛身非可以色蘊把握，諸佛之「來去相」唯是因緣聚合的方便示現，非實體之來去。</div>
</div>
<h2 id=&quot;s2-3&quot;>第三節　幻 喻 · 幻師幻作種種</h2>
<div class=&quot;classical-text&quot;>
<div class=&quot;text-label&quot;>原 典</div>
<p>「譬如幻師幻作種種，若象、若馬、若牛、若羊、若男、若女，如是等種種諸物。於汝意云何？是幻事從何處來？去至何所？」薩陀波崙菩薩言：「大師！幻事無實，云何當有來去處？」「善男子！是人分別佛有來有去亦如是。」</p>
</div>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>幻喻所破：實體執</div>
<div class=&quot;card-content&quot;>幻師所作象馬牛羊，看似有來有去，實則本無自性可言。同理，分別佛有「實體之來去」者，正同把幻事執為實有——破除的是<b>對佛身的實體化執取</b>。</div>
</div>
<h2 id=&quot;s2-4&quot;>第四節　夢 喻 · 夢中所見虛妄</h2>
<div class=&quot;classical-text&quot;>
<div class=&quot;text-label&quot;>原 典</div>
<p>「譬如夢中見若象、若馬、若牛、若羊、若男、若女。於汝意云何？夢中所見，有來處、有去處不？」薩陀波崙言：「大師！是夢中所見虛妄，云何當有來去？」「善男子！是人分別佛有來有去亦如是。佛說諸法如夢。若有眾生不知是諸法義，以名字色身著佛，是人分別諸佛有來有去，不知諸法實際相故，皆是愚夫無智之數。是人數數往來五道，遠離般若波羅蜜，遠離諸佛法。」</p>
</div>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>夢喻所破：名字色身著</div>
<div class=&quot;card-content&quot;>夢中所見既無實境，云何說「來去」？此喻所破，是以<b>名字、色身</b>去攀附佛體的執取——把佛的稱名、形相當作可定位、可移轉之實。能如實知諸法如夢者，「不分別諸法若來若去、若生若滅」，便是「<b>真佛弟子</b>」，方堪受供養為世間福田。</div>
</div>
<h2 id=&quot;s2-5&quot;>第五節　海 寶 喻 · 緣合則生，緣離則滅</h2>
<div class=&quot;classical-text&quot;>
<div class=&quot;text-label&quot;>原 典</div>
<p>「善男子！譬如大海水中諸寶，不從東方來，不從南方、西方、北方、四維、上下來，眾生善根因緣故，海生此寶。此寶亦不無因緣而生，是寶皆從因緣和合生，是寶若滅亦不去至十方。諸緣合故有，諸緣離故滅。善男子！諸佛身亦如是，從本業因緣果報生，生不從十方來，滅時亦不去至十方；但諸緣合故有，諸緣離故滅。」</p>
</div>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>海寶喻所示：緣起的「正面」</div>
<div class=&quot;card-content&quot;>前三喻（焰／幻／夢）皆從「<b>破執</b>」面說——破色身、實體、名字之執；海寶喻則轉向「<b>立緣</b>」面——明示諸佛之身雖無來去，卻是「從本業因緣果報生」「眾生善根因緣故，海生此寶」。緣起即空，空亦不礙緣起——這是中觀法義的兩面一體。</div>
</div>
<h2 id=&quot;s2-6&quot;>第六節　箜 篌 喻 · 眾緣和合而有聲</h2>
<div class=&quot;classical-text&quot;>
<div class=&quot;text-label&quot;>原 典</div>
<p>「善男子！譬如箜篌聲，出時無來處，滅時無去處。眾緣和合故生——有槽、有頸、有皮、有絃、有柱、有棍，有人以手鼓之，眾緣和合而有聲；是聲亦不從槽出，不從頸出，不從皮出，不從絃出，不從柱出，不從棍出，亦不從人手出，眾緣和合爾乃有聲。是因緣離時，亦無去處。善男子！諸佛身亦如是，從無量功德因緣生，不從一因一緣一功德生，亦不無因緣有，眾緣和合故有。諸佛身不獨從一事成，來無所從、去無所至。」</p>
</div>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>箜篌喻所示：眾緣和合的精密性</div>
<div class=&quot;card-content&quot;>箜篌聲不從槽、頸、皮、絃、柱、棍、手任一單一條件出，亦非無因而生。同理，諸佛身「<b>從無量功德因緣生，不從一因一緣一功德生</b>」。此喻所破，是「以單一原因解釋佛身存在」之執——例如以為佛唯由某一行門、某一願力、某一果報所成。中觀正面說緣起：「不獨從一事成」。</div>
</div>
<div class=&quot;classical-text&quot; style=&quot;margin-top:30px&quot;>
<div class=&quot;text-label&quot;>總 結</div>
<p>「善男子！應當如是知諸佛來相去相。善男子！亦當知一切法無來去相。汝若知諸佛及諸法無來無去、無生無滅相，必得阿耨多羅三藐三菩提，亦能行般若波羅蜜及方便力。」</p>
</div>
<div class=&quot;mnemonic&quot;>
<p>諸 佛 如 · 諸 法 如</p>
<p>一 如 無 分 別 · 出 諸 數 法</p>
<p>緣 合 則 有 · 緣 離 則 滅</p>
<p>不 獨 從 一 事 成 · 來 無 所 從 · 去 無 所 至</p>
</div>
<p style=&quot;margin-top:20px&quot;>五喻之後，曇無竭明示：知此即<b>必得阿耨多羅三藐三菩提，亦能行般若波羅蜜及方便力</b>。下文薩陀波崙的七歲求法，正是把這段聖言落地為實際修行——「般若」是知見根基，「方便」則是面對極端情境時的具體應用。</p>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-3&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第四品 · 第三章</div>
<h2 class=&quot;ch-name&quot;>七 歲 求 法 · 四 大 敘 事 節 點</h2>
<div class=&quot;ch-sub&quot;>經文原典下 · The Four Narrative Nodes</div>
</div>
<div class=&quot;ch-body&quot;>
<p>本章承上章五喻之後，呈現本品敘事段的完整原文：從薩陀波崙「以身屬師」的供養盟約，到「日沒入宮」的初次分離，再到「七歲入定 / 七歲經行」的雙線等待，最終以「魔蔽水源 / 刺血灑地 / 釋天讚歎」收束。下文第四至第七章的論釋問答，每一組都對應到此處原文的某一敘事節點。</p>
<h2 id=&quot;s3-1&quot;>第一節　受花散師 · 以身屬師的盟約</h2>
<div class=&quot;classical-text&quot;>
<div class=&quot;text-label&quot;>原 典</div>
<p>爾時，釋提桓因以天曼陀羅花與薩陀波崙菩薩摩訶薩，作是言：「善男子！以是花供養曇無竭菩薩摩訶薩，我當守護供養汝。所以者何？汝因緣力故，今日饒益百千萬億眾生，使得阿耨多羅三藐三菩提。善男子！如是善人，甚為難遇！為饒益一切眾生故，無量阿僧祇劫受諸勤苦。」</p>
<p>薩陀波崙菩薩摩訶薩受釋提桓因曼陀羅花，散曇無竭菩薩上，白言：「大師！我從今日以身屬師，供給供養。」如是三白已，合手師前立。</p>
<p>是時，長者女及五百侍女白薩陀波崙菩薩言：「我等從今日亦以身屬師。我等以是善根因緣故，當得如是法，亦如師所得；共師世世供養諸佛，世世常供養師。」</p>
<p>是時，薩陀波崙菩薩語長者女及五百女人：「若汝等以誠心屬我者，我當受汝。」諸女言：「我等以誠心屬師，當隨師教。」</p>
<p>是時，薩陀波崙菩薩及五百女人，并諸莊嚴寶物上妙供具及五百乘七寶車，奉上曇無竭菩薩，白言：「大師！我持是五百女人奉給大師，是五百乘車隨師所用。」</p>
<p>爾時，釋提桓因讚薩陀波崙菩薩言：「善哉！善哉！善男子！菩薩摩訶薩捨一切所有，應如是如是布施，疾得阿耨多羅三藐三菩提。作如是供養說法人，必得聞般若波羅蜜及方便力。過去諸佛本行菩薩道時，亦如是住布施中，得聞般若波羅蜜及方便力，得阿耨多羅三藐三菩提。」</p>
<p>爾時，曇無竭菩薩欲令薩陀波崙菩薩善根具足故，受五百乘車、長者女及五百侍女；受已，還與薩陀波崙菩薩。</p>
</div>
<div class=&quot;insight&quot;>
<div class=&quot;insight-title&quot;>敘事節點 1：盟約的成立</div>
<div class=&quot;insight-content&quot;>薩陀波崙先散花於師，三白「以身屬師」；長者女及五百侍女亦三白；接著舉<b>五百女人 + 五百七寶車</b>盡奉。曇無竭<b>受已還與</b>——這是中觀「<b>捨而不取，受而不執</b>」的精微示現：先讓「捨」的功德圓滿（讓薩陀波崙善根具足），再將外境完璧歸還，不因供養關係而生取捨。</div>
</div>
<h2 id=&quot;s3-2&quot;>第二節　日沒入宮 · 二威儀守候</h2>
<div class=&quot;classical-text&quot;>
<div class=&quot;text-label&quot;>原 典</div>
<p>是時，曇無竭菩薩說法，日沒，起，入宮中。薩陀波崙菩薩摩訶薩作是念：「我為法故來，不應坐、臥，當以二事：若行、若立，以待法師從宮中出說法。」</p>
</div>
<div class=&quot;insight&quot;>
<div class=&quot;insight-title&quot;>敘事節點 2：第一重辯證的事相發生</div>
<div class=&quot;insight-content&quot;>這短短一段是<b>第一重辯證的起點</b>。曇無竭日沒「起，入宮中」——「宮中」即眾香城典型的菩薩居所，內有婇女、五欲供具；薩陀波崙當下立誓「不應坐、臥」，常住<b>行、立二威儀</b>。師徒兩端的對比立刻成立：師則隨順世法入宮，徒則大欲精進不臥——這正是第四章所要解構的張力。</div>
</div>
<h2 id=&quot;s3-3&quot;>第三節　七歲入定 · 經行不臥的等待</h2>
<div class=&quot;classical-text&quot;>
<div class=&quot;text-label&quot;>原 典</div>
<p>爾時，曇無竭菩薩七歲一心入無量阿僧祇菩薩三昧，及行般若波羅蜜、方便力。薩陀波崙菩薩七歲經行、住立，不坐、不臥，無有睡眠，無欲、恚、惱，心不著味；但念：「曇無竭菩薩摩訶薩何時當從三昧起，出而說法？」</p>
<p>薩陀波崙菩薩過七歲已，作是念：「我當為曇無竭菩薩摩訶薩敷說法座，曇無竭菩薩摩訶薩當坐上說法。我當灑地清淨，散種種華，莊嚴是處，為曇無竭菩薩摩訶薩當說般若波羅蜜及方便力故。」是時，薩陀波崙菩薩與長者女及五百侍女為曇無竭菩薩摩訶薩敷七寶床，五百女人各脫上衣以敷座上，作是念：「曇無竭菩薩摩訶薩當坐此座上，說般若波羅蜜及方便力。」</p>
</div>
<div class=&quot;insight&quot;>
<div class=&quot;insight-title&quot;>敘事節點 3：第二、三重辯證的事相發生</div>
<div class=&quot;insight-content&quot;>這一段同時設立了兩重辯證的事相基底——師之側「<b>七歲一心入無量三昧</b>」（第三重·說法矛盾）；徒之側「<b>七歲經行、住立，不坐不臥</b>」（第二重·時空矛盾）。並且明確標出薩陀波崙在七年間的內在質地：「無睡眠、無欲恚惱、心不著味」，這正是後文「以一心念取代斷煩惱」的伏筆。最後「敷七寶床」「脫上衣以敷座上」承上啟下，引入第四重辯證。</div>
</div>
<h2 id=&quot;s3-4&quot;>第四節　魔蔽水源 · 刺血灑地的至誠</h2>
<div class=&quot;classical-text&quot;>
<div class=&quot;text-label&quot;>原 典</div>
<p>薩陀波崙菩薩敷座已，求水灑地而不能得。所以者何？惡魔隱蔽，令水不現。魔作是念：「薩陀波崙菩薩求水不得，於阿耨多羅三藐三菩提行乃至生一念劣心、異心，則善根不增、智慧不照，於一切智而有稽留。」</p>
<p>爾時，薩陀波崙菩薩作是念：「我當自刺其身，以血灑地，令無塵土來坋大師。我何用此身！此身必當破壞。我從無始生死已來數數喪身，未曾為法。」即以利刀自刺，出血灑地。薩陀波崙菩薩及長者女并五百侍女皆無異心，惡魔亦不能得便。</p>
<p>是時釋提桓因作是念：「未曾有也！薩陀波崙菩薩愛法乃爾，以刀自刺出血灑地！薩陀波崙及眾女人心不動轉，惡魔波旬不能壞其善根。其心堅固，發大莊嚴，不惜身命，以深心欲求阿耨多羅三藐三菩提，當度一切眾生無量生死苦。」釋提桓因讚薩陀波崙菩薩言：「善哉！善哉！善男子！汝精進力大，堅固難動，不可思議！汝愛法、求法，最為無上！善男子！過去諸佛亦如是，以深心愛法、惜法、重法，集諸功德，得阿耨多羅三藐三菩提。」</p>
<p>薩陀波崙菩薩作是念：「我為曇無竭菩薩摩訶薩敷法座，掃灑清淨已訖，當於何處得好名華莊嚴此地？若曇無竭菩薩摩訶薩法座上坐說法時，亦當散華供養。」釋提桓因知薩陀波崙菩薩心所念，即以三千石天曼陀羅華與薩陀波崙。薩陀波崙受華，以半散地，留半待曇無竭菩薩摩訶薩坐法座上說法時當供養。</p>
<p>爾時，曇無竭菩薩摩訶薩過七歲已，從諸三昧起，為說般若波羅蜜故，與無量百千萬眾恭敬圍遶，往法座上坐。薩陀波崙菩薩摩訶薩見曇無竭菩薩摩訶薩時，心淨悅樂，譬如比丘入第三禪。</p>
</div>
<div class=&quot;insight&quot;>
<div class=&quot;insight-title&quot;>敘事節點 4：第四重辯證與全品收束</div>
<div class=&quot;insight-content&quot;>這是<b>第四重辯證的事相發生場</b>：魔以「隱蔽水源」為微妙的攻心戰，欲令薩陀波崙起「一念劣心、異心」；薩陀波崙以「我何用此身！此身必當破壞」之觀身無常，斷然刺血灑地。釋提桓因見其「心不動轉，惡魔不能得便」，遂以三千石曼陀羅花應助——「<b>境隨心轉</b>」的圓融在此完成示現。「心淨悅樂，譬如比丘入第三禪」則是七歲守候的最終果報，亦為下一品的開展埋下伏筆。</div>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-4&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第四品 · 第四章</div>
<h2 class=&quot;ch-name&quot;>第 一 重 辯 證 · 行 儀 矛 盾</h2>
<div class=&quot;ch-sub&quot;>入宮受樂 vs. 不坐不臥 · The Dialectics of Rest &amp;amp; Austerity</div>
</div>
<div class=&quot;ch-body&quot;>
<p>本章承上章「日沒入宮」之敘事節點，對應龍樹之第一、第二組問答。學者第一個疑問來自一個強烈的師徒對比：宣說空性、貴為大菩薩的曇無竭，居然「日沒，起，入宮中」受用五欲；而初發心的薩陀波崙，反而立誓「不應坐、臥」承受極端的肉體折磨。此一矛盾若不能化解，整個求法敘事便顯得失重——師懈而徒勤，貌似顛倒。本章依「世俗諦／第一義諦」之雙軸，先聽兩造各自的邏輯，再合於中道。</p>
<h2 id=&quot;s4-1&quot;>第一節　學者的疑問 · 為何說法者貪圖五欲休息</h2>
<div class=&quot;qa&quot;>
<div class=&quot;q&quot;><strong>問曰：</strong>諸大菩薩說法不應疲極，何以入宮？</div>
<div class=&quot;a&quot;><strong>答曰：</strong>隨世人法故。又眾香城中眾生，不常求道，或時厭息，受五欲樂；諸天常受五欲故，妨廢求道。有菩薩所住國，常勤精進，不受五欲。是眾香城眾生本願雜受，曇無竭隨其志願，欲引導之，故生其國。是故以眾生聽法疲倦，起入宮中。又未得道者，法雖微妙，常聞故生疲厭心，是眾中有是人故。又曇無竭在是中受富樂，人法故，日沒應息。</div>
</div>
<h2 id=&quot;s4-2&quot;>第二節　導師邏輯 · 權巧方便與適應曲線</h2>
<p>論主的解答可以拆為兩層。第一層直接平實——「<b>隨世人法故</b>」：人世間日沒則息，菩薩既現人身、住人國，自當隨順此法。第二層則是中觀「方便善巧」的精妙運用——曇無竭<b>故意</b>生於眾香城這樣「本願雜受、不常求道」的眾生國土，正是為了示現「修道與享樂可以並行」的中道風範。</p>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>適應曲線 · The Adaptability Curve</div>
<div class=&quot;card-content&quot;>眾香城眾生並非常勤精進，而是混合求道與享樂。若曇無竭依「自己應修苦行」的標準常說法不息，眾生將生疲厭心，反而妨廢求道。是故曇無竭<b>隨其志願，欲引導之</b>——「入宮受樂」是世俗諦的展現，讓眾生不覺怪異，安撫並護念其根器；待時節因緣成熟，再以「七歲入定」展現第一義諦。</div>
</div>
<div class=&quot;flow&quot;>
<div class=&quot;flow-box&quot;>入 宮<br/><small>Entering Palace</small></div>
<div class=&quot;flow-arrow&quot;>→</div>
<div class=&quot;flow-box flow-emph&quot;>隨 世 人 法<br/><small>Adapting to Worldly Norms</small></div>
<div class=&quot;flow-arrow&quot;>→</div>
<div class=&quot;flow-box&quot;>護 念 眾 生<br/><small>Protecting Sentient Beings</small></div>
<div class=&quot;flow-arrow&quot;>→</div>
<div class=&quot;flow-box&quot;>免 疲 厭 心<br/><small>Avoiding Aversion</small></div>
</div>
<p>此即「<b>慈悲的向下牽引</b>」——導師有意識地把自身行儀調節到受眾的接受區間內，這不是退失精進，而是更深的方便善巧。</p>
<h2 id=&quot;s4-3&quot;>第三節　弟子邏輯 · 大欲精進與破戒禁取見</h2>
<div class=&quot;qa&quot;>
<div class=&quot;q&quot;><strong>問曰：</strong>為法故何以不應坐臥？</div>
<div class=&quot;a&quot;><strong>答曰：</strong>無是定法。此人大欲、大精進、恭敬法故，自作是念：「我若坐臥，則是懶惰。我初求法時，身尚不惜，何況疲倦！」是故不坐臥。大欲、大精進與坐臥相違故。又坐、臥則不勤力，行、立則勤力精進，是故常住二威儀以待師出。</div>
</div>
<p>論主在此用「<b>無是定法</b>」四字打了一個極重要的底子——「不應坐臥」並非一條普遍適用的戒律，而是<b>因人因時而設的權宜行儀</b>。坐臥本身無自性可言「懶」，行立本身亦無自性可言「勤」。所以薩陀波崙的不坐不臥，並不能被當作「站立才是修行」的普遍法則。</p>
<div class=&quot;two-col&quot;>
<div class=&quot;col-card left-blue&quot;>
<div class=&quot;col-title&quot;>懶惰 / 昏沉</div>
<div class=&quot;col-content&quot;>若因疲倦而坐臥，即被視為「懶情」。大欲與坐臥在邏輯上互斥——對治懶惰的相對論。</div>
</div>
<div class=&quot;col-card right-brown&quot;>
<div class=&quot;col-title&quot;>大欲 / 精進</div>
<div class=&quot;col-content&quot;>薩陀波崙初求法時「身尚不惜」，相較之下，七歲不臥不過是「<b>何足為難</b>」的輕微代價。常住二威儀，是為了隨時待命，不錯過法師出定說法的那一刻。</div>
</div>
</div>
<p>關鍵在於「<b>初求法時，身尚不惜</b>」這句——曾經為了求法而願賣身、刺血的人，當前的「站著七年」自然構不成挑戰。這正是「<b>由重抵輕</b>」的心理機制：一旦突破生死的最高閾值，時間與疲憊的閾值便自動降級。</p>
<h2 id=&quot;s4-4&quot;>第四節　二諦圓融 · 師徒行儀的觀待而立</h2>
<p>師徒行儀，本無定相，隨眾生緣，各現其用。下表將二者並列，便可清楚看出「行臥二儀」不過是同一中道在不同根器上的兩種表現：</p>
<table class=&quot;compare-table&quot;>
<tr><th></th><th>曇無竭（導師）</th><th>薩陀波崙（弟子）</th></tr>
<tr><td class=&quot;col-label&quot;>行儀</td><td>入宮休息、受五欲</td><td>七年行立、不坐臥</td></tr>
<tr><td class=&quot;col-label&quot;>諦層</td><td>世俗諦（隨緣示現）</td><td>世俗諦（對治煩惱）</td></tr>
<tr><td class=&quot;col-label&quot;>心法</td><td>權巧方便（Upāya）</td><td>大欲精進（Vīrya）</td></tr>
<tr><td class=&quot;col-label&quot;>作用</td><td>護念眾生（慈悲向下）</td><td>策勵自我（精進向上）</td></tr>
<tr><td class=&quot;col-label&quot;>勝義依持</td><td>住三昧、如幻示現</td><td>諸佛護念、心住於法</td></tr>
</table>
<h3 id=&quot;s4-4-1&quot;>一、自度心法 · 以大欲轉化精進</h3>
<p>修行非求蠻力，而是培養對真理的「<b>飢渴感</b>」。渴若超越肉體執著，精進自然發生——這是薩陀波崙的自度心法。「<b>大欲</b>」不同於世俗的貪欲，而是對般若法義的極致渴慕，能驅動色身突破物理極限。</p>
<h3 id=&quot;s4-4-2&quot;>二、度人心法 · 無定法的教導觀</h3>
<p>引導他人不可加以己之高標準強求初學者。觀察對象因緣，隨其志願方能入道——這是曇無竭的度人心法。「<b>無定法</b>」的精微在於：度人者必須放下對自己修行標準的執著，否則便落入「以己心衡量他人根器」的取見。</p>
<h2 id=&quot;s4-5&quot;>第五節　第一重辯證結語 · 法無定相，隨心而轉</h2>
<p>第一重辯證最終要破的，是<b>戒禁取見</b>——若執著「唯有站立才是修行」，即墮入戒禁取見。行為本身並無自性（即空），是背後的「因緣」賦予了行為意義。</p>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>破除戒禁取見</div>
<div class=&quot;card-content&quot;>休息<b>是為了眾生</b>，非為自己；不息<b>是為了求法</b>，非為虐身。行為的意義唯由心念與因緣構成，不從行為本身得來。</div>
</div>
<div class=&quot;mnemonic&quot;>
<p>師 入 宮 中 隨 世 法</p>
<p>徒 行 立 候 大 精 進</p>
<p>法 無 定 相 隨 心 轉</p>
<p>休 非 為 己 · 立 非 虐 身</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-5&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第四品 · 第五章</div>
<h2 class=&quot;ch-name&quot;>第 二 重 辯 證 · 時 空 矛 盾</h2>
<div class=&quot;ch-sub&quot;>人身軟弱 vs. 七歲立姿 · The Dialectics of Body &amp;amp; Time</div>
</div>
<div class=&quot;ch-body&quot;>
<p>本章承接第三章「七歲一心入無量三昧 / 七歲經行住立」之敘事節點，對應龍樹之第三、第四組問答。學者的疑問尖銳：人身本就軟弱，僅僅站立一日已感疲倦，何能延續七年不坐不臥？這是否只是宗教修辭上的誇大？在知識論上，又如何證成這長達七年「不疲極」的合理性？論主在此給出四層理由——壽命因緣、身福強大、心強身弱、諸佛益氣——並暗示時間本身亦非客觀絕對。</p>
<h2 id=&quot;s5-1&quot;>第一節　學者的疑問 · 人身軟弱何能七歲不臥</h2>
<div class=&quot;qa&quot;>
<div class=&quot;q&quot;><strong>問曰：</strong>薩陀波崙先知師七歲不出不？</div>
<div class=&quot;a&quot;><strong>答曰：</strong>初來不知故。又復曇無竭亦常七歲不出，以因緣故，自誓七歲入定。薩陀波崙自誓：「師未出，終不坐臥。」又大人，世間法尚不自違，何況為道法！又以初求法時，尚不惜身，今立七歲，何足為難！</div>
</div>
<div class=&quot;qa&quot;>
<div class=&quot;q&quot;><strong>問曰：</strong>人身軟弱，何能七歲不坐不臥？</div>
<div class=&quot;a&quot;><strong>答曰：</strong>是時人壽命長，雖復七歲，如今七日。又好世人身福德力大，雖立七歲，不以為難。如勤比丘，年六十始出家，而自結誓：「我脇不著席，要盡得聲聞所應得事，乃至得六神通阿羅漢。」作四阿含優婆提舍，於今大行於世。此人於惡世尚爾，何況薩陀波崙生於好世！又身力雖弱，以心強故，能辦其事。復次，一心求佛道者，十方諸佛所念；諸大菩薩及求佛道諸天益其氣力，圍遶守護，是故雖住立七歲而不疲極。</div>
</div>
<h2 id=&quot;s5-2&quot;>第二節　發願不可退性 · 大人之格的邏輯契約</h2>
<p>論主先把第一個小問題（薩陀波崙是否一開始就知道是七年）化解掉：<b>初來不知</b>——當薩陀波崙下定決心「師未出終不坐臥」的剎那，他並不知道這個誓言要付出七年的代價。誓言發動於「未知」之中，故是一個對自我心智的絕對承諾，而非一個被時長計算過後的折扣方案。</p>
<div class=&quot;flow flow-v&quot;>
<div class=&quot;flow-step&quot;>未 知 發 願<br/><small>誓言發動於未知</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-step&quot;>得 知 七 歲<br/><small>面對極端的資訊更新</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-step flow-emph&quot;>大 人 之 格<br/><small>誓約成為絕對的邏輯契約與本體論堅持</small></div>
</div>
<p>「<b>大人，世間法尚不自違，何況為道法！</b>」——這句把「不坐不臥」從體能挑戰拉升到「對自我承諾的本體論堅持」。一個有人格完整性的人，世間法的承諾尚且不會背棄，何況是為求道而立的誓？這把問題從「能不能撐七年」轉化為「會不會做一個違諾的人」——後者根本不在選項內。</p>
<h2 id=&quot;s5-3&quot;>第三節　苦的相對性 · 沉沒成本與閾值比較</h2>
<p>論主第二個關鍵理由是「<b>初求法時尚不惜身，今立七歲，何足為難！</b>」這是一個極精微的閾值比較法則——將絕對的「艱難」轉化為相對的「較易」。</p>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>Hardship Threshold · 閾值比較圖</div>
<div class=&quot;card-content&quot;>
<p>· <b>過去的極限犧牲</b>：為了求法，不惜割肉、刺血出體。是對實體色身最徹底的破除（生死閾值）。</p>
<p>· <b>當前的時間苦行</b>：相較於捨棄生命，僅僅是「站著七年」承受疲倦，屬於「<b>何足為難</b>」的輕微代價（疲憊閾值）。</p>
<p>· <b>心理學機制</b>：一旦突破了生死的最高閾值，時間與疲憊的閾值便自動降級。</p>
</div>
</div>
<div class=&quot;flow&quot;>
<div class=&quot;flow-box&quot;>賣 身 刺 血<br/><small>生死閾值（最高）</small></div>
<div class=&quot;flow-arrow&quot;>→</div>
<div class=&quot;flow-box flow-emph&quot;>由 重 抵 輕<br/><small>閾值降級</small></div>
<div class=&quot;flow-arrow&quot;>→</div>
<div class=&quot;flow-box&quot;>站 立 七 載<br/><small>疲憊閾值（輕微）</small></div>
</div>
<h2 id=&quot;s5-4&quot;>第四節　時間壓縮觀 · 七歲如七日的相對論</h2>
<p>「<b>是時人壽命長，雖復七歲，如今七日</b>」——這句話表面上是壽命比較，內裡卻是中觀對「時間自性」的徹底破斥。時間並非客觀物理常數，而是依「<b>壽命因緣</b>」與「<b>心識專注度</b>」共同決定的相對量。</p>
<div class=&quot;spectrum&quot;>
<div class=&quot;sp-node sp-left&quot;>
<h5>客觀時間</h5>
<small>七 歲</small>
<small style=&quot;margin-top:6px&quot;>凡夫所執之絕對時間</small>
</div>
<div class=&quot;sp-node sp-mid&quot;>
<h5>時 空 無 自 性</h5>
<small>時空相對論視角</small>
<small style=&quot;margin-top:6px&quot;>依壽命 + 心識專注度而立</small>
</div>
<div class=&quot;sp-node sp-right&quot;>
<h5>主觀時間</h5>
<small>七 日</small>
<small style=&quot;margin-top:6px&quot;>入定者 / 渴仰法者所經驗</small>
</div>
</div>
<p>當心念完全斷絕三惡覺觀，專注於單一目標（曇無竭何時當出），意識狀態進入極深的定境——專注力引發時間壓縮效應，證明時間是主觀心識產物。凡夫執著時間實有，故覺七年漫長；菩薩以「渴仰法者」攝持，遂能將七歲壓縮為七日的主觀經驗。</p>
<h2 id=&quot;s5-5&quot;>第五節　不疲極方程式 · 三力共振模型</h2>
<p>論主最後一層理由將「不疲極」拆為三力共振：<b>心強驅動肉體 + 諸佛益其氣力 + 好世福德加持</b>。突破肉體極限並非神話，而是內外因緣的精確計算。</p>
<div class=&quot;triangle-diagram&quot;>
<div class=&quot;tri-node&quot;>
<h5>內 力</h5>
<small>一心求佛道</small>
<small>強大的願力與大欲</small>
<small>以心識驅動肉體</small>
</div>
<div class=&quot;tri-node&quot;>
<h5>佛 力</h5>
<small>十方諸佛所念</small>
<small>諸大菩薩及諸天</small>
<small>「益其氣力」能量共振</small>
</div>
<div class=&quot;tri-node&quot;>
<h5>世 力</h5>
<small>好世福德</small>
<small>眾生本具長壽</small>
<small>大福德力之加持</small>
</div>
<div class=&quot;tri-conclusion&quot;>三 力 共 振 → 雖 住 立 七 歲 而 不 疲 極</div>
</div>
<p>此「不疲極方程式」正是中觀「<b>緣起即空</b>」的精彩應用——色身不疲倦，並非因為色身具有「不疲倦」的自性，而是內、外、世三層因緣和合的結果。緣合則不疲，緣離即敗壞，不必執著「人身軟弱」為一固定屬性。</p>
<h2 id=&quot;s5-6&quot;>第六節　第二重辯證結語 · 心空身亦安</h2>
<p>第二重辯證最終要破的，是<b>時空身見</b>——若執著「這是我的腳，好痠」，即落入身見而無法堅持。正因為觀身如幻，將色身視為純粹的法器，方能超越時間限制。</p>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>破時空身見 · 身心無我</div>
<div class=&quot;card-content&quot;>前章捨身體破<b>內在身見</b>（這身不是我）；本章立七歲破<b>外在時間</b>（七歲不是真實的長度）。內外二重身見既破，七年立而不臥便不再是奇蹟，而是中觀邏輯的自然推演。</div>
</div>
<div class=&quot;mnemonic&quot;>
<p>時 劫 本 如 幻 · 長 短 隨 業 現</p>
<p>身 見 七 載 如 七 日</p>
<p>心 空 · 身 亦 安</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-6&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第四品 · 第六章</div>
<h2 class=&quot;ch-name&quot;>第 三 重 辯 證 · 說 法 矛 盾</h2>
<div class=&quot;ch-sub&quot;>言說般若 vs. 入定七歲 · The Dialectics of Words &amp;amp; Silence</div>
</div>
<div class=&quot;ch-body&quot;>
<p>本章對應第三敘事節點下「曇無竭入無量三昧七歲不出」一段，並對應龍樹之第五、第六、第七組問答。學者的疑問是：應當廣宣般若波羅蜜的導師，何以長達七年絕對沉默？對極度渴求聽法的初學菩薩，這是否違背了慈悲度眾的本誓？論主在此引出「<b>身教重於言教</b>」「<b>癰瘡未熟譬喻</b>」「<b>取代法</b>」三層說明，並接著解釋薩陀波崙在七歲中莊嚴說法處的因緣。</p>
<h2 id=&quot;s6-1&quot;>第一節　學者的疑問 · 寂滅七歲是否違悲度本誓</h2>
<div class=&quot;qa&quot;>
<div class=&quot;q&quot;><strong>問曰：</strong>曇無竭入三昧，何以乃至七歲？</div>
<div class=&quot;a&quot;><strong>答曰：</strong>先已答：好世人壽長，雖七歲不以為久。又曇無竭宮殿、婇女、微妙五欲與天相似；薩陀波崙等新發意者，心未柔軟，疑曇無竭雖說空法、讚歎離欲，謂其心未能捨。是故七歲三昧，欲以除眾疑故，生貴敬心。聞曇無竭七歲三昧，心、口相應能說、能行，則信受其語，易可得度。譬如癰瘡未熟，醫則不破，但以藥塗令熟，熟則易破。</div>
</div>
<p>「<b>癰瘡未熟，醫則不破</b>」這一譬喻是整個第三重辯證的中樞——導師的沉默不是「不說」，而是<b>對說法時機的精密催熟工程</b>。</p>
<h2 id=&quot;s6-2&quot;>第二節　信任危機 · 言行不一的懷疑與身教重於言教</h2>
<p>導師平日宮殿婇女、受五欲樂；初發心菩薩必定生疑：「他雖讚歎離欲，自己真的捨得下嗎？」——這是第三重辯證背後最深的「<b>潛在信任危機</b>」。曇無竭口說空法，自身卻不離五欲場——這正是初學者最容易卡住的「言行不一」疑慮。</p>
<div class=&quot;two-col&quot;>
<div class=&quot;col-card left-blue&quot;>
<div class=&quot;col-title&quot;>言 教 · Word Teaching</div>
<div class=&quot;col-content&quot;>日常宮殿婇女、受五欲樂。<b>看似言行不一</b>，初發心菩薩必生疑慮。光靠口頭宣說空性，無法破除這層理智上的懷疑。</div>
</div>
<div class=&quot;col-card right-brown&quot;>
<div class=&quot;col-title&quot;>身 教 · Embodied Teaching</div>
<div class=&quot;col-content&quot;>為了證明自己「<b>心口相應</b>」，曇無竭必須動真格。入定七年不碰五欲，直接向眾生展示「攝心入慧」。沉默是最強大的身現法，用以粉碎理智上的疑慮。</div>
</div>
</div>
<h2 id=&quot;s6-3&quot;>第三節　時節因緣的催熟 · 癰瘡譬喻曲線</h2>
<p>論主在此引入醫學譬喻：癰瘡未熟之時，強行刺破只會留下傷口；正確的做法是「<b>以藥塗令熟，熟則易破</b>」。導師七年入定，正是這個「塗藥」過程——以無言示現完成信心催熟，待時節成熟，出定說法瞬間開悟。</p>
<div class=&quot;flow flow-v&quot;>
<div class=&quot;flow-step&quot;>癰 瘡 未 熟<br/><small>初發意者心未柔軟</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-step&quot;>七 歲 塗 藥<br/><small>七年三昧的無言示現</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-step&quot;>熟 則 易 破<br/><small>時節成熟，瞬間開悟</small></div>
</div>
<p>等待並非浪費時間，而是<b>精確的信心催熟工程</b>。導師越是沉默，弟子的渴求越是深化，當開講般若那一刻，「心、口相應能說、能行」的信受便如熟透的癰瘡，一觸即破，毫無滯礙。</p>
<p>論主又補一層：「<b>欲受心生實樂故，入無量三昧</b>」「<b>說法有二種：一者口說法，二者身現法。今欲以身現法故，入無量三昧，令眾生知攝心入慧，得如實智</b>」——這是把第三重辯證最深的法理點破：<b>沉默本身就是說法</b>。曇無竭七歲入定，是直接演示般若實證，比任何口頭講解都更具說服力。</p>
<h2 id=&quot;s6-4&quot;>第四節　弟子的防護機制 · 取代法與不味於味</h2>
<p>師方七歲入定固然得體，但弟子方在七年無聲的等待中，又如何保持心智的絕對清淨？論主在此直接引出薩陀波崙的內證境：「<b>三惡覺觀不生，不味於味</b>」。</p>
<div class=&quot;insight&quot;>
<div class=&quot;insight-title&quot;>取代法 · 一念取代三惡</div>
<div class=&quot;insight-content&quot;>薩陀波崙尚未破除煩惱，但他透過「<b>一心念：曇無竭何時當出？</b>」這單一強烈的善念，成功凍結了三惡覺觀。將所有的精神力集中於一個目標，這種強大的專注力暫時取代了「斷煩惱」的功能，形成完美的防護罩——<b>The Suppression Shield</b>。</div>
</div>
<div class=&quot;flow&quot;>
<div class=&quot;flow-box&quot;>三 惡 覺 觀<br/><small>欲、恚、惱</small></div>
<div class=&quot;flow-arrow&quot;>→</div>
<div class=&quot;flow-box flow-emph&quot;>一 心 念<br/><small>曇無竭何時當出</small></div>
<div class=&quot;flow-arrow&quot;>→</div>
<div class=&quot;flow-box&quot;>制 諸 煩 惱<br/><small>凍結三惡 · 不味於味</small></div>
</div>
<p>「<b>不味於味</b>」尤其精微——不貪著飲食之味，專注於求法之欲。這是「以聖欲制凡欲」的中觀心法：不靠強行斷除，而靠更高層次的渴求自然取代。</p>
<h2 id=&quot;s6-5&quot;>第五節　莊嚴說法處 · 在家與出家的供養之別</h2>
<div class=&quot;qa&quot;>
<div class=&quot;q&quot;><strong>問曰：</strong>薩陀波崙云何得知過七歲已，曇無竭當出？</div>
<div class=&quot;a&quot;><strong>答曰：</strong>有人言：先曾七歲展轉聞知。有人言：曇無竭初入三昧時，自說七歲為限。如釋迦文尼佛告阿難：「我欲一月、二月入禪定。」阿難以告四眾。薩陀波崙深愛佛法、敬重曇無竭故，供養莊嚴說法處。出家菩薩但莊嚴其心，詣師受法；在家菩薩則莊嚴說法處，華香供養。</div>
</div>
<div class=&quot;two-col&quot;>
<div class=&quot;col-card left-blue&quot;>
<div class=&quot;col-title&quot;>出 家 菩 薩</div>
<div class=&quot;col-content&quot;>「<b>但莊嚴其心，詣師受法</b>」——重內證、輕外飾。心法上的清淨即是對法的最高供養。</div>
</div>
<div class=&quot;col-card right-brown&quot;>
<div class=&quot;col-title&quot;>在 家 菩 薩</div>
<div class=&quot;col-content&quot;>「<b>莊嚴說法處，華香供養</b>」——薩陀波崙身居在家位，以外境莊嚴顯內心愛法。下文「以身所著上衣敷座、求水灑地、刺血」皆從此心而出。</div>
</div>
</div>
<p>論主又補：「<b>欲令曇無竭知其愛法、欲法相，深心信樂，故現是事</b>」——薩陀波崙的莊嚴行為，本質是讓導師「<b>看見</b>」自己求法的至誠。並非為了外境美觀，而是為了把內心的愛法以可見的形式呈現給說法人。</p>
<h2 id=&quot;s6-6&quot;>第六節　第三重辯證結語 · 口說空，身證空</h2>
<p>第三重辯證最終要破的，是<b>斷常二見</b>——若執著導師受五欲為實有，是凡夫見；若執著尊師入三昧必須永遠苦行，亦是偏見。曇無竭一邊現五欲身、一邊入三昧證空，正是「言教 / 身教」的二諦圓融。</p>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>言教與身教的二諦圓融</div>
<div class=&quot;card-content&quot;>宮殿五欲生敬心（破常見），七歲三昧斷狐疑（破斷見）。<b>口說空</b>是言教層，<b>身證空</b>是身教層；兩者相輔相成，缺一不可。</div>
</div>
<div class=&quot;mnemonic&quot;>
<p>口 說 空 · 身 證 空</p>
<p>離 欲 樂 · 現 真 常</p>
<p>癰 瘡 未 熟 醫 不 破</p>
<p>七 歲 三 昧 斷 狐 疑</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-7&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第四品 · 第七章</div>
<h2 class=&quot;ch-name&quot;>第 四 重 辯 證 · 淨 穢 矛 盾</h2>
<div class=&quot;ch-sub&quot;>魔蔽水源 vs. 刺血灑地 · The Dialectics of Purity &amp;amp; Defilement</div>
</div>
<div class=&quot;ch-body&quot;>
<p>本章是全品最戲劇性的辯證——薩陀波崙敷座已，求水灑地而不可得，原因是惡魔波旬隱蔽水源；薩陀波崙當即以「我何用此身！」之觀，自刺其身、出血灑地。這一行為若不解構，看似瘋狂自殘；論主卻指出，這正是中觀「<b>無分別智 + 諸天護持</b>」雙重作用的精密結晶。本章對應龍樹之第八、第九組問答。</p>
<h2 id=&quot;s7-1&quot;>第一節　學者的疑問 · 血腥自殘何以證成清淨供養</h2>
<p>供養理應清淨——求水灑地、華香供養——這是世俗對供養的基本想像。而魔王所隱蔽的，正是「世俗清淨」的這條路徑。緊接著薩陀波崙的反應卻是「自刺其身，出血灑地」——以「腥臭」的肉身之血替代清淨之水。學者的疑問：這種看似瘋狂的自殘行為，在中觀邏輯中如何被證成為「<b>清淨的無分別智</b>」？</p>
<h2 id=&quot;s7-2&quot;>第二節　心理戰 · 魔考的攻擊向量</h2>
<div class=&quot;qa&quot;>
<div class=&quot;q&quot;><strong>問曰：</strong>魔何以隱蔽水源？（隱含於文中設問）</div>
<div class=&quot;a&quot;><strong>答曰：</strong>魔作是念：「若薩陀波崙求水不得，其心則劣，志願不滿故。又令自鄙其身，我薄福德故，為供養法，求水不得，以自輕憂愁覆心故。」福德不增、智慧不照不明者，諸憂愁煩惱覆心故，諸福德、智慧不能照明；譬如日障蔽故，其照不明。魔知其心大，不可沮壞，但小沮壞，令其稽留。</div>
</div>
<p>魔的目的並非生理剝奪，而是<b>精準的心智破壞</b>。論主將魔的攻擊路徑拆解為五階段——這是整段敘事最隱秘也最重要的心理戰結構：</p>
<div class=&quot;flow flow-v&quot;>
<div class=&quot;flow-step&quot;>缺 水<br/><small>Lack of Water</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-step&quot;>志 願 受 挫<br/><small>Frustrated Goal</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-step&quot;>自 鄙 / 自 輕<br/><small>「我薄福德故」</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-step&quot;>憂 愁 覆 心<br/><small>Clouded Mind</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-step flow-emph&quot;>智 慧 不 照 · 稽 留 道 業<br/><small>Prajñā Blocked · The Strategic Goal of Māra</small></div>
</div>
<p>魔知薩陀波崙「<b>心大，不可沮壞</b>」，故不能正面進攻，<b>只採用微小的挫折進行消耗戰</b>——如同烏雲蔽日，一旦落入「自輕悔恨」的陷阱，般若智慧即刻被屏蔽。「<b>譬如日障蔽故，其照不明</b>」這個譬喻把「自鄙」的危害講透：智慧本來如日光長明，烏雲（自鄙憂愁）一遮，並非智慧滅了，而是其照明被打斷。</p>
<h2 id=&quot;s7-3&quot;>第三節　破局之道 · 不自鄙的絕對行動力</h2>
<p>薩陀波崙的反制方式有兩層精微：</p>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>反制憂愁的利刃</div>
<div class=&quot;card-content&quot;>面對逆境，不墮入「我業障重」的自憐陷阱。立刻尋找替代方案，以<b>絕對的行動力</b>斬斷「憂愁」的滋生空間。「我當自刺其身」這個念頭在問題出現的瞬間就被決定，沒有給魔的攻擊向量留下一絲發酵時間。</div>
</div>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>忘身法與表法觀</div>
<div class=&quot;card-content&quot;>透過極端行為向法義證明：「<b>對法的渴慕，超越了對此生皮囊的最後一絲執著</b>」。供養不僅是給予外物，而是獻出自我。「<b>我何用此身！此身必當破壞。我從無始生死已來數數喪身，未曾為法</b>」——這是從觀身無常直接導出的決定。</div>
</div>
<div class=&quot;flow&quot;>
<div class=&quot;flow-box&quot;>缺 水<br/><small>Lack of Water</small></div>
<div class=&quot;flow-arrow&quot;>→</div>
<div class=&quot;flow-box&quot;>志 願 受 挫</div>
<div class=&quot;flow-arrow&quot;>→</div>
<div class=&quot;flow-box flow-emph&quot;>刺 血 灑 地<br/><small>Extreme Action</small></div>
<div class=&quot;flow-arrow&quot;>→</div>
<div class=&quot;flow-box&quot;>破 除 身 見<br/><small>Eradicating Body View</small></div>
<div class=&quot;flow-arrow&quot;>→</div>
<div class=&quot;flow-box&quot;>智 慧 明 照<br/><small>Prajñā Illuminated</small></div>
</div>
<h2 id=&quot;s7-4&quot;>第四節　四大無我與淨穢轉化機制</h2>
<p>問題的下一層：人血肉本臭，何以能用以供養法座？論主對此給出最深的中觀法理：「<b>以其至心求水不得，意不分別香臭好惡，為欲淹塵，不惜身命。又薩陀波崙深心愛著般若波羅蜜故，無所愛惜</b>」——關鍵在於<b>意不分別</b>。</p>
<div class=&quot;triangle-diagram&quot;>
<div class=&quot;tri-node&quot;>
<h5>四 大 互 換</h5>
<small>身中四大本無自性</small>
<small>外水被魔隱蔽</small>
<small>即調用體內內水（血）</small>
</div>
<div class=&quot;tri-node&quot;>
<h5>無 分 別 智</h5>
<small>意不分別香臭好惡</small>
<small>深心愛著般若</small>
<small>「我」是空 · 內外平等</small>
</div>
<div class=&quot;tri-node&quot;>
<h5>諸 天 護 持</h5>
<small>諸天龍鬼神隨逐</small>
<small>無量福德成就</small>
<small>所出之血變為香水</small>
</div>
<div class=&quot;tri-conclusion&quot;>至 心 + 無 分 別 + 福 德 → 血 變 香 水 · 隨 願 即 成</div>
</div>
<div class=&quot;qa&quot;>
<div class=&quot;q&quot;><strong>問曰：</strong>刺血灑地之合理性？（隱含於文中設問）</div>
<div class=&quot;a&quot;><strong>答曰：</strong>有人言：「多有諸天龍、鬼神等常隨逐薩陀波崙，佐助守護，是故所出之血變為香水。如羼提仙人被割截時，血化為乳。」又以無量福德成就故，隨願即成。</div>
</div>
<p>四大本空，故外水（井泉之水）與內水（血）在勝義上本無自性可言「淨」「穢」。當薩陀波崙的「至心 + 無分別 + 福德」三者具足，物理屬性即被改寫——所出之血瞬間變為香水。這正是中觀「<b>境隨心轉</b>」的具體展現，<b>羼提仙人血化為乳</b>的典故為其旁證。</p>
<h2 id=&quot;s7-5&quot;>第五節　心法提煉 · 心物階層與不分別觀</h2>
<p>此段在極限壓力測試中，證成了菩薩道的<b>心物法則優先級</b>（Mind-Over-Matter Hierarchy）。論主同時提煉出兩個並列心法：</p>
<div class=&quot;two-col&quot;>
<div class=&quot;col-card left-blue&quot;>
<div class=&quot;col-title&quot;>不自鄙的防護觀</div>
<div class=&quot;col-content&quot;>在逆境中，第一要務是<b>防護心智不被「憂愁」污染</b>。資源匱乏不代表福報欠缺，而是考驗調度替代資源的決心。「自鄙」是魔的根本陷阱，「不自鄙」是般若的根本盾牌。</div>
</div>
<div class=&quot;col-card right-brown&quot;>
<div class=&quot;col-title&quot;>淨穢平等觀</div>
<div class=&quot;col-content&quot;>破除世俗對乾淨與汙穢的僵化定義。當心專注於崇高的利他目標時，物質世界的「<b>好惡</b>」失去自性，環境將隨著心念而重塑——這就是「忘身法 / Forgetting the Body」的具體應用。</div>
</div>
</div>
<h2 id=&quot;s7-6&quot;>第六節　第四重辯證結語 · 心淨則土淨</h2>
<p>第四重辯證最終要破的，是<b>物質實有見</b>——「水」「血」「香」「臭」皆無固定實體。魔試圖用物質障礙阻擋菩薩道業，菩薩則用心理空性破解物理障礙。</p>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>境 隨 心 轉 · 四 大 本 空</div>
<div class=&quot;card-content&quot;>外水既被隱蔽，內水（血）即時調用；身中四大本非「我」所有，唯有「法」是真正的求取對象。<b>心淨</b>，則土自淨；腥血化為香水檀香。</div>
</div>
<div class=&quot;mnemonic&quot;>
<p>外 水 既 隱 · 內 水 當 灑</p>
<p>四 大 非 我 · 唯 法 是 求</p>
<p>心 淨 則 土 淨 · 腥 血 化 栴 檀</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-8&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第四品 · 第八章</div>
<h2 class=&quot;ch-name&quot;>終 極 統 合 · 悲 智 雙 運</h2>
<div class=&quot;ch-sub&quot;>空性演算法 · The Epistemological Blueprint of Prajñā</div>
</div>
<div class=&quot;ch-body&quot;>
<p>四重辯證至此已逐一解構。本章將分散在各章中的中觀解局收束為「<b>悲智雙運的中觀宿諦</b>」——整部薩陀波崙求法記，本質上是一個動態平衡系統。導師（曇無竭）代表「悲」與「智」的向下相容；學子（薩陀波崙）代表「願」與「行」的向上突破。這兩股看似衝突的力量，在《中論》「緣起性空」的架構下完美耦合。</p>
<h2 id=&quot;s8-1&quot;>第一節　四大辯證總表 · 矛盾·解局·記憶</h2>
<p>將敘事結構還原為嚴密的修行運算矩陣：</p>
<table class=&quot;compare-table&quot;>
<tr>
<th style=&quot;width:14%&quot;>辯證節點</th>
<th>表層矛盾（世俗）</th>
<th>中觀解局（第一義）</th>
<th>記憶口訣</th>
</tr>
<tr>
<td class=&quot;col-label&quot;>第一重<br/>行儀</td>
<td>師受樂 vs. 徒立候</td>
<td>隨順方便 vs. 大欲精進</td>
<td>法無定相<br/>隨心而轉</td>
</tr>
<tr>
<td class=&quot;col-label&quot;>第二重<br/>時空</td>
<td>人身弱 vs. 站七年</td>
<td>願力加持 + 時空相對</td>
<td>身見既破<br/>心空身安</td>
</tr>
<tr>
<td class=&quot;col-label&quot;>第三重<br/>說法</td>
<td>求法渴 vs. 入定默</td>
<td>身教證空 + 催熟因緣</td>
<td>癰瘡未熟<br/>身教圓融</td>
</tr>
<tr>
<td class=&quot;col-label&quot;>第四重<br/>淨穢</td>
<td>供法清 vs. 灑血穢</td>
<td>四大互換 + 境隨心轉</td>
<td>外隱內灑<br/>血化栴檀</td>
</tr>
</table>
<p>四欄並列之後，幾個關鍵共相便清晰浮出：每一重辯證都遵循「<b>表層矛盾 → 二諦並立 → 心法提煉</b>」的三段式；每一重的中觀解局都不否定世俗諦的合理性，而是把它重新安置在第一義諦的脈絡下；每一個口訣都可單獨記憶、單獨應用——這是龍樹刻意設計的「可攜帶心法」。</p>
<h2 id=&quot;s8-2&quot;>第二節　動態平衡系統 · 導師向下與學子向上</h2>
<p>整部求法記展現了一個完美的動態平衡：</p>
<div class=&quot;two-col&quot;>
<div class=&quot;col-card left-blue&quot;>
<div class=&quot;col-title&quot;>導師 · 慈智下化</div>
<div class=&quot;col-content&quot;><b>曇無竭</b>：入宮受樂、七歲入定、放任求水不得。Upāya（方便）+ 大悲，自上而下相容受眾。</div>

<div class=&quot;col-card right-brown&quot;>

<div class=&quot;col-content&quot;><b>薩陀波崙</b>：以身屬師、七歲立候、刺血灑地。Vīrya（精進）+ 大欲忘身，自下而上突破極限。</div>

<div class=&quot;spectrum&quot;>

<h5>悲 · 智 向 下</h5>

<small>Compassion + Wisdom</small>
<small style=&quot;margin-top:6px&quot;>適應受眾根器</small>

<div class=&quot;sp-node sp-mid&quot;>

</div>

<p>沒有學子的極端精進，導師的沉默說法便無處安立；沒有導師的權巧，學子的精進將淪為徒勞。<b>悲智雙運</b>不是兩個獨立心法，而是同一中道在不同位次上的兩種顯現。</p>
<h2 id=&quot;s8-3&quot;>第三節　從神話到心法 · The Epistemological Blueprint of Prajñā</h2>
<p>讀完本品的論釋，我們得以重新看待「薩陀波崙求法記」：</p>
<div class=&quot;insight&quot;>
<div class=&quot;insight-title&quot;>給當代學者的啟示</div>
<div class=&quot;insight-content&quot;>
<p>我們不再只看見<b>流血與苦行</b>，</p>
<p>而是看見一套能<b>重塑時空、防護心智、改變物質性質</b>的「<b>空性演算法</b>」。</p>
<p style=&quot;font-style:italic;color:var(--text-muted);font-size:17px;margin-top:14px;text-align:right&quot;>— The Epistemological Blueprint of Prajñā</p>
</div>
</div>
<h3 id=&quot;s8-3-1&quot;>一、極端行為並非狂熱</h3>
<p>七歲立候、刺血灑地——這些行為在表層看似「狂熱」，但在中觀層面，每一個動作都對應到一條精確的法義推理：「<b>由重抵輕</b>」對應沉沒成本理論；「<b>不自鄙</b>」對應魔的攻擊向量截斷；「<b>意不分別</b>」對應四大互換的轉化條件——這些不是激情，而是精密的修行運算。</p>
<h3 id=&quot;s8-3-2&quot;>二、敘事即心法地圖</h3>
<p>《大智度論》卷九十九本品的敘事結構並非偶然——四重辯證恰好對應修行者最常遇到的四類困境：行儀疑慮、體能極限、信心動搖、外境逼迫。讀者只要在面對任一困境時，回憶起對應的口訣，便能立刻找到中觀進路。</p>
<h3 id=&quot;s8-3-3&quot;>三、二諦圓融的可攜帶性</h3>
<p>本品的最大特色是：四個辯證節點都同時保留了世俗諦的合理性與第一義諦的解脫性。讀者不必在「世法」與「出世法」之間做痛苦的選擇——曇無竭示現的，正是「<b>住世而出世，出世不離世</b>」的中道風骨。</p>
<h2 id=&quot;s8-4&quot;>第四節　全 品 收 束 · 十 字 心 法</h2>
<p>若以十字總持收束全品，可得：</p>
<div class=&quot;mnemonic&quot; style=&quot;padding:32px 30px&quot;>
<p style=&quot;font-size:24px;letter-spacing:6px&quot;>如 · 緣 · 諦 · 行 · 證</p>
<p style=&quot;font-size:24px;letter-spacing:6px&quot;>心 · 時 · 言 · 淨 · 圓</p>
<p style=&quot;font-size:14px;letter-spacing:3px;margin-top:18px;color:rgba(255,255,255,.75);font-family:'Noto Sans TC',sans-serif&quot;>
        如：諸法如不動相 · 緣：諸緣合故有 · 諦：二諦相即<br/>
        行：方便與精進 · 證：身證即口說<br/>
        心：心強身亦安 · 時：七歲如七日 · 言：默然即說法<br/>
        淨：意不分別香臭 · 圓：悲智雙運中道
      </p>
</div>
<p style=&quot;margin-top:24px&quot;>前五字統攝<b>義理底盤</b>（諸佛無來無去的五喻法義）；後五字統攝<b>四重辯證的心法提煉</b>。讀者若能在日常修行中常持此十字，本品所傳遞的「空性演算法」便不只是書頁上的文字，而能轉為當下面對任何境界的活用智慧。</p>
<hr/>
<p style=&quot;text-align:center;color:var(--text-muted);font-size:17px;letter-spacing:2px;margin-top:24px&quot;>
      — 大智度論 · 卷九十九 · 第四品 · 曇無竭品釋疑分 · 終 —
    </p>
<p style=&quot;text-align:center;color:var(--text-muted);font-size:15.5px;margin-top:8px&quot;>
      下一品將承「曇無竭出三昧、坐法座說般若」之事相，續論「般若實證」的圓滿章節。
    </p>
</div>

  max-width:760px;margin:0 auto;line-height:1.9;
}
.ch-body{
  background:var(--card);
  max-width:980px;margin:0 auto;padding:40px 36px 56px;
  border-left:1px solid var(--border-light);
  border-right:1px solid var(--border-light);
}

/* ── 章內元素 ── */
h2{
  font-size:30px;color:var(--accent);margin:32px 0 14px;
  padding:10px 0 10px 20px;border-left:4px solid var(--gold);
  background:linear-gradient(90deg,rgba(184,134,11,.08),transparent);
  letter-spacing:2px;
}
h3{
  font-size:23.5px;color:var(--text);margin:24px 0 10px;
  padding-bottom:6px;border-bottom:1px solid var(--border-light);
}
h4{font-size:20px;color:var(--text2);margin:18px 0 8px;}
h5{font-size:18.5px;color:var(--accent);margin:14px 0 6px;}
p{font-size:20px;color:var(--text);line-height:1.9;margin:0 0 12px;}
strong,b{color:var(--accent-red);font-weight:600;}

/* ── 段落縮排（問答自動標記） ── */
.qa-2{padding-left:2em;}
.qa-3{padding-left:3em;}

/* ── 經典原文 ── */
.classical-text{
  background:#FFFDF5;border:1px solid #E8E0D0;
  border-radius:10px;padding:22px 26px;line-height:2;
  margin:18px 0;position:relative;font-size:20px;
}
.text-label{
  display:inline-block;background:var(--accent);color:#fff;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:13.5px;
  padding:3px 14px;border-radius:14px;letter-spacing:3px;
  margin-bottom:12px;
}

/* ── 偈頌／引文 ── */
.verse,.gatha,blockquote{
  background:var(--verseBg);border-left:4px solid var(--verseBd);
  padding:18px 26px;margin:18px 0;line-height:2.2;
  white-space:normal;text-align:center;
  font-style:normal;font-size:22px;color:var(--text);border-radius:0 8px 8px 0;
}
.verse small,.gatha small{color:var(--text-muted);font-size:14px;letter-spacing:2px;display:block;margin-top:6px;}

/* ── 卡片類 ── */
.card,.insight,.commentary,.practice,.metaphor,.note{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:18px 24px;margin:16px 0;
  box-shadow:0 1px 3px var(--shadow);font-size:20px;line-height:1.9;
}
.insight{border-left:4px solid var(--gold);}
.commentary{border-left:4px solid var(--accent);background:#fffaf0;}
.practice{border-left:4px solid #6b8e23;background:#f8faf2;}
.metaphor{border-left:4px solid #a85a3c;background:#fdf6f0;}

.card-title{
  font-size:21.5px;color:var(--accent);font-weight:600;
  margin-bottom:10px;letter-spacing:1px;
}
.card-desc{font-size:20px;color:var(--text);line-height:1.9;}

/* ── 問答 ── */
.qa{
  display:grid;grid-template-columns:1fr 1fr;gap:18px;
  margin:18px 0;
}
.qa .q,.qa .a{
  padding:18px 22px;border-radius:8px;font-size:19px;line-height:1.9;
}
.qa .q{background:#eef3f8;border-left:4px solid #4a76a8;color:#1d3557;}
.qa .a{background:#fdf6e8;border-left:4px solid var(--accent);color:var(--text);}
.qa .q strong,.qa .a strong{color:inherit;}
.qa-label{
  display:inline-block;font-family:&quot;Noto Sans TC&quot;,sans-serif;
  font-size:13.5px;padding:2px 12px;border-radius:12px;
  letter-spacing:2px;color:#fff;margin-bottom:8px;
}
.qa .q .qa-label{background:#4a76a8;}
.qa .a .qa-label{background:var(--accent);}

/* ── 格線 ── */
.four-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;}
.four-grid .cell{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:16px 20px;font-size:19px;
}
.four-grid .cell-title{
  color:var(--accent);font-weight:600;font-size:18px;
  margin-bottom:8px;letter-spacing:1px;
}

.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0;}
.three-col .col{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:16px 18px;font-size:19px;
}
.three-col .col-title{
  color:var(--accent);font-weight:600;font-size:17.5px;
  margin-bottom:8px;letter-spacing:1px;
  padding-bottom:6px;border-bottom:1px solid var(--border-light);
}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;}
.two-col .col{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:16px 20px;font-size:19px;
}

/* ── 流程圖（垂直） ── */
.flow{
  display:flex;flex-direction:column;align-items:center;
  gap:8px;margin:18px 0;
}
.flow.flow-h{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:stretch;}
.flow-box,.flow-step{
  background:var(--card);border:1.5px solid var(--gold);
  border-radius:10px;padding:14px 22px;
  min-width:240px;max-width:680px;text-align:center;
  font-size:17.5px;line-height:1.6;color:var(--text);
  box-shadow:0 1px 4px rgba(184,134,11,.12);
}
.flow-box strong,.flow-step strong{color:var(--accent);}
.flow-box small,.flow-step small{display:block;color:var(--text-muted);font-size:13.5px;margin-top:4px;letter-spacing:1px;}
.flow-arrow{font-size:22px;color:var(--gold);font-weight:700;}

/* ── 三柱結構 ── */
.tri-pillar{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
  margin:18px 0;
}
.tri-pillar .pillar{
  background:linear-gradient(180deg,#fffaf0,#fdf6e8);
  border:1px solid var(--border);border-top:4px solid var(--gold);
  border-radius:8px;padding:18px 18px;text-align:center;
}
.tri-pillar .pillar-num{
  display:inline-block;width:30px;height:30px;border-radius:50%;
  background:var(--gold);color:#fff;line-height:30px;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-weight:700;
  margin-bottom:8px;
}
.tri-pillar .pillar-title{
  font-size:18px;color:var(--accent);font-weight:600;
  margin-bottom:8px;letter-spacing:1px;
}
.tri-pillar .pillar-desc{font-size:16.5px;color:var(--text2);line-height:1.7;}

/* ── 五重塔 ── */
.pagoda{
  display:flex;flex-direction:column;align-items:center;
  gap:4px;margin:24px 0;
}
.pagoda .layer{
  background:linear-gradient(135deg,#fffaf0,#f5ecd8);
  border:1px solid var(--gold);border-radius:6px;
  padding:12px 22px;text-align:center;font-size:18px;
  box-shadow:0 1px 3px rgba(184,134,11,.15);
  position:relative;
}
.pagoda .layer-1{width:62%;}
.pagoda .layer-2{width:68%;}
.pagoda .layer-3{width:74%;}
.pagoda .layer-4{width:80%;}
.pagoda .layer-5{width:88%;}
.pagoda .layer .ord{
  display:inline-block;width:26px;height:26px;border-radius:50%;
  background:var(--gold);color:#fff;line-height:26px;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:13.5px;font-weight:700;
  margin-right:10px;
}
.pagoda .layer strong{color:var(--accent);}
.pagoda .layer .ja{font-size:12.5px;color:var(--text-muted);letter-spacing:1.5px;margin-left:8px;}
.pagoda .base{
  margin-top:6px;width:96%;padding:10px 22px;
  background:var(--accent);color:#fff;border-radius:6px;
  text-align:center;font-size:17.5px;letter-spacing:6px;font-weight:600;
}

/* ── 對照矩陣表 ── */
.matrix-table{
  width:100%;border-collapse:collapse;margin:18px 0;
  font-size:18px;line-height:1.7;
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;
}
.matrix-table th{
  background:var(--accent);color:#fff;
  padding:12px 14px;text-align:center;font-weight:600;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;letter-spacing:2px;font-size:16px;
}
.matrix-table td{
  padding:12px 14px;border:1px solid var(--border-light);
  vertical-align:top;
}
.matrix-table td:first-child{
  background:#fdf6e8;color:var(--accent);font-weight:600;
  text-align:center;width:18%;
}
.matrix-table tr:nth-child(even) td:not(:first-child){background:#fffdf7;}

/* ── 三欄總表（最終章用） ── */
.summary-table{
  width:100%;border-collapse:collapse;margin:20px 0;
  font-size:17.5px;line-height:1.75;
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;
}
.summary-table th{
  background:linear-gradient(135deg,var(--accent),var(--accentL));
  color:#fff;padding:14px 14px;text-align:center;font-weight:600;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;letter-spacing:3px;font-size:16px;
}
.summary-table td{
  padding:14px 14px;border:1px solid var(--border-light);vertical-align:top;
}
.summary-table td:nth-child(1){background:#fdf6e8;text-align:center;font-weight:600;color:var(--accent);width:23%;}
.summary-table td:nth-child(2){width:32%;color:var(--text);}
.summary-table td:nth-child(3){width:45%;color:var(--text2);font-style:italic;}

/* ── 上升光帶（五節點） ── */
.ladder{
  display:flex;flex-direction:column;gap:10px;margin:24px 0;
  padding:18px 22px;background:linear-gradient(180deg,#fffaf0 0%,#f5ecd8 100%);
  border:1px solid var(--gold);border-radius:12px;
}
.ladder .step{
  display:flex;align-items:center;gap:18px;
  padding:12px 18px;background:var(--card);
  border-radius:8px;border-left:4px solid var(--gold);
  font-size:18.5px;
}
.ladder .step .num{
  flex-shrink:0;width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:18px;font-weight:700;
}
.ladder .step .lab{font-weight:600;color:var(--accent);min-width:120px;}
.ladder .step .ar{color:var(--gold);font-size:18px;}
.ladder .step .dx{color:var(--text2);font-size:16.5px;flex:1;}

/* ── 維恩風（四大互換） ── */
.venn-wrap{
  display:flex;justify-content:center;align-items:center;
  min-height:260px;gap:0;margin:24px 0;
}
.venn-circle{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  width:220px;height:220px;border-radius:50%;
  font-size:16px;line-height:1.55;font-weight:600;
  text-align:center;padding:0 22px;box-sizing:border-box;
  gap:6px;color:var(--text);
}
.venn-circle br{display:none;}
.venn-circle small{font-size:12.5px;display:block;width:100%;text-align:center;line-height:1.4;color:var(--text-muted);font-weight:400;}
.venn-a{background:rgba(74,118,168,.32);border:2px solid #4a76a8;margin-right:-50px;}
.venn-b{background:rgba(184,134,11,.32);border:2px solid var(--gold);margin-left:-50px;}
.venn-label{
  font-family:&quot;Noto Sans TC&quot;,sans-serif;letter-spacing:2px;
  text-align:center;color:var(--accent);font-size:18px;
  margin-top:8px;font-weight:600;
}

/* ── 章節橋接（前置／後置） ── */
.bridge{
  background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:10px;padding:22px 28px;margin:24px 0;
  box-shadow:0 2px 10px rgba(91,58,41,.06);
}
.bridge-outro{
  border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);
}
.bridge-label{
  display:inline-block;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:12.5px;
  background:var(--gold);color:#fff;padding:3px 14px;border-radius:14px;
  letter-spacing:2.2px;margin-bottom:12px;
}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{font-size:18.5px;color:var(--text2);line-height:2.1;margin:0;}

/* ── 進度條 ── */
.read-progress{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:120;background:rgba(30,26,20,.92);color:var(--gold);
  padding:9px 24px;border-radius:30px;
  border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:&quot;Noto Sans TC&quot;,sans-serif;
  font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:14px;
  pointer-events:none;user-select:none;backdrop-filter:blur(6px);
}
.rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));
  width:0%;transition:width .3s;}
.rp-pct{font-weight:600;min-width:42px;text-align:right;font-size:13px;}
.rp-label{font-size:12px;opacity:.75;letter-spacing:3px;}

/* ── 回頂按鈕 ── */
#backTop{
  position:fixed;right:20px;bottom:74px;z-index:110;
  width:44px;height:44px;border-radius:50%;
  background:var(--sbBg);color:var(--gold);
  border:1px solid rgba(184,134,11,.4);font-size:18px;
  cursor:pointer;opacity:0;visibility:hidden;
  transition:all .25s;box-shadow:0 4px 14px rgba(0,0,0,.18);
}
#backTop.show{opacity:1;visibility:visible;}
#backTop:hover{color:#fff;background:var(--gold);}

/* ── 頁尾 ── */
.site-footer{
  text-align:center;padding:42px 28px;
  background:var(--sbBg);color:#a99670;
  font-size:15px;letter-spacing:2px;line-height:2;margin-top:64px;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;
}
.site-footer .ft-line{margin-bottom:8px;}
.site-footer .ft-em{color:var(--goldL);}

/* ── 響應式 ── */
@media (max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);}
  #sbToggle{display:block;}
  .main{margin-left:0;}
  .ch-body{padding:30px 20px 42px;}
  .qa,.four-grid,.three-col,.two-col,.tri-pillar{grid-template-columns:1fr;}
  .hero-title{font-size:38px;letter-spacing:4px;}
  .hero-subtitle{font-size:16px;letter-spacing:3px;}
  .ch-name{font-size:26px;}
  .toc-grid{grid-template-columns:1fr;}
  .venn-wrap{flex-direction:column;min-height:auto;}
  .venn-a,.venn-b{margin:0;}
}
@media (max-width:600px){
  body{font-size:17px;}
  h2{font-size:24px;}
  h3{font-size:20px;}
  .verse,.gatha{font-size:18px;}
}

<div class=&quot;preface&quot;>
<div class=&quot;preface-title&quot;>本品要旨</div>
<p>本品（卷九十九 · 第五品）緊接著曇無竭菩薩開示「諸佛無來無去」之後，敘述薩陀波崙菩薩在「七年待法 → 魔王隱水 → 刺血灑地 → 帝釋讚歎 → 曇無竭出三昧 → 見師大歡喜如三禪樂」這一連串極限考驗中的中觀實踐。</p>
<p>表面上是充滿戲劇性的供養與感應故事，骨子裡卻是龍樹菩薩用九組緊湊的問答——將每一個情節都拆解為「事相 → 心法 → 中觀理路」三層的精密驗算。本品因此被視為《大智度論》末卷裡最具實踐張力的「空性構築藍圖」。</p>
<p>本網頁依照論文〈空性構築藍圖：薩陀波崙菩薩的中觀實踐矩陣〉之解構邏輯，將本品分為九章。前八章對應「魔隱水 → 刺血 → 防護 → 精進 → 四大互換 → 感應 → 禪定出入 → 第三禪樂喻」八個關鍵節點；最終第九章以「五節點上升光帶」與「事件·心法·中觀理路三欄總表」總攝全品。每一章皆同時呈現經文原典、論主問答與中觀解構，使讀者能從事相層、論理層與實證層三方互證。</p>
</div>
