<title>大智度論 · 卷九十九 · 釋曇無竭品 第一～第五品</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&amp;family=Noto+Sans+TC:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f7f3ec; --text:#2c2416; --text2:#5a4e3a; --text-muted:#6B5B4B;
  --accent:#8b5e3c; --accentL:#c4956a; --accent-red:#8B2500;
  --gold:#b8860b; --goldL:#d4a84b; --gold-light:#C9A84C;
  --border:#d4c4a8; --border-light:#EDE8E0; --card:#fffdf7;
  --verseBg:#f0e8d8; --verseBd:#c4956a;
  --sbW:76px; --sbBg:#1e1a14; --sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
  --r:8px;
}
*{box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;}
html,body{scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none!important;width:0;height:0;}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",Georgia,serif;font-size:20px;line-height:1.85;-webkit-font-smoothing:antialiased;}
img{-webkit-user-drag:none;pointer-events:none;}

/* ===== 側欄 ===== */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;background:var(--sbBg);color:var(--sbText);z-index:100;display:flex;flex-direction:column;align-items:center;padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sb-brand{position:sticky;top:0;width:100%;font-family:"Noto Sans TC",sans-serif;color:var(--gold);text-align:center;line-height:1.5;background:linear-gradient(to bottom,var(--sbBg) 78%,rgba(30,26,20,0));padding:14px 4px 12px;margin-bottom:6px;z-index:5;text-decoration:none;cursor:pointer;transition:color .25s;display:block;border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand .sb-brand-line2{display:block;font-size:13px;font-weight:700;letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;gap:8px;width:100%;align-items:center;padding-top:6px;}
.sb-item{text-decoration:none;color:var(--sbText);display:flex;flex-direction:column;align-items:center;padding:5px 4px;width:64px;border-radius:8px;transition:background .2s,color .2s;}
.sb-item:hover{background:rgba(184,134,11,.12);color:var(--goldL);}
.sb-item.active{background:rgba(184,134,11,.22);color:#fff;box-shadow:0 0 14px rgba(184,134,11,.4) inset;}
.sb-circle{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:"Noto Sans TC",sans-serif;font-size:15px;font-weight:700;color:var(--gold);background:rgba(184,134,11,.08);margin-bottom:4px;}
.sb-item.active .sb-circle{background:var(--gold);color:#1e1a14;}
.sb-label{font-family:"Noto Sans TC",sans-serif;font-size:11.5px;letter-spacing:.5px;line-height:1.2;text-align:center;}

/* ===== Hamburger ===== */
#sbToggle{display:none;position:fixed;top:14px;left:14px;z-index:200;width:42px;height:42px;border:none;border-radius:8px;background:var(--sbBg);color:var(--gold);font-size:22px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);}

/* ===== 主內容 ===== */
.main{margin-left:var(--sbW);padding:0 28px 80px;}

/* ===== Hero ===== */
.site-hero{position:relative;background:linear-gradient(135deg,#1a1612 0%,#2a2018 50%,#1a1612 100%);color:#f5e8c5;padding:90px 32px 76px;text-align:center;border-radius:0 0 16px 16px;overflow:hidden;margin:0 -28px 30px;}
.site-hero::before{content:"般若";position:absolute;font-size:280px;font-weight:900;color:rgba(212,168,75,.045);left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Noto Serif TC",serif;letter-spacing:30px;}
.site-hero::after{content:"卷九十九";position:absolute;font-size:140px;font-weight:900;color:rgba(184,134,11,.04);right:-20px;bottom:-30px;font-family:"Noto Serif TC",serif;letter-spacing:10px;}
.hero-content{position:relative;z-index:1;}
.hero-title{font-size:56px;font-weight:900;color:var(--goldL);margin:0 0 18px;letter-spacing:8px;text-shadow:0 2px 20px rgba(212,168,75,.3);}
.hero-subtitle{font-size:20px;color:#e8d8b2;margin:0 0 14px;letter-spacing:4px;font-weight:300;}
.hero-sub{font-size:18px;color:#d4c4a8;margin:0 0 22px;letter-spacing:3px;line-height:1.9;}
.hero-meta{display:flex;justify-content:center;gap:36px;flex-wrap:wrap;font-size:18px;color:#c4a87a;margin-top:24px;padding-top:22px;border-top:1px solid rgba(212,168,75,.22);}
.hero-meta span::before{content:"·";color:var(--goldL);margin-right:8px;}
.hero-range{margin-top:18px;font-size:17px;color:#b39866;letter-spacing:2px;font-style:italic;}

/* ===== Preface ===== */
.preface{max-width:920px;margin:36px auto 40px;padding:32px 36px;background:linear-gradient(135deg,#fffdf5,#f5ecd8);border:1px solid var(--border);border-left:5px solid var(--gold);border-radius:14px;box-shadow:0 4px 18px rgba(91,58,41,.08);}
.preface h2{font-size:30px;color:var(--accent);text-align:center;margin:0 0 22px;letter-spacing:4px;}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);margin:0 0 16px;text-indent:2em;}
.preface p:last-child{margin-bottom:0;}
.preface strong{color:var(--accent-red);font-weight:700;}

/* ===== TOC ===== */
.toc-section{max-width:1100px;margin:30px auto 50px;padding:36px 28px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 3px 14px rgba(91,58,41,.06);}
.toc-title{font-size:34px;color:var(--accent);text-align:center;margin:0 0 8px;letter-spacing:8px;font-weight:700;}
.toc-desc{font-size:17px;color:var(--text-muted);text-align:center;margin:0 0 28px;letter-spacing:3px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
.toc-card{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border:1px solid var(--border-light);border-radius:10px;background:#fffefa;text-decoration:none;color:var(--text);transition:all .25s;}
.toc-card:hover{background:#fff8e6;border-color:var(--gold);transform:translateY(-2px);box-shadow:0 4px 12px rgba(184,134,11,.18);}
.toc-num{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans TC",sans-serif;font-size:18px;font-weight:700;box-shadow:0 2px 6px rgba(184,134,11,.3);}
.toc-name{flex:1;font-size:19.5px;line-height:1.7;color:var(--text);font-weight:600;}
.toc-sub{display:block;font-size:14.5px;color:var(--text-muted);font-weight:400;margin-top:3px;}

/* ===== Chapter（外層）===== */
.chapter{margin:60px 0;scroll-margin-top:24px;}
.ch-head{background:var(--headGrad);color:#f5e8c5;padding:52px 32px;text-align:center;border-radius:14px 14px 0 0;position:relative;}
.ch-head::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--goldL),transparent);}
.ch-num{font-size:18px;color:var(--goldL);letter-spacing:5px;margin-bottom:14px;font-family:"Noto Sans TC",sans-serif;}
.ch-name{font-size:34px;color:#fff;margin:0 0 12px;letter-spacing:5px;font-weight:700;}
.ch-sub{font-size:17px;color:#d4c4a8;letter-spacing:2px;line-height:1.8;}

.ch-body{background:var(--bg);max-width:1080px;margin:0 auto;padding:34px 30px 30px;border:1px solid var(--border);border-top:none;border-radius:0 0 14px 14px;box-shadow:0 4px 22px rgba(91,58,41,.06);}

/* ===== Bridge ===== */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);border:1px solid var(--border);border-left:5px solid var(--gold);border-radius:10px;padding:18px 24px;margin:0 0 26px;box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);background:linear-gradient(135deg,#fdf8e8,#f2e6c8);margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:11px;background:var(--gold);color:#fff;padding:3px 12px;border-radius:12px;letter-spacing:2px;margin-bottom:10px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2;font-size:15.5px;}
.bridge strong{color:var(--accent-red);font-weight:700;}

/* ===== iframe ===== */
.ch-frame{display:block;width:100%;border:0;background:#fffdf7;border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 20px rgba(91,58,41,.1);margin:0 0 8px;min-height:180px;}

/* ===== next-link ===== */
.next-link{display:inline-block;margin:18px 0 6px;font-size:17px;color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accentL);padding-bottom:2px;font-family:"Noto Sans TC",sans-serif;letter-spacing:2px;}
.next-link:hover{color:var(--accent-red);border-color:var(--accent-red);}

/* ===== Footer ===== */
.site-footer{margin:60px -28px 0;padding:40px 32px;background:#1e1a14;color:#d4c4a8;text-align:center;border-radius:16px 16px 0 0;}
.site-footer h3{font-size:24px;color:var(--goldL);margin:0 0 10px;letter-spacing:6px;}
.site-footer p{margin:0;font-size:15px;color:#a89878;letter-spacing:2px;}

/* ===== 回頂 ===== */
#backTop{position:fixed;right:20px;bottom:80px;width:44px;height:44px;border:none;border-radius:50%;background:var(--gold);color:#fff;font-size:22px;cursor:pointer;display:none;box-shadow:0 4px 14px rgba(184,134,11,.4);z-index:110;}
#backTop:hover{background:var(--goldL);}

/* ===== 底部進度膠囊 ===== */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;background:rgba(30,26,20,.92);color:var(--gold);padding:8px 22px;border-radius:30px;border:1px solid rgba(184,134,11,.5);box-shadow:0 4px 18px rgba(0,0,0,.25);font-family:"Noto Sans TC",sans-serif;font-size:13px;letter-spacing:2px;display:flex;align-items:center;gap:12px;pointer-events:none;user-select:none;backdrop-filter:blur(6px);}
.read-progress .rp-bar{width:140px;height:3px;background:rgba(212,196,168,.18);border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;}
.read-progress .rp-label{font-size:11px;opacity:.75;letter-spacing:3px;}

/* ===== 響應式 ===== */
@media (max-width: 900px){
  #sb{display:none;}
  #sbToggle{display:block;}
  .main{margin-left:0;padding:0 14px 80px;}
  .site-hero{padding:60px 18px 50px;margin:0 -14px 22px;}
  .hero-title{font-size:38px;letter-spacing:4px;}
  .toc-grid{grid-template-columns:1fr;}
  .ch-head{padding:36px 18px;}
  .ch-name{font-size:26px;letter-spacing:3px;}
  .ch-body{padding:18px 14px 20px;}
  .preface{padding:22px 18px;margin:22px auto 30px;}
}
@media (max-width: 600px){
  body{font-size:17.5px;}
  .hero-title{font-size:30px;}
}

/* ============ 1.2x 字級放大（buddhist-text-html 新卷預設）============ */
body{font-size:20px!important;}
.hero-title,.site-hero h1{font-size:56px!important;}
.hero-subtitle,.site-hero .hero-subtitle{font-size:20px!important;}
.hero-sub,.site-hero .hero-sub,.hero-meta{font-size:18px!important;}
.hero-range{font-size:17px!important;}
.preface p,.preface-text p{font-size:19px!important;line-height:2.1!important;}
.preface h2,.preface-title{font-size:30px!important;}
.toc-title{font-size:34px!important;}
.toc-desc{font-size:17px!important;}
.toc-name{font-size:19.5px!important;line-height:1.7!important;}
.toc-num{font-size:17px!important;}
.bridge p{font-size:18.5px!important;line-height:2.1!important;}
.bridge-label{font-size:12.5px!important;letter-spacing:2.2px!important;}
.ch-num{font-size:18px!important;}
.ch-name{font-size:34px!important;}
.ch-sub,.ch-desc,.ch-subtitle{font-size:17px!important;}
.next-link{font-size:17px!important;}
.read-progress{font-size:14px!important;padding:9px 24px!important;}
.read-progress .rp-bar{width:148px!important;height:4px!important;}
.read-progress .rp-pct{font-size:13px!important;}
.read-progress .rp-label{font-size:12px!important;}
.sb-circle{font-size:15px!important;}
.sb-label{font-size:11.5px!important;}
.site-footer,.site-footer p{font-size:15px!important;}

:root{
  --bg:#f7f3ec; --text:#2c2416; --text2:#5a4e3a; --text-muted:#6B5B4B;
  --accent:#8b5e3c; --accentL:#c4956a; --accent-red:#8B2500;
  --gold:#b8860b; --goldL:#d4a84b; --gold-light:#C9A84C;
  --border:#d4c4a8; --border-light:#EDE8E0; --card:#fffdf7;
  --verseBg:#f0e8d8; --verseBd:#c4956a;
  --sbW:76px; --sbBg:#1e1a14; --sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
  --r:8px;
}
*{box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;}
html,body{scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
body{margin:0;background:var(--bg);color:var(--text);font-family:&quot;Noto Serif TC&quot;,&quot;Source Han Serif TC&quot;,&quot;Songti TC&quot;,Georgia,serif;font-size:20px;line-height:1.85;-webkit-font-smoothing:antialiased;}
img{-webkit-user-drag:none;pointer-events:none;}

/* ===== 側欄 ===== */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;background:var(--sbBg);color:var(--sbText);z-index:100;display:flex;flex-direction:column;align-items:center;padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sb-brand{position:sticky;top:0;width:100%;font-family:&quot;Noto Sans TC&quot;,sans-serif;color:var(--gold);text-align:center;line-height:1.5;background:linear-gradient(to bottom,var(--sbBg) 78%,rgba(30,26,20,0));padding:14px 4px 12px;margin-bottom:6px;z-index:5;text-decoration:none;cursor:pointer;transition:color .25s;display:block;border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand .sb-brand-line2{display:block;font-size:13px;font-weight:700;letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;gap:8px;width:100%;align-items:center;padding-top:6px;}
.sb-item{text-decoration:none;color:var(--sbText);display:flex;flex-direction:column;align-items:center;padding:5px 4px;width:64px;border-radius:8px;transition:background .2s,color .2s;}
.sb-item:hover{background:rgba(184,134,11,.12);color:var(--goldL);}
.sb-item.active{background:rgba(184,134,11,.22);color:#fff;box-shadow:0 0 14px rgba(184,134,11,.4) inset;}
.sb-circle{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:15px;font-weight:700;color:var(--gold);background:rgba(184,134,11,.08);margin-bottom:4px;}
.sb-item.active .sb-circle{background:var(--gold);color:#1e1a14;}
.sb-label{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:11.5px;letter-spacing:.5px;line-height:1.2;text-align:center;}

/* ===== Hamburger ===== */
#sbToggle{display:none;position:fixed;top:14px;left:14px;z-index:200;width:42px;height:42px;border:none;border-radius:8px;background:var(--sbBg);color:var(--gold);font-size:22px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);}

/* ===== 主內容 ===== */
.main{margin-left:var(--sbW);padding:0 28px 80px;}

/* ===== Hero ===== */
.site-hero{position:relative;background:linear-gradient(135deg,#1a1612 0%,#2a2018 50%,#1a1612 100%);color:#f5e8c5;padding:84px 32px 70px;text-align:center;border-radius:0 0 16px 16px;overflow:hidden;margin:0 -28px 30px;}
.site-hero::before{content:&quot;般若&quot;;position:absolute;font-size:280px;font-weight:900;color:rgba(212,168,75,.045);left:50%;top:50%;transform:translate(-50%,-50%);font-family:&quot;Noto Serif TC&quot;,serif;letter-spacing:30px;}
.site-hero::after{content:&quot;卷九十九&quot;;position:absolute;font-size:140px;font-weight:900;color:rgba(184,134,11,.04);right:-20px;bottom:-30px;font-family:&quot;Noto Serif TC&quot;,serif;letter-spacing:10px;}
.hero-content{position:relative;z-index:1;}
.hero-title{font-size:56px;font-weight:900;color:var(--goldL);margin:0 0 18px;letter-spacing:8px;text-shadow:0 2px 20px rgba(212,168,75,.3);}
.hero-subtitle{font-size:20px;color:#e8d8b2;margin:0 0 14px;letter-spacing:4px;font-weight:300;}
.hero-sub{font-size:18px;color:#d4c4a8;margin:0 0 22px;letter-spacing:3px;line-height:1.9;}
.hero-meta{display:flex;justify-content:center;gap:36px;flex-wrap:wrap;font-size:18px;color:#c4a87a;margin-top:24px;padding-top:22px;border-top:1px solid rgba(212,168,75,.22);}
.hero-meta span::before{content:&quot;·&quot;;color:var(--goldL);margin-right:8px;}
.hero-range{margin-top:18px;font-size:17px;color:#b39866;letter-spacing:2px;font-style:italic;}

/* ===== Preface ===== */
.preface{max-width:920px;margin:36px auto 40px;padding:32px 36px;background:linear-gradient(135deg,#fffdf5,#f5ecd8);border:1px solid var(--border);border-left:5px solid var(--gold);border-radius:14px;box-shadow:0 4px 18px rgba(91,58,41,.08);}
.preface h2{font-size:30px;color:var(--accent);text-align:center;margin:0 0 22px;letter-spacing:4px;}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);margin:0 0 16px;text-indent:2em;}
.preface p:last-child{margin-bottom:0;}

/* ===== TOC ===== */
.toc-section{max-width:1100px;margin:30px auto 50px;padding:36px 28px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 3px 14px rgba(91,58,41,.06);}
.toc-title{font-size:34px;color:var(--accent);text-align:center;margin:0 0 8px;letter-spacing:8px;font-weight:700;}
.toc-desc{font-size:17px;color:var(--text-muted);text-align:center;margin:0 0 28px;letter-spacing:3px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
.toc-card{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border:1px solid var(--border-light);border-radius:10px;background:#fffefa;text-decoration:none;color:var(--text);transition:all .25s;}
.toc-card:hover{background:#fff8e6;border-color:var(--gold);transform:translateY(-2px);box-shadow:0 4px 12px rgba(184,134,11,.18);}
.toc-num{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;display:flex;align-items:center;justify-content:center;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:18px;font-weight:700;box-shadow:0 2px 6px rgba(184,134,11,.3);}
.toc-name{flex:1;font-size:19.5px;line-height:1.7;color:var(--text);font-weight:600;}
.toc-sub{display:block;font-size:14.5px;color:var(--text-muted);font-weight:400;margin-top:3px;}

/* ===== Chapter ===== */
.chapter{margin:60px 0;}
.ch-head{background:var(--headGrad);color:#f5e8c5;padding:48px 32px;text-align:center;border-radius:14px 14px 0 0;position:relative;}
.ch-head::after{content:&quot;&quot;;position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--goldL),transparent);}
.ch-num{font-size:18px;color:var(--goldL);letter-spacing:5px;margin-bottom:14px;font-family:&quot;Noto Sans TC&quot;,sans-serif;}
.ch-name{font-size:34px;color:#fff;margin:0 0 12px;letter-spacing:5px;font-weight:700;}
.ch-sub{font-size:17px;color:#d4c4a8;letter-spacing:2px;line-height:1.8;}

.ch-body{background:var(--card);max-width:980px;margin:0 auto;padding:42px 44px 50px;border:1px solid var(--border);border-top:none;border-radius:0 0 14px 14px;box-shadow:0 4px 22px rgba(91,58,41,.06);}

/* ===== H2 / H3 ===== */
.ch-body h2{font-size:30px;color:var(--accent);margin:32px 0 14px;padding:10px 0 10px 20px;border-left:4px solid var(--gold);background:linear-gradient(90deg,rgba(184,134,11,.08),transparent);letter-spacing:2px;}
.ch-body h2:first-child{margin-top:0;}
.ch-body h3{font-size:23.5px;color:var(--text);margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border-light);font-weight:600;}
.ch-body h4{font-size:20px;color:var(--accent);margin:18px 0 8px;font-weight:600;}
.ch-body h5{font-size:18.5px;color:var(--gold);margin:14px 0 6px;}
.ch-body p{margin:0 0 14px;font-size:20px;line-height:1.95;color:var(--text);}

strong,b{color:var(--accent-red);font-weight:700;}

/* ===== Verse / Quote ===== */
.verse,.gatha,blockquote{background:var(--verseBg);border-left:4px solid var(--verseBd);padding:18px 26px;margin:18px 0;line-height:2.1;font-size:22px;font-style:normal;text-align:center;white-space:normal;border-radius:0 8px 8px 0;}
.verse-small{font-size:17px;color:var(--text-muted);margin-top:8px;font-style:normal;}

.classical-text{background:#FFFDF5;border:1px solid #E8E0D0;border-radius:10px;padding:20px 26px;margin:18px 0;line-height:2;font-size:20px;position:relative;}
.text-label{display:inline-block;background:var(--accent);color:#fff;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:13.5px;padding:3px 12px;border-radius:12px;letter-spacing:2.5px;margin-bottom:12px;}

/* ===== Cards ===== */
.card,.insight,.commentary,.practice,.metaphor,.note{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 24px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.insight{border-left:4px solid var(--gold);}
.commentary{border-left:4px solid var(--accent);}
.metaphor{border-left:4px solid var(--accentL);background:linear-gradient(135deg,#fffdf5,#faf5e8);}

.card-title,.insight-title,.col-title{font-size:21.5px;color:var(--accent);font-weight:700;margin:0 0 10px;letter-spacing:1px;}

/* ===== Grids ===== */
.two-col,.col-card{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0;}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0;}
.four-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0;}
.col{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 22px;}
.col-title{font-size:19px;color:var(--accent);font-weight:700;margin:0 0 8px;}
.col-content{font-size:19px;line-height:1.85;color:var(--text);}

.grid-4{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;}
.grid-4 .cell{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;font-size:19px;}
.cell .num{display:inline-block;width:30px;height:30px;background:var(--gold);color:#fff;border-radius:50%;line-height:30px;text-align:center;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-weight:700;font-size:14px;margin-right:8px;}
.cell .term{font-weight:700;color:var(--accent);}

/* ===== Flow ===== */
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;margin:22px 0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px 18px;}
.flow.flow-v{flex-direction:column;}
.flow-box,.flow-step{background:#fffdf5;border:1.5px solid var(--gold);border-radius:10px;padding:14px 20px;min-width:170px;max-width:260px;text-align:center;font-size:17.5px;line-height:1.55;color:var(--text);box-shadow:0 2px 6px rgba(184,134,11,.12);}
.flow-box small,.flow-step small{display:block;font-size:14px;color:var(--text-muted);margin-top:4px;}
.flow-arrow{font-size:26px;color:var(--gold);font-weight:700;}

/* ===== Domino ===== */
.domino-chain{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:22px 0;}
.domino{background:linear-gradient(135deg,var(--card),#f8f0e0);border:1.5px solid var(--accentL);border-radius:8px;padding:12px 18px;font-size:17.5px;color:var(--text);box-shadow:0 2px 5px rgba(0,0,0,.05);}
.chain-arrow{color:var(--gold);font-size:22px;font-weight:700;}

/* ===== Spectrum ===== */

.sp-right{background:#f0e8d8;border:1px solid var(--accentL);}
.sp-arrow{color:var(--gold);font-size:20px;}

/* ===== Venn ===== */
.venn-wrap{display:flex;align-items:center;justify-content:center;min-height:240px;margin:24px 0;gap:0;}
.venn-circle{display:flex;flex-direction:column;align-items:center;justify-content:center;width:220px;height:220px;border-radius:50%;border:2.5px solid var(--accent);background:rgba(184,134,11,.08);font-size:16px;line-height:1.55;padding:0 22px;box-sizing:border-box;gap:6px;text-align:center;}

<div class=&quot;preface&quot;>
<h2>編 者 前 言</h2>
<p>《大智度論》卷九十九「釋曇無竭品第八十九」，是般若波羅蜜「常啼薩陀波崙求法」公案的最終回。本品經文以一場高層對話為主軸：法師曇無竭面對歷盡千辛萬苦來到面前的薩陀波崙，所宣說的不是又一段深奧義理，而是把佛陀本身放回緣起空性的解剖台上——「諸佛無所從來，去亦無所至」。這一句宣言，徹底拆解了「佛=神聖實體」的潛在執著，將求法者從色身崇拜推回法身實相。</p>
<p>本品論文的精彩，在於它把抽象的「諸法不來不去」具象化為五重譬喻：焰、幻、夢、海中諸寶、箜篌音聲，層層剝落空間方向、物質自性、結構本質，最後讓「佛身亦如是」順理成章地落地。中觀的四句破、二諦的統合、能所雙亡的究竟義，全在這一品內收束完成，可謂《般若》收尾的思想總結。</p>
<p>但更難得的是，本品同時是一篇「體空實踐」的活劇。薩陀波崙在聽完諸佛無來無去之後，不是合掌讚嘆然後散場——他七歲不坐不臥地等待，遇魔網水源枯竭時不躊躇片刻，立即以利刀刺身、以血灑地。這一切都不是悲壯，而是體空：因身是空、所以毫無執著地捨棄；因佛是空、所以這份供養不夾雜「神聖權威的交易」。般若之劍與無我之血，恰是般若波羅蜜與方便力的雙運疊加。</p>
<p>本卷編排依「卷 → 品 → 章 → 節」四級體系：第一章列出經文與論主【論】釋曰原典；第二章至第七章，依《空性之幾何》論文的二十頁視覺化邏輯，分七章二十八節，從「認知困境」逐層推進到「般若與方便完美疊加」的終極心法。每一章先給結構性的概念地圖，再以原典證之，使讀者在追隨論文邏輯的同時，能始終與經論本身對讀。</p>
</div>

<section class=&quot;chapter&quot; id=&quot;chapter-1&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 釋曇無竭品 · 第一章</div>
<h1 class=&quot;ch-name&quot;>經 論 原 典</h1>
<p class=&quot;ch-sub&quot;>大智度論卷第九十九 · 釋曇無竭品第八十九</p>
</div>
<div class=&quot;ch-body&quot;>
<h2>第一節　卷品結銜與譯主</h2>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>卷品結銜</span>
<p>大智度論釋曇無竭品第八十九（卷第九十九）</p>
<p style=&quot;text-align:right;color:var(--text-muted);font-size:17px;&quot;>［＊］龍樹菩薩造<br/>［＊］後秦龜茲國三藏鳩摩羅什譯</p>
</div>
<div class=&quot;commentary&quot;>
<h4 class=&quot;card-title&quot;>第八十九品的位置</h4>
<p>「曇無竭品」是般若部「薩陀波崙公案」三品的收尾。前兩品（薩陀波崙品第八十八）寫常啼菩薩東行求法、賣身賣骨、入眾香城；本品則寫他終於見到法師曇無竭，受其開示「諸佛無來無去」的般若究竟義，並以血灑地完成最後的供養。本品同時也是整部《摩訶般若波羅蜜經》的倒數第二品（後一品「累教品」即流通分）——可說是般若教義的最後高峰。</p>
</div>
<h2>第二節　【經】曇無竭破執宣告</h2>
<p>本節為曇無竭菩薩對薩陀波崙開示「諸佛無來無去」的根本宣言，是整品的教理核心。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 開宗破執</span>
<p>「爾時，曇無竭菩薩摩訶薩語薩陀波崙菩薩言：『善男子！<strong>諸佛無所從來，去亦無所至。</strong>何以故？<strong>諸法如不動相，諸法如即是佛。</strong>善男子！無生法無來無去，無生法即是佛；無滅法無來無去，無滅法即是佛；實際法無來無去，實際法即是佛；空無來無去，空即是佛。善男子！無染無來無去，無染即是佛；寂滅無來無去，寂滅即是佛；虛空性無來無去，虛空性即是佛。善男子！離是諸法更無佛；諸佛如、諸法如，<strong>一如無分別</strong>。善男子！是如常一，無二、無三，出諸數法，無所有故。』」</p>
</div>
<h2>第三節　【經】五重譬喻 · 焰、幻、夢、海寶、箜篌</h2>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 焰中無水</span>
<p>「『譬如春末月，日中熱時，有人見焰動，逐之求水望得。於汝意云何？是水從何池、何山、何泉來？今何所去？若入東海、西海、南海、北海耶？』</p>
<p>「薩陀波崙言：『大師！焰中尚無水，云何當有來處、去處？』</p>
<p>「曇無竭菩薩語薩陀波崙菩薩言：『善男子！愚夫無智，為熱渴所逼，見焰動，無水生水想。<strong>善男子！若有人分別諸佛有來有去，當知是人皆是愚夫。</strong>何以故？善男子！諸佛不可以色身見，諸佛法身無來無去，諸佛來處、去處亦如是。』」</p>
</div>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 幻事無實</span>
<p>「『善男子！譬如幻師幻作種種，若象、若馬、若牛、若羊、若男、若女，如是等種種諸物。於汝意云何？是幻事從何處來？去至何所？』</p>
<p>「薩陀波崙菩薩言：『大師！幻事無實，云何當有來去處？』</p>
<p>「『善男子！是人分別佛有來有去亦如是。』」</p>
</div>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 夢中虛妄</span>
<p>「『善男子！譬如夢中見若象、若馬、若牛、若羊、若男、若女。於汝意云何？夢中所見，有來處、有去處不？』</p>
<p>「薩陀波崙言：『大師！是夢中所見虛妄，云何當有來去？』</p>
<p>「『善男子！是人分別佛有來有去亦如是。善男子！<strong>佛說諸法如夢</strong>。若有眾生不知是諸法義，以名字色身著佛，是人分別諸佛有來有去，不知諸法實際相故，皆是愚夫無智之數。是人數數往來五道，遠離般若波羅蜜，遠離諸佛法。<strong>善男子！佛說諸法如幻、如夢。</strong>若有眾生如實知，是人不分別諸法若來若去、若生若滅；若不分別諸法若來若去、若生若滅，則能知佛所說諸法實相。是人行般若波羅蜜，近阿耨多羅三藐三菩提，名為真佛弟子，不虛妄食人信施，是人應受供養，為世間福田。』」</p>
</div>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 海中生寶</span>
<p>「『善男子！譬如大海水中諸寶，不從東方來，不從南方、西方、北方、四維、上下來，眾生善根因緣故，海生此寶。此寶亦不無因緣而生，<strong>是寶皆從因緣和合生</strong>，是寶若滅亦不去至十方。諸緣合故有，諸緣離故滅。善男子！<strong>諸佛身亦如是，從本業因緣果報生</strong>，生不從十方來，滅時亦不去至十方；但諸緣合故有，諸緣離故滅。』」</p>
</div>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 箜篌音聲</span>
<p>「『善男子！譬如箜篌聲，出時無來處，滅時無去處。眾緣和合故生——有槽、有頸、有皮、有絃、有柱、有棍，有人以手鼓之，眾緣和合而有聲；是聲亦不從槽出，不從頸出，不從皮出，不從絃出，不從柱出，不從棍出，亦不從人手出，<strong>眾緣和合爾乃有聲</strong>。是因緣離時，亦無去處。善男子！諸佛身亦如是，<strong>從無量功德因緣生</strong>，不從一因一緣一功德生，亦不無因緣有，眾緣和合故有。諸佛身不獨從一事成，來無所從、去無所至。』」</p>
</div>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 結語付囑</span>
<p>「『善男子！應當如是知諸佛來相去相。善男子！亦當知一切法無來去相。<strong>汝若知諸佛及諸法無來無去、無生無滅相，必得阿耨多羅三藐三菩提，亦能行般若波羅蜜及方便力。</strong>』」</p>
</div>
<h2>第四節　【經】薩陀波崙的回應 · 三事供養與七歲精進</h2>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 釋提桓因散花作證</span>
<p>「爾時，釋提桓因以天曼陀羅花與薩陀波崙菩薩摩訶薩，作是言：『善男子！以是花供養曇無竭菩薩摩訶薩，我當守護供養汝。所以者何？汝因緣力故，今日饒益百千萬億眾生，使得阿耨多羅三藐三菩提。善男子！如是善人，甚為難遇！為饒益一切眾生故，無量阿僧祇劫受諸勤苦。』」</p>
</div>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 以身屬師</span>
<p>「薩陀波崙菩薩摩訶薩受釋提桓因曼陀羅花，散曇無竭菩薩上，白言：『大師！我從今日以身屬師，供給供養。』如是三白已，合手師前立。</p>
<p>「是時，長者女及五百侍女白薩陀波崙菩薩言：『我等從今日亦以身屬師。我等以是善根因緣故，當得如是法，亦如師所得；共師世世供養諸佛，世世常供養師。』</p>
<p>「是時，薩陀波崙菩薩及五百女人，并諸莊嚴寶物上妙供具及五百乘七寶車，奉上曇無竭菩薩，白言：『大師！我持是五百女人奉給大師，是五百乘車隨師所用。』」</p>
</div>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 七歲不坐不臥</span>
<p>「是時，曇無竭菩薩說法，日沒，起，入宮中。薩陀波崙菩薩摩訶薩作是念：『<strong>我為法故來，不應坐、臥，當以二事：若行、若立，以待法師從宮中出說法。</strong>』</p>
<p>「爾時，曇無竭菩薩七歲一心入無量阿僧祇菩薩三昧，及行般若波羅蜜、方便力。<strong>薩陀波崙菩薩七歲經行、住立，不坐、不臥，無有睡眠，無欲、恚、惱，心不著味</strong>；但念：『曇無竭菩薩摩訶薩何時當從三昧起，出而說法？』」</p>
</div>
<h2>第五節　【經】魔網考驗與以血息塵</h2>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 惡魔隱蔽水源</span>
<p>「薩陀波崙菩薩敷座已，求水灑地而不能得。所以者何？惡魔隱蔽，令水不現。魔作是念：『<strong>薩陀波崙菩薩求水不得，於阿耨多羅三藐三菩提行乃至生一念劣心、異心，則善根不增、智慧不照</strong>，於一切智而有稽留。』」</p>
</div>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 以血灑地</span>
<p>「爾時，薩陀波崙菩薩作是念：『<strong>我當自刺其身，以血灑地，令無塵土來坋大師。我何用此身！此身必當破壞。我從無始生死已來數數喪身，未曾為法。</strong>』即以利刀自刺，出血灑地。薩陀波崙菩薩及長者女并五百侍女皆無異心，惡魔亦不能得便。</p>
<p>「是時釋提桓因作是念：『未曾有也！薩陀波崙菩薩愛法乃爾，以刀自刺出血灑地！薩陀波崙及眾女人心不動轉，惡魔波旬不能壞其善根。其心堅固，發大莊嚴，不惜身命，以深心欲求阿耨多羅三藐三菩提，當度一切眾生無量生死苦。』」</p>
</div>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 三千石曼陀羅華</span>
<p>「釋提桓因知薩陀波崙菩薩心所念，即以三千石天曼陀羅華與薩陀波崙。薩陀波崙受華，以半散地，留半待曇無竭菩薩摩訶薩坐法座上說法時當供養。</p>
<p>「爾時，曇無竭菩薩摩訶薩過七歲已，從諸三昧起，為說般若波羅蜜故，與無量百千萬眾恭敬圍遶，往法座上坐。</p>
<p>「薩陀波崙菩薩摩訶薩見曇無竭菩薩摩訶薩時，<strong>心淨悅樂，譬如比丘入第三禪。</strong>」</p>
</div>
<h2>第六節　【論】釋曰 · 龍樹菩薩的解析切入點</h2>
<p>論主【論】釋曰的開首兩段，已點出整品論文的解析方向——薩陀波崙的「大空智力」何以在佛前失效？關鍵在於「神聖執著」這一最後的盲點。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論 · 開首</span>
<p style=&quot;font-weight:600;color:var(--accent);&quot;>【論】釋曰：</p>
<p>薩陀波崙菩薩雖知諸法空無來去相，未能深入，亦不能解種種法門；於諸佛身恭敬深重故，不能觀空。<strong>如大海水波，其力雖大，到須彌山邊則退而無用；薩陀波崙亦如是，雖有大空智力，到佛所則亦無用。</strong>是故曇無竭菩薩今為說：「諸佛無所從來、去亦無所至。」</p>
<p>此中曇無竭自說因緣，所謂：「諸法如不動相，諸法如即是佛。」</p>
</div>
<div class=&quot;insight&quot;>
<h4 class=&quot;insight-title&quot;>論主切入點的精妙</h4>
<p>龍樹不從正面教義切入，而是先「診斷」薩陀波崙的盲區——已具大空智力，卻於諸佛身不能觀空。這是修行者極常見的「最後一層執著」：所有法都可被空性消解，唯獨「佛」被潛意識保留為神聖實體。曇無竭應機而說「諸法如即是佛」，正是把佛拉回緣起的解剖台，與一切諸法平等並陳，無有特權。</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-2&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 釋曇無竭品 · 第二章</div>
<h1 class=&quot;ch-name&quot;>認 知 困 境</h1>
<p class=&quot;ch-sub&quot;>薩陀波崙的智慧瓶頸 · 情感與智慧的極端角力</p>
</div>
<div class=&quot;ch-body&quot;>
<h2>第一節　情感與智慧的極端角力</h2>
<p>本品論文（《空性之幾何》）開篇即指出：薩陀波崙並非一般的初學者，他已具備「大空智力」——觀照萬法皆空的智慧基礎。但奇妙的是，這份智慧一旦碰到「佛」這個對象，立刻熄火。論主形容這是「<strong>能觀一切法空，卻不敢觀『佛』空</strong>」的邏輯矛盾：當對象轉為極度景仰的神聖實體時，分別心隨即復甦。</p>
<div class=&quot;two-col&quot;>
<div class=&quot;col&quot; style=&quot;border-left:4px solid var(--gold);&quot;>
<h4 class=&quot;col-title&quot;>大 空 智 力</h4>
<p class=&quot;col-content&quot;>已知諸法空無來去相。具備觀照萬法皆空的智慧基礎。<br/>—— 對「諸法」可以觀空。</p>
</div>
<div class=&quot;col&quot; style=&quot;border-left:4px solid #a83a3a;background:#fdf5f0;&quot;>
<h4 class=&quot;col-title&quot; style=&quot;color:#a83a3a;&quot;>神 聖 執 著</h4>
<p class=&quot;col-content&quot;>於諸佛身恭敬深重。面對「佛」的具體形象時，產生實有化的投射。<br/>—— 對「佛」不敢觀空。</p>
</div>
</div>
<div class=&quot;insight&quot;>
<h4 class=&quot;insight-title&quot;>邏輯矛盾的核心</h4>
<p>能觀一切法空，卻不敢觀「佛」空。當對象轉為極度景仰的神聖實體時，「<strong>分別心</strong>」隨即復甦。智慧並未消失，只是被一道「神聖屏障」鎖死，這道屏障的本質仍是「我與對象」的能所對立。</p>
</div>
<h2>第二節　波浪與須彌山 · 般若空慧的失效</h2>
<p>論主用一個極富畫面感的譬喻來形容這種失效——大海水波vs須彌山。海浪的力量雖大，到了須彌山邊則退而無用。薩陀波崙亦如是，雖有大空智力，到佛所則亦無用。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論 · 波浪與須彌山</span>
<p>「<strong>如大海水波，其力雖大，到須彌山邊則退而無用</strong>；薩陀波崙亦如是，雖有大空智力，到佛所則亦無用。」</p>
</div>
<div class=&quot;metaphor&quot;>
<h4 class=&quot;card-title&quot;>譬喻的三層解讀</h4>
<p><strong>動力學層</strong>：海浪 = 般若空慧；須彌山 = 對佛的實有執著。海浪本可洗刷一切沙土（諸法）、推倒岸邊岩石（凡見），但面對「須彌山」這個被預設為神聖、堅固、不可動搖的對象，海浪只能退回。</p>
<p><strong>潛意識層</strong>：在潛意識中，「佛」被視為不可被空性消解的神聖存在，導致觀空之智在此失效。這不是技術問題，是預設問題——預設一旦不破，技術再強都用不上。</p>
<p><strong>救拔層</strong>：故須曇無竭親自下手，從根本上消解「佛=須彌山」這個預設，把佛重新放回緣起的海洋中——「諸佛身亦從因緣和合生」。海與山的對立，於是解構。</p>
</div>
<h2>第三節　兩種截然不同的認知體系 · 愚夫 vs 菩薩</h2>
<p>論文進一步將薩陀波崙的困境放入一個更大的對比框架：愚夫 vs 菩薩的認知矩陣。表面上薩陀波崙不是愚夫，但在「對佛產生實有執著」這一點上，他暫時走入了愚夫的認知模式。曇無竭即以此矩陣為說法的潛在地圖。</p>
<div class=&quot;two-col&quot;>
<div class=&quot;col&quot; style=&quot;background:#fdf5f0;border:1.5px solid #d4a8a8;&quot;>
<h4 class=&quot;col-title&quot; style=&quot;color:#a83a3a;&quot;>愚 夫 無 智</h4>
<ul class=&quot;checklist&quot; style=&quot;margin:0;&quot;>
<li><strong>著相</strong>：以名字色身著佛</li>
<li><strong>空間限制</strong>：分別諸佛有來有去</li>
<li><strong>現象解讀</strong>：視幻化、神蹟為實有</li>
<li><strong>結果</strong>：遠離般若波羅蜜，數數往來五道</li>
</ul>
</div>
<div class=&quot;col&quot; style=&quot;background:#f5f9ec;border:1.5px solid #a8d4a8;&quot;>
<h4 class=&quot;col-title&quot; style=&quot;color:#3d6e2e;&quot;>菩 薩 如 實 知</h4>
<ul class=&quot;checklist&quot; style=&quot;margin:0;&quot;>
<li><strong>見性</strong>：諸佛不可以色身見，唯證法身</li>
<li><strong>超越時空</strong>：不分別諸法若來若去、若生若滅</li>
<li><strong>現象解讀</strong>：視諸法如夢、如幻</li>
<li><strong>結果</strong>：能知佛所說諸法實相，近阿耨多羅三藐三菩提</li>
</ul>
</div>
</div>
<div class=&quot;insight&quot;>
<h4 class=&quot;insight-title&quot;>不在於慧根，而在於是否「徹底」</h4>
<p>薩陀波崙與愚夫的差別不在「有沒有空慧」，而在「有沒有徹底」。愚夫對一切現象都著相；薩陀波崙能對絕大多數法空之，但對佛這一個對象不徹底。曇無竭的開示恰是要把這「一個例外」也破乾淨——一旦例外存在，空就還沒到頂。</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-3&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 釋曇無竭品 · 第三章</div>
<h1 class=&quot;ch-name&quot;>破 執 宣 告</h1>
<p class=&quot;ch-sub&quot;>諸佛無所從來，去亦無所至 · 從色身昇華至法身</p>
</div>
<div class=&quot;ch-body&quot;>
<h2>第一節　破執宣告 · 從色身到法身的強制昇華</h2>
<p>曇無竭的開首一句即是整品的金鋼樞紐：「諸佛無所從來，去亦無所至」。這不是一個玄學命題，而是一次強制的認知升級——把求法者從「色身（Rūpakāya）」的層次強制昇華至「法身（Dharmakāya）」的層次。</p>
<blockquote>「諸佛無所從來，去亦無所至。<br/>何以故？諸法如不動相，諸法如即是佛。」</blockquote>
<div class=&quot;commentary&quot;>
<h4 class=&quot;card-title&quot;>破執宣告的兩個動作</h4>
<p><strong>第一動作 · 拆「來去」</strong>：佛若有來有去，則佛必有色身（有具體位移的肉體）；色身則有生滅、有時空座標、有「神聖實體」可被景仰。曇無竭一刀劃下：佛無來無去——故佛非色身、非時空中的某個實體。</p>
<p><strong>第二動作 · 建「諸法如即是佛」</strong>：破完之後不留真空，立即建立新坐標——佛即是「諸法如」（諸法的真如）。佛從一個「具體對象」轉為「一切諸法所共有的不動相」。求法者於是不再需要尋找佛在哪裡，而是要見諸法之如——當下任一法皆是。</p>
</div>
<h2>第二節　破執的七重平行命題</h2>
<p>曇無竭緊接著鋪開七重平行命題，把「諸佛無來無去」延伸到一切根本範疇，每一個都是「無來無去 ≡ 即是佛」的等號。</p>
<div class=&quot;grid-4&quot;>
<div class=&quot;cell&quot;><span class=&quot;num&quot;>1</span><span class=&quot;term&quot;>無生法</span> 無來無去 ≡ 即是佛</div>
<div class=&quot;cell&quot;><span class=&quot;num&quot;>2</span><span class=&quot;term&quot;>無滅法</span> 無來無去 ≡ 即是佛</div>
<div class=&quot;cell&quot;><span class=&quot;num&quot;>3</span><span class=&quot;term&quot;>實際法</span> 無來無去 ≡ 即是佛</div>
<div class=&quot;cell&quot;><span class=&quot;num&quot;>4</span><span class=&quot;term&quot;>空</span> 無來無去 ≡ 即是佛</div>
<div class=&quot;cell&quot;><span class=&quot;num&quot;>5</span><span class=&quot;term&quot;>無染</span> 無來無去 ≡ 即是佛</div>
<div class=&quot;cell&quot;><span class=&quot;num&quot;>6</span><span class=&quot;term&quot;>寂滅</span> 無來無去 ≡ 即是佛</div>
<div class=&quot;cell&quot; style=&quot;grid-column:1/-1;&quot;><span class=&quot;num&quot;>7</span><span class=&quot;term&quot;>虛空性</span> 無來無去 ≡ 即是佛</div>
</div>
<div class=&quot;insight&quot;>
<h4 class=&quot;insight-title&quot;>七重等號的密意</h4>
<p>這七重平行不是修飾或冗餘，而是嚴密的邏輯包圍。它把「佛」分別等同於：無生、無滅、實際、空、無染、寂滅、虛空性——亦即般若七要義。任何試圖在這些之外另立一個「神聖佛體」的企圖，都被預先封死。佛 = 般若一切要義之聚集 = 諸法真如，更無別佛可得。</p>
</div>
<h2>第三節　五重譬喻 · 緣起與無生的心法</h2>
<p>曇無竭在抽象命題之後，立即用五個層層遞進的譬喻，把「無來無去」具象化。論文稱之為「<strong>解構實存的五重譬喻</strong>」——從現象界的「來處」與「去處」逐層剝落，最後證成「無生法即是佛」。</p>
<div class=&quot;flow flow-v&quot;>
<div class=&quot;flow-box&quot;><strong>譬喻一 · 焰中求水</strong><small>解構空間與方向 · 來去處本不可問</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>譬喻二 · 幻事無實</strong><small>解構現象本身 · 幻象沒有從哪來</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>譬喻三 · 夢中見象馬</strong><small>解構認知本身 · 夢中虛妄無來去</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>譬喻四 · 海中諸寶</strong><small>解構物質的自性生 · 因緣和合而生</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>譬喻五 · 箜篌音聲</strong><small>解構結構與本質 · 眾緣和合爾乃有聲</small></div>
</div>
<h2>第四節　譬喻一 · 焰中求水 · 空間方向的崩解</h2>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 焰中無水</span>
<p>「春末月日中熱時，有人見焰動，逐之求水……『大師！焰中尚無水，云何當有來處、去處？』」</p>
</div>
<div class=&quot;commentary&quot;>
<h4 class=&quot;card-title&quot;>譬喻分析</h4>
<p>春末烈日，遠處地面蒸發出陽焰，狀如水波。愚夫被熱渴所逼，誤把陽焰當水，於是去追逐——並進一步問「這水從哪裡來？要流到哪裡去？東海西海南海北海？」這個問題本身即是邏輯謬誤：<strong>焰中既無水，問來去本身就是偽命題</strong>。</p>
<p>同樣，若把「佛」當作色身實體去追問「從哪裡來、要去哪裡」，就如同問陽焰之水的東西南北。問題不在答案，而在問題不成立——佛非色身實體，從一開始就沒有「來處、去處」這個維度。</p>
</div>
<ul class=&quot;checklist&quot;>
<li>如春末熱焰，愚夫生水想。</li>
<li>若現象本身（幻事、夢境）皆無實體，探究其「從何池、何山來」或「去至何海」本身就是邏輯上的偽命題。</li>
<li><strong>投射於佛</strong>：若執著佛有來去，即同追逐焰中之水。</li>
</ul>
<h2>第五節　譬喻二、三 · 幻事與夢 · 現象本身無實</h2>
<div class=&quot;two-col&quot;>
<div class=&quot;col&quot;>
<h4 class=&quot;col-title&quot;>幻事無實</h4>
<p class=&quot;col-content&quot;>幻師幻作象馬牛羊男女種種——這些幻事「從何處來？去至何所？」薩陀波崙立即答：「幻事無實，云何當有來去處？」</p>
<p class=&quot;col-content&quot;>幻事的「存在」本身就是條件性的，是幻師的咒術、觀眾的眼根、光影等等因緣的暫時聚合。離開這個聚合，就無「象馬」可指。</p>
</div>
<div class=&quot;col&quot;>
<h4 class=&quot;col-title&quot;>夢中虛妄</h4>
<p class=&quot;col-content&quot;>夢中見象馬牛羊男女，醒來後，夢中所見有來處、有去處嗎？薩陀波崙答：「是夢中所見虛妄，云何當有來去？」</p>
<p class=&quot;col-content&quot;>夢中之物在第一義上根本就不存在「位移」，因為它沒有獨立的物質基礎可被位移。</p>
</div>
</div>
<div class=&quot;insight&quot;>
<h4 class=&quot;insight-title&quot;>佛說諸法如幻、如夢</h4>
<p>曇無竭由此推出全品最核心的判詞：「佛說諸法如夢」「佛說諸法如幻、如夢」。世間萬法皆如夢如幻，分別其來去本是愚夫——若分別諸佛有來有去，性質與此完全相同。<strong>判定愚夫與真佛弟子的試金石</strong>，正在於是否「不分別諸法若來若去、若生若滅」。</p>
</div>
<h2>第六節　譬喻四 · 海中生寶 · 因緣和合的無來無去</h2>
<p>前三個譬喻都從「現象虛妄」一面切入，第四個譬喻則切到「實有之物」——大海中真正的珍寶。即便是真實存在的寶物，其「生」也不從十方來，其「滅」也不去十方，只是諸緣和合與離散。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 海中生寶</span>
<p>「譬如大海水中諸寶，不從東方來，不從南方、西方、北方、四維、上下來，眾生善根因緣故，海生此寶。此寶亦不無因緣而生，<strong>是寶皆從因緣和合生</strong>，是寶若滅亦不去至十方。」</p>
</div>
<div class=&quot;triangle-diagram&quot;>
<div class=&quot;tri-node&quot;><strong>有生之法</strong><br/>必賴眾緣<br/><small>非無因緣，亦非單一因緣</small></div>
<div class=&quot;tri-node&quot;><strong>佛身的顯現</strong><br/>非實體跨越宇宙空間的移動<br/><small>不從十方來</small></div>
<div class=&quot;tri-node&quot;><strong>而是「本業因緣果報」</strong><br/>與「眾生善根」的交會疊加<br/><small>諸緣合故有，諸緣離故滅</small></div>
<div class=&quot;tri-conclusion&quot;>結論：佛身與海中諸寶同理。生不從十方來，滅亦不去十方——但諸緣合故有，諸緣離故滅。</div>
</div>
<h2>第七節　譬喻五 · 箜篌音聲 · 緣起網的徹底解構</h2>
<p>第五個譬喻是五重譬喻的高潮——箜篌音聲的緣起網。箜篌（古樂器）發聲，需要槽、頸、皮、絃、柱、棍、彈奏的手……七個緣同時和合，方有聲生。但這聲既不藏於任一單一構件，也不藏於人手——是「眾緣和合爾乃有聲」。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 箜篌音聲</span>
<p>「譬如箜篌聲，出時無來處，滅時無去處。眾緣和合故生——有槽、有頸、有皮、有絃、有柱、有棍，有人以手鼓之，眾緣和合而有聲；是聲亦不從槽出，不從頸出，不從皮出，不從絃出，不從柱出，不從棍出，亦不從人手出，<strong>眾緣和合爾乃有聲</strong>。」</p>
</div>
<div class=&quot;commentary&quot;>
<h4 class=&quot;card-title&quot;>箜篌譬喻的力道</h4>
<p>這個譬喻把「緣起」推到一個無可辯駁的境地——聲音明明白白地產生、明明白白地消失，但若你去追問「這聲從哪個構件來的？」，逐一檢查每一個構件，都找不到。槽中無聲，皮中無聲，絃中無聲……人手中亦無聲。聲就在「眾緣和合」這個動作之中，離開動作即無聲。</p>
<p>佛身亦如是：「從無量功德因緣生，不從一因一緣一功德生」——尋找佛的實體，如同問古琴中藏聲音的實體。實體不在，只有緣起之網的展開。</p>
</div>
<div class=&quot;insight&quot;>
<h4 class=&quot;insight-title&quot;>五重譬喻的層層遞進</h4>
<p>焰中求水（解構方向）→ 幻事無實（解構現象）→ 夢中虛妄（解構認知）→ 海中諸寶（解構物質自性）→ 箜篌音聲（解構結構本質）。從外到內，從現象到本質，從虛妄到看似實有——層層剝落「來處／去處」的可能性，最終讓「諸佛身亦如是」順理成章地落地。</p>
</div>
<h2>第八節　破執宣告的收束 · 般若波羅蜜與方便力</h2>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 結語付囑</span>
<p>「善男子！應當如是知諸佛來相去相。善男子！亦當知一切法無來去相。<strong>汝若知諸佛及諸法無來無去、無生無滅相，必得阿耨多羅三藐三菩提，亦能行般若波羅蜜及方便力。</strong>」</p>
</div>
<div class=&quot;insight&quot;>
<h4 class=&quot;insight-title&quot;>「亦能行方便力」是關鍵伏筆</h4>
<p>曇無竭的結語並未停在「必得阿耨多羅三藐三菩提」，而是補上「亦能行般若波羅蜜及方便力」。這是整品最重要的伏筆——般若空慧若無方便力配合，就只是「斷見的空」；唯有般若 + 方便雙運，才是真正的菩薩道。下文薩陀波崙的供養精進、以血息塵，正是「方便力」的展現；空性從此不導向虛無，反而是通往極致悲智的唯一入口。</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-4&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 釋曇無竭品 · 第四章</div>
<h1 class=&quot;ch-name&quot;>中 觀 深 層 解 構</h1>
<p class=&quot;ch-sub&quot;>不即不離 · 四句破 · 一如無二 · 能所雙亡</p>
</div>
<div class=&quot;ch-body&quot;>
<h2>第一節　佛與五蘊 · 不即不離的概念模型</h2>
<p>論文在五重譬喻之後，進入中觀邏輯的深層解構。第一個工具是「不即不離」——佛與五蘊（眾生身心）的關係。論文用一個 Venn 圖式來呈現：佛 ≠ 五蘊（非即），但離五蘊亦無處尋佛（非離）。</p>
<div class=&quot;venn-wrap&quot;>
<div class=&quot;venn-circle venn-a&quot;><strong>佛</strong><small>諸法如、法身</small></div>
<div class=&quot;venn-circle venn-b&quot;><strong>五蘊</strong><small>色受想行識</small></div>
</div>
<div class=&quot;two-col&quot;>
<div class=&quot;col&quot;>
<h4 class=&quot;col-title&quot;>非即（佛 ≠ 五蘊）</h4>
<p class=&quot;col-content&quot;>佛不等於五蘊。若五蘊即佛，五蘊生滅虛誑，眾生皆有五蘊，豈非皆是佛？<br/><strong>譬如五指不等於拳頭。</strong></p>
</div>
<div class=&quot;col&quot;>
<h4 class=&quot;col-title&quot;>非離（離五蘊無佛）</h4>
<p class=&quot;col-content&quot;>離開五蘊，亦無處尋佛。無蘊身則無法在世間現示。<br/><strong>無五指則無法成拳。</strong></p>
</div>
</div>
<div class=&quot;insight&quot;>
<h4 class=&quot;insight-title&quot;>五指與拳頭的譬喻</h4>
<p>佛身如拳頭，僅為因緣和合的假名，自性本空。五指（五蘊）攤開時不是拳頭，但拳頭並非離五指另有一物——它就在五指的「握合動作」中暫時顯現。離五指無拳，五指非拳——這正是「不即不離」的活註腳。</p>
</div>
<h2>第二節　四句破（Tetralemma）· 封死一切實有認知</h2>
<p>「不即不離」尚是兩句，中觀更進一步用「四句破」徹底封死所有對「佛」的實有預設。把「佛 ↔ 五蘊」的關係列出四種可能組合，逐一拆穿。</p>
<div class=&quot;refutation-grid&quot;>
<div class=&quot;ref-cell&quot;>
<span class=&quot;ref-q&quot;>佛即是五蘊？</span>
<span class=&quot;ref-x&quot;>✘</span>則佛成生滅法
</div>
<div class=&quot;ref-cell&quot;>
<span class=&quot;ref-q&quot;>佛離五蘊有實體？</span>
<span class=&quot;ref-x&quot;>✘</span>離蘊無可指認
</div>
<div class=&quot;ref-cell&quot;>
<span class=&quot;ref-q&quot;>五蘊在佛之中？</span>
<span class=&quot;ref-x&quot;>✘</span>預設空間性包容
</div>
<div class=&quot;ref-cell&quot;>
<span class=&quot;ref-q&quot;>佛在五蘊之中？</span>
<span class=&quot;ref-x&quot;>✘</span>預設實體潛藏
</div>
</div>
<div class=&quot;commentary&quot;>
<p style=&quot;text-align:center;font-size:21px;color:var(--accent);margin:14px 0;&quot;>假 名</p>
<p style=&quot;text-align:center;color:var(--text-muted);font-size:17px;&quot;>如來過戲論，而人生戲論。<br/><strong>遠離四句，方見諸法實相。</strong></p>
</div>
<div class=&quot;insight&quot;>
<h4 class=&quot;insight-title&quot;>四句破的閉合邏輯</h4>
<p>四句破不是「四個獨立的否定」，而是一張完整的網——把「佛是某物」這個假設的四種可能組合全部列盡並一一否定。一旦這四種都不成立，「佛是某物」這個命題本身就被證偽。所剩唯有「假名」——佛只是因緣和合的暫時稱呼，無自性可指。</p>
</div>
<h2>第三節　終極等式 · 一如無二的究竟義</h2>
<p>四句破完之後，論文給出「終極等式」——將吾人之五蘊與諸佛之法身，皆放入「皆是性空」的等式中，最終得出「諸法如 ≡ 諸佛如」。</p>
<div class=&quot;classical-text&quot; style=&quot;text-align:center;font-size:22px;line-height:2.4;&quot;>
<p>［吾人之五蘊］═══（皆是性空）═══▶【如】</p>
<p>［諸佛之法身］═══（皆是性空）═══▶【如】</p>
<p style=&quot;margin-top:18px;border-top:1px solid var(--border-light);padding-top:14px;&quot;>∴ <strong>諸 法 如 ≡ 諸 佛 如</strong></p>
</div>
<blockquote>「諸佛如、諸法如，一如無分別。是如常一，無二、無三，出諸數法，無所有故。」</blockquote>
<div class=&quot;commentary&quot;>
<h4 class=&quot;card-title&quot;>「一如無二」的精密數學性</h4>
<p>「諸法如」與「諸佛如」分屬兩個範疇——一是萬有之真如，一是聖人之真如，看似有「凡」與「聖」的分別。但兩者皆通過「皆是性空」的化約，最終映射到同一個「如」。這個「如」是常一、無二、無三、出諸數法——它不是「某物」，而是「一切數法的共同底色」，故云「無所有故」。</p>
<p>這個等式封死了「聖凡兩個層次」的分別。求道者不需「上升到聖層次」找佛，也不需「貶低凡層次」找佛——佛就在凡聖共有的「諸法如」中，當下即是。</p>
</div>
<h2>第四節　能所雙亡 · 觀測者與被觀測者的消融</h2>
<p>論文的第四個工具是「能所雙亡」——當「一如無二」被理解時，禮拜的「我」（薩陀波崙）與受禮拜的「佛」（曇無竭），在實相上完全平等。沒有更高階差異被空性徹底抹平，於是「無來無去」的究竟義水落石出。</p>
<div class=&quot;flow&quot;>
<div class=&quot;flow-box&quot;><strong>觀測者（能）</strong><br/><small>薩陀波崙·我</small></div>
<div class=&quot;flow-arrow&quot;>⇄</div>
<div class=&quot;flow-box&quot; style=&quot;border:2px solid var(--gold);background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;&quot;>
<strong>能 所 雙 亡</strong><br/><small style=&quot;color:rgba(255,255,255,.92);&quot;>一如無二</small></div>
<div class=&quot;flow-arrow&quot;>⇄</div>
<div class=&quot;flow-box&quot;><strong>被觀測者（所）</strong><br/><small>佛·曇無竭</small></div>
</div>
<div class=&quot;two-col&quot;>
<div class=&quot;col&quot; style=&quot;border-left:4px solid var(--accent);&quot;>
<h4 class=&quot;col-title&quot;>Analysis</h4>
<p class=&quot;col-content&quot;>當理解「一如無二」時，禮拜的「我」（薩陀波崙）與受禮拜的「佛」（曇無竭），在實相上完全平等。能（觀者）與所（被觀者）的階級差異被空性徹底抹平。</p>
</div>
<div class=&quot;col&quot; style=&quot;border-left:4px solid var(--gold);&quot;>
<h4 class=&quot;col-title&quot;>Insight</h4>
<p class=&quot;col-content&quot;>空間距離與階級差異被空性徹底抹平。沒有需要追尋的終點，也沒有出發的起點。<strong>這就是「無來無去」的究竟意義。</strong></p>
</div>
</div>
<div class=&quot;insight&quot;>
<h4 class=&quot;insight-title&quot;>為何「能所雙亡」是「無來無去」的根本義？</h4>
<p>「來去」這個語法預設了「能來能去的主體」與「來去的方向／終點」兩個項，亦即能與所的對立。一旦能所雙亡，「來」與「去」失去坐標系——不是「沒有運動」，而是運動所依的「坐標系本身不存在」。佛無來無去，正是在這個層次上講的；不是「佛在某處待著不動」，而是「能來去的『佛』從未被預設為孤立實體」。</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-5&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 釋曇無竭品 · 第五章</div>
<h1 class=&quot;ch-name&quot;>二 諦 統 合</h1>
<p class=&quot;ch-sub&quot;>為何經中時說有佛，時說無佛？</p>
</div>
<div class=&quot;ch-body&quot;>
<h2>第一節　二諦統合的必要性</h2>
<p>讀完前章的中觀深層解構，讀者可能立即生起一個質疑：既然「佛無所從來、去亦無所至」，那麼經中為何處處說「爾時佛在某處」「佛說某法」？此即「有佛」之說。論文以「二諦」為工具，統合此看似矛盾的兩面，徹底解答「為何經中時說有佛、時說無佛」。</p>
<div class=&quot;two-col&quot;>
<div class=&quot;col&quot; style=&quot;background:#f5f0e8;&quot;>
<h4 class=&quot;col-title&quot;>世 俗 諦（世間法）</h4>
<ul style=&quot;list-style:none;padding:0;margin:0;font-size:19px;line-height:2;&quot;>
<li><strong>狀態</strong>：緣合故似有</li>
<li><strong>作用</strong>：示現三十二相八十種好，有來有去，受人供養，為世間福田</li>
<li><strong>目的</strong>：為了引接度化眾生</li>
</ul>
</div>
<div class=&quot;col&quot; style=&quot;background:#1e1a14;color:#f5e8c5;border:1px solid var(--gold);&quot;>
<h4 class=&quot;col-title&quot; style=&quot;color:var(--goldL);&quot;>第 一 義 諦（勝義法）</h4>
<ul style=&quot;list-style:none;padding:0;margin:0;font-size:19px;line-height:2;color:#e8d8b2;&quot;>
<li><strong style=&quot;color:var(--goldL);&quot;>狀態</strong>：勝義法性空</li>
<li><strong style=&quot;color:var(--goldL);&quot;>作用</strong>：無形無相，無來無去，等同實際、寂滅、虛空性</li>
<li><strong style=&quot;color:var(--goldL);&quot;>目的</strong>：破除對佛的終極執著，契入般若</li>
</ul>
</div>
</div>
<h2>第二節　二諦的「口訣」</h2>
<div class=&quot;classical-text&quot; style=&quot;text-align:center;font-size:21.5px;line-height:2.3;background:linear-gradient(135deg,#fffdf5,#f5ecd8);&quot;>
<p>「<strong>世諦假名佛，勝義法性空</strong>；<br/>緣合故似有，緣散無所從。」</p>
</div>
<div class=&quot;commentary&quot;>
<h4 class=&quot;card-title&quot;>口訣的兩重作用</h4>
<p><strong>世諦假名佛</strong>：在世俗層次，「佛」這個假名是必要的——它是引接、度化、結緣的橋樑。沒有這個橋樑，凡夫無從入手。經中言「佛在祇樹給孤獨園」「佛說某法」，皆是世俗諦的施設。</p>
<p><strong>勝義法性空</strong>：在勝義層次，「佛」並無一個獨立實體可指——所謂佛即諸法如、即空、即寂滅。前章五重譬喻、四句破、一如無二，皆是這一層次的展開。</p>
<p>兩個諦不是矛盾，而是同一個實相的兩個視角。<strong>能在世俗中善用「佛」之假名度眾、又在勝義中徹見「佛」之無自性</strong>，方是真實的菩薩行。</p>
</div>
<h2>第三節　二諦不可偏執</h2>
<div class=&quot;two-col&quot;>
<div class=&quot;col&quot; style=&quot;border-left:4px solid #a83a3a;background:#fdf5f0;&quot;>
<h4 class=&quot;col-title&quot; style=&quot;color:#a83a3a;&quot;>偏執世俗諦</h4>
<p class=&quot;col-content&quot;>以佛為實有，著於三十二相、八十種好、肉身舍利。此即薩陀波崙原本的盲區——大空智力到佛所而無用。<br/><strong>結果</strong>：執相生迷，遠離般若。</p>
</div>
<div class=&quot;col&quot; style=&quot;border-left:4px solid #6e3a1a;background:#f5f0e8;&quot;>
<h4 class=&quot;col-title&quot; style=&quot;color:#6e3a1a;&quot;>偏執第一義諦</h4>
<p class=&quot;col-content&quot;>以「無佛可得」為究竟，廢棄供養、禮拜、皈依，墮入斷滅頑空。<br/><strong>結果</strong>：失方便力，亦不能行菩薩道。</p>
</div>
</div>
<div class=&quot;insight&quot;>
<h4 class=&quot;insight-title&quot;>中道的橋樑</h4>
<p>曇無竭在前章說「諸佛無所從來、去亦無所至」——這是引導薩陀波崙從偏執世俗諦躍升到第一義諦。但他緊接著補上「亦能行般若波羅蜜及方便力」——這就是不讓躍升的人墮入第二種偏執。<strong>二諦統合的核心就在於：勝義空、不礙世俗有；世俗有、不礙勝義空。</strong></p>
</div>
<h2>第四節　二諦視角下重看五重譬喻</h2>
<p>用二諦回顧前章五重譬喻，每一個譬喻其實都在做同一件事——示範如何在「似有」與「實空」之間保持中道。</p>
<div class=&quot;grid-4&quot;>
<div class=&quot;cell&quot;><span class=&quot;num&quot;>1</span><span class=&quot;term&quot;>焰</span> 似有水（世俗）／實無水（勝義）</div>
<div class=&quot;cell&quot;><span class=&quot;num&quot;>2</span><span class=&quot;term&quot;>幻</span> 似有象馬（世俗）／實無象馬（勝義）</div>
<div class=&quot;cell&quot;><span class=&quot;num&quot;>3</span><span class=&quot;term&quot;>夢</span> 似有見聞（世俗）／實無見聞（勝義）</div>
<div class=&quot;cell&quot;><span class=&quot;num&quot;>4</span><span class=&quot;term&quot;>海寶</span> 似從十方來（世俗）／實緣合而生（勝義）</div>
<div class=&quot;cell&quot; style=&quot;grid-column:1/-1;&quot;><span class=&quot;num&quot;>5</span><span class=&quot;term&quot;>箜篌聲</span> 似從一處出（世俗）／實眾緣和合爾乃有聲（勝義）</div>
</div>
<div class=&quot;commentary&quot;>
<p>五重譬喻不是要徹底否認現象（那是偏執第一義諦），而是要在承認現象的「似有」之同時，洞見其勝義的「實空」。<strong>佛身亦如是——世俗中是法座上說法的曇無竭，勝義中是從無量功德因緣生的諸法如。</strong>兩者並不衝突，這正是二諦統合的精義。</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-6&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 釋曇無竭品 · 第六章</div>
<h1 class=&quot;ch-name&quot;>體 空 實 踐</h1>
<p class=&quot;ch-sub&quot;>薩陀波崙的血與諸法實相 · 從教理到實踐</p>
</div>
<div class=&quot;ch-body&quot;>
<h2>第一節　從教理到實踐 · 敘事作為數據</h2>
<p>本品的後半段不再是教理，而是一場活生生的「體空示範」。薩陀波崙聽完曇無竭的開示之後，沒有合掌讚嘆即散場——他立即用三件事證明「諸法無來無去」的觀念已內化為身心一致的實踐。論文稱此為「敘事作為數據」——菩薩實踐的時間軸。</p>
<div class=&quot;roadmap&quot;>
<div class=&quot;rm-step&quot;>
<div class=&quot;rm-icon&quot;>①</div>
<div class=&quot;rm-title&quot;>奉獻一切</div>
<div class=&quot;rm-desc&quot;>Offering 500 chariots<br/><strong>捨棄世間資財的執著</strong></div>
</div>
<div class=&quot;rm-step&quot;>
<div class=&quot;rm-icon&quot;>②</div>
<div class=&quot;rm-title&quot;>尊師重道</div>
<div class=&quot;rm-desc&quot;>Dharmodgata returns the offerings<br/><strong>雙方皆不住於相的布施與持戒</strong></div>
</div>
<div class=&quot;rm-step&quot;>
<div class=&quot;rm-icon&quot;>③</div>
<div class=&quot;rm-title&quot;>絕對精進</div>
<div class=&quot;rm-desc&quot;>Standing 7 years without sleeping<br/><strong>身心完全降伏，無欲、恚、惱，心不著味</strong></div>
</div>
</div>
<h2>第二節　三事供養 · 以身屬師的徹底布施</h2>
<p>薩陀波崙在受釋提桓因的曼陀羅花、散於曇無竭之上後，立即作出三層供養。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 三層供養</span>
<p>「『大師！我從今日<strong>以身屬師</strong>，供給供養。』如是三白已，合手師前立。」<br/>
「是時，長者女及五百侍女白薩陀波崙菩薩言：『我等從今日<strong>亦以身屬師</strong>。』」<br/>
「是時，薩陀波崙菩薩及五百女人，并諸莊嚴寶物上妙供具及<strong>五百乘七寶車</strong>，奉上曇無竭菩薩。」</p>
</div>
<div class=&quot;commentary&quot;>
<h4 class=&quot;card-title&quot;>三層供養的體空展現</h4>
<p><strong>第一層 · 五百乘七寶車</strong>：財物資具的供養——捨棄一切世間資財的「我所」。</p>
<p><strong>第二層 · 長者女及五百侍女</strong>：人事眷屬的供養——捨棄「我的隨從、我的家屬」。</p>
<p><strong>第三層 · 我從今日以身屬師</strong>：自身的供養——連「我」這個主體都奉上。</p>
<p>由外（資具）→ 中（眷屬）→ 內（自身）三層遞進，正是「無我」的階梯。但更精彩的是曇無竭的回應——「<strong>欲令薩陀波崙菩薩善根具足故，受五百乘車、長者女及五百侍女；受已，還與薩陀波崙菩薩。</strong>」雙方皆不住於相：施者不留戀，受者不執取。</p>
</div>
<div class=&quot;insight&quot;>
<h4 class=&quot;insight-title&quot;>不住於相的布施</h4>
<p>若曇無竭拒絕，薩陀波崙的「捨」就不徹底；若曇無竭收下不還，又落於「教化者占有所有」的相。「受已，還與」正是不二的方便——既成全了薩陀波崙的徹底布施，又示現了不執取的清淨。<strong>這是《金剛經》「不住相布施」最戲劇化的活劇。</strong></p>
</div>
<h2>第三節　七歲精進 · 等待三昧覺醒</h2>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 七歲不坐不臥</span>
<p>「爾時，曇無竭菩薩<strong>七歲一心入無量阿僧祇菩薩三昧</strong>，及行般若波羅蜜、方便力。<strong>薩陀波崙菩薩七歲經行、住立，不坐、不臥，無有睡眠，無欲、恚、惱，心不著味</strong>；但念：『曇無竭菩薩摩訶薩何時當從三昧起，出而說法？』」</p>
</div>
<div class=&quot;commentary&quot;>
<h4 class=&quot;card-title&quot;>七年的數據意義</h4>
<p>七年（七歲）這個數字並非隨意——它在本品中是一個「體空的時間單位」。曇無竭七歲入三昧、行般若波羅蜜方便力；薩陀波崙七歲經行住立、不坐不臥。兩者並行對應，構成一個雙軌時間軸。</p>
<p>更深層的是「身心完全降伏」這六個字。「<strong>無欲、恚、惱，心不著味</strong>」——欲（貪）、恚（嗔）、惱（亂）、味（取著感受）——五蓋全息。能維持七年，不是憑藉意志力，而是憑藉前章「諸法無來無去」的觀照已徹底內化：既知道「身心皆是緣起」，就沒有「我在受苦」的能所對立。</p>
</div>
<h2>第四節　魔網考驗 · 枯竭的甘露</h2>
<p>就在薩陀波崙準備為曇無竭敷座、求水灑地以淨壇時，惡魔波旬出手了。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 惡魔隱蔽水源</span>
<p>「薩陀波崙菩薩敷座已，求水灑地而不能得。所以者何？惡魔隱蔽，令水不現。魔作是念：『<strong>薩陀波崙菩薩求水不得，於阿耨多羅三藐三菩提行乃至生一念劣心、異心，則善根不增、智慧不照</strong>，於一切智而有稽留。』」</p>
</div>
<div class=&quot;two-col&quot;>
<div class=&quot;col&quot;>
<h4 class=&quot;col-title&quot;>Context（背景）</h4>
<p class=&quot;col-content&quot;>薩陀波崙欲為大師敷座說法，求水灑地以息塵土。</p>
</div>
<div class=&quot;col&quot;>
<h4 class=&quot;col-title&quot;>The Obstacle（障礙）</h4>
<p class=&quot;col-content&quot;>惡魔波旬隱蔽水源，令其不現。<strong>不顯神通破壞、不示惡相威脅，只悄悄抽走最普通的東西——水。</strong></p>
</div>
</div>
<div class=&quot;commentary&quot;>
<h4 class=&quot;card-title&quot;>Mara's Calculation · 魔的算盤</h4>
<p>魔的算盤精密無比——「<strong>欲令菩薩生一念劣心、異心</strong>」。不需要讓他退道，不需要讓他生大煩惱，只要他在這個關鍵節骨眼上生起「一念」劣心或異心，阻斷善根增長，長養智慧之光就斷掉。只要菩薩因外境匱乏而生瞋惱，空性觀即告瓦解——這就是退轉。</p>
<p>魔不打強仗，魔打弱仗——打你最不設防的、最普通日常的那一面。這個劇情是般若部對所有修行者的警告：<strong>真正的考驗不在大事上，而在「正要做最後一步時，水突然沒了」。</strong></p>
</div>
<h2>第五節　以血息塵 · 終極的供養</h2>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 以血灑地</span>
<p>「爾時，薩陀波崙菩薩作是念：『<strong>我當自刺其身，以血灑地，令無塵土來坋大師。我何用此身！此身必當破壞。我從無始生死已來數數喪身，未曾為法。</strong>』即以利刀自刺，出血灑地。薩陀波崙菩薩及長者女并五百侍女皆無異心，惡魔亦不能得便。」</p>
</div>
<div class=&quot;commentary&quot;>
<h4 class=&quot;card-title&quot;>以血息塵的內在運作</h4>
<p>薩陀波崙不躊躇片刻——魔斷水源，他立刻以血代水。值得注意的是他的思維過程：</p>
<ul class=&quot;checklist&quot;>
<li>「<strong>我當自刺其身</strong>」——這不是激情的衝動，而是緊接著計算的決定。</li>
<li>「<strong>我何用此身！此身必當破壞</strong>」——立即引用前章的觀照：身是緣起，必歸壞滅。</li>
<li>「<strong>我從無始生死已來數數喪身，未曾為法</strong>」——把這一身放在無數次生死的長尺度上看，反而見出「未曾為法」的虧欠。</li>
</ul>
<p>這三步思維完全是「體空」的活用——身是空、所以可捨；身是空、所以這份捨無交易性。</p>
</div>
<h2>第六節　血與空的辯證 · 體空的極致實踐</h2>
<p>論文在此處停下來，提出一個極尖銳的反問：</p>
<div class=&quot;two-col&quot;>
<div class=&quot;col&quot; style=&quot;background:#fdf5f0;border-left:4px solid #a83a3a;&quot;>
<h4 class=&quot;col-title&quot; style=&quot;color:#a83a3a;&quot;>The Contradiction（矛盾）</h4>
<p class=&quot;col-content&quot;>既然前文已用嚴密的邏輯證明「<strong>佛是幻影、琴聲、海中寶</strong>」，無實體亦無來去，為何薩陀波崙還要為一個「幻影」刺身流血？這不是落回「執相」嗎？</p>
</div>
<div class=&quot;col&quot; style=&quot;background:#f5f9ec;border-left:4px solid #3d6e2e;&quot;>
<h4 class=&quot;col-title&quot; style=&quot;color:#3d6e2e;&quot;>The Synthesis（綜合）</h4>
<ul style=&quot;list-style:none;padding:0;margin:0;font-size:19px;line-height:1.85;&quot;>
<li>因為<strong>身是「空」</strong>的（無我），所以能毫無執著地捨棄與奉獻。</li>
<li>因為<strong>佛是「空」</strong>的（無相），所以這份供養絕對純粹，不夾雜任何對神聖權威的「交易式期望」。</li>
</ul>
</div>
</div>
<div class=&quot;insight&quot;>
<h4 class=&quot;insight-title&quot;>「空」與「血」的辯證關係</h4>
<p>看似最具體、最血肉的「以血灑地」，其實只有在「空」徹底成立時才可能。若身是實有，則「捨身」必伴隨痛苦、恐懼、計較——這份供養變成交易：「我捨命，您回報。」唯有身是緣起無自性，捨身才是無交易的純粹。</p>
<p>反過來，若佛是實體，這份供養就會夾帶「<strong>奉獻給某個神聖權威</strong>」的內隱信念——血變成換取神聖加持的代幣，又落於愚夫之分別。唯有佛是諸法如，供養才超越「對誰」的範疇，純為「自心法爾」的展開。</p>
<p><strong>體空不是不做事，而是讓「做事」變得徹底純粹。</strong>薩陀波崙的血，正是這個辯證的具體寫照。</p>
</div>
<h2>第七節　釋提桓因的三層回應</h2>
<p>薩陀波崙以血息塵之後，連魔波旬也無計可施。釋提桓因（天帝釋）作為旁觀者，做出三層回應，每一層都是對「體空實踐」的證成。</p>
<div class=&quot;grid-4&quot;>
<div class=&quot;cell&quot;><span class=&quot;num&quot;>①</span><span class=&quot;term&quot;>震驚讚嘆</span><br/>「未曾有也！薩陀波崙菩薩愛法乃爾，以刀自刺出血灑地！」</div>
<div class=&quot;cell&quot;><span class=&quot;num&quot;>②</span><span class=&quot;term&quot;>證心不動</span><br/>「薩陀波崙及眾女人心不動轉，惡魔波旬不能壞其善根。」</div>
<div class=&quot;cell&quot; style=&quot;grid-column:1/-1;&quot;><span class=&quot;num&quot;>③</span><span class=&quot;term&quot;>三千石曼陀羅花</span><br/>「即以三千石天曼陀羅華與薩陀波崙。薩陀波崙受華，以半散地，留半待曇無竭菩薩坐法座上說法時當供養。」</div>
</div>
<div class=&quot;commentary&quot;>
<h4 class=&quot;card-title&quot;>三千石的方便智慧</h4>
<p>釋提桓因贈三千石曼陀羅花後，薩陀波崙的處理同樣精彩——「<strong>以半散地，留半待曇無竭坐法座上說法時當供養</strong>」。不是全用於眼前，也不是全留待後用，而是各半。這是極精細的方便力：當下的莊嚴與將來的供養兩不偏廢。</p>
</div>
<h2>第八節　曇無竭出三昧 · 心淨悅樂如入第三禪</h2>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經 · 出三昧</span>
<p>「爾時，曇無竭菩薩摩訶薩過七歲已，從諸三昧起，為說般若波羅蜜故，與無量百千萬眾恭敬圍遶，往法座上坐。<br/>
「薩陀波崙菩薩摩訶薩見曇無竭菩薩摩訶薩時，<strong>心淨悅樂，譬如比丘入第三禪。</strong>」</p>
</div>
<div class=&quot;insight&quot;>
<h4 class=&quot;insight-title&quot;>入第三禪的隱喻</h4>
<p>本品經文以「<strong>心淨悅樂，譬如比丘入第三禪</strong>」收尾，這個比喻不是隨手取譬。第三禪以「離喜妙樂」為相——已超越欲界的粗喜、初禪的離生喜、二禪的定生喜，純然在「微妙安樂」中安住。</p>
<p>薩陀波崙此時的心境，恰是七年精進、以血息塵、徹底體空之後的自然收成：沒有「終於見到佛」的激動（激動仍是分別），沒有「我做到了」的成就感（成就仍是我執），純然的「心淨悅樂」——清淨而樂、無相而妙。<strong>這就是般若波羅蜜與方便力雙運後，心的真實狀態。</strong></p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-7&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 釋曇無竭品 · 第七章</div>
<h1 class=&quot;ch-name&quot;>般 若 與 方 便 的 完 美 疊 加</h1>
<p class=&quot;ch-sub&quot;>中觀之劍與無我之血 · 清淨恭敬 · 終極心法</p>
</div>
<div class=&quot;ch-body&quot;>
<h2>第一節　中觀之劍與無我之血</h2>
<p>本品的論文總結出兩件「神兵」，恰好對應曇無竭結語中的「般若波羅蜜及方便力」。</p>
<ul class=&quot;checklist&quot;>
<li>以「<strong>中觀之劍</strong>」斬斷對佛的實有崇拜（般若波羅蜜）</li>
<li>以「<strong>無我之血</strong>」完成對法的絕對奉獻（方便力）</li>
</ul>
<div class=&quot;classical-text&quot; style=&quot;text-align:center;font-size:22px;background:linear-gradient(135deg,#fffdf5,#f5ecd8);&quot;>
「汝若知諸佛及諸法無來無去、無生無滅相，<br/>必得阿耨多羅三藐三菩提，亦能行<strong>般若波羅蜜及方便力</strong>。」
</div>
<div class=&quot;insight&quot;>
<h4 class=&quot;insight-title&quot;>空性從不導向虛無</h4>
<p style=&quot;font-size:21px;text-align:center;color:var(--accent);&quot;><strong>空性從不導向虛無，而是通往極致悲智的唯一入口。</strong></p>
<p>這是整品最核心的歸結。中觀之劍若獨用，會割斷一切而落於斷見；無我之血若獨流，會缺少智慧光照而成盲動。兩者疊加——劍下無物可斬（般若），血流不為神聖（方便）——才是真實的菩薩行。薩陀波崙的整個故事，從求法、奉獻、精進、以血息塵，到最後見曇無竭如入第三禪，正是這兩者完美疊加的活劇。</p>
</div>
<h2>第二節　清淨恭敬 · 不住於相的菩薩行</h2>
<p>論文用「清淨恭敬」四字總結菩薩行的最終姿態——從「神聖執著」昇華到「清淨恭敬」，是整品的心路坐標。</p>
<div class=&quot;three-col&quot;>
<div class=&quot;col&quot;>
<h4 class=&quot;col-title&quot;>Concept（概念）</h4>
<p class=&quot;col-content&quot;>從「神聖執著」到「清淨恭敬」的昇華。神聖執著是有相的（執著佛是某種神聖實體）；清淨恭敬是無相的（恭敬而不住於相）。</p>
</div>
<div class=&quot;col&quot;>
<h4 class=&quot;col-title&quot;>Insight（洞見）</h4>
<p class=&quot;col-content&quot;>當行者體悟琴聲（佛身）只是因緣和合，沒有實體，他依然可以全心全意地欣賞琴聲（恭敬供養）。<strong>恭敬本身不需要建立在「對象是實體」的預設上。</strong></p>
</div>
<div class=&quot;col&quot;>
<h4 class=&quot;col-title&quot;>State of Mind（心境）</h4>
<p class=&quot;col-content&quot;>心裡不再尋找「聲音從哪裡來、去哪裡」，不再將主客體對立。此時的流血與奉獻，不再是悲夫的狂熱，而是與「般若波羅蜜」完全相應的清淨之行。</p>
</div>
</div>
<h2>第三節　終極心法 · 雙運總持</h2>
<p>本品的最終心法可以歸納為一張矩陣——把「對佛的態度」「對法的實踐」「心的狀態」三個維度全部統合在「般若 + 方便」的雙運中。</p>
<div class=&quot;four-grid&quot;>
<div class=&quot;cell&quot;><span class=&quot;phase-badge&quot;>般若 · 體</span><br/>對佛<strong>無實有崇拜</strong>。佛即諸法如，無來無去，等同實際寂滅虛空性。</div>
<div class=&quot;cell&quot;><span class=&quot;phase-badge&quot;>方便 · 用</span><br/>對法<strong>絕對奉獻</strong>。三事供養、七歲精進、以血息塵——「為法故不惜身命」。</div>
<div class=&quot;cell&quot;><span class=&quot;phase-badge&quot;>境界 · 因</span><br/>心住「<strong>清淨恭敬</strong>」。不住於相而恭敬，不執於人而供養。</div>
<div class=&quot;cell&quot;><span class=&quot;phase-badge&quot;>圓滿 · 果</span><br/>「<strong>心淨悅樂，譬如比丘入第三禪</strong>」——離喜妙樂，超越能所。</div>
</div>
<div class=&quot;insight&quot;>
<h4 class=&quot;insight-title&quot;>十字總持</h4>
<p style=&quot;text-align:center;font-size:22px;color:var(--accent);&quot;><strong>諸法如 · 諸佛如 · 一如無二</strong></p>
<p style=&quot;text-align:center;font-size:22px;color:var(--accent);&quot;><strong>般若慧 · 方便力 · 雙運疊加</strong></p>
<p>橫看是「諸法如 ≡ 諸佛如 ≡ 一如無二」——這是般若空慧的究竟見地。豎看是「般若慧 + 方便力 = 雙運疊加」——這是菩薩道的真實作風。兩者交織，正是大智度論卷九十九釋曇無竭品的全部心要。</p>
</div>
<h2>第四節　承先啟後 · 大智度論卷九十九的位置</h2>
<div class=&quot;commentary&quot;>
<h4 class=&quot;card-title&quot;>在《大智度論》全書中的位置</h4>
<p>本品（釋曇無竭品第八十九）是般若部「薩陀波崙公案」的收尾，亦是《摩訶般若波羅蜜經》倒數第二品。下一品「累教品」即流通分（佛法的咐囑流通）。可以說，曇無竭品是般若教義的「終曲」——前面所有的般若理論（畢竟空、無自性、實相、二諦、中道）在這一品被濃縮為一場活劇，由曇無竭演說、由薩陀波崙演證。</p>
<p>從修行次第看，本品的位置也極關鍵。前面 88 品反覆教授「諸法空相」，主要對治「對法的執著」；本品則最後一招——對治「對佛的執著」。這個執著最隱蔽、最被預設為「正當」（誰會否定恭敬佛？），但若不破，般若就還沒到頂。曇無竭的開示，正是般若上升的最後一級台階。</p>
</div>
<div class=&quot;metaphor&quot;>
<h4 class=&quot;card-title&quot;>迴向偈</h4>
<p style=&quot;text-align:center;font-size:22px;line-height:2.4;color:var(--accent);&quot;>
願以此功德　莊嚴佛淨土<br/>
上報四重恩　下濟三途苦<br/>
若有見聞者　悉發菩提心<br/>
盡此一報身　同生極樂國
</p>
</div>
</div>
</section>

.sb-brand .sb-brand-line3{display:block;font-size:10.5px;letter-spacing:2px;color:var(--gold-light);margin-top:1px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;gap:8px;padding:6px 0;width:100%;align-items:center;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:4px 4px;cursor:pointer;text-decoration:none;color:var(--sbText);
  transition:all .25s;width:100%;}
.sb-circle{width:34px;height:34px;border-radius:50%;
  background:rgba(212,196,168,.10);border:1px solid rgba(212,196,168,.35);
  display:flex;align-items:center;justify-content:center;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:15px;font-weight:700;
  color:var(--gold);transition:all .25s;}
.sb-label{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:11.5px;
  letter-spacing:1px;color:var(--sbText);opacity:.85;text-align:center;
  line-height:1.3;max-width:62px;}
.sb-item:hover .sb-circle{background:rgba(184,134,11,.18);border-color:var(--gold);}
.sb-item.active .sb-circle{background:var(--gold);border-color:var(--gold);color:#fff;
  box-shadow:0 0 14px rgba(184,134,11,.5);}
.sb-item.active .sb-label{color:var(--goldL);opacity:1;font-weight:600;}

#sbToggle{display:none;position:fixed;top:14px;left:14px;z-index:130;
  width:42px;height:42px;border:0;border-radius:50%;
  background:rgba(30,26,20,.92);color:var(--gold);font-size:20px;cursor:pointer;}

/* ======= Main ======= */
.main{margin-left:var(--sbW);padding:0;}

/* ======= Hero ======= */
.site-hero{position:relative;background:var(--headGrad);color:#fff;
  padding:84px 24px 76px;text-align:center;overflow:hidden;}
.site-hero::before{content:&quot;般若&quot;;position:absolute;font-size:420px;font-weight:900;
  color:rgba(212,168,75,.04);top:-60px;right:-30px;font-family:&quot;Noto Serif TC&quot;,serif;
  pointer-events:none;letter-spacing:30px;}
.site-hero::after{content:&quot;空性&quot;;position:absolute;font-size:300px;font-weight:900;
  color:rgba(212,168,75,.035);bottom:-80px;left:-20px;font-family:&quot;Noto Serif TC&quot;,serif;
  pointer-events:none;letter-spacing:24px;}
.hero-content{position:relative;z-index:1;max-width:1080px;margin:0 auto;}
.hero-eyebrow{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:14px;letter-spacing:8px;
  color:var(--goldL);margin-bottom:18px;opacity:.92;}
.hero-title{font-size:56px;font-weight:900;letter-spacing:8px;line-height:1.18;
  color:#fff;margin:0 0 14px;text-shadow:0 2px 10px rgba(0,0,0,.4);}
.hero-subtitle{font-size:20px;color:var(--goldL);letter-spacing:5px;
  margin:0 0 26px;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-weight:500;}
.hero-sub{font-size:18px;color:#e8dec5;letter-spacing:2.5px;margin:0 0 8px;line-height:1.7;}
.hero-meta{font-size:17px;color:#c9b88e;letter-spacing:2px;margin-top:18px;line-height:1.8;}
.hero-meta span{display:inline-block;padding:0 14px;}
.hero-meta span + span{border-left:1px solid rgba(212,168,75,.35);}
.hero-skt{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-style:italic;color:#a89878;
  font-size:15.5px;letter-spacing:1px;margin-top:22px;opacity:.85;}
.hero-range{font-size:17px;color:var(--goldL);letter-spacing:3px;margin-top:14px;
  padding:5px 22px;display:inline-block;border:1px solid rgba(212,168,75,.35);border-radius:30px;}

/* ======= Preface ======= */
.preface{max-width:880px;margin:38px auto 0;padding:32px 32px 24px;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 4px 20px rgba(91,58,41,.06);}
.preface h2{font-size:30px;color:var(--accent);text-align:center;margin:0 0 22px;letter-spacing:4px;}
.preface p{font-size:19px;line-height:2.1;color:var(--text);margin:0 0 14px;}
.preface p:last-child{margin-bottom:0;}
.preface .lead{font-style:normal;color:var(--accent);font-weight:600;text-align:center;
  border-bottom:1px solid var(--border-light);padding-bottom:14px;margin-bottom:18px;}

/* ======= TOC ======= */
.toc-section{max-width:1100px;margin:40px auto 24px;padding:0 24px;}
.toc-title{font-size:34px;color:var(--accent);text-align:center;letter-spacing:14px;
  margin:0 0 10px;font-weight:700;}
.toc-desc{font-size:17px;text-align:center;color:var(--text2);letter-spacing:3px;margin-bottom:30px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;}
.toc-card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:18px 22px;display:flex;align-items:flex-start;gap:14px;
  text-decoration:none;color:inherit;transition:all .25s;
  box-shadow:0 2px 8px rgba(91,58,41,.05);}
.toc-card:hover{border-color:var(--gold);transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(91,58,41,.12);}
.toc-num{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:var(--gold);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-weight:700;font-size:17px;letter-spacing:0;}
.toc-name{font-size:19.5px;line-height:1.6;font-weight:600;color:var(--text);
  flex:1;letter-spacing:1px;}
.toc-name small{display:block;font-weight:400;font-size:14px;color:var(--text-muted);
  margin-top:4px;letter-spacing:1.5px;}

/* ======= Chapter ======= */
.chapter{margin:40px auto;max-width:1100px;padding:0 24px;scroll-margin-top:20px;}
.ch-head{background:var(--headGrad);color:#fff;text-align:center;
  padding:50px 28px 46px;border-radius:14px 14px 0 0;position:relative;overflow:hidden;}
.ch-head::after{content:&quot;&quot;;position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--goldL),transparent);}
.ch-num{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:18px;letter-spacing:8px;
  color:var(--goldL);margin-bottom:14px;}
.ch-name{font-size:34px;font-weight:900;letter-spacing:6px;color:#fff;margin:0 0 12px;line-height:1.3;}
.ch-sub{font-size:17px;color:#c9b88e;letter-spacing:3px;line-height:1.7;}

.ch-body{background:#fffdf7;padding:36px 38px 42px;border:1px solid var(--border);
  border-top:0;border-radius:0 0 14px 14px;max-width:980px;margin:0 auto;}
.ch-body p{font-size:20px;line-height:1.95;color:var(--text);margin:0 0 14px;text-indent:0;}
.ch-body p.indent{text-indent:2em;}

/* ======= Headings ======= */
.ch-body h2{font-size:30px;color:var(--accent);font-weight:700;letter-spacing:3px;
  margin:34px 0 16px;padding:10px 0 10px 20px;
  border-left:4px solid var(--gold);
  background:linear-gradient(90deg,rgba(184,134,11,.10),rgba(184,134,11,0));}
.ch-body h2:first-child{margin-top:0;}
.ch-body h3{font-size:23.5px;color:var(--text);font-weight:700;letter-spacing:2px;
  margin:28px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border-light);}
.ch-body h4{font-size:20px;color:var(--text2);font-weight:700;letter-spacing:1.5px;
  margin:22px 0 10px;}
.ch-body h5{font-size:18.5px;color:var(--accent);font-weight:700;letter-spacing:1px;
  margin:18px 0 8px;}

/* ======= Verse / 原典 ======= */
.verse,.gatha,blockquote{background:var(--verseBg);border-left:4px solid var(--verseBd);
  padding:18px 26px;margin:18px 0;line-height:2.2;font-size:22px;
  border-radius:0 8px 8px 0;color:var(--text);white-space:normal;text-align:center;}
.classical-text{background:#FFFDF5;border:1px solid #E8E0D0;border-radius:10px;
  padding:22px 26px;line-height:2.0;font-size:20px;margin:18px 0;color:var(--text);}
.classical-text .text-label{display:inline-block;background:var(--primary);color:#fff;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:13.5px;letter-spacing:3px;
  padding:4px 14px;border-radius:14px;margin-bottom:14px;}
.classical-text p{margin:0 0 10px;line-height:1.95;}
.classical-text p:last-child{margin-bottom:0;}

/* ======= Cards ======= */
.card,.insight,.commentary,.practice,.metaphor,.note{
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:18px 24px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.card-icon{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:14px;flex-shrink:0;}
.card-title{font-size:21.5px;color:var(--accent);font-weight:700;letter-spacing:2px;margin:0;}
.card-content,.card-desc{font-size:20px;line-height:1.95;color:var(--text);}

.insight{background:linear-gradient(135deg,#fdf8e8,#f4ead2);border-left:5px solid var(--gold);}
.insight-title{font-size:21.5px;color:var(--accent);font-weight:700;letter-spacing:2px;margin:0 0 10px;}
.insight-content{font-size:20px;line-height:1.95;color:var(--text);}

/* ======= QA ======= */
.qa{margin:16px 0;}
.qa .q,.qa .a{font-size:20px;line-height:1.95;padding:14px 22px;border-radius:8px;margin:8px 0;}
.qa .q{background:#e8eef5;border-left:4px solid #3a6294;color:#1e2c44;}
.qa .a{background:#fdf6e3;border-left:4px solid var(--gold);color:var(--text);}
.qa .q::before{content:&quot;問曰：&quot;;font-weight:700;color:#3a6294;}
.qa .a::before{content:&quot;答曰：&quot;;font-weight:700;color:var(--accent);}
.qa.no-prefix .q::before,.qa.no-prefix .a::before{content:&quot;&quot;;}

/* ======= Grids ======= */
.four-grid,.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0;}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0;}
.grid-cell,.col-card,.three-col > div{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:18px 22px;font-size:19px;line-height:1.9;}
.col-title{font-size:21.5px;color:var(--accent);font-weight:700;margin:0 0 10px;letter-spacing:1.5px;}
.col-content,.col-card .content{font-size:20px;line-height:1.95;}

/* 五求 grid */
.five-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:18px 0;}
.five-grid .cell{background:linear-gradient(135deg,#fdf8e8,#f4ead2);
  border:1px solid var(--gold);border-radius:10px;padding:18px 16px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8px;}
.five-grid .num{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:18px;}
.five-grid .term{font-size:20px;font-weight:700;color:var(--accent);letter-spacing:1.5px;}
.five-grid .desc{font-size:15.5px;color:var(--text2);line-height:1.7;}

/* ======= Flow ======= */
.flow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:12px;margin:18px 0;padding:14px 18px;background:var(--card);
  border:1px solid var(--border);border-radius:10px;}
.flow.flow-v{flex-direction:column;}
.flow-box,.flow-step{background:linear-gradient(135deg,#fdf6e0,#f0e4c0);
  border:1px solid var(--accentL);border-radius:8px;padding:14px 22px;
  font-size:17.5px;font-weight:600;color:var(--text);text-align:center;
  min-width:160px;max-width:380px;line-height:1.6;}
.flow-box small{display:block;font-weight:400;font-size:13.5px;
  color:var(--text-muted);margin-top:6px;}
.flow-arrow{font-size:24px;color:var(--gold);font-weight:700;}

/* ======= Refutation grid（×對手立宗） ======= */
.refutation-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0;}
.ref-cell{background:#fbf3eb;border:1px solid #d4b896;border-radius:10px;
  padding:18px 22px;position:relative;}
.ref-cell::before{content:&quot;✘&quot;;position:absolute;top:14px;right:18px;
  font-size:26px;color:var(--accent-red);font-weight:900;}
.ref-cell h5{margin:0 0 8px;color:var(--accent-red);font-size:18.5px;letter-spacing:1.5px;}
.ref-cell p{font-size:18px;line-height:1.9;margin:0;color:var(--text);}

/* ======= Domino chain ======= */
.domino-chain{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:8px;margin:18px 0;padding:14px;background:#f8efd9;border-radius:10px;}
.domino{background:#fff;border:1px solid var(--gold);border-radius:6px;
  padding:10px 16px;font-size:17px;font-weight:700;color:var(--accent);}
.chain-arrow{color:var(--gold);font-weight:700;font-size:18px;}

/* ======= Spectrum ======= */
.spectrum{display:flex;justify-content:space-between;align-items:stretch;gap:10px;
  margin:18px 0;padding:18px;background:linear-gradient(90deg,#f8e4d0,#fdf6e3,#f8e4d0);
  border-radius:12px;}
.sp-node{flex:1;text-align:center;padding:12px;font-size:15.5px;line-height:1.6;}
.sp-node h5{margin:0 0 6px;font-size:17px;color:var(--accent-red);}
.sp-mid{background:linear-gradient(135deg,var(--gold),var(--goldL));border-radius:8px;
  color:#fff;padding:14px;text-shadow:0 1px 3px rgba(0,0,0,.25);}
.sp-mid,.sp-mid *{color:#fff !important;}
.sp-mid h5{color:#fff !important;font-weight:700;}
.sp-mid small{color:rgba(255,255,255,.92) !important;}

/* ======= Bridge（章節間橋接） ======= */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:10px;padding:20px 26px;margin:0 0 28px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);margin-top:32px;margin-bottom:14px;}
.bridge-label{display:inline-block;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:12.5px;
  background:var(--gold);color:#fff;padding:4px 14px;border-radius:14px;
  letter-spacing:2.2px;margin-bottom:12px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0 0 8px;color:var(--text2);line-height:2.05;font-size:18.5px;}
.bridge p:last-child{margin-bottom:0;}

/* ======= Conclusion box ======= */
.conclusion{background:linear-gradient(135deg,#2c2418,#3d3225);color:#fdf6e3;
  border-radius:12px;padding:24px 32px;margin:20px 0;box-shadow:0 4px 18px rgba(0,0,0,.15);}
.conclusion h5{color:var(--goldL);font-size:19px;margin:0 0 10px;letter-spacing:2px;}
.conclusion p{font-size:19px;line-height:1.95;margin:0 0 8px;color:#fdf6e3;}
.conclusion p:last-child{margin-bottom:0;}
.conclusion strong{color:var(--goldL);}

/* ======= Read progress ======= */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:120;background:rgba(30,26,20,.92);color:var(--gold);
  padding:9px 24px;border-radius:30px;
  border:1px solid rgba(184,134,11,.5);box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;
  pointer-events:none;user-select:none;backdrop-filter:blur(6px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:42px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:12px;opacity:.75;letter-spacing:3px;}

/* ======= Back top ======= */
#backTop{position:fixed;right:24px;bottom:24px;width:44px;height:44px;border-radius:50%;
  background:var(--primary);color:#fff;border:0;cursor:pointer;font-size:22px;
  display:none;z-index:120;box-shadow:0 4px 12px rgba(0,0,0,.25);}
#backTop:hover{background:var(--accent);}

/* ======= Strong / em ======= */
.ch-body strong,.ch-body b{color:var(--accent-red);font-weight:700;}
.ch-body em{font-style:normal;color:var(--accent);font-weight:600;}

/* ======= Footer ======= */
.site-footer{background:#1e1a14;color:#a89878;text-align:center;
  padding:36px 24px;margin-top:50px;letter-spacing:2px;font-size:15px;line-height:2;}
.site-footer strong{color:var(--goldL);font-weight:700;letter-spacing:3px;}
.site-footer p{margin:6px 0;}

/* ======= Mobile ======= */
@media (max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);}
  #sbToggle{display:flex;align-items:center;justify-content:center;}
  .main{margin-left:0;}
  .hero-title{font-size:38px;letter-spacing:5px;}
  .ch-head{padding:32px 18px;}
  .ch-name{font-size:24px;letter-spacing:3px;}
  .ch-body{padding:24px 22px;}
  .four-grid,.two-col,.refutation-grid{grid-template-columns:1fr;}
  .three-col{grid-template-columns:1fr;}
}
@media (max-width:600px){
  html,body{font-size:17px;}
  .verse,.gatha{font-size:18.5px;}
  .ch-body p{font-size:17.5px;}
}

<div class=&quot;preface&quot;>
<h2>編者前言</h2>
<p class=&quot;lead&quot;>本品乃曇無竭菩薩於說法之間，承《般若》第一義以「諸佛如、諸法如，一如無分別」立宗之後，龍樹菩薩於《大智度論》中對此命題進行縝密的論釋辯證。</p>
<p>整品文脈分為兩條軸線：<strong>經文軸</strong>承曇無竭品「諸佛無來無去」之開示，以「箜篌聲喻」「夢中見象喻」「大海諸寶喻」三大緣起譬喻為骨幹，鋪陳「眾緣和合故有、諸緣離故滅」的緣起空義；<strong>論釋軸</strong>則由「何等是諸法如」入題，正面迎戰外道「五指合為拳，故五眾合為佛」的實有立宗，透過<strong>二諦判教</strong>、<strong>一與五的數量矛盾</strong>、<strong>泛稱與特稱矛盾</strong>、<strong>對手妙色身的回防</strong>，最終收束於「<strong>五求辯證</strong>」——即、離、在內、在外、所有，五個方位地毯式搜索佛的實體立足點，宣告「<strong>五種求佛不可得故，當知無佛；佛無故無來無去</strong>」。</p>
<p>本品的關鍵轉折在「<strong>無佛即邪見</strong>」的危機之問：若論主透過五求破盡實有佛，是否意味菩薩發心求作佛將失去依憑？龍樹於此祭出中觀心法──<strong>「無佛」是破執有想之藥，不是反向取著無佛之斷滅</strong>。離有無二邊、處中道，即是諸法實相；得是實相，名為得佛。最終匯歸於「<strong>一如</strong>」境界：色等法如即諸佛如、即虛空性如，是如一無二無三，出諸數法。</p>
<p>本網頁將上述六大層級的辯證脈絡，按「卷→品→章→節」順序編排為六章，並融入隨附《般若藍圖：空性構造》視覺化論文之七大模塊（開卷大哉問、緣起模型、二諦中道、五求辯證、中道破斷、一如修心、不惜身命）作為章節主軸。論文中以「拳指映射矩陣」「五求地毯搜索」「治病執藥光譜」等視覺結構呈現的論證骨架，已逐一以對應 HTML 元件重現。</p>
</div>
