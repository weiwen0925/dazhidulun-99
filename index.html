<title>大智度論 · 卷九十九 · 釋曇無竭品 · 第一至第五品彙整</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&amp;family=Noto+Sans+TC:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f7f3ec; --text:#2c2416; --text2:#5a4e3a; --text-muted:#6B5B4B;
  --accent:#8b5e3c; --accentL:#c4956a; --accent-red:#8B2500;
  --gold:#b8860b; --goldL:#d4a84b; --gold-light:#C9A84C;
  --border:#d4c4a8; --border-light:#EDE8E0; --card:#fffdf7;
  --verseBg:#f0e8d8; --verseBd:#c4956a;
  --sbW:76px; --sbBg:#1e1a14; --sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
  --r:8px;
}
*{box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;}
html,body{scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",Georgia,serif;font-size:20px;line-height:1.85;-webkit-font-smoothing:antialiased;}
img{-webkit-user-drag:none;pointer-events:none;}

/* 側欄 */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;background:var(--sbBg);color:var(--sbText);z-index:100;display:flex;flex-direction:column;align-items:center;padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sb-brand{position:sticky;top:0;width:100%;font-family:"Noto Sans TC",sans-serif;color:var(--gold);text-align:center;line-height:1.5;background:linear-gradient(to bottom,var(--sbBg) 78%,rgba(30,26,20,0));padding:14px 4px 12px;margin-bottom:6px;z-index:5;text-decoration:none;cursor:pointer;transition:color .25s;display:block;border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand .sb-brand-line2{display:block;font-size:13px;font-weight:700;letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;gap:8px;width:100%;align-items:center;padding-top:6px;}
.sb-item{text-decoration:none;color:var(--sbText);display:flex;flex-direction:column;align-items:center;padding:5px 4px;width:64px;border-radius:8px;transition:background .2s,color .2s;}
.sb-item:hover{background:rgba(184,134,11,.12);color:var(--goldL);}
.sb-item.active{background:rgba(184,134,11,.22);color:#fff;box-shadow:0 0 14px rgba(184,134,11,.4) inset;}
.sb-circle{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:"Noto Sans TC",sans-serif;font-size:15px;font-weight:700;color:var(--gold);background:rgba(184,134,11,.08);margin-bottom:4px;}
.sb-item.active .sb-circle{background:var(--gold);color:#1e1a14;}
.sb-label{font-family:"Noto Sans TC",sans-serif;font-size:11.5px;letter-spacing:.5px;line-height:1.2;text-align:center;}

/* Hamburger */
#sbToggle{display:none;position:fixed;top:14px;left:14px;z-index:200;width:42px;height:42px;border:none;border-radius:8px;background:var(--sbBg);color:var(--gold);font-size:22px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);}

/* main */
.main{margin-left:var(--sbW);padding:0 28px 80px;}

/* Hero */
.site-hero{position:relative;background:linear-gradient(135deg,#1a1612 0%,#2a2018 50%,#1a1612 100%);color:#f5e8c5;padding:84px 32px 70px;text-align:center;border-radius:0 0 16px 16px;overflow:hidden;margin:0 -28px 30px;}
.site-hero::before{content:"般若";position:absolute;font-size:280px;font-weight:900;color:rgba(212,168,75,.045);left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Noto Serif TC",serif;letter-spacing:30px;pointer-events:none;}
.hero-content{position:relative;z-index:2;}
.hero-title{font-size:56px;letter-spacing:8px;color:var(--goldL);margin:0 0 18px;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.5);}
.hero-subtitle{font-size:20px;color:#f5e8c5;margin:0 0 12px;letter-spacing:3px;}
.hero-sub{font-size:18px;color:#e8d5a8;margin:0 0 8px;letter-spacing:2px;opacity:.92;}
.hero-meta{font-size:18px;color:#d4b87d;margin:14px 0 6px;letter-spacing:3px;}
.hero-range{display:inline-block;margin-top:14px;padding:5px 18px;border:1px solid rgba(212,168,75,.5);border-radius:20px;font-size:17px;color:#d4b87d;letter-spacing:2px;}

/* Preface */
.preface{max-width:980px;margin:0 auto 36px;padding:30px 36px;background:linear-gradient(135deg,#fffdf5,#f5ecd8);border:1px solid var(--border);border-left:5px solid var(--gold);border-radius:12px;box-shadow:0 2px 12px rgba(91,58,41,.08);}
.preface-title{font-size:30px;color:var(--accent);text-align:center;letter-spacing:4px;margin:0 0 18px;font-weight:700;}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);margin:0 0 14px;text-align:justify;}
.preface p:last-child{margin-bottom:0;}

/* TOC */
.toc-section{max-width:1100px;margin:0 auto 40px;padding:30px 18px;}
.toc-title{font-size:34px;color:var(--accent);text-align:center;letter-spacing:8px;margin:0 0 12px;font-weight:700;}
.toc-desc{font-size:17px;color:var(--text-muted);text-align:center;letter-spacing:2px;margin:0 0 24px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;}
.toc-card{display:flex;align-items:flex-start;gap:14px;background:var(--card);padding:16px 18px;border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--text);transition:all .2s;}
.toc-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(184,134,11,.15);border-color:var(--gold);}
.toc-num{flex-shrink:0;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans TC",sans-serif;font-size:17px;font-weight:700;box-shadow:0 2px 6px rgba(184,134,11,.3);}
.toc-name{font-size:19.5px;line-height:1.7;color:var(--text);font-weight:500;}

/* 章節 chapter section */
section.chapter{max-width:1100px;margin:36px auto;}
.ch-head{background:var(--headGrad);color:#f5e8c5;padding:38px 28px 30px;text-align:center;border-radius:14px 14px 0 0;position:relative;}
.ch-head::after{content:"";display:block;width:50%;height:2px;background:linear-gradient(to right,transparent,var(--gold),transparent);margin:18px auto 0;}
.ch-num{font-family:"Noto Sans TC",sans-serif;font-size:18px;letter-spacing:6px;color:var(--gold);margin:0 0 14px;}
.ch-name{font-size:34px;letter-spacing:6px;margin:0 0 12px;font-weight:700;color:#f5e8c5;}
.ch-sub{font-size:17px;color:#d4b87d;letter-spacing:2px;margin:0;line-height:1.6;}
.ch-body{background:var(--bg);padding:30px 8px 22px;border:1px solid var(--border);border-top:none;border-radius:0 0 14px 14px;}

/* Bridge */
.bridge{
  background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);
  border-left:5px solid var(--gold);
  border-radius:10px;
  padding:18px 24px; margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);
}
.bridge-outro{
  border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);
  margin-top:30px; margin-bottom:14px;
}
.bridge-label{
  display:inline-block;
  font-family:"Noto Sans TC",sans-serif; font-size:12.5px;
  background:var(--gold); color:#fff;
  padding:3px 12px; border-radius:12px;
  letter-spacing:2.2px; margin-bottom:10px;
}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0; color:var(--text2); line-height:2.1; font-size:18.5px;text-align:justify;}

/* iframe */
.ch-frame{
  display:block; width:100%; border:0;
  background:#fffdf7;
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:0 4px 20px rgba(91,58,41,.1);
  margin:0 0 8px;
  min-height:180px;
}

/* next link */
.next-link{
  display:block;text-align:center;text-decoration:none;
  margin:24px auto 0;max-width:420px;
  background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;padding:14px 28px;border-radius:30px;
  font-size:17px;letter-spacing:3px;font-weight:600;
  box-shadow:0 4px 14px rgba(184,134,11,.3);
  transition:transform .2s,box-shadow .2s;
}
.next-link:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(184,134,11,.4);}

/* 底部進度膠囊 */
.read-progress{
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
  z-index:120; background:rgba(30,26,20,.92); color:var(--gold);
  padding:9px 24px; border-radius:30px;
  border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:"Noto Sans TC",sans-serif;
  font-size:14px; letter-spacing:2px;
  display:flex; align-items:center; gap:12px;
  pointer-events:none; user-select:none;
  backdrop-filter:blur(6px);
}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:12px;opacity:.75;letter-spacing:3px;}

/* footer */
.site-footer{margin:60px -28px 0;padding:50px 28px 70px;background:linear-gradient(135deg,#1a1612,#2a2018);color:#d4b87d;text-align:center;border-radius:16px 16px 0 0;}
.site-footer h3{font-size:24px;letter-spacing:6px;color:var(--goldL);margin:0 0 14px;}
.site-footer p{font-size:15px;letter-spacing:2px;line-height:1.9;margin:6px 0;color:#c9a872;}
.site-footer .vow{font-size:17px;color:#f5e8c5;margin:18px 0 6px;letter-spacing:4px;}

/* backTop */
#backTop{position:fixed;right:24px;bottom:96px;width:44px;height:44px;border-radius:50%;background:var(--gold);color:#fff;border:none;font-size:20px;cursor:pointer;display:none;z-index:110;box-shadow:0 4px 14px rgba(184,134,11,.4);}
#backTop.show{display:block;}

/* 響應式 */
@media(max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .25s;}
  #sb.open{transform:translateX(0);}
  #sbToggle{display:block;}
  .main{margin-left:0;padding:0 16px 80px;}
  .site-hero{margin:0 -16px 24px;padding:60px 18px 50px;}
  .hero-title{font-size:38px;letter-spacing:5px;}
  .ch-head{padding:30px 16px 24px;}
  .ch-name{font-size:26px;letter-spacing:4px;}
  .preface{padding:22px 18px;}
  .toc-grid{grid-template-columns:1fr;}
}

/* === 1.2x outer boost === */
body{font-size:20px!important;}
.hero-title,.site-hero h1{font-size:56px!important;}
.hero-subtitle,.site-hero .hero-subtitle{font-size:20px!important;}
.hero-sub,.site-hero .hero-sub,.hero-meta{font-size:18px!important;}
.hero-range{font-size:17px!important;}
.preface p{font-size:19px!important;line-height:2.1!important;}
.preface h2,.preface-title{font-size:30px!important;}
.toc-title{font-size:34px!important;}
.toc-desc{font-size:17px!important;}
.toc-name{font-size:19.5px!important;line-height:1.7!important;}
.toc-num{font-size:17px!important;}
.bridge p{font-size:18.5px!important;line-height:2.1!important;}
.bridge-label{font-size:12.5px!important;letter-spacing:2.2px!important;}
.ch-num{font-size:18px!important;}
.ch-name{font-size:34px!important;}
.ch-sub,.ch-desc,.ch-subtitle{font-size:17px!important;}
.next-link{font-size:17px!important;}
.read-progress{font-size:14px!important;padding:9px 24px!important;}
.read-progress .rp-bar{width:148px!important;height:4px!important;}
.read-progress .rp-pct{font-size:13px!important;}
.read-progress .rp-label{font-size:12px!important;}
.sb-circle{font-size:15px!important;}
.sb-label{font-size:11.5px!important;}
.site-footer,.site-footer p{font-size:15px!important;}
</style>
