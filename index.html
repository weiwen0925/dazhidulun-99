<style>
:root{
  --bg:#f7f3ec;--text:#2c2416;--text2:#5a4e3a;--text-muted:#6B5B4B;
  --accent:#8b5e3c;--accentL:#c4956a;--accent-red:#8B2500;
  --gold:#b8860b;--goldL:#d4a84b;--border:#d4c4a8;--card:#fffdf7;
  --sbW:88px;--sbBg:#1e1a14;--sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
}
*{box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;}
html,body{scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Serif TC","Songti TC",Georgia,serif;font-size:20px;line-height:1.85;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
img{-webkit-user-drag:none;pointer-events:none;}

/* 側欄 */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;background:var(--sbBg);color:var(--sbText);z-index:100;display:flex;flex-direction:column;align-items:center;padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sb-brand{position:sticky;top:0;width:100%;font-family:"Noto Sans TC",sans-serif;color:var(--gold);text-align:center;line-height:1.5;background:linear-gradient(to bottom,var(--sbBg) 80%,rgba(30,26,20,0));padding:14px 4px 12px;margin-bottom:6px;z-index:5;cursor:pointer;border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand-line2{display:block;font-size:13px;font-weight:700;letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center;padding-top:6px;}
.sb-item{display:flex;flex-direction:column;align-items:center;padding:4px 4px;width:76px;border-radius:8px;transition:background .2s,color .2s;}
.sb-item:hover{background:rgba(184,134,11,.12);color:var(--goldL);}
.sb-item.active{background:rgba(184,134,11,.22);color:#fff;box-shadow:0 0 14px rgba(184,134,11,.4) inset;}
.sb-circle{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:"Noto Sans TC",sans-serif;font-size:16px;font-weight:700;color:var(--gold);background:rgba(184,134,11,.08);margin-bottom:4px;}
.sb-item.active .sb-circle{background:var(--gold);color:#1e1a14;}
.sb-label{font-family:"Noto Sans TC",sans-serif;font-size:12px;letter-spacing:.4px;line-height:1.25;text-align:center;}

#sbToggle{display:none;position:fixed;top:14px;left:14px;z-index:200;width:42px;height:42px;border:none;border-radius:8px;background:var(--sbBg);color:var(--gold);font-size:22px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);}

.main{margin-left:var(--sbW);padding:0 28px 90px;}

/* Hero */
.site-hero{position:relative;background:linear-gradient(135deg,#1a1612 0%,#2a2018 50%,#1a1612 100%);color:#f5e8c5;padding:90px 32px 74px;text-align:center;border-radius:0 0 16px 16px;overflow:hidden;margin:0 -28px 30px;}
.site-hero::before{content:"般若";position:absolute;font-size:300px;font-weight:900;color:rgba(212,168,75,.045);left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Noto Serif TC",serif;letter-spacing:30px;}
.site-hero::after{content:"卷九十九";position:absolute;font-size:140px;font-weight:900;color:rgba(184,134,11,.04);right:-20px;bottom:-30px;font-family:"Noto Serif TC",serif;letter-spacing:10px;}
.hero-content{position:relative;z-index:1;}
.hero-title{font-size:58px;font-weight:900;color:var(--goldL);margin:0 0 18px;letter-spacing:10px;text-shadow:0 2px 20px rgba(212,168,75,.3);}
.hero-subtitle{font-size:21px;color:#e8d8b2;margin:0 0 14px;letter-spacing:4px;font-weight:300;}
.hero-sub{font-size:18px;color:#d4c4a8;margin:0 auto 22px;max-width:760px;letter-spacing:2px;line-height:1.9;}
.hero-range{margin-top:20px;font-size:17px;color:#b39866;letter-spacing:2px;font-style:italic;padding-top:22px;border-top:1px solid rgba(212,168,75,.22);display:inline-block;}

/* Preface */
.preface{max-width:860px;margin:0 auto 36px;background:var(--card);border:1px solid var(--border);border-left:5px solid var(--gold);border-radius:10px;padding:26px 32px;box-shadow:0 2px 12px rgba(91,58,41,.06);}
.preface h2{font-size:26px;color:var(--accent);text-align:center;margin:0 0 18px;letter-spacing:6px;}
.preface p{margin:0 0 14px;color:var(--text2);line-height:2.05;font-size:18.5px;text-align:justify;}
.preface p:last-child{margin-bottom:0;}

/* TOC */
.toc-section{max-width:1100px;margin:0 auto 42px;}
.toc-title{font-size:32px;color:var(--accent);text-align:center;letter-spacing:8px;margin:0 0 8px;}
.toc-desc{text-align:center;color:var(--text-muted);font-size:16px;letter-spacing:1px;margin:0 0 26px;font-family:"Noto Sans TC",sans-serif;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
.toc-card{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 22px;transition:transform .18s,box-shadow .18s,border-color .18s;box-shadow:0 1px 4px rgba(91,58,41,.06);}
.toc-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(91,58,41,.14);border-color:var(--gold);}
.toc-num{flex:none;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;font-family:"Noto Serif TC",serif;box-shadow:0 2px 8px rgba(184,134,11,.35);}
.toc-name{font-size:19px;color:var(--text);line-height:1.55;font-weight:600;}

/* 章節（品）頭 */
.chapter{margin:34px 0;scroll-margin-top:20px;}
.ch-head{background:var(--headGrad);color:#f5e8c5;text-align:center;padding:46px 28px 40px;border-radius:14px 14px 0 0;position:relative;overflow:hidden;}
.ch-head::after{content:"";position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:80px;height:2px;background:linear-gradient(90deg,transparent,var(--goldL),transparent);}
.ch-num{font-family:"Noto Sans TC",sans-serif;font-size:16px;color:var(--goldL);letter-spacing:4px;margin-bottom:12px;}
.ch-name{font-size:38px;font-weight:900;color:#f5e8c5;margin:0 0 12px;letter-spacing:4px;}
.ch-sub{font-size:17px;color:#c4a87a;margin:0;letter-spacing:1.5px;line-height:1.7;font-family:"Noto Sans TC",sans-serif;}
.ch-body{background:transparent;padding:26px 0 0;}

/* 橋接 */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);border:1px solid var(--border);border-left:5px solid var(--gold);border-radius:10px;padding:20px 26px;margin:0 0 26px;box-shadow:0 2px 10px rgba(91,58,41,.06);max-width:980px;margin-left:auto;margin-right:auto;}
.bridge-outro{border-left-color:var(--accentL);background:linear-gradient(135deg,#fdf8e8,#f2e6c8);margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:12.5px;background:var(--gold);color:#fff;padding:3px 14px;border-radius:12px;letter-spacing:2.2px;margin-bottom:12px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2.05;font-size:18.5px;text-align:justify;}
.next-link{display:block;max-width:980px;margin:0 auto;text-align:right;color:var(--accent);font-family:"Noto Sans TC",sans-serif;font-size:17px;font-weight:600;padding:4px 4px 0;}
.next-link:hover{color:var(--gold);}

/* iframe */
.ch-frame{display:block;width:100%;max-width:1080px;margin:0 auto 8px;border:0;background:#fffdf7;border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 20px rgba(91,58,41,.1);min-height:180px;}

/* 底部進度膠囊 */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;background:rgba(30,26,20,.92);color:var(--gold);padding:9px 24px;border-radius:30px;border:1px solid rgba(184,134,11,.5);box-shadow:0 4px 18px rgba(0,0,0,.25);font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:2px;display:flex;align-items:center;gap:12px;pointer-events:none;user-select:none;backdrop-filter:blur(6px);transition:opacity .45s ease,transform .45s ease;}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:13px;opacity:.85;letter-spacing:4px;color:var(--goldL);}

#backTop{position:fixed;right:24px;bottom:24px;width:46px;height:46px;border:none;border-radius:50%;background:var(--sbBg);color:var(--gold);font-size:22px;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.3);display:none;z-index:120;}
#backTop.show{display:block;}

.site-footer{text-align:center;color:var(--text-muted);font-family:"Noto Sans TC",sans-serif;font-size:15px;letter-spacing:1px;padding:34px 20px 10px;border-top:1px solid var(--border);margin:40px auto 0;max-width:980px;}

@media(max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .25s;}
  #sb.open{transform:none;}
  #sbToggle{display:block;}
  .main{margin-left:0;padding:0 16px 90px;}
  .site-hero{margin:0 -16px 24px;padding:64px 20px 50px;}
  .hero-title{font-size:40px;letter-spacing:6px;}
  .ch-name{font-size:30px;}
  .toc-grid{grid-template-columns:1fr;}
}
</style>

<script>
// 進度
var rpFill=document.getElementById('rpFill'),rpPct=document.getElementById('rpPct');
function updateProgress(){var sh=document.documentElement.scrollHeight-window.innerHeight;var pct=sh>0?Math.min(100,Math.max(0,window.scrollY/sh*100)):0;if(rpFill)rpFill.style.width=pct+'%';if(rpPct)rpPct.textContent=Math.round(pct)+'%';}
window.addEventListener('scroll',updateProgress,{passive:true});updateProgress();
// 接近頁尾淡出
(function(){var cap=document.getElementById('readProgress');if(!cap)return;function setHide(on){cap.classList.toggle('hide-near-end',!!on);}
var ts=[].slice.call(document.querySelectorAll('.site-footer,[data-wy-notice="v2"]'));if(!ts.length)return;
if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){setHide(es.some(function(e){return e.isIntersecting;}));},{rootMargin:'0px 0px -20px 0px',threshold:0.01});ts.forEach(function(t){io.observe(t);});}})();
// iframe 自動高度
function resizeFrame(f){try{var d=f.contentDocument||f.contentWindow.document;if(!d||!d.body)return;
d.body.style.minHeight='0';d.body.style.height='auto';if(d.documentElement){d.documentElement.style.minHeight='0';d.documentElement.style.height='auto';}
var h=d.body.scrollHeight;if(h>100){f.style.height=h+'px';f.style.minHeight='0';}}catch(e){}}
function resizeAllFrames(){document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);if(typeof updateProgress==='function')updateProgress();}
function setupFrame(f){var tries=0;function tick(){tries++;resizeFrame(f);if(tries<30)setTimeout(tick,200);}
if(f.contentDocument&&f.contentDocument.readyState==='complete'){tick();}else{f.addEventListener('load',tick);}}
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(resizeAllFrames,200);});
// 錨點防錯跳
document.addEventListener('click',function(e){var a=e.target;while(a&&a.tagName!=='A')a=a.parentElement;if(!a)return;
var h=a.getAttribute('href');if(!h||h.charAt(0)!=='#'||h.length<2)return;var id=h.substring(1);var el=document.getElementById(id);if(!el)return;
e.preventDefault();resizeAllFrames();setTimeout(function(){resizeAllFrames();var rect=el.getBoundingClientRect();var y=window.scrollY+rect.top-20;window.scrollTo({top:y,behavior:'smooth'});},60);},true);
var _rt=0,_riv=setInterval(function(){_rt++;resizeAllFrames();if(_rt>50)clearInterval(_riv);},300);
// 側欄高亮
var items=[].slice.call(document.querySelectorAll('.sb-item'));
var chaps=items.map(function(a){return document.getElementById('chapter-'+a.getAttribute('data-ch'));});
function highlight(){var idx=-1;for(var i=0;i<chaps.length;i++){if(chaps[i]&&chaps[i].getBoundingClientRect().top<window.innerHeight*0.35)idx=i;}
items.forEach(function(a,i){a.classList.toggle('active',i===idx);});}
window.addEventListener('scroll',highlight,{passive:true});highlight();
// sb-brand 回頂
var sbBrand=document.getElementById('sbBrand');if(sbBrand)sbBrand.addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});});
// 漢堡
var tog=document.getElementById('sbToggle'),sb=document.getElementById('sb');
if(tog)tog.addEventListener('click',function(){sb.classList.toggle('open');});
// 回頂鈕
var bt=document.getElementById('backTop');
window.addEventListener('scroll',function(){if(bt)bt.classList.toggle('show',window.scrollY>600);},{passive:true});
if(bt)bt.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
// 外層防複製
(function(){var blk=function(e){e.preventDefault();return false;};['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){document.addEventListener(ev,blk,true);});
document.addEventListener('keydown',function(e){var k=e.key;if(e.ctrlKey&&(k==='c'||k==='C'||k==='a'||k==='A'||k==='s'||k==='S'||k==='p'||k==='P'||k==='u'||k==='U')){blk(e);}if(k==='F12')blk(e);if(e.ctrlKey&&e.shiftKey&&(k==='I'||k==='J'||k==='C'||k==='K')){blk(e);}},true);})();
</script>

<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy-dazhidulun-99-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>
