<section class=&quot;chapter&quot; id=&quot;chapter-1&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第二品 · 第一章</div>
<h2 class=&quot;ch-name&quot;>入論大綱</h2>
<p class=&quot;ch-sub&quot;>般若藍圖總覽 · 諸佛無來去之開端</p>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;>
<div class=&quot;bridge-label&quot;>本章要旨</div>
<p>本品緊承〈曇無竭品〉前段「諸佛無所從來，去亦無所至。何以故？諸法如不動相，諸法如即是佛」的開示而立。曇無竭以「焰中無水、幻事無實、夢中見象」三譬，引導薩陀波崙從「執空間位移」的世俗實有觀，轉入「諸佛法身無來無去」的勝義空性觀。本章先確立論釋的入題點──「<strong>何等是諸法如？</strong>」──並把 PDF 視覺化解析的設計理念引入，作為後續五章辯證的座標。</p>
</div>
<h2>第一節　開卷大哉問 · 諸佛無來去之疑</h2>
<p>曇無竭菩薩於前文以最直接的方式為薩陀波崙開示般若實相：「諸佛無所從來，去亦無所至。」這句經文的力道不在於「無來無去」四字本身，而在於它直接打破了凡夫對「佛」這個概念的最後一層執著──<strong>空間中的實體位移</strong>。我們習慣把佛當作「曾經在某處」、「現在到了某處」、「未來會去某處」的對象來追求；而曇無竭直指此見為「<em>愚夫無智，為熱渴所逼，見焰動，無水生水想</em>」。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經文 · 開卷宣示</span>
<p>「善男子！諸佛無所從來，去亦無所至。何以故？諸法如不動相，諸法如即是佛。善男子！無生法無來無去，無生法即是佛；無滅法無來無去，無滅法即是佛；實際法無來無去，實際法即是佛；空無來無去，空即是佛。」</p>
<p>「善男子！離是諸法更無佛；諸佛如、諸法如，一如無分別。善男子！是如常一，無二、無三，出諸數法，無所有故。」</p>
</div>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 認知鴻溝</h3>
<div class=&quot;insight-content&quot;>
<p>視覺化解析以「曇無竭的般若實相」與「薩陀波崙的空間幻象」並列為兩種認知模式的對峙：</p>
<div class=&quot;refutation-grid&quot;>
<div class=&quot;ref-cell&quot;>
<h5>曇無竭：般若實相</h5>
<p>「諸法如不動相，諸法如即是佛。」<br/><small>諸法本無生滅，法身無來無去。</small></p>
</div>
<div class=&quot;ref-cell&quot;>
<h5>薩陀波崙：空間幻象</h5>
<p>「若諸佛無來無去，為何我們能見佛、求佛？」<br/><small>執著於空間移動與實體存在。</small></p>
</div>
</div>
<p>論文指出：兩者之間的差距，正是<strong>「世俗實有」與「勝義空性」</strong>的認知鴻溝。本品下文所有論辯，皆是為了跨越這道鴻溝而設計的層層階梯。</p>
</div>
</div>
<h2>第二節　何等是諸法如 · 釋論起點</h2>
<p>論主（龍樹）以一個極簡的問句切入論釋──「何等是諸法如？」這個問題之所以關鍵，是因為前段經文中「諸法如」是承擔「即是佛」這個賓語的主詞。如果不能清楚指認「諸法如」的內涵，整段「諸佛無來無去」的開示就只是修辭，而非可操作的見地。</p>
<div class=&quot;qa no-prefix&quot;>
<p class=&quot;q&quot;><strong>問曰：</strong>何等是諸法如？</p>
<p class=&quot;a&quot;><strong>答曰：</strong>諸法實相，所謂性空、無所得、空等諸法門。</p>
</div>
<p>論主的回答只有十六字，但已埋下整品辯證的三大關鍵詞：</p>
<div class=&quot;three-col&quot;>
<div>
<h5>性 空</h5>
<p>諸法皆從因緣生，無獨立自性。這是後文「若和合故有，是即為無」的法理基礎。</p>
</div>
<div>
<h5>無所得</h5>
<p>凡可被指認、被把握、被名言所收攝者，皆非實相。這是第六章「出諸數法」收束處的核心。</p>
</div>
<div>
<h5>空等諸法門</h5>
<p>並非僅「空」一門，凡能令心離戲論、契實相者，皆與空門等量齊觀。為後文八不、雙空鋪路。</p>
</div>
</div>
<p>這簡短的問答，是進入整個第二品最關鍵的閘口。讀者若不在此處立穩「諸法如＝性空＝無所得」的等式，後續所有「五眾與佛」「五求佛不可得」「諸法實相即是佛」的辯證皆會走樣。</p>
<h2>第三節　視覺化邏輯導讀 · 簡報設計理念</h2>
<p>本網頁所融入的論文《般若藍圖：空性構造》──全名《研讀指責：解構大智度論之邏輯座標》──其設計理念有三：</p>
<div class=&quot;flow flow-v&quot;>
<div class=&quot;flow-box&quot;>精確映射龍樹菩薩如何將《中論》核心引擎「<strong>不來不去、不生不滅</strong>」應用至《大智度論》卷九十九的「佛身辯證」<small>——從色身微細結構至一切種智，逐層拆解。</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;>展示經論如何精妙遊走於「<strong>實有佛身</strong>」與「<strong>斷滅空</strong>」兩邊之間<small>——破除「有相」執著而不墮入虛無，建構中觀的「真空妙有」思維矩陣。</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;>將「<strong>五求辯證</strong>」視覺化為地毯式搜索矩陣<small>——作為深入探究的實用分析工具，幫助讀者親自體驗論主的破立節奏。</small></div>
</div>
<div class=&quot;conclusion&quot;>
<h5>本品閱讀地圖</h5>
<p>下面五章將依以下次第展開：</p>
<p><strong>第二章</strong> · 對手立宗（五指合為拳之喻）→ 論主以二諦立教 → 緣起與假名 → 聲喻緣起的跨域應用。</p>
<p><strong>第三章</strong> · 一與五的矛盾 → 泛稱與特稱矛盾 → 對手以妙色身回防 → 一切種智的寂滅相。</p>
<p><strong>第四章</strong> · 五求辯證（即、異、在內、在外、所有）→ 地毯式搜索佛的實體立足點。</p>
<p><strong>第五章</strong> · 危機之問（無佛即邪見）→ 治病執藥 → 離有無二邊 → 處中道。</p>
<p><strong>第六章</strong> · 一如等式（色如＝佛如＝虛空性如）→ 出諸數法 → 不惜身命 → 終極心法。</p>
</div>
</div>
</section>
<section class=&quot;chapter&quot; id=&quot;chapter-2&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第二品 · 第二章</div>
<h2 class=&quot;ch-name&quot;>對手立宗與緣起破之</h2>
<p class=&quot;ch-sub&quot;>二諦中道 · 假名性空 · 聲喻緣起</p>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;>
<div class=&quot;bridge-label&quot;>本章要旨</div>
<p>第一章已立定「諸法如＝性空、無所得」的入論前提。本章正面迎戰外道（或聲聞）的反擊立宗──「<strong>清淨五眾和合故名為佛</strong>」，並以「五指和合為拳」作為類比，企圖證明：既然名字、形狀、力用都「異」於五眾，那麼「佛」就不可能是「無」。論主則祭出中觀的兩道殺手鐧：<strong>二諦判教</strong>（世諦講說／第一義空寂）與<strong>緣起破之</strong>（若和合故有，是即為無）。本章末以〈曇無竭品〉的「箜篌聲喻」「大海諸寶喻」回應，把「眾緣和合而生，因緣離時即滅」的緣起骨架立穩。</p>
</div>
<h2>第一節　對手立宗 · 五指合為拳之喻</h2>
<p>外道採取一個極聰明的策略：他不直接主張「有佛」，而是先承認般若波羅蜜的至高地位，然後以「若無佛則無說般若者」反推「必有佛」。再以五指合為拳之喻，鞏固「五眾合為佛」的合法性。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論主設問 · 對手立宗</span>
<p><strong>問曰：</strong>摩訶般若波羅蜜於佛法大乘六波羅蜜中第一法，若無佛，則無說般若者。三十二相、八十隨形好、十力、四無所畏等色、無色法等淨妙五眾和合，是故名為佛。如五指和合名為拳，不得言無拳；名字既異，形亦異，力用亦異，不得言無拳，是故知有佛。</p>
</div>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 對手的核心假設</h3>
<div class=&quot;insight-content&quot;>
<p>視覺化解析將對手的攻勢拆解為一條清晰的「<strong>邏輯升級鏈</strong>」：</p>
<div class=&quot;domino-chain&quot;>
<span class=&quot;domino&quot;>五指</span><span class=&quot;chain-arrow&quot;>→</span>
<span class=&quot;domino&quot;>和合</span><span class=&quot;chain-arrow&quot;>→</span>
<span class=&quot;domino&quot;>拳（名異／形異／力用異）</span><span class=&quot;chain-arrow&quot;>→</span>
<span class=&quot;domino&quot;>∴ 拳法非無</span>
</div>
<div class=&quot;domino-chain&quot;>
<span class=&quot;domino&quot;>五眾</span><span class=&quot;chain-arrow&quot;>→</span>
<span class=&quot;domino&quot;>和合</span><span class=&quot;chain-arrow&quot;>→</span>
<span class=&quot;domino&quot;>佛（三十二相／十力／四無所畏）</span><span class=&quot;chain-arrow&quot;>→</span>
<span class=&quot;domino&quot;>∴ 佛非無</span>
</div>
<p>對手企圖證明：當局部元件（指／眾）組合成具備新功能與形體的整體（拳／佛）時，整體就成為「<strong>實有</strong>」的存在，不能被宣告為「無」。</p>
</div>
</div>
<h2>第二節　二諦立教 · 世諦與第一義諦</h2>
<p>論主沒有正面拆解對手的譬喻，而是先建立判教座標──佛法中有<strong>二諦</strong>：世諦與第一義諦。同一件事，在不同諦中有不同的成立方式。「佛說般若波羅蜜」是世諦中的施設言說；「諸佛空、無來無去」是第一義中的寂滅相。兩者並不矛盾，反而是同一實相的兩重看待。</p>
<div class=&quot;qa no-prefix&quot;>
<p class=&quot;a&quot;><strong>答曰：</strong>不然！佛法中有二諦：世諦、第一義諦。世諦故言「佛說般若波羅蜜」，第一義故說「諸佛空，無來無去」。</p>
</div>
<div class=&quot;spectrum&quot;>
<div class=&quot;sp-node&quot;>
<h5>世諦（俗）</h5>
<p>佛說般若波羅蜜<br/><small>建立教化、有人說有人聽</small></p>
</div>
<div class=&quot;sp-node sp-mid&quot;>
<h5>二諦無二</h5>
<p>不即不離<br/><small>不壞世俗，不礙真諦</small></p>
</div>
<div class=&quot;sp-node&quot;>
<h5>第一義諦（真）</h5>
<p>諸佛空、無來無去<br/><small>寂滅相、無戲論</small></p>
</div>
</div>
<p>論文視覺化解析將此節抽煉為一句核心箴言：「<strong>中觀核心原理：二諦無二，不即不離，不壞世俗，不礙真諦。</strong>」這正是龍樹《中論》〈觀四諦品〉「若不依俗諦，不得第一義；不得第一義，則不得涅槃」的「相互依存」邏輯，本品由此安立。</p>
<h2>第三節　緣起與假名 · 若和合故有即為無</h2>
<p>立穩二諦後，論主直擊對手譬喻的破口──「<strong>若和合故有，是即為無</strong>」。這六字是整品最尖銳的緣起武器：凡須依賴條件組合才存在者，其自身並無獨立自性可言。對手以為「和合」是有，論主則指出「和合」恰恰證明「無自性」。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論主破之 · 五眾非佛</span>
<p>如汝說：「清淨五眾和合故名為佛。」若和合故有，是即為無。如經中佛自說因緣：「五眾非佛，離五眾亦無佛，五眾不在佛中，佛不在五眾中，佛非五眾有。」</p>
<p>何以故？五眾是五、佛是一，一不作五、五不作一。又五眾無自性故，虛誑不實；佛自說：「一切無誑法中，我最第一。」是故五眾不即是佛。</p>
<p>復次，若五眾即是佛，諸有五眾者皆應是佛。</p>
</div>
<div class=&quot;four-grid&quot;>
<div class=&quot;grid-cell&quot;>
<h5>假 名（Conceptual Label）</h5>
<p>因緣和合所生的整體，僅是世俗安立的名相──「拳」是五指和合的施設名，「佛」是清淨五眾和合的施設名。</p>
</div>
<div class=&quot;grid-cell&quot;>
<h5>自 性（Self-Nature）</h5>
<p>本質、不依他緣、獨立存在的體性。論主指出：因緣所生法本質即空，故無自性。</p>
</div>
</div>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 拳指映射矩陣</h3>
<div class=&quot;insight-content&quot;>
<p>視覺化解析將此一節呈現為「<strong>指與拳的映射矩陣</strong>」──以拳指譬喻為基底，對應佛與五眾之關係：</p>
<div class=&quot;two-col&quot;>
<div class=&quot;grid-cell&quot;>
<h5>局部 / 因緣（Parts）</h5>
<p>五指 ↔ 五眾<br/><small>單獨皆無「拳」的功能；單獨皆無「佛」的體性。</small></p>
</div>
<div class=&quot;grid-cell&quot;>
<h5>整體 / 假名（Whole）</h5>
<p>拳頭 ↔ 佛（假名安立）<br/><small>「離開五根手指，找不到拳頭的實體；離開五眾，亦無『佛』的實體可得。」</small></p>
</div>
</div>
<p>映射矩陣的核心訊息是：對手以為「整體非無」可以證成「整體實有」，但中觀指出──<strong>整體既無自體，即是假名，並非絕對真實的存在</strong>。</p>
</div>
</div>
<h2>第四節　聲喻緣起 · 模型跨域應用</h2>
<p>為穩固「眾緣和合故有，諸緣離故滅」的緣起骨架，論主在前段經文中已透過曇無竭菩薩之口，連續以三大譬喻把這套模型推到極致：<strong>幻事喻、夢喻、大海諸寶喻、箜篌聲喻</strong>。本節擷取其中最具系統性的「箜篌聲喻」與「大海諸寶喻」，作為論釋階段的緣起前奏。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經文 · 箜篌聲喻</span>
<p>「『善男子！譬如箜篌聲，出時無來處，滅時無去處。眾緣和合故生──有槽、有頸、有皮、有絃、有柱、有棍，有人以手鼓之，眾緣和合而有聲；是聲亦不從槽出，不從頸出，不從皮出，不從絃出，不從柱出，不從棍出，亦不從人手出，眾緣和合爾乃有聲。是因緣離時，亦無去處。</p>
<p>善男子！諸佛身亦如是，從無量功德因緣生，不從一因一緣一功德生，亦不無因緣有，眾緣和合故有。<strong>諸佛身不獨從一事成，來無所從、去無所至。</strong>』」</p>
</div>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 聲喻三層 Insight</h3>
<div class=&quot;insight-content&quot;>
<div class=&quot;three-col&quot;>
<div>
<h5>聲無定所</h5>
<p>聲音不從單一零件出──不從槽出、不從絃出、不從手出。</p>
</div>
<div>
<h5>緣合而生</h5>
<p>槽、頸、皮、絃、柱、棍、人手──七緣和合，方有聲響。</p>
</div>
<div>
<h5>無來無去</h5>
<p>出時無來處，滅時無去處；眾緣和合而生，因緣離時即滅。</p>
</div>
</div>
<p>論文指出：箜篌聲喻可<strong>跨域應用</strong>──將「聲」替換為「佛身」，整套緣起邏輯完全成立。這正是「諸佛身亦如是，從無量功德因緣生，不從一因一緣一功德生」的精確映射。</p>
</div>
</div>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經文 · 大海諸寶喻</span>
<p>「『善男子！譬如大海水中諸寶，不從東方來，不從南方、西方、北方、四維、上下來，眾生善根因緣故，海生此寶。此寶亦不無因緣而生，是寶皆從因緣和合生，是寶若滅亦不去至十方。<strong>諸緣合故有，諸緣離故滅。</strong>善男子！諸佛身亦如是，從本業因緣果報生，生不從十方來，滅時亦不去至十方；但諸緣合故有，諸緣離故滅。」</p>
</div>
<div class=&quot;conclusion&quot;>
<h5>第二章收束</h5>
<p>對手以「五指合為拳」企圖將「實有」走私進般若場域；論主以<strong>二諦</strong>立教，繼以<strong>緣起破之</strong>──「若和合故有，是即為無」六字斷然回擊。聲喻、大海諸寶喻則把這套緣起模型推到「眾緣和合故有、諸緣離故滅、來無所從、去無所至」的圓滿表述。但對手不會就此罷手──下一章他將升級攻勢，以「三十二相」「妙色身」「一切種智」回頭再戰。</p>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<div class=&quot;bridge-label&quot;>承先啟後</div>
<p>承本章「<strong>若和合故有，是即為無</strong>」的緣起破式，下一章對手將透過「形體完美化」與「智慧加值」兩道防禦──主張「<strong>不是普通五眾，而是清淨五眾＋三十二相＋一切種智</strong>」──企圖在量上失利後從質上扳回。論主則以「<strong>一與五的數量矛盾</strong>」與「<strong>泛稱／特稱矛盾</strong>」迎擊，並最終以「一切種智＝寂滅相＝無戲論＝無所得」收編對手最後一張王牌。</p>
</div>
</div>
</section>
<section class=&quot;chapter&quot; id=&quot;chapter-3&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第二品 · 第三章</div>
<h2 class=&quot;ch-name&quot;>邏輯辯證</h2>
<p class=&quot;ch-sub&quot;>一與五的對峙 · 妙色身與一切種智</p>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;>
<div class=&quot;bridge-label&quot;>本章要旨</div>
<p>上一章論主以二諦與緣起雙刃破除對手的「五眾合為佛」立宗。本章對手不認輸，依次拿出兩道防禦：（一）<strong>形體完美化</strong>──主張不是普通五眾，而是具備三十二相、八十隨形好的「清淨五眾」；（二）<strong>智慧加值</strong>──主張除色身外加「一切種智」，方名為佛。論主則以三重邏輯反擊：<strong>一與五的數量矛盾</strong>、<strong>泛稱與特稱矛盾</strong>、<strong>菩薩時亦有相好為何不名佛</strong>。最後對手最後一張王牌「一切種智」也被收編──論主指出：般若中說一切種智即是寂滅相、無戲論、無所得，無所得故名為佛，佛即是空。</p>
</div>
<h2>第一節　一與五矛盾 · 五眾是五，佛是一</h2>
<p>論主在前一章已埋下這條邏輯利刃──「<strong>五眾是五、佛是一，一不作五、五不作一</strong>」。表面是極簡的數量分析，實則直擊類概念的根基：若五眾即是佛，則一個「佛」會被五個「眾」所等同，這在最基本的計數邏輯上就無法成立。</p>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 一與五的矛盾</h3>
<div class=&quot;insight-content&quot;>
<p>視覺化解析以邏輯反證的方式呈現：</p>
<div class=&quot;flow flow-v&quot;>
<div class=&quot;flow-box&quot;>假設：五眾 ＝ 佛</div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;>則：1 ＝ 5（在數量上必須成立）</div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>結論：邏輯不成立 → 五眾不即是佛。</strong></div>
</div>
<p>論文指出：對手如果想保住「五眾合為佛」的等式，就必須接受「<strong>一可作五、五可作一</strong>」的數論。一旦進入這個區域，整個有部以五蘊建立人格主體的論述都要被拖下水。</p>
</div>
</div>
<h2>第二節　泛稱與特稱矛盾 · 諸有五眾者皆應是佛</h2>
<p>論主再下一城──若五眾即是佛，那麼凡是擁有五眾的眾生皆應是佛。這是純粹的「泛稱／特稱」邏輯演繹：當你把一個普遍特徵（五眾）等同於一個專有屬性（佛），則所有具備該特徵的個體都應落入該屬性之下。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論主反擊 · 泛稱矛盾</span>
<p>復次，若五眾即是佛，諸有五眾者皆應是佛。</p>
</div>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 邏輯證法二與三</h3>
<div class=&quot;insight-content&quot;>
<p>視覺化解析以「<strong>泛特矛盾</strong>」與「<strong>誑非誑矛盾</strong>」雙軌呈現：</p>
<div class=&quot;refutation-grid&quot;>
<div class=&quot;ref-cell&quot;>
<h5>誑非誑矛盾</h5>
<p>五蘊本質是生滅虛妄的，佛自宣稱「一切無誑法中，我最第一」。若五眾即是佛，則佛亦是虛妄──與佛自宣矛盾。</p>
</div>
<div class=&quot;ref-cell&quot;>
<h5>泛特矛盾</h5>
<p>「若五眾即是佛，諸有五眾者皆應是佛。」凡夫皆有五蘊，難道凡夫皆是佛？──與佛之獨特性矛盾。</p>
</div>
</div>
</div>
</div>
<h2>第三節　對手的防禦 · 三十二相與妙色身</h2>
<p>面對「一與五」「泛與特」兩重邏輯打擊，對手不得不升級。他承認普通五眾不能等同佛，但堅持「<strong>第一清淨五眾</strong>」──加上三十二相、八十隨形好的<strong>妙色身</strong>──可以等同佛。論主則以一個簡潔的反例直擊：菩薩時亦有三十二相，為何不名為佛？</p>
<div class=&quot;qa no-prefix&quot;>
<p class=&quot;q&quot;><strong>問曰：</strong>以是難故，我先說：「第一清淨五眾、三十二相等名為佛。」</p>
<p class=&quot;a&quot;><strong>答曰：</strong>三十二相等，菩薩時亦有，何以不名為佛？</p>
</div>
<p>對手立刻補打第二道補丁：菩薩時雖有相好莊嚴身，卻無「一切種智」；若一切種智安住於第一妙色身中，是即名為佛。</p>
<div class=&quot;qa no-prefix&quot;>
<p class=&quot;q&quot;><strong>問曰：</strong>爾時雖有相好莊嚴身，而無一切種智；若一切種智在第一妙色身中，是即名為佛。</p>
</div>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 辯證升級</h3>
<div class=&quot;insight-content&quot;>
<p>視覺化解析指出：對手試圖透過<strong>形體的「完美化」</strong>，將凡夫的五蘊升級為清淨色身，再次企圖證明佛具備實體存在──這是把「實有」從粗品五眾推到細品「<strong>Perfect Body Shell（妙色身殼）</strong>」的層級升級。</p>
<div class=&quot;flow flow-v&quot;>
<div class=&quot;flow-box&quot;>第一層攻勢：五眾 = 佛 <small>（已被一與五、泛特雙刃破除）</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;>第二層攻勢：清淨五眾（三十二相） = 佛 <small>（被「菩薩時亦有」反例打破）</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;>第三層攻勢：妙色身 + 一切種智 = 佛 <small>（將進入下一節的最終收編）</small></div>
</div>
</div>
</div>
<h2>第四節　一切種智 · 寂滅相、無戲論、無所得</h2>
<p>對手最後一張王牌就是「一切種智」──認為這是佛獨有、菩薩所無的內容，可以為「佛」這個概念補上最後的實體依據。論主於此祭出最深的般若刀法：<strong>一切種智本身即是寂滅相、無戲論、無所得；既是無所得，故名為佛，佛即是空。</strong></p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論主收編 · 一切種智歸於空寂</span>
<p>「一切種智」，般若中說是寂滅相、無戲論；若得是法，則名無所得，無所得故名為佛，<strong>佛即是空</strong>。如是等因緣故，五眾不得即是佛。</p>
<p>離是五眾亦無佛。所以者何？離是五眾，更無餘法可說；如離五指更無拳法可說。</p>
</div>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 一切種智的解構</h3>
<div class=&quot;insight-content&quot;>
<p>視覺化解析將此節抽煉為三句核心命題：</p>
<div class=&quot;flow flow-v&quot;>
<div class=&quot;flow-box&quot;>命題 1：真理是心行處滅的（<strong>無戲論</strong>）</div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;>命題 2：因此真正「得到」真理，就是放棄所有抓取的概念（<strong>無所得</strong>）</div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;>命題 3：<strong>無所得故名為佛，佛即是空</strong></div>
</div>
<p>論文指出：對手把一切種智當作「最堅實的內容」交出，論主則把它當成「最終的鑰匙」收回──因為「得」此法者必須放棄所有可得的內容。這是中觀辯證最深一刀：用對手自己交出的籌碼，證明對手無法成立「實有」。</p>
</div>
</div>
<div class=&quot;conclusion&quot;>
<h5>第三章收束</h5>
<p>對手三層攻勢──普通五眾、清淨五眾（三十二相）、清淨五眾＋一切種智──皆被論主透過「<strong>一與五矛盾</strong>」「<strong>泛特矛盾</strong>」「<strong>菩薩亦有</strong>」「<strong>一切種智即寂滅相</strong>」四道反擊瓦解。至此「<strong>五眾不得即是佛</strong>」與「<strong>離是五眾亦無佛</strong>」雙重否定皆已確立。但這只是第一輪的「即」「離」兩位，下一章還有三位──在內、在外、所有──的全面搜索。</p>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<div class=&quot;bridge-label&quot;>承先啟後</div>
<p>本章已完成「<strong>即</strong>」與「<strong>離</strong>」兩位──「五眾即是佛」與「離五眾有佛」皆不可得。下一章將進入論釋最核心的「<strong>五求辯證</strong>」：以五個邏輯方位（即／異／在內／在外／所有）對「佛在五眾之何處」進行地毯式搜索，宣告「<strong>如是五種求佛不可得故，當知無佛；佛無故無來無去</strong>」。這正是視覺化論文中以五角矩陣呈現的核心結構。</p>
</div>
</div>
</section>
<section class=&quot;chapter&quot; id=&quot;chapter-4&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第二品 · 第四章</div>
<h2 class=&quot;ch-name&quot;>五求辯證</h2>
<p class=&quot;ch-sub&quot;>求佛不可得 · 即離內外有的地毯搜索</p>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;>
<div class=&quot;bridge-label&quot;>本章要旨</div>
<p>本章是整品論釋辯證的核心高潮。論主以五個邏輯方位──<strong>即、異、在內、在外、所有</strong>──對「佛在五眾之何處」進行徹底的地毯式搜索。前章已完成「即」「離（異）」兩位的論證，本章繼續處理「在內（五眾在佛中）」「在外（佛在五眾中）」「所有（佛有五眾）」三位，最終宣告「<strong>如是五種求佛不可得故，當知無佛；佛無故無來無去</strong>」。視覺化論文將此節呈現為佛身的五重檢驗矩陣──任何一格都不能成立佛的實體存在。</p>
</div>
<h2>第一節　五求法總覽 · 即異內外有</h2>
<p>「五求法」是中觀辯證的標準操作手法──以窮舉的方式檢驗一個假設實體與其組成元素之間的可能關係。佛若有自性、若真實存在，必落在以下五種關係之一；若五種關係皆不可立，則佛之自性必不可得。</p>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 五求法地毯式搜索</h3>
<div class=&quot;insight-content&quot;>
<p>從五個幾何與邏輯方位進行地毯式搜索，證明<strong>整體（佛／拳）</strong>在<strong>部分（五眾／五指）</strong>中毫無實體立足點：</p>
<div class=&quot;five-grid&quot;>
<div class=&quot;cell&quot;>
<div class=&quot;num&quot;>1</div>
<div class=&quot;term&quot;>即（Identity）</div>
<div class=&quot;desc&quot;>五眾即是佛？<br/>已破：一與五矛盾。</div>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;num&quot;>2</div>
<div class=&quot;term&quot;>異（Difference）</div>
<div class=&quot;desc&quot;>離五眾有佛？<br/>已破：離五眾無餘法可說。</div>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;num&quot;>3</div>
<div class=&quot;term&quot;>在內（Containment-In）</div>
<div class=&quot;desc&quot;>五眾在佛中？<br/>本章將破。</div>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;num&quot;>4</div>
<div class=&quot;term&quot;>在外（Containment-Out）</div>
<div class=&quot;desc&quot;>佛在五眾中？<br/>本章將破。</div>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;num&quot;>5</div>
<div class=&quot;term&quot;>所有（Possession）</div>
<div class=&quot;desc&quot;>佛擁有五眾？<br/>本章將破。</div>
</div>
</div>
</div>
</div>
<h2>第二節　即與離 · 不即不離菩提</h2>
<p>第三章已完成「即」與「離」的論證。論主在此處再以拳指譬喻收束，使「即」「離」二位成為後續三位的支點。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論主收束 · 不即不離</span>
<p>離是五眾亦無佛。所以者何？離是五眾，更無餘法可說；<strong>如離五指更無拳法可說</strong>。</p>
</div>
<div class=&quot;qa no-prefix&quot;>
<p class=&quot;q&quot;><strong>問曰：</strong>何以故無拳法？形亦異，力用亦異；若但是指者，不應異。因五指合故拳法生，是拳法雖無常生滅，不得言無。</p>
<p class=&quot;a&quot;><strong>答曰：</strong>是拳法若定有，除五指應更有拳可見，亦不須因五指。</p>
<p class=&quot;a&quot;>如是等因緣，<strong>離五指更無有拳；佛亦如是，離五眾則無有佛</strong>。</p>
</div>
<h2>第三節　在內與在外 · 空間關係解構</h2>
<p>對手既不能用「即」也不能用「離」立佛，只能改打空間關係牌：佛或許是「在」五眾「之中」？反之，五眾是否「在」佛「之中」？論主以「<strong>異不可得故</strong>」一刀斬斷──若兩物之間連「異」這個前提都不可得，那麼「誰在誰裡面」的空間包容關係根本無從成立。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論主破之 · 內外不立</span>
<p>佛不在五眾中，五眾不在佛中。何以故？異不可得故。若五眾異佛者，佛應在五眾中，但是事不然。</p>
</div>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 在內與在外</h3>
<div class=&quot;insight-content&quot;>
<div class=&quot;refutation-grid&quot;>
<div class=&quot;ref-cell&quot;>
<h5>含 內？──五眾在佛中？</h5>
<p>兩者無法被分說兩個獨立的客體（異不可得故），因此無法成立「誰在誰裡面」的空間包容關係。</p>
</div>
<div class=&quot;ref-cell&quot;>
<h5>含 外？──佛在五眾中？</h5>
<p>同理，若無法確立「佛」與「五眾」是兩個獨立可分的存在，則任何容器／內容物的隱喻皆不成立。</p>
</div>
</div>
<p>論文指出：空間包容是預設了<strong>兩個獨立、彼此有別的實體</strong>。中觀的雙刃在於──既不允許「即」（合一），也不允許「異」（分立）；既不合也不分的存在，根本不能用「在內」「在外」這種空間術語來描述。</p>
</div>
</div>
<h2>第四節　所有權 · 不得言佛有五眾</h2>
<p>對手最後一招──主張佛「擁有」五眾，如同比丘擁有三衣鉢。論主立刻指出這個比喻的破口：擁有關係要求兩個獨立的實體（持有者與被持有物），而前面已論證佛與五眾不得別異，因此「擁有」也無從成立。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論主破之 · 所有權不立</span>
<p>佛亦不在五眾。所以者何？離五眾無佛，離佛亦無五眾。<strong>譬如比丘有三衣鉢故，可得言有；但佛與五眾不得別異，是故不得言佛有五眾。</strong></p>
</div>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 所有權之解構</h3>
<div class=&quot;insight-content&quot;>
<div class=&quot;two-col&quot;>
<div class=&quot;grid-cell&quot;>
<h5>譬如比丘有三衣鉢</h5>
<p>比丘 ≠ 衣鉢（兩個獨立實體）<br/>→ 可成立「擁有」關係。</p>
</div>
<div class=&quot;grid-cell&quot;>
<h5>佛與五眾</h5>
<p>佛與五眾不得別異（不異）<br/>→ 不能成立「擁有」關係。</p>
</div>
</div>
<p>論文核心命題：<strong>沒有一個獨立的「佛」作為主人，來擁有這些身體零件。</strong>「擁有」要求 distinct entities；中觀指出佛與五眾既非一亦非異，故「所有」一位亦立不起。</p>
</div>
</div>
<h2>第五節　五求皆不可得結論 · 當知無佛</h2>
<p>五位推求皆不可得──即不可得、異不可得、在內不可得、在外不可得、所有不可得。論主終於做出最決絕的結論：<strong>如是五種求佛不可得故，當知無佛；佛無故無來無去。</strong></p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>五求結論 · 無佛故無來無去</span>
<p>如是五種求佛不可得故，當知無佛；佛無故無來無去。</p>
</div>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 佛身檢驗結論矩陣</h3>
<div class=&quot;insight-content&quot;>
<div class=&quot;five-grid&quot;>
<div class=&quot;cell&quot;>
<div class=&quot;num&quot;>✘</div>
<div class=&quot;term&quot;>即</div>
<div class=&quot;desc&quot;>五指即拳？<br/>五眾即佛？<br/><strong>不立</strong></div>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;num&quot;>✘</div>
<div class=&quot;term&quot;>異</div>
<div class=&quot;desc&quot;>離五指有拳？<br/>離五眾有佛？<br/><strong>不立</strong></div>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;num&quot;>✘</div>
<div class=&quot;term&quot;>在內</div>
<div class=&quot;desc&quot;>五指在拳中？<br/>五眾在佛中？<br/><strong>不立</strong></div>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;num&quot;>✘</div>
<div class=&quot;term&quot;>在外</div>
<div class=&quot;desc&quot;>拳在五指中？<br/>佛在五眾中？<br/><strong>不立</strong></div>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;num&quot;>✘</div>
<div class=&quot;term&quot;>所有</div>
<div class=&quot;desc&quot;>拳有五指？<br/>佛有五眾？<br/><strong>不立</strong></div>
</div>
</div>
<p>五格皆 ✘ → 整體（佛／拳）在部分（五眾／五指）中無實體立足點 → <strong>佛之自性不可得 → 佛無 → 無來無去</strong>。</p>
</div>
</div>
<div class=&quot;conclusion&quot;>
<h5>第四章收束</h5>
<p>五求辯證是中觀辯證的最高體現。它的高明處不在於「破有」，而在於用「<strong>窮舉式的窮盡</strong>」讓對手的所有立宗都無處可逃。一旦五個方位都被檢驗為不可得，「<strong>佛有自性</strong>」這個命題就再也找不到任何邏輯立足點。但邏輯的徹底破之，立刻帶來下一個危機──「無佛」是否就是「斷滅見」？菩薩發心求作佛是否頓時失去意義？</p>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<div class=&quot;bridge-label&quot;>承先啟後</div>
<p>五求辯證的終點是「<strong>當知無佛</strong>」。但「無佛」二字一旦被誤解為斷滅、虛無、否定一切修行依憑，就會把整個般若殿堂連根拔起。下一章將處理這一危機之問──「<strong>若無佛即邪見，云何菩薩發心求作佛？</strong>」論主將祭出中觀心法：「無佛」是破實有想之藥，不是反向取著無佛之斷滅；離有無二邊，處中道，即是諸法實相。</p>
</div>
</div>
</section>
<section class=&quot;chapter&quot; id=&quot;chapter-5&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第二品 · 第五章</div>
<h2 class=&quot;ch-name&quot;>危機與中道</h2>
<p class=&quot;ch-sub&quot;>邪見之問 · 治病執藥 · 離有無二邊</p>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;>
<div class=&quot;bridge-label&quot;>本章要旨</div>
<p>第四章「五求不可得故當知無佛」是整品論辯的高點，也是最大的危機點。若「無佛」被當成另一個實體立宗，整套般若修道立刻塌陷成虛無主義。本章論主以三重心法化解危機：（一）<strong>「無佛」是治病之藥，不是反向取著的成果</strong>；（二）<strong>離有無二邊</strong>，破除戲論與分別；（三）<strong>處中道即是諸法實相，得是實相即是得佛</strong>。本章亦是龍樹中觀辯證學最關鍵的「藥與毒」之教──執藥比執病更深。</p>
</div>
<h2>第一節　邪見之問 · 無佛則菩薩何發心</h2>
<p>對手在五求辯證後絕望地抛出最後一個問題：<strong>若無佛即是邪見，云何菩薩發心求作佛？</strong>這個問題的力量不在於辯論技巧，而在於它直擊整個大乘修道的存在意義──若終究無佛，那無量阿僧祇劫菩薩道的奉獻、捨身、累積資糧，豈不全是空轉？</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>對手反問 · 危機之問</span>
<p><strong>問曰：</strong>若無佛，即是邪見，云何菩薩發心求作佛？</p>
</div>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 邏輯的危機</h3>
<div class=&quot;insight-content&quot;>
<p>論文呈現此節為「<strong>墜入斷滅見的恐懼</strong>」──如果我們在理智上承認「<strong>佛無</strong>」，這是否摧毀了佛教修行與慈悲的全部基礎？</p>
<div class=&quot;flow flow-v&quot;>
<div class=&quot;flow-box&quot;>執著「實有佛」<small>──走向「常見」（常邊）</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;>破斥「實有佛」<small>──若反向取著「無佛」</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>墜入「斷滅見」</strong><small>──比常見更糟，因為失去修行依憑</small></div>
</div>
</div>
</div>
<h2>第二節　治病與執藥 · 「無佛」是破有想之藥</h2>
<p>論主以最精煉的方式回應──「<strong>無佛」是破執有佛想的藥；藥到病除後，絕不能反向對「無佛」生取著</strong>。這正是中觀辯證學的根本心法：所有否定式的命題都是「治病」工具，不是「結論」。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論主開示 · 藥不是結論</span>
<p><strong>答曰：</strong>此中言「無佛」，<strong>破著佛想，不言「取無佛想」</strong>。若有佛尚不令取，何況取無佛邪見！</p>
</div>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 中觀的否定方法說</h3>
<div class=&quot;insight-content&quot;>
<div class=&quot;spectrum&quot;>
<div class=&quot;sp-node&quot;>
<h5>執著「有」</h5>
<p>常見邊<br/><small>把佛當實體</small></p>
</div>
<div class=&quot;sp-node sp-mid&quot;>
<h5>中道（Middle Way）</h5>
<p>離有無二邊<br/><small>戲論寂滅，無所取</small></p>
</div>
<div class=&quot;sp-node&quot;>
<h5>執著「無」</h5>
<p>斷見邊<br/><small>取「無佛」為實</small></p>
</div>
</div>
<p>論文以三句心法總結：</p>
<ul style=&quot;font-size:19px;line-height:2;padding-left:24px;margin:14px 0;&quot;>
<li>「<strong>無佛</strong>」是一帖用來打破實有妄想的藥。</li>
<li>病好了（妄想破了），<strong>絕不能反過來對「無」產生執著</strong>。</li>
<li><strong>執著「無佛」比執著「有佛」墮落更深</strong>。</li>
</ul>
</div>
</div>
<h2>第三節　離有無二邊 · 處中道即諸法實相</h2>
<p>論主從「治病執藥」進一步推到中觀立教的最高位──佛是離有無二邊、處中道的諸法實相。所謂「得佛」，並非得到一個實體之佛，而是<strong>於諸法實相中無分別、無戲論、無所取</strong>。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論主收束 · 處中道即得佛</span>
<p>又佛常寂滅、無戲論相；若人分別、戲論常寂滅事，是人亦墮邪見。<strong>離是有、無二邊，處中道，即是諸法實相。諸法實相即是佛。</strong>何以故？得是諸法實相，名為得佛。</p>
</div>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 處中道即得佛</h3>
<div class=&quot;insight-content&quot;>
<p>論文以三句核心箴言鎖定本章心法：</p>
<div class=&quot;flow flow-v&quot;>
<div class=&quot;flow-box&quot;><strong>佛不是神格化的實體，也不是斷滅的虛無。</strong></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>離開了「有」與「無」的雙重二元對立。</strong></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>安住於無分別的實相中，得是實相，即名為得佛。</strong></div>
</div>
</div>
</div>
<div class=&quot;conclusion&quot;>
<h5>第五章收束</h5>
<p>五求破實有，是<strong>第一刀</strong>；中道破斷滅，是<strong>第二刀</strong>。兩刀並行，方是般若。本章將「無佛」從可能的斷見深淵中救回，轉化為通往諸法實相的<strong>方便藥</strong>。讀者至此應已明白：論主並非否定佛的存在意義，而是在更深的層次上指認──佛即諸法實相，得實相即得佛；而實相無形、無分別、無數法、不可取。下一章將把這套「不可取」推到最終的「<strong>一如</strong>」境界。</p>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<div class=&quot;bridge-label&quot;>承先啟後</div>
<p>本章已完成「<strong>離有無二邊處中道</strong>」的安立。下一章將進入本品最高的「<strong>一如</strong>」境界──色等法如即諸佛如、即虛空性如，是如一無二無三，出諸數法，無所有故。並以〈曇無竭品〉末段「薩陀波崙不惜身命、刺血灑地」之事跡，把這套高峰見地落實為可實踐的修行心法。</p>
</div>
</div>
</section>
<section class=&quot;chapter&quot; id=&quot;chapter-6&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第二品 · 第六章</div>
<h2 class=&quot;ch-name&quot;>一如修心</h2>
<p class=&quot;ch-sub&quot;>出諸數法 · 不惜身命 · 終極心法</p>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;>
<div class=&quot;bridge-label&quot;>本章要旨</div>
<p>本章是整品的終極匯歸。第五章「處中道即得佛」奠定了見地，本章則進一步把見地推到最寬廣的「一如」位──<strong>色等法如即諸佛如、即虛空性如，是如一無二無三，出諸數法，無所有故</strong>。並透過〈曇無竭品〉末段薩陀波崙菩薩「不惜身命、刺血灑地」的事跡，把「畢竟空」的見地落實為「無所執著地奉獻一切」的修行心法──這正是論文最後幾頁所強調的：徹底了知諸佛及法無來無去，才能無所執著地奉獻一切。</p>
</div>
<h2>第一節　一如等式 · 色等法如即佛如</h2>
<p>論主在本節將前五章所有辯證的果實，匯歸為一個極簡的等式──<strong>色如 ＝ 佛如 ＝ 虛空性如</strong>，是如一無二無三。「如」這個字本身已不再指特定主體，而是「諸法本然之相」的代稱。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論主匯歸 · 一如無別</span>
<p>復次，<strong>色等法如相即是佛，色等法性空是如相，諸佛如亦性空</strong>；以是故，不來不去。不生、不滅、法性、實際、空、無染、寂滅、虛空性亦如無來無去。<strong>如，乃至虛空性如、佛如，是如一，無二、無三等別異。</strong></p>
</div>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 終極等式 · 一如境界</h3>
<div class=&quot;insight-content&quot;>
<div class=&quot;flow flow-v&quot;>
<div class=&quot;flow-box&quot;>色等法性空 ──── 物質的本質是「空／如」</div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;>色等法如相 ──── 物質的本然之相即是「如」</div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>色如 ＝ 佛如 ＝ 虛空性如 ＝ 是如一無二無三</strong></div>
</div>
<p>論文指出：這正是「畢竟空 ＝ 不來不去」的最寬廣面貌──不僅佛無來無去，色、受、想、行、識、虛空性、實際、法性，<strong>一切法皆無來無去</strong>。一如境界把整品從「佛身辯證」拓展為「諸法平等」。</p>
</div>
</div>
<h2>第二節　出諸數法 · 斬斷戲論</h2>
<p>論主以最後一道工序收束辯證──「<strong>出諸數法，無所有故</strong>」。「數法」即可被概念化、可被計數、可被名言所收攝的法。一切名言、計數、戲論，皆是憶想分別所構造；既出諸數法，則無所有，無所有故無所取。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論主收束 · 出諸數法</span>
<p>此中自說因緣：「何以故？出諸數法，無所有故。」</p>
<p>如等法是實，是中無有憶想分別。取相故有名字，名字中有數。</p>
<p>此中自說因緣：「空、非實，無所有故。」</p>
</div>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 斬斷戲論</h3>
<div class=&quot;insight-content&quot;>
<p>論文以三層解析呈現「<strong>取相 → 名字 → 數 → 戲論</strong>」的鏈條：</p>
<div class=&quot;domino-chain&quot;>
<span class=&quot;domino&quot;>取相</span><span class=&quot;chain-arrow&quot;>→</span>
<span class=&quot;domino&quot;>名字</span><span class=&quot;chain-arrow&quot;>→</span>
<span class=&quot;domino&quot;>數</span><span class=&quot;chain-arrow&quot;>→</span>
<span class=&quot;domino&quot;>戲論／實體化</span>
</div>
<div class=&quot;domino-chain&quot;>
<span class=&quot;domino&quot;>出諸數法</span><span class=&quot;chain-arrow&quot;>→</span>
<span class=&quot;domino&quot;>無所有</span><span class=&quot;chain-arrow&quot;>→</span>
<span class=&quot;domino&quot;>寂滅相</span><span class=&quot;chain-arrow&quot;>→</span>
<span class=&quot;domino&quot;>解構（Deconstruction）</span>
</div>
<p>「<strong>如等法是實，是中無有憶想分別</strong>」──實相中沒有「憶想分別」，是因為一切「取相」操作本身就已脫離實相。「如」之所以是「如」，正在於它不被概念化、不被命名、不被計數。</p>
</div>
</div>
<h2>第三節　不惜身命 · 薩陀波崙刺血灑地</h2>
<p>本品論釋的見地至此已完備。但見地若無實踐相應，仍只是言說。曇無竭品末段以薩陀波崙菩薩的事跡作為見地的人間落實──當他為大師敷座灑地而水不可得時（魔王隱蔽），他毫不猶豫地以利刀自刺，<strong>以血灑地</strong>，並如是念：「我何用此身！此身必當破壞。我從無始生死已來數數喪身，未曾為法。」</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經文 · 薩陀波崙刺血灑地</span>
<p>「薩陀波崙菩薩敷座已，求水灑地而不能得。所以者何？惡魔隱蔽，令水不現。魔作是念：『薩陀波崙菩薩求水不得，於阿耨多羅三藐三菩提行乃至生一念劣心、異心，則善根不增、智慧不照，於一切智而有稽留。』</p>
<p>爾時，薩陀波崙菩薩作是念：『<strong>我當自刺其身，以血灑地，令無塵土來坋大師。我何用此身！此身必當破壞。我從無始生死已來數數喪身，未曾為法。</strong>』即以利刀自刺，出血灑地。薩陀波崙菩薩及長者女并五百侍女皆無異心，惡魔亦不能得便。」</p>
</div>
<div class=&quot;insight&quot;>
<h3 class=&quot;insight-title&quot;>論文視覺解析 · 為什麼「畢竟空」不會導致消極？</h3>
<div class=&quot;insight-content&quot;>
<p>論文於此處設下一個關鍵自問：<strong>為什麼「畢竟空」不會導致消極？</strong></p>
<div class=&quot;conclusion&quot;>
<h5>論文回答</h5>
<p>解答：徹底了知「<strong>諸佛及法無來無去</strong>」，才能無所執著地奉獻一切。</p>
<p>薩陀波崙的刺血灑地，正是「五求佛不可得」「無佛即真實見佛」見地的人間印證──<strong>不執身為實有，故能無所惜；不執佛為實有，故能盡此身命供養。</strong></p>
</div>
<p>釋提桓因讚言：「<strong>未曾有也！薩陀波崙菩薩愛法乃爾，以刀自刺出血灑地！薩陀波崙及眾女人心不動轉，惡魔波旬不能壞其善根。其心堅固，發大莊嚴，不惜身命，以深心欲求阿耨多羅三藐三菩提，當度一切眾生無量生死苦。</strong>」</p>
</div>
</div>
<h2>第四節　終極心法 · 離即是如，不執實有亦不墮斷滅</h2>
<p>本品最終心法可凝鍊為一句──「<strong>離即是如</strong>」。離開「有佛實體」之見，離開「無佛斷滅」之執，安住於五求不可得的「無所得」心中，<strong>即是親見諸佛法身</strong>。這正是論文末頁所給出的修道立場：</p>
<div class=&quot;conclusion&quot;>
<h5>終極心法 · 三層收束</h5>
<p><strong>不著於「實有佛」之見，亦不墮於「無佛」之斷滅。</strong></p>
<p><strong>安住於五求不可得之「無所得」心中，即是親見諸佛法身。</strong></p>
<p><strong>離即是如──離戲論、離分別、離取相，即是諸法本然之「如」。</strong></p>
</div>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經文 · 七歲精進 · 法座成就</span>
<p>「爾時，曇無竭菩薩七歲一心入無量阿僧祇菩薩三昧，及行般若波羅蜜、方便力。<strong>薩陀波崙菩薩七歲經行、住立，不坐、不臥，無有睡眠，無欲、恚、惱，心不著味</strong>；但念：『曇無竭菩薩摩訶薩何時當從三昧起，出而說法？』」</p>
<p>「爾時，曇無竭菩薩摩訶薩過七歲已，從諸三昧起，為說般若波羅蜜故，與無量百千萬眾恭敬圍遶，往法座上坐。薩陀波崙菩薩摩訶薩見曇無竭菩薩摩訶薩時，<strong>心淨悅樂，譬如比丘入第三禪</strong>。」</p>
</div>
<div class=&quot;conclusion&quot;>
<h5>第六章收束 · 本品整體匯歸</h5>
<p>從第一章「<strong>諸佛無所從來，去亦無所至</strong>」的開卷大哉問，到第六章「<strong>離即是如、不執實有亦不墮斷滅</strong>」的終極心法，整品論釋以「五求辯證」為核心引擎，串連起：</p>
<p><strong>緣起破之</strong>（聲喻、大海諸寶喻）→ <strong>二諦立教</strong>（世諦／第一義諦）→ <strong>邏輯辯證</strong>（一與五、泛特、菩薩亦有、一切種智）→ <strong>五求地毯式搜索</strong>（即／異／在內／在外／所有）→ <strong>中道破斷</strong>（無佛是藥不是結論、離有無二邊）→ <strong>一如匯歸</strong>（色如＝佛如＝虛空性如、出諸數法）→ <strong>不惜身命</strong>（薩陀波崙刺血灑地、七歲精進）。</p>
<p>這套辯證不是純理論的邏輯遊戲，而是「<strong>見地 → 心法 → 修行</strong>」三層一體的般若藍圖：見地處中道，心法不取著，修行不惜身命。三者圓滿，即是論主所說「<strong>諸法實相即是佛</strong>」的真實內涵。</p>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<div class=&quot;bridge-label&quot;>文獻與法理溯源</div>
<p>本品所闡論之中道辯證，最終可上溯至《中論》〈觀四諦品〉之根本偈：「<strong>眾因緣所生法，我說即是空，亦為是假名，亦是中道義。</strong>」此偈即是「緣起 → 假名 → 中道 → 空」四相一體的法理基石。</p>
<p>經證：《大智度論》卷九十九〈釋曇無竭品第八十九〉· 譯者：後秦三藏鳩摩羅什 · 造論：龍樹菩薩。</p>
<p>視覺化論文：《般若藍圖：空性構造 · 法理建構與五求辯證》全 30 頁 · 7 大模塊（開卷大哉問 → 緣起模型 → 二諦中道 → 邏輯辯證 → 五求地毯 → 中道破斷 → 一如修心）。</p>
</div>
</div>

.hero-range{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:17px;color:#b8a87b;letter-spacing:2px;margin-top:18px;}
.hero-skt{display:block;font-style:italic;color:#b8a87b;font-size:15px;margin-top:8px;letter-spacing:1px;}
.preface{max-width:920px;margin:0 auto;padding:54px 30px 14px;}
.preface h2{font-family:&quot;Noto Serif TC&quot;,serif;font-size:30px;color:var(--accent);text-align:center;margin:0 0 24px;letter-spacing:4px;}
.preface p{font-size:19px;line-height:2.1;color:var(--text);margin:0 0 14px;text-align:justify;text-indent:2em;}
.preface .preface-quote{background:var(--verseBg);border-left:4px solid var(--verseBd);padding:14px 22px;margin:18px 0;font-style:normal;color:var(--text2);text-indent:0;}
.toc-section{max-width:1100px;margin:30px auto 50px;padding:30px;}
.toc-title{font-family:&quot;Noto Serif TC&quot;,serif;font-size:34px;color:var(--accent);text-align:center;letter-spacing:8px;margin:0 0 10px;}
.toc-desc{text-align:center;color:var(--text-muted);font-size:17px;margin:0 0 30px;letter-spacing:2px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;}
.toc-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s,border-color .2s;cursor:pointer;}
.toc-card:hover{transform:translateY(-3px);box-shadow:0 6px 22px rgba(91,58,41,.15);border-color:var(--gold);}
.toc-num{flex:0 0 36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;display:flex;align-items:center;justify-content:center;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:17px;font-weight:700;}
.toc-name{flex:1;font-size:19.5px;line-height:1.7;font-weight:600;color:var(--text);}
.toc-name small{display:block;font-size:14.5px;font-weight:400;color:var(--text-muted);margin-top:4px;}
section.chapter{max-width:1100px;margin:36px auto 24px;padding:0 30px;scroll-margin-top:12px;}
.ch-head{background:var(--headGrad);color:#fff;border-radius:12px 12px 0 0;padding:46px 30px 36px;text-align:center;position:relative;overflow:hidden;}
.ch-head::after{content:&quot;&quot;;position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:100px;height:2px;background:linear-gradient(to right,transparent,var(--gold),transparent);}
.ch-num{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:18px;letter-spacing:5px;color:var(--goldL);opacity:.85;margin-bottom:10px;}
.ch-name{font-size:34px;font-weight:900;letter-spacing:3px;margin:6px 0 8px;color:#fffdf7;}
.ch-sub{font-size:17px;color:#d4c4a8;letter-spacing:2px;font-weight:400;margin-top:8px;font-family:&quot;Noto Sans TC&quot;,sans-serif;}
.ch-body{background:#fffdf7;border:1px solid var(--border);border-top:0;border-radius:0 0 12px 12px;padding:38px 50px;max-width:980px;margin:0 auto;}
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);border:1px solid var(--border);border-left:5px solid var(--gold);border-radius:10px;padding:18px 24px;margin:0 0 26px;box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);background:linear-gradient(135deg,#fdf8e8,#f2e6c8);margin-top:36px;margin-bottom:0;}
.bridge-label{display:inline-block;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:12.5px;background:var(--gold);color:#fff;padding:3px 12px;border-radius:12px;letter-spacing:2.2px;margin-bottom:10px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0 0 8px;color:var(--text2);line-height:2.1;font-size:18.5px;}
.bridge p:last-child{margin-bottom:0;}
h2{font-family:&quot;Noto Serif TC&quot;,serif;font-size:30px;color:var(--accent);border-left:4px solid var(--gold);padding:10px 0 10px 20px;background:linear-gradient(to right,rgba(184,134,11,.08),transparent);margin:32px 0 14px;letter-spacing:3px;}
h3{font-size:23.5px;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:8px;margin:24px 0 10px;letter-spacing:2px;}
h4{font-size:20px;color:var(--accent-red);margin:18px 0 8px;letter-spacing:1.5px;}
h5{font-size:18.5px;color:var(--gold);margin:14px 0 8px;font-weight:700;}
p{margin:0 0 12px;font-size:20px;line-height:1.9;color:var(--text);text-align:justify;}
.classical-text{background:#FFFDF5;border:1px solid #E8E0D0;border-radius:10px;padding:18px 24px;margin:16px 0;line-height:1.95;}
.classical-text .text-label{display:inline-block;background:var(--primary);color:#fff;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:13.5px;padding:3px 12px;border-radius:4px;letter-spacing:3px;margin-bottom:10px;}
.classical-text p{margin:8px 0;font-size:20px;line-height:1.95;color:var(--text);text-indent:2em;}
.classical-text p:first-of-type{text-indent:0;}
.qa{background:#fdf8ed;border:1px solid var(--border);border-radius:8px;margin:18px 0;padding:0;overflow:hidden;}
.qa-q{background:linear-gradient(to right,rgba(74,116,162,.18),rgba(74,116,162,.04));border-left:4px solid #4a74a2;padding:14px 22px;font-size:20px;line-height:1.9;color:#3a4d68;}
.qa-q strong{color:#234670;font-weight:700;letter-spacing:2px;margin-right:6px;}
.qa-a{padding:16px 22px;color:var(--text);}
.qa-a strong{color:var(--accent-red);font-weight:700;letter-spacing:2px;margin-right:6px;}
.qa-a p{margin:0 0 10px;font-size:20px;line-height:1.9;text-indent:2em;}
.qa-a p:first-child{text-indent:0;}
.qa-a p:last-child{margin-bottom:0;}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 22px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.card-title{font-size:21.5px;color:var(--accent);font-weight:700;margin:0 0 8px;letter-spacing:1.5px;}
.card p{font-size:20px;line-height:1.9;}
.card strong{color:var(--accent-red);}
.insight{background:linear-gradient(135deg,#fff8e7,#fdf2cf);border:1px solid var(--gold);border-left:5px solid var(--gold);border-radius:8px;padding:16px 22px;margin:18px 0;}
.insight-title{display:inline-block;background:var(--gold);color:#fff;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:13px;padding:3px 12px;border-radius:12px;letter-spacing:2px;margin-bottom:10px;}
.insight p{font-size:20px;line-height:1.95;margin:0 0 8px;}
.insight p:last-child{margin-bottom:0;}
.insight strong{color:var(--accent-red);}
.verse{background:var(--verseBg);border-left:4px solid var(--verseBd);padding:14px 22px;margin:16px 0;line-height:2.2;font-size:22px;color:var(--text);text-align:center;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0;}
.col-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 20px;}
.col-card .col-title{font-size:19.5px;color:var(--accent);font-weight:700;margin:0 0 8px;letter-spacing:1.5px;}
.col-card p{font-size:18.5px;line-height:1.85;margin:0 0 6px;}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0;}
.four-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0;}
.four-grid .cell{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 18px;font-size:19px;line-height:1.8;}
.four-grid .cell h5{margin:0 0 6px;font-size:18.5px;color:var(--gold);letter-spacing:1.5px;}
.spectrum{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin:20px 0;}
.spectrum .sp-node{padding:14px 16px;border-radius:8px;text-align:center;line-height:1.6;font-size:15.5px;}
.sp-left{background:linear-gradient(135deg,#fceae6,#f7d4cc);border:1px solid #c87060;color:#7a2a1a;}
.sp-right{background:linear-gradient(135deg,#e8eef9,#cdd9ee);border:1px solid #5879af;color:#2a3a62;}
.sp-mid{background:linear-gradient(135deg,var(--gold),var(--goldL));border:1px solid var(--gold);}
.sp-mid,.sp-mid *{color:#fff!important;}
.sp-mid h5{color:#fff!important;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.35);}
.sp-mid small{color:rgba(255,255,255,.92)!important;font-size:14px;}
.sp-mid p{font-size:15.5px;color:#fff;margin:0;}
.flow{display:flex;flex-direction:column;gap:8px;margin:18px 0;align-items:stretch;}
.flow-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 18px;font-size:17.5px;text-align:center;line-height:1.7;}
.flow-box small{display:block;font-size:14px;color:var(--text-muted);margin-top:4px;}
.flow-arrow{text-align:center;font-size:22px;color:var(--gold);font-weight:700;}
.flow-h{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;}
.flow-h .flow-box{flex:1 1 180px;min-width:180px;max-width:360px;}
.flow-h .flow-arrow{flex:0 0 auto;padding:0 6px;}
.triangle-diagram{position:relative;width:100%;max-width:680px;margin:30px auto;}
.triangle-diagram .tri-row{display:flex;justify-content:center;gap:18px;margin-bottom:14px;flex-wrap:wrap;}
.triangle-diagram .tri-node{background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:14px 18px;flex:1 1 200px;max-width:280px;text-align:center;font-size:17px;line-height:1.7;}
.triangle-diagram .tri-node h5{margin:0 0 6px;font-size:18px;color:var(--gold);letter-spacing:1.5px;}
.triangle-diagram .tri-node small{display:block;color:var(--text-muted);font-size:14px;}
.triangle-diagram .tri-conclusion{background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;border-radius:10px;padding:14px 20px;text-align:center;font-size:17px;letter-spacing:1.5px;margin-top:14px;}
.venn-wrap{display:flex;justify-content:center;align-items:center;min-height:260px;margin:30px auto;gap:0;flex-wrap:wrap;}
.venn-circle{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:240px;height:240px;border-radius:50%;border:2px solid var(--gold);background:rgba(184,134,11,.08);padding:0;box-sizing:border-box;font-size:15.5px;text-align:center;line-height:1.55;color:var(--text);}
.venn-circle .venn-inner{max-width:140px;display:flex;flex-direction:column;align-items:center;gap:6px;}
.venn-circle strong{font-size:16px;color:var(--accent-red);letter-spacing:1px;display:block;}
.venn-circle small{font-size:12.5px;display:block;width:100%;text-align:center;line-height:1.45;color:var(--text-muted);}
.venn-a{margin-right:-32px;background:rgba(184,134,11,.10);}
.venn-a .venn-inner{transform:translateX(-26px);}
.venn-b{margin-left:-32px;margin-right:-32px;background:rgba(140,90,40,.12);z-index:1;}
.venn-c{margin-left:-32px;background:rgba(91,58,41,.12);}
.venn-c .venn-inner{transform:translateX(26px);}
.infinity-loop{margin:24px auto;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.infinity-loop .loop-node{width:100%;background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:14px 18px;text-align:center;font-size:17.5px;line-height:1.7;}
.infinity-loop .loop-center{background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;}
.infinity-loop .loop-center *{color:#fff!important;}
.infinity-loop .loop-arrow{font-size:24px;color:var(--gold);}
.iceberg{position:relative;background:linear-gradient(180deg,rgba(74,116,162,.06) 0%,rgba(74,116,162,.06) 40%,rgba(74,116,162,.16) 40.1%,rgba(91,58,41,.18) 100%);border:1px solid var(--border);border-radius:12px;padding:24px;margin:24px 0;}
.iceberg-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:flex-start;}
.iceberg-below{padding-top:30px;}
.iceberg-card{background:var(--card);border:1px solid var(--gold);border-radius:8px;padding:14px 18px;}
.iceberg-card h5{margin:0 0 8px;color:var(--gold);font-size:18px;letter-spacing:1.5px;}
.iceberg-card p{margin:4px 0;font-size:17px;line-height:1.7;}
.iceberg-line{grid-column:span 2;margin:14px -6px;border:0;border-top:2px dashed rgba(74,116,162,.6);position:relative;}
.iceberg-line::before{content:&quot;Water Level （二諦分界）&quot;;position:absolute;right:0;top:-13px;background:#fff;color:#4a74a2;padding:0 10px;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:13px;letter-spacing:2px;}
.macro-map{margin:24px 0;border:1px solid var(--border);border-radius:12px;background:linear-gradient(135deg,#1e1610,#2a1f15);color:#f5ecd8;padding:30px 24px;}
.macro-map h4{color:var(--goldL);text-align:center;margin:0 0 18px;font-size:20px;letter-spacing:3px;}
.macro-quad{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.macro-quad .quad-node{background:rgba(184,134,11,.10);border:1px solid rgba(184,134,11,.45);border-radius:10px;padding:14px 18px;font-size:17px;line-height:1.7;color:#f5ecd8;}
.macro-quad .quad-node h5{margin:0 0 8px;color:var(--goldL);font-size:18.5px;letter-spacing:2px;}
.macro-quad .quad-node p{color:#f5ecd8!important;font-size:17px;line-height:1.85;margin:0;text-align:left;}
.macro-quad .quad-node strong{color:#fff8e7!important;}
.macro-map h4{color:var(--goldL)!important;}
.macro-center{margin:14px auto 0;max-width:380px;background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;text-align:center;padding:14px 18px;border-radius:10px;font-size:18px;letter-spacing:3px;font-weight:700;}
.four-pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0;}
.pillar{background:var(--card);border:1px solid var(--gold);border-top:4px solid var(--gold);border-radius:8px;padding:18px 14px;text-align:center;font-size:17px;line-height:1.7;}
.pillar h5{margin:0 0 8px;color:var(--accent);font-size:18px;letter-spacing:2px;}
.pillar small{display:block;color:var(--text-muted);font-size:13.5px;margin-top:6px;}
.three-stage{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0;}
.three-stage .stage{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;line-height:1.8;font-size:17.5px;position:relative;}
.three-stage .stage h5{margin:0 0 6px;color:var(--gold);font-size:18.5px;letter-spacing:1.5px;}
.three-stage .stage-num{position:absolute;top:-14px;left:14px;background:var(--gold);color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:&quot;Noto Sans TC&quot;,sans-serif;}
#backTop{position:fixed;right:24px;bottom:80px;width:44px;height:44px;border-radius:50%;background:rgba(30,26,20,.92);color:var(--gold);border:1px solid rgba(184,134,11,.6);font-size:22px;cursor:pointer;display:none;z-index:120;box-shadow:0 4px 18px rgba(0,0,0,.3);align-items:center;justify-content:center;}
#backTop:hover{background:rgba(184,134,11,.85);color:#fff;}
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;background:rgba(30,26,20,.92);color:var(--gold);padding:9px 24px;border-radius:30px;border:1px solid rgba(184,134,11,.5);box-shadow:0 4px 18px rgba(0,0,0,.25);font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:14px;letter-spacing:2px;display:flex;align-items:center;gap:12px;pointer-events:none;user-select:none;backdrop-filter:blur(6px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s;}
.read-progress .rp-pct{font-size:13px;font-weight:600;min-width:38px;text-align:right;}
.read-progress .rp-label{font-size:12px;opacity:.75;letter-spacing:3px;}
.site-footer{background:#1e1610;color:#b8a87b;padding:36px 30px;text-align:center;margin-top:60px;}
.site-footer p{margin:6px 0;font-size:15px;letter-spacing:1.5px;color:#d4c4a8;}
.site-footer .footer-gold{color:var(--goldL);font-weight:600;}
@media (max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);}
  #sbToggle{display:flex;align-items:center;justify-content:center;}
  .main{margin-left:0;}
  .hero-title{font-size:38px;letter-spacing:3px;}
  .hero-subtitle{font-size:17px;}
  .ch-name{font-size:26px;}
  .ch-head{padding:32px 18px 24px;}
  .ch-body{padding:24px 22px;}
  section.chapter{padding:0 14px;}
  body{font-size:18px;}
  p{font-size:18px;}
  .two-col,.three-col,.four-grid,.four-pillars,.three-stage,.macro-quad{grid-template-columns:1fr;}
  .iceberg-row{grid-template-columns:1fr;}
  .iceberg-line{grid-column:auto;}
  .venn-circle{width:160px;height:160px;font-size:14px;}
  .venn-a{margin-right:-30px;}
  .venn-b{margin-left:-30px;margin-right:-30px;}
  .venn-c{margin-left:-30px;}
  .spectrum{grid-template-columns:1fr;}
}

.toc-desc{font-size:17px!important;}
.toc-num{font-size:18px!important;}
.toc-name{font-size:20px!important;line-height:1.7!important;}

.ch-name{font-size:32px!important;}

<div class=&quot;preface&quot;><h2>編 者 前 言</h2><p>本卷《大智度論》第九十九卷第三品，是龍樹菩薩對《大般若波羅蜜經 · 釋曇無竭品第八十九》最具邏輯張力的一段中觀辯證。經文敘事看似平鋪——曇無竭為薩陀波崙說「諸佛無來無去」、釋提桓因送花、長者女以身供養、薩陀波崙刺血灑地——但在這串故事的每一個轉折處，論主都伏下了一條精密的辯證鏈。</p><p>本書把全品邏輯整理為<strong>四道悖論</strong>：本體論的悖論（空中如何見聞）、感應論的悖論（空中如何感應）、倫理的悖論（空中為何拘禮）、布施的悖論（送出為何退還）。每一悖論獨佔一章，章內以「<em>論主問答 → 譬喻解析 → 觀修心法</em>」三步結構展開。讀者依目次次序，可在七章之內完整走完一遍「中觀實相地圖」。</p><div class=&quot;preface-quote&quot;><p style=&quot;text-indent:0;&quot;>「諸法如不動相，諸法如即是佛——若知諸佛及諸法無來無去、無生無滅相，必得阿耨多羅三藐三菩提，亦能行般若波羅蜜及方便力。」</p><p style=&quot;text-indent:0;color:var(--text-muted);font-size:15px;margin-top:8px;&quot;>　　　　　　　　　　　　　　　　　　　　——曇無竭菩薩授記薩陀波崙</p></div></div><div class=&quot;toc-section&quot;><h2 class=&quot;toc-title&quot;>目 次</h2><p class=&quot;toc-desc&quot;>卷九十九 · 第三品 · 全七章</p><div class=&quot;toc-grid&quot;><a class=&quot;toc-card&quot; href=&quot;#chapter-1&quot;><span class=&quot;toc-num&quot;>1</span><span class=&quot;toc-name&quot;>第一章 · 序分 · 寫給專家的邏輯架構<small>Logic Architecture · 四悖論／二諦／二身的入手結構</small></span></a><a class=&quot;toc-card&quot; href=&quot;#chapter-2&quot;><span class=&quot;toc-num&quot;>2</span><span class=&quot;toc-name&quot;>第二章 · 經典原典 · 諸佛無來無去及曇無竭納供<small>Sutra Text · 二十八段經文一次收齊</small></span></a><a class=&quot;toc-card&quot; href=&quot;#chapter-3&quot;><span class=&quot;toc-num&quot;>3</span><span class=&quot;toc-name&quot;>第三章 · 悖論一 · 本體論的辯證<small>Paradox of Ontology · 空中何以見聞苦樂？</small></span></a><a class=&quot;toc-card&quot; href=&quot;#chapter-4&quot;><span class=&quot;toc-num&quot;>4</span><span class=&quot;toc-name&quot;>第四章 · 悖論二 · 感應論的物理學<small>Physics of Resonance · 絕對空性中感應如何發生？</small></span></a><a class=&quot;toc-card&quot; href=&quot;#chapter-5&quot;><span class=&quot;toc-num&quot;>5</span><span class=&quot;toc-name&quot;>第五章 · 悖論三 · 倫理防護罩<small>Ethical Shielding · 空中為何拘泥世俗禮法？</small></span></a><a class=&quot;toc-card&quot; href=&quot;#chapter-6&quot;><span class=&quot;toc-num&quot;>6</span><span class=&quot;toc-name&quot;>第六章 · 悖論四 · 極致布施的辯證<small>Extreme Dāna Pāramitā · 送出的供養為何又被退還？</small></span></a><a class=&quot;toc-card&quot; href=&quot;#chapter-7&quot;><span class=&quot;toc-num&quot;>7</span><span class=&quot;toc-name&quot;>第七章 · 中觀實相地圖 · 從「發心」到「近成佛」<small>Macroscopic System Map · 全品邏輯總攝</small></span></a></div></div><section class=&quot;chapter&quot; id=&quot;chapter-1&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第三品 · 第一章</div>
<div class=&quot;ch-name&quot;>序分 · 寫給專家的邏輯架構</div>
<div class=&quot;ch-sub&quot;>Logic Architecture · 四悖論／二諦／二身的入手結構</div>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;><span class=&quot;bridge-label&quot;>本章要旨</span><p>本品要解決的核心問題是：當<strong>諸法皆空</strong>遇上<strong>諸佛度生、釋天送花、菩薩賣身、長者女三從</strong>四個鮮活的場景，「空」如何不墮為空談？此章先把全品要展開的四道悖論一次列出，並以二諦框架（世俗諦／第一義諦）與佛陀二身論（色身／法身）為觀讀全品的兩把鑰匙。讀完此章，後續六章只是對這張思考地圖的逐格細描。</p></div>
<h2 id=&quot;ch1-s1&quot;>第一節　四悖論總覽</h2>
<p>卷九十九第三品的論主（龍樹菩薩）為破薩陀波崙、長者女及五百侍女的疑情，並未平鋪直敘地說「空即是空」，而是依次拆解四條彼此扣連的悖論。這四條悖論不只是修辭設問，而是構成全品邏輯的四個<strong>結構性入口</strong>。</p>
<div class=&quot;four-grid&quot;>
<div class=&quot;cell&quot;>
<h5>悖論一　本體論（Paradox of Ontology）</h5>
<p>若諸法如不動相、空無所有，云何可見、可聞、有苦有樂、有縛有脫？若諸佛無來無去，眼前度眾的佛從何而來？</p>
</div>
<div class=&quot;cell&quot;>
<h5>悖論二　感應論（Physics of Resonance）</h5>
<p>若萬法皆空，釋提桓因為何要化作曼陀羅華供養薩陀波崙？感應是神明的賜予，還是緣起的必然？</p>
</div>
<div class=&quot;cell&quot;>
<h5>悖論三　倫理（Ethical Shielding）</h5>
<p>既然諸法皆空，長者女及五百侍女為何不直接供養大福田曇無竭，而必須先「以身屬」薩陀波崙？</p>
</div>
<div class=&quot;cell&quot;>
<h5>悖論四　極致布施（Extreme Dāna）</h5>
<p>長者女送出 → 薩陀波崙轉送 → 曇無竭退還。送出的供養為何又被退還？這場法權流轉背後的真正目的是什麼？</p>
</div>
</div>
<div class=&quot;insight&quot;>
<span class=&quot;insight-title&quot;>本品結構速覽</span>
<p>讀完本章後，第三章對應悖論一，第四章對應悖論二，第五章對應悖論三，第六章對應悖論四。第七章收束為一張「中觀實相地圖」——從一念<strong>發心</strong>到趨近<strong>阿耨多羅三藐三菩提</strong>的所有變量關係。</p>
</div>
<h2 id=&quot;ch1-s2&quot;>第二節　二諦框架 · 世俗諦／第一義諦</h2>
<p>論主全篇所有看似矛盾的論述，其實都運行在<strong>二諦軌道</strong>上。世俗諦處理事相、假名、現象運作；第一義諦處理本體、無自性、畢竟空寂。<em>沒有世俗諦，便無從建立第一義諦；不依世俗，不得第一義。</em></p>
<div class=&quot;two-col&quot;>
<div class=&quot;col-card&quot;>
<div class=&quot;col-title&quot;>世俗諦（Saṃvṛti-satya）</div>
<p>‧ 事相運作、假名施設、因緣和合</p>
<p>‧ 釋提桓因送花、長者女三從、薩陀波崙刺血灑地——皆在此諦上展開</p>
<p>‧ 是空性顯化必經的「假名通道」</p>
</div>
<div class=&quot;col-card&quot;>
<div class=&quot;col-title&quot;>第一義諦（Paramārtha-satya）</div>
<p>‧ 諸法實相、無自性、畢竟空寂</p>
<p>‧ 「諸佛無所從來，去亦無所至」「諸法如即是佛」——皆在此諦上立言</p>
<p>‧ 是實相不動的根本面</p>
</div>
</div>
<div class=&quot;verse&quot;>
  「若不依俗諦，不得第一義；不得第一義，則不得涅槃。」<br/>
<small style=&quot;font-size:14px;color:var(--text-muted);&quot;>——《中論．觀四諦品》</small>
</div>
<h2 id=&quot;ch1-s3&quot;>第三節　佛陀二身論 · 色身／法身</h2>
<p>呼應二諦的，是論主在本品中所立的<strong>佛陀二身論</strong>。這是一張「冰山模型」——浮在水面上、可見可聞的是<em>色身</em>（世諦故有），潛藏於水面下、無來無去的是<em>法身</em>（真佛、第一義諦）。</p>
<div class=&quot;iceberg&quot;>
<div class=&quot;iceberg-row&quot;>
<div class=&quot;iceberg-above&quot;>
<div class=&quot;iceberg-card&quot;>
<h5>色身 Rūpakāya （水面上）</h5>
<p>‧ 世諦故有 · 從因緣和合生</p>
<p>‧ 有三十二相、八十種好</p>
<p>‧ 為度眾生而現</p>
<p>‧ 因緣聚而生、因緣散則滅</p>
</div>
</div>
<div class=&quot;iceberg-below&quot;>
<div class=&quot;iceberg-card&quot;>
<h5>法身 Dharmakāya （水面下）</h5>
<p>‧ 真佛 · 第一義諦</p>
<p>‧ 諸法實相</p>
<p>‧ 無所從來，去無所至</p>
<p>‧ 不生不滅</p>
</div>
</div>
<hr class=&quot;iceberg-line&quot;/>
</div>
</div>
<div class=&quot;insight&quot;>
<span class=&quot;insight-title&quot;>核心洞見</span>
<p>「<strong>諸佛不可以色身見</strong>」——色身屬世諦，可見可聞但會滅；得「諸法實相」者方名為<strong>真佛弟子</strong>。這也是為什麼曇無竭一開頭便說「離是諸法更無佛；諸佛如、諸法如，一如無分別。」</p>
</div>
<h2 id=&quot;ch1-s4&quot;>第四節　中論錨點 · 八不中道</h2>
<p>本品所引的中論基本錨點（後續各章將反覆出現）：</p>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>不生亦不滅　不常亦不斷</div>
<p>悖論一的本體論辯證（破實有 + 破斷滅），即是「不生不滅」「不常不斷」的展開——焰水破生、夢幻破實、海寶破斷、射箭破常。</p>
</div>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>不一亦不異　不來亦不出</div>
<p>悖論二「絕對空性中感應如何發生」即是「不一不異」的展開——感應不是天王神授，亦不離天王與薩陀波崙的福德因緣，「眾緣和合故有，眾緣離故無」。</p>
</div>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>以有空義故，一切法得成</div>
<p>悖論三、悖論四對「世俗禮法／布施流轉」的肯認，皆建立在這條根本錨點上——正因為一切法畢竟空，才能在因緣中如實顯現一切假名建構。空與有不是對立，而是同一實相的兩面。</p>
</div>
</div>
</section>
<section class=&quot;chapter&quot; id=&quot;chapter-2&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第三品 · 第二章</div>
<div class=&quot;ch-name&quot;>經典原典 · 諸佛無來無去及曇無竭納供</div>
<div class=&quot;ch-sub&quot;>Sutra Text · 二十八段經文一次收齊</div>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;><span class=&quot;bridge-label&quot;>本章要旨</span><p>本章是<strong>原典完整收錄</strong>，依《大智度論》卷九十九（釋曇無竭品第八十九）原次序排列。讀者可在此章建立後續六章解構的<em>文本錨點</em>——所有論主在三、四、五、六章引用的「焰水、夢、海寶、箜篌、鏡像、射箭、刺血灑地、散華七年」皆出於此章。經文段次序未被打亂，僅以閱讀友善的方式分節。</p></div>
<h2 id=&quot;ch2-s1&quot;>第一節　經文 · 諸佛無來無去（曇無竭開示）</h2>
<div class=&quot;classical-text&quot;><span class=&quot;text-label&quot;>原典</span>
<p>大智度論釋曇無竭品第八十九（卷第九十九）<br/><small style=&quot;font-size:14px;color:var(--text-muted);&quot;>[*]龍樹菩薩造　[*]後秦龜茲國三藏鳩摩羅什譯</small></p></div>
<div class=&quot;classical-text&quot;><span class=&quot;text-label&quot;>經文</span>
<p>爾時，曇無竭菩薩摩訶薩語薩陀波崙菩薩言：「善男子！諸佛無所從來，去亦無所至。何以故？諸法如不動相，諸法如即是佛。善男子！無生法無來無去，無生法即是佛；無滅法無來無去，無滅法即是佛；實際法無來無去，實際法即是佛；空無來無去，空即是佛。善男子！無染無來無去，無染即是佛；寂滅無來無去，寂滅即是佛；虛空性無來無去，虛空性即是佛。善男子！離是諸法更無佛；諸佛如、諸法如，一如無分別。善男子！是如常一，無二、無三。」</p>
<p>薩陀波崙言：「大師！焰中尚無水，云何當有來處、去處？」</p>
<p>曇無竭菩薩語薩陀波崙菩薩言：「善男子！愚夫無智，為熱渴所逼，見焰動，無水生水想。善男子！若有人分別諸佛有來有去，當知是人皆是愚夫。何以故？善男子！諸佛不可以色身見，諸佛法身無來無去，諸佛來處、去處亦如是。善男子！譬如幻師幻作種種，若象、若馬、若牛、若羊、若男、若女，如是等種種諸物。於汝意云何？是幻事從何處來？去至何所？」</p>
<p>薩陀波崙菩薩言：「大師！幻事無實，云何當有來去處？」</p>
<p>「善男子！是人分別佛有來有去亦如是。</p>
<p>「善男子！譬如夢中見若象、若馬、若牛、若羊、若男、若女。於汝意云何？夢中所見，有來處、有去處不？」</p>
<p>薩陀波崙言：「大師！是夢中所見虛妄，云何當有來去？」</p>
<p>「善男子！是人分別佛有來有去亦如是。善男子！佛說諸法如夢。若有眾生不知是諸法義，以名字色身著佛，是人分別諸佛有來有去，不知諸法實際相故，皆是愚夫無智之數。是人數數往來五道，遠離般若波羅蜜，遠離諸佛法。善男子！佛說諸法如幻、如夢。若有眾生如實知，是人不分別諸法若來若去、若生若滅；若不分別諸法若來若去、若生若滅，則能知佛所說諸法實相。是人行般若波羅蜜，近阿耨多羅三藐三菩提，名為真佛弟子，不虛妄食人信施。」</p>
<p>「善男子！譬如大海水中諸寶，不從東方來，不從南方、西方、北方、四維、上下來，眾生善根因緣故，海生此寶。此寶亦不無因緣而生，是寶皆從因緣和合生，是寶若滅亦不去至十方。諸緣合故有，諸緣離故滅。善男子！諸佛身亦如是，從本業因緣果報生，生不從十方來，滅時亦不去至十方；但諸緣合故有，諸緣離故滅。</p>
<p>「善男子！譬如箜篌聲，出時無來處，滅時無去處。眾緣和合故生——有槽、有頸、有皮、有絃、有柱、有棍，有人以手鼓之，眾緣和合而有聲；是聲亦不從槽出，不從頸出，不從皮出，不從絃出，不從柱出，不從棍出，亦不從人手出，眾緣和合爾乃有聲。是因緣離時，亦無去處。善男子！諸佛身亦如是，從無量功德因緣生，不從一因一緣一功德生，亦不無因緣有，眾緣和合故有。諸佛身不獨從一事成，來無所從、去無所至。</p>
<p>「善男子！應當如是知諸佛來相去相。善男子！亦當知一切法無來去相。汝若知諸佛及諸法無來無去、無生無滅相，必得阿耨多羅三藐三菩提，亦能行般若波羅蜜及方便力。」</p>
</div>
<h2 id=&quot;ch2-s2&quot;>第二節　經文 · 釋天送花與薩陀波崙以身屬師</h2>
<div class=&quot;classical-text&quot;><span class=&quot;text-label&quot;>經文</span>
<p>爾時，釋提桓因以天曼陀羅花與薩陀波崙菩薩摩訶薩，作是言：「善男子！以是花供養曇無竭菩薩摩訶薩，我當守護供養汝。所以者何？汝因緣力故，今日饒益百千萬億眾生，使得阿耨多羅三藐三菩提。善男子！如是善人，甚為難遇！為饒益一切眾生故，無量阿僧祇劫受諸勤苦。」</p>
<p>薩陀波崙菩薩摩訶薩受釋提桓因曼陀羅花，散曇無竭菩薩上，白言：「大師！我從今日以身屬師，供給供養。」如是三白已，合手師前立。</p>
<p>是時，長者女及五百侍女白薩陀波崙菩薩言：「我等從今日亦以身屬師。我等以是善根因緣故，當得如是法，亦如師所得；共師世世供養諸佛，世世常供養師。」</p>
<p>是時，薩陀波崙菩薩語長者女及五百女人：「若汝等以誠心屬我者，我當受汝。」</p>
<p>諸女言：「我等以誠心屬師，當隨師教。」</p>
<p>是時，薩陀波崙菩薩及五百女人，并諸莊嚴寶物上妙供具及五百乘七寶車，奉上曇無竭菩薩，白言：「大師！我持是五百女人奉給大師，是五百乘車隨師所用。」</p>
<p>爾時，釋提桓因讚薩陀波崙菩薩言：「善哉！善哉！善男子！菩薩摩訶薩捨一切所有，應如是如是布施，疾得阿耨多羅三藐三菩提。作如是供養說法人，必得聞般若波羅蜜及方便力。過去諸佛本行菩薩道時，亦如是住布施中，得聞般若波羅蜜及方便力，得阿耨多羅三藐三菩提。」</p>
<p>爾時，曇無竭菩薩欲令薩陀波崙菩薩善根具足故，受五百乘車、長者女及五百侍女；受已，還與薩陀波崙菩薩。</p>
</div>
<h2 id=&quot;ch2-s3&quot;>第三節　經文 · 七年三昧、刺血灑地、散華供養</h2>
<div class=&quot;classical-text&quot;><span class=&quot;text-label&quot;>經文</span>
<p>是時，曇無竭菩薩說法，日沒，起，入宮中。薩陀波崙菩薩摩訶薩作是念：「我為法故來，不應坐、臥，當以二事：若行、若立，以待法師從宮中出說法。」</p>
<p>爾時，曇無竭菩薩七歲一心入無量阿僧祇菩薩三昧，及行般若波羅蜜、方便力。薩陀波崙菩薩七歲經行、住立，不坐、不臥，無有睡眠，無欲、恚、惱，心不著味；但念：「曇無竭菩薩摩訶薩何時當從三昧起，出而說法？」薩陀波崙菩薩過七歲已，作是念：「我當為曇無竭菩薩摩訶薩敷說法座，曇無竭菩薩摩訶薩當坐上說法。我當灑地清淨，散種種華，莊嚴是處，為曇無竭菩薩摩訶薩當說般若波羅蜜及方便力故。」是時，薩陀波崙菩薩與長者女及五百侍女敷置法座。</p>
<p>薩陀波崙菩薩敷座已，求水灑地而不能得。所以者何？惡魔隱蔽，令水不現。魔作是念：「薩陀波崙菩薩求水不得，於阿耨多羅三藐三菩提行乃至生一念劣心、異心，則善根不增、智慧不照，於一切智而有稽留。」</p>
<p>爾時，薩陀波崙菩薩作是念：「我當自刺其身，以血灑地，令無塵土來坋大師。我何用此身！此身必當破壞。我從無始生死已來數數喪身，未曾為法。」即以利刀自刺，出血灑地。薩陀波崙菩薩及長者女并五百侍女皆無異心，惡魔亦不能得便。</p>
<p>是時釋提桓因作是念：「未曾有也！薩陀波崙菩薩愛法乃爾，以刀自刺出血灑地！薩陀波崙及眾女人心不動轉，惡魔波旬不能壞其善根。其心堅固，發大莊嚴，不惜身命，以深心欲求阿耨多羅三藐三菩提，當度一切眾生無量生死苦。」釋提桓因讚薩陀波崙菩薩言：「善哉！善哉！善男子！汝精進力大，堅固難動，不可思議！汝愛法、求法，最為無上！善男子！過去諸佛亦如是，以深心愛法、惜法、重法，集諸功德，得阿耨多羅三藐三菩提。」</p>
<p>薩陀波崙菩薩作是念：「我為曇無竭菩薩摩訶薩敷法座，掃灑清淨已訖，當於何處得好名華莊嚴此地？若曇無竭菩薩摩訶薩法座上坐說法時，亦當散華供養。」</p>
<p>釋提桓因知薩陀波崙菩薩心所念，即以三千石天曼陀羅華與薩陀波崙。薩陀波崙受華，以半散地，留半待曇無竭菩薩摩訶薩坐法座上說法時當供養。</p>
<p>爾時，曇無竭菩薩摩訶薩過七歲已，從諸三昧起，為說般若波羅蜜故，與無量百千萬眾恭敬圍遶，往法座上坐。</p>
<p>薩陀波崙菩薩摩訶薩見曇無竭菩薩摩訶薩時，心淨悅樂，譬如比丘入第三禪。</p>
</div>
<div class=&quot;bridge bridge-outro&quot;><span class=&quot;bridge-label&quot;>承先啟後</span><p>以上為《大智度論》卷九十九第三品經文的完整收錄。接下來四章（第三章至第六章）將圍繞論主在 03 論文中提出的<strong>六輪問答</strong>，依四悖論順序逐一展開——把上述經文中所有「為何如此」的疑情，化為清晰的辯證鏈。</p></div>
</div>
</section>
<section class=&quot;chapter&quot; id=&quot;chapter-3&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第三品 · 第三章</div>
<div class=&quot;ch-name&quot;>悖論一 · 本體論的辯證</div>
<div class=&quot;ch-sub&quot;>Paradox of Ontology · 空中何以見聞苦樂？</div>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;><span class=&quot;bridge-label&quot;>本章要旨</span><p>悖論一：「若諸法如不動相，空無所有，云何可見、可聞、有苦有樂、有縛有脫？」這是薩陀波崙在聽完「諸佛無來無去」後立即提起的<strong>常理性反問</strong>——若一切皆空，眼前的苦樂如何安立？論主以「焰水／夢／幻」三譬喻先破實有見，再以「海寶／箜篌／射箭／鏡像」四譬喻破斷滅見，最後以<strong>佛陀二身論</strong>（色身為世諦故有、法身真實寂滅）統攝二邊。此章把這條論線完整鋪開。</p></div>
<h2 id=&quot;ch3-s1&quot;>第一節　悖論起點 · 薩陀波崙的認知斷層</h2>
<p>當曇無竭宣說「諸佛無所從來，去亦無所至」「諸法如即是佛」，薩陀波崙立刻在心中分裂為兩個極端：</p>
<div class=&quot;spectrum&quot;>
<div class=&quot;sp-node sp-left&quot;>
<h5>實有見 Eternalism</h5>
<p>執著現象為真。<br/>「<strong>為何有苦樂、有縛有脫？</strong>」<br/>誤把假名當實體。</p>
</div>
<div class=&quot;sp-node sp-mid&quot;>
<h5>中道 · 諸法如</h5>
<p>緣起性空<br/>不生不滅<br/>不來不去</p>
</div>
<div class=&quot;sp-node sp-right&quot;>
<h5>斷滅見 Nihilism</h5>
<p>聽聞無佛後，<br/>以為諸法皆滅。<br/>「<strong>諸佛尚無，諸法亦應皆滅</strong>」。</p>
</div>
</div>
<div class=&quot;qa&quot;>
<div class=&quot;qa-q&quot;><strong>問曰：</strong>若是法無所有，云何可見、可聞、有苦有樂、有縛有脫等分別諸異？</div>
<div class=&quot;qa-a&quot;><strong>答曰：</strong><p>此中曇無竭自種種分別譬喻說，所謂如春末月見焰，乃至是人不分別諸法若來若去。如焰等中雖無實事，亦能誑人自生苦樂事；諸法亦如是，雖空、無所有，亦能令人得苦、樂、憂、喜事。夢等法亦如是。</p></div>
</div>
<h2 id=&quot;ch3-s2&quot;>第二節　佛陀二身論 · 真佛弟子的定義</h2>
<p>論主立刻祭出本品的核心心法——<strong>佛陀二身論</strong>，把曇無竭在經文中的「諸佛不可以色身見，諸佛法身無來無去」展為一個完整的結構。</p>
<div class=&quot;qa&quot;>
<div class=&quot;qa-q&quot;><strong>論主立義：</strong>復次，佛有二種身：一者、法身，二者、色身。法身是真佛，色身為世諦故有。</div>
<div class=&quot;qa-a&quot;><p><strong>佛法身相：</strong>上種種因緣說諸法實相，是諸法實相亦無來無去，是故說「諸佛無所從來，去亦無所至」。若人得諸佛法身相，是名近阿耨多羅三藐三菩提，未得一切智故名為近，以相似故。</p>
<p><strong>真佛弟子：</strong>般若波羅蜜名諸法實相；若能如是行，是為行般若波羅蜜真佛弟子。真佛弟子者，得諸法實相名為佛；得諸法實相差別故，有須陀洹乃至辟支佛、大菩薩。</p>
<p><strong>不虛食信施：</strong>布施畜生，雖得百倍果報，而此福有盡有量，不能度眾生生死故，名為「虛食」。須陀洹等乃至佛，諸賢聖受人信施；此福果報，乃至涅槃無盡無量，是故說不虛妄食人信施。</p></div>
</div>
<h2 id=&quot;ch3-s3&quot;>第三節　四譬喻解析矩陣</h2>
<p>論主預見：說完「諸佛無來無去」後，聽眾極易墮入斷滅見——「諸佛尚無，諸法亦應皆滅」。為破斷滅、為證明「<strong>空中有假名顯現</strong>」，論主連用四譬喻：</p>
<h3>譬喻 I · 焰水（破實有見）</h3>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>譬如春末月，日中熱時見焰，愚夫無智，見焰動，無水生水想。</div>
<p>【對治】破「實有見」——境界<strong>能誑人，但境界是假的</strong>。「如幻亦如夢」。</p>
<p>【中論錨點】《中論》：「諸法不自生，亦不從他生，不共不無因，是故知無生。」</p>
</div>
<h3>譬喻 II · 海寶（破斷滅見 · 不從十方來）</h3>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>譬如大海中諸寶，不從東方、南方、西方、北方、四維、上下來，眾生善根因緣故，海生此寶。</div>
<p>【對治】破「斷滅見／無因論」——寶不憑空生，<strong>得度需雙重因緣</strong>：「內有正見、不惜身命大心」+「外有善知識說法」。</p>
<p>【中論錨點】「眾緣和合海生寶，緣盡還滅」——對應「以有空義故，一切法得成」。</p>
</div>
<div class=&quot;qa&quot;>
<div class=&quot;qa-q&quot;><strong>問曰：</strong>若眾生福德因緣故海生珍寶，何以不近眾生處生，而乃在大海難得之處？</div>
<div class=&quot;qa-a&quot;><p><strong>答曰：</strong>海中亦有眾生，龍、阿修羅等用是寶。</p>
<p>復次，若寶生人中濁世，貪者覆藏，不令人得。若好世時，珍寶自生人間，無有惜者；如<strong>彌勒佛時，珍寶如瓦礫</strong>。以懈怠懶惰人惜身，強作願求樂，是故寶在大海不能得；若大心，不惜身命勤求者乃得。</p>
<p><strong>大海水喻十方六道國土，諸珍寶即是諸佛。</strong>如珍寶為一切眾生故生，而懈怠懶惰者所不能得；諸佛亦如是，雖為眾生故出世，懈怠、小心、貪身著我者不得度。</p>
<p>所以者何？諸法皆從眾緣和合生，眾生有二因緣故得度：一者、<strong>內有正見</strong>，二者、<strong>外有善說法者</strong>。</p></div>
</div>
<h3>譬喻 III · 箜篌出聲（不從一因，亦非無因）</h3>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>譬如箜篌聲，出時無來處，滅時無去處——有槽、有頸、有皮、有絃、有柱、有棍，有人以手鼓之，眾緣和合而有聲；聲不從槽出，亦不從人手出。</div>
<p>【對治】證「無來無去／非自非他」。</p>
<p>【解析 · 破四生】不從一因（非自生）、亦非無因（非無因生）。佛身不在六波羅蜜中，亦不離六波羅蜜。</p>
<p>【中論錨點】「因緣生法，即是寂滅」——聲音無生無滅，佛身亦如是。</p>
</div>
<h3>譬喻 IV · 仰射虛空（不常／磨滅）</h3>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>譬如善射之人，仰射虛空，箭去雖遠，必當墮地；諸佛身亦如是，雖相好光明、福德成就、名稱無量、度人無限，亦歸磨滅。</div>
<p>【對治】證「有為法無常性」——破常見、破對色身的執著。</p>
<p>【中論錨點】「相好莊嚴如射箭，力盡還墮」——色身屬世諦，必歸於滅。</p>
</div>
<h3>譬喻 V · 鏡像（緣聚則現、緣散則無）</h3>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>如鏡中像，眾因緣和合故有，眾緣離故無；諸佛亦如是，有諸因緣故出現，諸因緣散故滅。</div>
<p>【對治】總攝前四譬喻——以鏡像之假名顯現，收束「空中有假名」的根本邏輯。</p>
</div>
<h2 id=&quot;ch3-s4&quot;>第四節　本體論觀修心法 · 三角心法</h2>
<p>論主把上述繁複的譬喻收束為一張可操作的<em>三角心法圖</em>，供讀者作為實修錨點：</p>
<div class=&quot;triangle-diagram&quot;>
<div class=&quot;tri-row&quot; style=&quot;justify-content:center;&quot;>
<div class=&quot;tri-node&quot;>
<h5>歸宿上 · 依止法身</h5>
<small>超越生滅，不墮斷常</small>
</div>
</div>
<div class=&quot;tri-row&quot;>
<div class=&quot;tri-node&quot;>
<h5>感覺上 · 視苦樂如陽焰</h5>
<small>破除實有見，解脫妄受</small>
</div>
<div class=&quot;tri-node&quot;>
<h5>認知上 · 視佛身如海寶／箜篌／射箭</h5>
<small>明了眾緣和合，力盡歸滅</small>
</div>
</div>
<div class=&quot;tri-conclusion&quot;>
    總結：邏輯上解決「空性」與「現象」的衝突 ──「一切法無障礙故，方能近阿耨多羅三藐三菩提」。
  </div>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<span class=&quot;bridge-label&quot;>承先啟後</span>
<p>本體論辯證完成後，<strong>下一個悖論立即從事實層面湧現</strong>——既然諸法皆空、諸佛無來無去，那麼「<em>釋提桓因為何要化作曼陀羅華</em>」？這場由帝釋天主導的莊嚴感應，會不會反過來戳破前面建立的「空性」？第四章將以「物理學」的精準語言回應這個棘手追問。</p>
</div>
</div>
</section>
<section class=&quot;chapter&quot; id=&quot;chapter-4&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第三品 · 第四章</div>
<div class=&quot;ch-name&quot;>悖論二 · 感應論的物理學</div>
<div class=&quot;ch-sub&quot;>Physics of Resonance · 絕對空性中感應如何發生？</div>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;><span class=&quot;bridge-label&quot;>本章要旨</span><p>悖論二：「若萬法皆空，釋提桓因（帝釋天）為何要化作曼陀羅華供養薩陀波崙？感應是神明的賜予，還是緣起的必然？」此章把焦點從<em>本體（什麼是真實）</em>移到<em>機制（如何運作）</em>——天人供養不是神授，而是<strong>內因（菩薩福德）</strong>與<strong>外緣（天王攝化）</strong>在空性中精準耦合的<em>感應交道</em>。「魔障隱水→自刺出血」一節，則是這套物理學對<em>意志強度</em>的極端壓力測試。</p></div>
<h2 id=&quot;ch4-s1&quot;>第一節　悖論起點 · 絕對空性中感應如何發生</h2>
<p>本品中釋提桓因兩度出場：先以天曼陀羅花與薩陀波崙，後復以三千石曼陀羅華成全散花莊嚴。若一切法畢竟空，這場跨層級的「天人感應」是憑空發生，還是有它精密的因緣機制？</p>
<div class=&quot;insight&quot;>
<span class=&quot;insight-title&quot;>悖論二的核心追問</span>
<p>若萬法皆空，釋提桓因（帝釋天）為何要化作曼陀羅華供養薩陀波崙？<br/><strong>感應是神明的賜予，還是緣起的必然？</strong></p>
</div>
<div class=&quot;qa&quot;>
<div class=&quot;qa-q&quot;><strong>問曰：</strong>釋提桓因何以化作文（曼）陀羅華與薩陀波崙？</div>
<div class=&quot;qa-a&quot;><strong>答曰：</strong>
<p>釋提桓因愛樂佛道故，常供養諸菩薩。</p>
<p>復次，釋提桓因欲<strong>攝眾生令入佛道</strong>故，現天王身，以華與薩陀波崙。薩陀波崙一心求佛道故，諸天來供養；眾生見者，皆亦發心。釋提桓因為引導眾生故，供養薩陀波崙。</p>
<p>有人言：「釋提桓因深愛敬薩陀波崙，上品來試已，令身體平復，今復以華與之。釋提桓因力能與一切人華，<strong>以眾生無福力故，設當與者，華即變壞</strong>；薩陀波崙福德成就故，得必不變，是故與；若一切菩薩供養師時不盡與。」</p>
<p>應守護供養者，先已說因緣，所謂<strong>割肉出血，試以成親舊故守護</strong>。復次，釋提桓因此中自說因緣，所謂：「汝因緣力故，饒益百千等眾生。」</p></div>
</div>
<h2 id=&quot;ch4-s2&quot;>第二節　天人供養的內因外緣機制</h2>
<p>論主把「感應」拆為兩端對稱、缺一不可的能量耦合——這正是<strong>「不一不異」</strong>的精準演示。感應不是單向施予，亦不離雙方福德，而是兩股因緣於空性中精準交匯。</p>
<div class=&quot;infinity-loop&quot;>
<div class=&quot;loop-node&quot;>
<strong>【外緣】釋提桓因的攝受</strong><br/>
    動機：愛樂佛道、攝眾生令入佛道（示現榜樣效應）
  </div>
<div class=&quot;loop-arrow&quot;>↓</div>
<div class=&quot;loop-node loop-center&quot;>
    【感應交道】<br/>
<small>感應非隨機神蹟，而是「福德物理學」</small>
</div>
<div class=&quot;loop-arrow&quot;>↑</div>
<div class=&quot;loop-node&quot;>
<strong>【內因】薩陀波崙的福德</strong><br/>
    承載：福德成就、一心求佛道、不惜身命的決心
  </div>
</div>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>關鍵命題</div>
<p>「釋提桓因力能與一切人華」——他<strong>有能力</strong>對所有人散花，但<strong>沒有對象有能力承載</strong>。「以眾生無福力故，設當與者，華即變壞」。<em>感應的瓶頸不在天人這一端，而在受者的內因厚薄。</em></p>
</div>
<h2 id=&quot;ch4-s3&quot;>第三節　危機與對治 · 魔障隱水</h2>
<p>當薩陀波崙敷座圓滿，準備灑水掃地，<strong>惡魔波旬突然「隱蔽令水不現」</strong>。魔王為何在此刻出手？論主借這一段揭示：感應的物理學並不平坦——強大的福德場，必引發等量的逆向擾動。</p>
<div class=&quot;flow flow-h&quot;>
<div class=&quot;flow-box&quot;>
<strong>危機觸發</strong>
<small>魔王隱水，令薩陀波崙「於阿耨多羅三藐三菩提行乃至生一念劣心、異心」</small>
</div>
<div class=&quot;flow-arrow&quot;>→</div>
<div class=&quot;flow-box&quot;>
<strong>對治升級</strong>
<small>「我何用此身！此身必當破壞」——以利刀自刺，出血灑地</small>
</div>
<div class=&quot;flow-arrow&quot;>→</div>
<div class=&quot;flow-box&quot;>
<strong>感應強化</strong>
<small>釋提桓因復讚「不可思議」、復以三千石曼陀羅華予之</small>
</div>
</div>
<div class=&quot;insight&quot;>
<span class=&quot;insight-title&quot;>中論視角</span>
<p>「天花非天予，依福始不壞」——完美詮釋性空緣起。莊嚴外在的道場，實為莊嚴內在的決心；不向外抱怨，向內激發道心。<strong>魔障所擾動的不是水，而是行人的心；隱水這個動作本身，反而成為福德場升階的觸發器。</strong></p>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<span class=&quot;bridge-label&quot;>承先啟後</span>
<p>本體論（空中如何見聞）與感應論（空中如何感應）解決後，論主立即切入<strong>更微妙的第三層</strong>——長者女明明已決意供養曇無竭，為何整套行禮必須先繞道薩陀波崙？這條看似多餘的世俗禮法，是否反而違背了空性？第五章將顯示：<em>俗諦不是空性的敵人，而是空性顯化的絕緣層</em>。</p>
</div>
</div>
</section>
<section class=&quot;chapter&quot; id=&quot;chapter-5&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第三品 · 第五章</div>
<div class=&quot;ch-name&quot;>悖論三 · 倫理防護罩</div>
<div class=&quot;ch-sub&quot;>Ethical Shielding · 空中為何拘泥世俗禮法？</div>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;><span class=&quot;bridge-label&quot;>本章要旨</span><p>悖論三：「既然諸法皆空，長者女及五百侍女為何不直接供養大福田曇無竭，而必須先『以身屬』薩陀波崙？」此章是全品最被忽略的層次——<strong>第一義諦的清淨，反而需要世俗諦的禮法作護法</strong>。論主用「女身罪穢、譏謗、三從之禮、無所繫屬」四條俗諦邏輯，建立一張<em>二諦防護矩陣</em>：俗諦不是空性的對立，而是空性顯化過程中防止外緣干擾的<strong>絕緣層</strong>。</p></div>
<h2 id=&quot;ch5-s1&quot;>第一節　悖論起點 · 諸法皆空為何拘泥禮法</h2>
<p>長者女及五百侍女既已發心求佛道，又共薩陀波崙詣曇無竭，似乎理應直接以身供養大福田曇無竭——畢竟「諸法皆空，何來男女相、何來譏謗？」但論主卻為她們的「不直接供養」給出一段精密的世俗諦邏輯。</p>
<div class=&quot;insight&quot;>
<span class=&quot;insight-title&quot;>悖論三的核心追問</span>
<p>既然諸法皆空，<strong>長者女及五百侍女為何不直接供養大福田曇無竭，而必須先「以身屬」薩陀波崙</strong>？</p>
</div>
<h2 id=&quot;ch5-s2&quot;>第二節　女身布施的抉擇點</h2>
<div class=&quot;qa&quot;>
<div class=&quot;qa-q&quot;><strong>問曰：</strong>薩陀波崙以身供養曇無竭，曇無竭福田大，女何以不以身供養，而與薩陀波崙？</div>
<div class=&quot;qa-a&quot;><strong>答曰：</strong>
<p>女人智短著多故，不用捨本師而供養他。又以<strong>女身罪穢，心雖清白，為外有譏謗故</strong>。</p></div>
</div>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>論主的雙重理由</div>
<p><strong>內因：</strong>「女人智短著多」——非貶女性，乃是說女眾在當時社會脈絡下，未必能獨力對抗外境干擾。</p>
<p><strong>外緣：</strong>「為外有譏謗故」——女身直接送上大福田，會招致世人造口業（譏謗、毀謗）；這口業反過來損傷曇無竭的法緣與長者女的福德。</p>
</div>
<h2 id=&quot;ch5-s3&quot;>第三節　二諦軌跡 · 不越級的順流路徑</h2>
<div class=&quot;two-col&quot;>
<div class=&quot;col-card&quot; style=&quot;border-left:4px solid #c87060;&quot;>
<div class=&quot;col-title&quot;>【錯誤的越級路徑】</div>
<p>長者女 → 直接導師曇無竭</p>
<p>世間凡夫起譏謗：「動機不純」「華麗女眾包裝大師」</p>
<p>結果：在世俗邏輯與緣起法則上會產生<strong>斷裂</strong>。</p>
</div>
<div class=&quot;col-card&quot; style=&quot;border-left:4px solid #5879af;&quot;>
<div class=&quot;col-title&quot;>【正確的順流路徑】</div>
<p>長者女 → 引路人薩陀波崙 → 連結上層諸佛（曇無竭）</p>
<p>世俗禮法成立，無從生譏謗，福德因緣鏈完整。</p>
<p>結果：<strong>不棄因緣銀鏈，方能累積真實福德。</strong></p>
</div>
</div>
<div class=&quot;qa&quot;>
<div class=&quot;qa-q&quot;><strong>問曰：</strong>長者女初捨父母，已屬薩陀波崙，今何以復以身施？</div>
<div class=&quot;qa-a&quot;><strong>答曰：</strong>
<p>初捨父母，共薩陀波崙詣曇無竭，<strong>為法故供養，亦不自以身施</strong>，父母亦不以施薩陀波崙。今見薩陀波崙問甚深義，曇無竭為解說，釋提桓因歡喜供養，是故發歡喜心，以身供養，<strong>以自在心故</strong>。</p>
<p>又一切女身<strong>無所繫屬，則受惡名</strong>。女人之禮，幼則從父母，少則從夫，老則從子。是長者女等，雖道路共來，<strong>不得久無所屬</strong>，是故自以身施，而作是願：「如師所得，我等亦當得之。」</p></div>
</div>
<h2 id=&quot;ch5-s4&quot;>第四節　二諦防護矩陣</h2>
<p>論主在此將「女身罪穢／三從之禮／無所繫屬／譏謗」四條俗諦邏輯交織為一張<strong>防護矩陣</strong>——它的功能不是壓抑空性，而是保護空性在世間的顯化通道不被外緣的「口業／疑情／斷裂」所污染。</p>
<div class=&quot;four-grid&quot;>
<div class=&quot;cell&quot;>
<h5>防護一 · 女身譏謗</h5>
<p>避免凡夫造譏謗口業，必須建立明確的世俗歸屬。</p>
</div>
<div class=&quot;cell&quot;>
<h5>防護二 · 三從禮法</h5>
<p>幼從父母、少從夫、老從子——這是世俗社會對女眾的<strong>合法繫屬框架</strong>。</p>
</div>
<div class=&quot;cell&quot;>
<h5>防護三 · 無所屬則受惡名</h5>
<p>女身在道路上若無所繫屬，必受惡名；惡名損善根。</p>
</div>
<div class=&quot;cell&quot;>
<h5>防護四 · 為法故先以身施</h5>
<p>以身屬薩陀波崙，並非占有，而是建立<strong>俗諦合法的弟子身分</strong>——再以此身分隨師供養大福田曇無竭。</p>
</div>
</div>
<div class=&quot;verse&quot;>
  「若不依俗諦，不得第一義。」<br/>
<small style=&quot;font-size:14px;color:var(--text-muted);&quot;>——順應世間禮法，正是為了保護出世間的清淨法脈。</small>
</div>
<div class=&quot;insight&quot;>
<span class=&quot;insight-title&quot;>核心洞見</span>
<p>俗諦不是束縛，<strong>俗諦是空性顯化過程中的絕緣層</strong>。沒有絕緣層，第一義諦的高壓電流會在世俗社會中產生短路（譏謗、疑情、斷裂）。本品這幾段對「長者女抉擇點」的反覆問答，正是龍樹菩薩為大乘行者所立的<em>俗諦操作手冊</em>。</p>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<span class=&quot;bridge-label&quot;>承先啟後</span>
<p>俗諦防護矩陣建立後，<strong>真正的布施動作隨即展開</strong>。但下一個悖論已在路上：薩陀波崙轉手把長者女、五百侍女、五百乘車盡上曇無竭，曇無竭隨即又退還薩陀波崙。送了又收，這場法權流轉到底證明了什麼？第六章將以「三輪體空」的最高峰回應。</p>
</div>
</div>
</section>
<section class=&quot;chapter&quot; id=&quot;chapter-6&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第三品 · 第六章</div>
<div class=&quot;ch-name&quot;>悖論四 · 極致布施的辯證</div>
<div class=&quot;ch-sub&quot;>Extreme Dāna Pāramitā · 送出的供養為何又被退還？</div>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;><span class=&quot;bridge-label&quot;>本章要旨</span><p>悖論四：長者女送給薩陀波崙→薩陀波崙轉送曇無竭→曇無竭隨即退還薩陀波崙——這場「<strong>無限退還迴圈</strong>」既違反世俗布施邏輯（送了又收豈非鬧劇？），又似乎牴觸般若空性（如果一切空，誰是施者誰是受者？）。本章揭示這一連串看似多餘的動作，正是檀波羅蜜在<em>絕對空性中保持中道</em>的精準演示——三輪（施者／受者／施物）體空而不廢假名布施，物歸原主而功德已圓滿於法界。</p></div>
<h2 id=&quot;ch6-s1&quot;>第一節　悖論起點 · 送出的供養為何又被退還</h2>
<p>論主在這一段把整品最具戲劇性的場景拆為一條精密的法權流轉鏈：</p>
<div class=&quot;verse&quot;>
  長者女送給薩陀波崙　→　薩陀波崙轉送曇無竭　→　曇無竭按受後又退還　<br/>
<small style=&quot;font-size:14px;color:var(--text-muted);&quot;>這場法權流轉背後的真正目的是什麼？</small>
</div>
<h2 id=&quot;ch6-s2&quot;>第二節　三段式法權轉移</h2>
<p>《大智度論》論主把這一連串看似冗餘的動作，拆為三段功能各異、邏輯嚴密的<strong>法權轉移</strong>：</p>
<div class=&quot;three-stage&quot;>
<div class=&quot;stage&quot;>
<div class=&quot;stage-num&quot;>1</div>
<h5>除疑與盡捨</h5>
<p>薩陀波崙若自留五百美女，必招世人懷疑動機不純。<strong>轉手即施</strong>，方能「明已無著」——破除世人「貪心將女私留」的譏謗。</p>
</div>
<div class=&quot;stage&quot;>
<div class=&quot;stage-num&quot;>2</div>
<h5>盡捨無餘</h5>
<p>「愛貪等煩惱未盡，而能盡捨內外布施」——徹底捨離（Renunciation）的證明。</p>
</div>
<div class=&quot;stage&quot;>
<div class=&quot;stage-num&quot;>3</div>
<h5>退還令福德具足</h5>
<p>曇無竭以大智方便將女與車<strong>退還</strong>薩陀波崙——令其福德具足、同得佛果。</p>
</div>
</div>
<div class=&quot;qa&quot;>
<div class=&quot;qa-q&quot;><strong>釋提桓因讚：</strong>「善哉！善哉！善男子！菩薩摩訶薩捨一切所有，應如是如是布施，疾得阿耨多羅三藐三菩提。」</div>
<div class=&quot;qa-a&quot;><p>釋提桓因知薩陀波崙<strong>愛貪等煩惱未盡，而能盡捨內外布施，無復遺餘</strong>，故讚言「善哉！」以過去佛為喻：行難事故，得難得果報，所謂「阿耨多羅三藐三菩提」。</p></div>
</div>
<h2 id=&quot;ch6-s3&quot;>第三節　受者心智 · 曇無竭的上受</h2>
<div class=&quot;qa&quot;>
<div class=&quot;qa-q&quot;><strong>問曰：</strong>若曇無竭欲令薩陀波崙善根具足故受——善根者，所謂具足檀波羅蜜——何以故還與薩陀波崙？</div>
<div class=&quot;qa-a&quot;><strong>答曰：</strong>
<p><strong>曇無竭大智方便，令薩陀波崙大得福德而無所失，是謂上受。</strong></p>
<p>薩陀波崙至誠心施，斷諸貪著，不望還得，福德具足。曇無竭思惟薩陀波崙遠來而於五欲心不染著，舊人供養為善，是故還與。又聞諸女先以身上薩陀波崙，<strong>人非財物</strong>，欲遂其本意故。又是諸女<strong>世世為薩陀波崙弟子</strong>。如是等因緣故，還與薩陀波崙。</p></div>
</div>
<div class=&quot;triangle-diagram&quot;>
<div class=&quot;tri-row&quot; style=&quot;justify-content:center;&quot;>
<div class=&quot;tri-node&quot;>
<h5>【上受】</h5>
<small>受是為了「有」（成全福德因緣），還是為了「空」（顯示無染著）？</small>
</div>
</div>
<div class=&quot;tri-row&quot;>
<div class=&quot;tri-node&quot;>
<h5>【為何受？】成全「因」</h5>
<small>為了成就薩陀波崙的施波羅蜜功德（令善根具足），布施必須有受者方能成立。</small>
</div>
<div class=&quot;tri-node&quot;>
<h5>【為何還？】圓滿「果」</h5>
<small>大智方便，令大得福德而無所失，不違背眷屬緣起與無染著。</small>
</div>
</div>
</div>
<h2 id=&quot;ch6-s4&quot;>第四節　深度剖析 · 人非財物與宿世緣起</h2>
<p>論主在「還與」的解釋中藏了兩條更深的<em>緣起理由</em>，超越了一般的施／受邏輯：</p>
<div class=&quot;two-col&quot;>
<div class=&quot;col-card&quot;>
<div class=&quot;col-title&quot;>【人非財物】</div>
<p>曇無竭觀見這些侍女<strong>不是普通的供養財物</strong>——本是受薩陀波崙感召而來，<strong>非單純物品</strong>。她們是「人」，不是「物」，不能像金銀車馬那樣被簡單地法權轉移。</p>
</div>
<div class=&quot;col-card&quot;>
<div class=&quot;col-title&quot;>【尊重緣起的歸屬】</div>
<p>觀見諸女「<strong>世世為薩陀波崙弟子</strong>」——若被強留供養他者，將遺漏、損害這條跨深世緣起的尊重與慈悲。</p>
</div>
</div>
<h2 id=&quot;ch6-s5&quot;>第五節　假名布施、中道而行 · 三輪體空</h2>
<p>論主把這一系列動作收束為布施波羅蜜的最高峰——<strong>三輪體空</strong>：施者、受者、施物，皆無自性可得；但這「空」不是廢假名，而是<em>於假名中行中道</em>。</p>
<div class=&quot;venn-wrap&quot;>
<div class=&quot;venn-circle venn-a&quot;>
<div class=&quot;venn-inner&quot;>
<strong>【施者空】</strong>
<small>薩陀波崙<br/>「不望還得」<br/>無布施傲慢</small>
</div>
</div>
<div class=&quot;venn-circle venn-b&quot;>
<div class=&quot;venn-inner&quot;>
<strong>【受者空】</strong>
<small>曇無竭<br/>「受已退還」<br/>無所得智慧</small>
</div>
</div>
<div class=&quot;venn-circle venn-c&quot;>
<div class=&quot;venn-inner&quot;>
<strong>【施物空】</strong>
<small>長者女<br/>「如無心物」<br/>隨順因緣流轉</small>
</div>
</div>
</div>
<div class=&quot;insight&quot;>
<span class=&quot;insight-title&quot;>核心洞見</span>
<p>整條法權流轉鏈，是檀波羅蜜在<strong>絕對空性中保持中道</strong>的精準演示：施而不執、受而不取、物隨緣轉。「<strong>物歸原主而功德已圓滿於法界</strong>」——這場看似多餘的「送出又退還」，反而證明三輪體空不是空談，而是可以被精確操作的菩薩道。</p>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<span class=&quot;bridge-label&quot;>承先啟後</span>
<p>本體論（悖論一）、感應論（悖論二）、倫理（悖論三）、布施（悖論四）四道層次解構完畢。下一章將把這四個獨立模塊匯聚為一張總攬地圖——展示《大智度論》卷九十九第三品從「<strong>一念發心</strong>」到「<strong>近阿耨多羅三藐三菩提</strong>」的所有變量關係。</p>
</div>
</div>
</section>
<section class=&quot;chapter&quot; id=&quot;chapter-7&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第三品 · 第七章</div>
<div class=&quot;ch-name&quot;>中觀實相地圖 · 從「發心」到「近成佛」</div>
<div class=&quot;ch-sub&quot;>Macroscopic System Map · 全品邏輯總攝</div>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;><span class=&quot;bridge-label&quot;>本章要旨</span><p>第七章是全品邏輯的<strong>總攬</strong>——把第三章「本體論矩陣」、第四章「感應論迴路」、第五章「倫理防護罩」、第六章「布施流轉圖」四個獨立模塊，匯聚為《大智度論》卷九十九的<em>四維中觀地圖</em>。終以「<strong>緣起網絡中的菩薩道</strong>」四柱回應龍樹菩薩在卷首所揭示之命題：「<em>諸法如不動相，諸法如即是佛</em>」——展示從一念發心，到近阿耨多羅三藐三菩提的所有變量關係。</p></div>
<h2 id=&quot;ch7-s1&quot;>第一節　四層邏輯整合 · 中觀實相地圖</h2>
<p>《大智度論》卷九十九第三品之底層邏輯全貌，可以收束為「四個獨立卻彼此扣連的模塊」。展示從「<strong>發心</strong>」到「<strong>近成佛</strong>」的所有變量關係：</p>
<div class=&quot;macro-map&quot;>
<h4>中觀實相地圖 · Macroscopic System Map</h4>
<div class=&quot;macro-quad&quot;>
<div class=&quot;quad-node&quot;>
<h5>本體論矩陣（第三章）</h5>
<p>注意自身的雙層結構：色身（世諦）為假名顯現，法身（第一義）無來無去。心法以「焰水／海寶／箜篌／射箭／鏡像」五譬喻為觀修錨點。</p>
</div>
<div class=&quot;quad-node&quot;>
<h5>倫理防護罩（第五章）</h5>
<p>二諦軌的世俗隨順：俗諦（女身譏謗、三從禮法、無所繫屬）是空性顯化過程中的絕緣層，沒有絕緣層，第一義諦的高壓電流會在世俗社會中產生短路。</p>
</div>
<div class=&quot;quad-node&quot;>
<h5>感應論迴路（第四章）</h5>
<p>福德與神蹟的反饋：感應不是天王神授，而是內因（菩薩福德成就）與外緣（天王愛樂攝化）在空性中精準耦合的「福德物理學」。</p>
</div>
<div class=&quot;quad-node&quot;>
<h5>布施流轉圖（第六章）</h5>
<p>三輪體空的法權翻轉：施者空、受者空、施物空——於假名中行中道，「物歸原主而功德已圓滿於法界」。</p>
</div>
</div>
<div class=&quot;macro-center&quot;>諸法實相 · 一切法無障礙故</div>
</div>
<h2 id=&quot;ch7-s2&quot;>第二節　緣起網絡中的菩薩道 · 四柱總攝</h2>
<p>本品四悖論最終收束為《大智度論》論主給薩陀波崙的<strong>四柱總持口訣</strong>。這四柱不是平行並列，而是<em>同一條菩薩道在四個維度上的同時運行</em>。</p>
<div class=&quot;four-pillars&quot;>
<div class=&quot;pillar&quot;>
<h5>一、在感覺上如幻</h5>
<p>視苦樂如陽焰</p>
<small>對應本體論：破除實有見，解脫妄受</small>
</div>
<div class=&quot;pillar&quot;>
<h5>二、在行持上至誠</h5>
<p>不惜身命必應</p>
<small>對應感應論：內因（福德）厚則外緣（天人）自至</small>
</div>
<div class=&quot;pillar&quot;>
<h5>三、在世俗中嚴謹</h5>
<p>內修空亦順世儀</p>
<small>對應倫理：俗諦防護矩陣，不墮世間譏謗</small>
</div>
<div class=&quot;pillar&quot;>
<h5>四、在勝義中無得</h5>
<p>受即非受 · 圓滿檀度</p>
<small>對應布施：三輪體空，物歸原主</small>
</div>
</div>
<div class=&quot;verse&quot;>
  「一切法無障礙故。」<br/>
<small style=&quot;font-size:14px;color:var(--text-muted);&quot;>——曇無竭給薩陀波崙的終極授記。<br/>四柱同行，方能近阿耨多羅三藐三菩提。</small>
</div>
<h2 id=&quot;ch7-s3&quot;>第三節　卷九十九第三品結論</h2>
<div class=&quot;card&quot;>
<div class=&quot;card-title&quot;>回到本品開頭</div>
<p>曇無竭以「<strong>諸佛無所從來，去亦無所至。何以故？諸法如不動相，諸法如即是佛。</strong>」入手，看似只是談「諸佛從何而來、去向何處」的本體問題；但讀完七章，會發現論主在這短短一句中已埋下了全品的四層邏輯：</p>
<p>「<strong>諸法如不動相</strong>」——第一義諦（本體論）</p>
<p>「<strong>諸法如即是佛</strong>」——色身法身、感應、布施皆不離此「諸法如」（感應論／倫理／布施）</p>
</div>
<div class=&quot;insight&quot;>
<span class=&quot;insight-title&quot;>本品在《大智度論》中的位置</span>
<p>卷九十九第三品是《釋曇無竭品第八十九》的精華節錄——它把《大般若波羅蜜經》末段「薩陀波崙求法、曇無竭授法」的故事，由龍樹菩薩以中觀邏輯逐句解構。它既是<strong>般若波羅蜜的實修壓力測試</strong>（薩陀波崙刺血灑地、七年三昧），也是<strong>中觀二諦的最佳操作手冊</strong>（俗諦防護＋第一義不動）。</p>
<p>讀者若能在此七章間反覆參學，自能照見：<strong>「諸佛無所從來，去亦無所至」與「一心供養曇無竭、刺血灑地、長者女三從」並無矛盾——前者是法身、後者是色身；前者是第一義、後者是世俗；前者是空、後者是緣起；空中有緣起，緣起即是空。</strong></p>
</div>
<div class=&quot;verse&quot;>
  諸法如不動相　諸法如即是佛<br/>
  一切法無障礙故　行般若波羅蜜及方便力<br/>
  必得阿耨多羅三藐三菩提<br/>
<small style=&quot;font-size:14px;color:var(--text-muted);&quot;>——《大智度論》卷九十九 釋曇無竭品第八十九 · 結語</small>
</div>
</div>
</section>
