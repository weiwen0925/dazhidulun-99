<section class=&quot;chapter&quot; id=&quot;chapter-1&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第五品 · 第一章</div>
<div class=&quot;ch-name&quot;>空性基線 — 開卷導讀</div>
<div class=&quot;ch-sub&quot;>以「諸佛無來無去」的五重實相塔，奠定本品全部敘事的理論零點</div>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;>
<div class=&quot;bridge-label&quot;>本章要旨</div>
<p>在進入薩陀波崙的種種極限考驗之前，必須先看清楚整部劇本的「零點座標」——曇無竭菩薩開示的「諸佛無來無去」。這個座標一旦確立，後面所有看似激烈的事相（刺血、感應、狂喜）就不再是浪漫的宗教神話，而是依循空性法則的精密運算。本章引入經文中的五重實相比喻，並預告本品九章的整體敘事光帶。</p>
</div>
<h2>第一節　五重實相塔 · 如來本體的空性基線</h2>
<p>本卷開篇，曇無竭菩薩面對薩陀波崙「諸佛從何處來，去至何所」的提問，給出了一個徹底反常識的答案：諸佛實際上既無所從來，亦無所至。為什麼？因為諸法本身的「如」（Tathatā，真如實相）就是不動的——而諸佛的本體即是這個「如」。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經文原典</span>
<p>「諸佛無所從來，去亦無所至。何以故？諸法如不動相，諸法如即是佛。善男子！無生法無來無去，無生法即是佛；無滅法、實際法、空、無染、寂滅、虛空性，無憶想分別，無得無戲論，無來無去，皆即是佛。離是諸法更無佛；諸佛如、諸法如，一如無分別。是如常一，無二、無三，出諸數法，無所有故。」</p>
</div>
<p>為了讓這段抽象的「如」具象化，經文接著拋出五個層層遞進的譬喻，構成一座「五重實相塔」：</p>
<div class=&quot;pagoda&quot;>
<div class=&quot;layer layer-1&quot;><span class=&quot;ord&quot;>一</span><strong>陽焰</strong>　春末日中，遠望若水<span class=&quot;ja&quot;>Mirage</span></div>
<div class=&quot;layer layer-2&quot;><span class=&quot;ord&quot;>二</span><strong>幻化</strong>　幻師作種種人物相<span class=&quot;ja&quot;>Illusion</span></div>
<div class=&quot;layer layer-3&quot;><span class=&quot;ord&quot;>三</span><strong>夢境</strong>　夢中見一切色相<span class=&quot;ja&quot;>Dream</span></div>
<div class=&quot;layer layer-4&quot;><span class=&quot;ord&quot;>四</span><strong>海寶</strong>　大海諸寶非從十方來<span class=&quot;ja&quot;>Ocean Treasure</span></div>
<div class=&quot;layer layer-5&quot;><span class=&quot;ord&quot;>五</span><strong>箜篌</strong>　眾緣和合而聲生滅<span class=&quot;ja&quot;>Harp Sound</span></div>
<div class=&quot;base&quot;>底座 · 如　Tathatā</div>
</div>
<div class=&quot;insight&quot;>
<div class=&quot;card-title&quot;>論主補注 · 為何要警告「以名字色身著佛」</div>
<p>論中側註點出：諸佛身從<strong>無量功德因緣</strong>生，並非單獨自有；若有人執著佛的<strong>名字</strong>或<strong>色身</strong>而以為實有來去，便是龍樹一再呵斥的「愚夫」見地。五重比喻的真正功能，是把學人對「佛身可見可觸」的執取，一層一層剝離乾淨。</p>
</div>
<h2>第二節　從「經」到「論」的拆解進路</h2>
<p>本品的特殊之處，是它呈現了一種非常清晰的「文本三層結構」——經文敘述事相，論文提出問題，問答之間呈現中觀理路。讀者只要把握這個閱讀方法，整段薩陀波崙故事就會從「神聖敘事」變成「可驗算的中觀方程式」。</p>
<div class=&quot;tri-pillar&quot;>
<div class=&quot;pillar&quot;>
<div class=&quot;pillar-num&quot;>經</div>
<div class=&quot;pillar-title&quot;>事相層</div>
<div class=&quot;pillar-desc&quot;>薩陀波崙刺血、五百女供養、帝釋降華、曇無竭出三昧——皆是可感知的具體事件。</div>
</div>
<div class=&quot;pillar&quot;>
<div class=&quot;pillar-num&quot;>論</div>
<div class=&quot;pillar-title&quot;>論理層</div>
<div class=&quot;pillar-desc&quot;>龍樹以「問曰／答曰」的九組辯證，逐一質疑每個事件背後的可能矛盾。</div>
</div>
<div class=&quot;pillar&quot;>
<div class=&quot;pillar-num&quot;>觀</div>
<div class=&quot;pillar-title&quot;>實證層</div>
<div class=&quot;pillar-desc&quot;>每個答曰最終都收束到「諸法畢竟空 · 緣起無自性」的中觀根本見地。</div>
</div>
</div>
<h2>第三節　本品九章敘事光帶</h2>
<p>本品所載的薩陀波崙故事，並非一連串無連續的奇蹟，而是<strong>連續五個壓力測試</strong>之後接著三組哲理回答。下圖以「上升光帶」的形式，將九章主題串接成一道完整的中觀實踐軌跡，整本網頁的閱讀路線即依此光帶推進。</p>
<div class=&quot;ladder&quot;>
<div class=&quot;step&quot;><span class=&quot;num&quot;>1</span><span class=&quot;lab&quot;>空性基線</span><span class=&quot;ar&quot;>→</span><span class=&quot;dx&quot;>確立「諸佛無來無去」的零點座標</span></div>
<div class=&quot;step&quot;><span class=&quot;num&quot;>2</span><span class=&quot;lab&quot;>確診魔障</span><span class=&quot;ar&quot;>→</span><span class=&quot;dx&quot;>識破魔王隱水、不假外求</span></div>
<div class=&quot;step&quot;><span class=&quot;num&quot;>3</span><span class=&quot;lab&quot;>四大互換</span><span class=&quot;ar&quot;>→</span><span class=&quot;dx&quot;>刺血為水，界與空的等價</span></div>
<div class=&quot;step&quot;><span class=&quot;num&quot;>4</span><span class=&quot;lab&quot;>無瘡受毒</span><span class=&quot;ar&quot;>→</span><span class=&quot;dx&quot;>心無憂愁，魔不得便</span></div>
<div class=&quot;step&quot;><span class=&quot;num&quot;>5</span><span class=&quot;lab&quot;>緣起感應</span><span class=&quot;ar&quot;>→</span><span class=&quot;dx&quot;>純粹悲念招引天華</span></div>
<div class=&quot;step&quot;><span class=&quot;num&quot;>6</span><span class=&quot;lab&quot;>二諦出入</span><span class=&quot;ar&quot;>→</span><span class=&quot;dx&quot;>大悲心牽引菩薩自三昧起</span></div>
<div class=&quot;step&quot;><span class=&quot;num&quot;>7</span><span class=&quot;lab&quot;>捨喜得淨</span><span class=&quot;ar&quot;>→</span><span class=&quot;dx&quot;>第三禪樂喻 · 實相無受</span></div>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<div class=&quot;bridge-label&quot;>承上啟下</div>
<p>有了「諸佛如不動相」的零點，下一章我們即進入第一個壓力測試：薩陀波崙七年苦待之後，正要灑地敷座迎請曇無竭出定，卻發現所有水源都被魔王波旬隱蔽。這個橋段提出的根本問題是——「若菩薩福德成就、隨願即得，魔王為何還能成功干擾？」</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-2&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第五品 · 第二章</div>
<div class=&quot;ch-name&quot;>魔隱水之謎 — 新發意菩薩的權限限制</div>
<div class=&quot;ch-sub&quot;>逆境作為增上緣 · 無始生死的沉沒成本如何被重估</div>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;>
<div class=&quot;bridge-label&quot;>本章要旨</div>
<p>本章處理本品第一個論主問答：薩陀波崙是「能令種種華香瓔珞自然湧出」的福德具足者，照理說只要心念一動就能得水灑地，為何卻被魔王波旬成功隱蔽？論主用「位階限制 vs. 逆緣觸發」的雙線結構回答，順帶提出「無始生死沉沒成本」這個極為現代的價值重估觀念。</p>
</div>
<h2>第一節　福德成就為何魔仍能隱水？</h2>
<p>經文先給出事實：薩陀波崙與五百女人欲取水灑地，而<strong>惡魔波旬</strong>把方圓所有的水源（井泉、池水、河流）盡皆隱蔽。論主隨即接上一個尖銳的提問：</p>
<div class=&quot;qa&quot;>
<div class=&quot;q&quot;>
<span class=&quot;qa-label&quot;>問</span>
<p>若薩陀波崙福德成就，隨願即得，魔不應隱蔽其水？</p>
</div>
<div class=&quot;a&quot;>
<span class=&quot;qa-label&quot;>答</span>
<p>是菩薩<strong>新發意</strong>，能成小願，未能卻魔。此中薩陀波崙自說出血因緣——「我從無始生死已來，數數喪身，未曾為法」。</p>
</div>
</div>
<div class=&quot;commentary&quot;>
<div class=&quot;card-title&quot;>論義闡釋 · 位階限制與逆緣觸發</div>
<p>這段答曰的關鍵字是「<strong>新發意</strong>」。新發意菩薩雖已生起菩提心、能成就「小願」（如令華香湧出），但尚未具足「卻魔」的位階神力。論主在此沒有把「無法卻魔」當成失敗，反而當成<strong>逆緣觸發</strong>的精密設計——魔王的隱水，正是把菩薩推向「以血灑地」這個更高層次供養的催化劑。</p>
</div>
<h2>第二節　逆緣轉化方程式 · The Obstacle is the Way</h2>
<p>論文視覺解析中以三段式方程式呈現這一節的中觀邏輯——「無水（匱乏）」並非劇本的故障，而是讓菩薩從凡夫供養模式（外取資源）切換到聖者供養模式（內取本命）的<strong>轉軌器</strong>：</p>
<div class=&quot;flow&quot;>
<div class=&quot;flow-box&quot;><strong>① 無水</strong><small>Scarcity · 外部資源切斷</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>② 刺血灑地</strong><small>轉化福緣 · 將最珍貴之物作為祭品</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>③ 供養功德倍增</strong><small>魔本欲阻止，反成催化劑</small></div>
</div>
<div class=&quot;insight&quot;>
<div class=&quot;card-title&quot;>中觀洞見 · 障礙即是道路</div>
<p>原本是「外部變數」的惡魔，被菩薩用<strong>不退轉的願力</strong>反向利用，變成了「將水異質為血」的化學催化劑。這正是大乘菩薩道的核心邏輯之一——<strong>逆境並非道路的中斷，而是道路本身的一段</strong>。</p>
</div>
<h2>第三節　無始生死的沉沒成本 · 借假修真</h2>
<p>論主在解釋為何薩陀波崙會做出「自刺其身、出血灑地」這個極端決定時，引述了薩陀波崙的自述——「我從無始生死已來，數數喪身，未曾為法」。這句話的份量極重，因為它把整個輪迴重新定義為一筆<strong>沉沒成本</strong>（sunk cost）：</p>
<div class=&quot;two-col&quot;>
<div class=&quot;col&quot;>
<div class=&quot;card-title&quot; style=&quot;color:#4a76a8&quot;>虛妄的循環</div>
<p style=&quot;font-size:18px;line-height:1.85&quot;>Samsara's Sunk Cost——無量劫以來，這副身體已經為了貪欲、瞋恚、恐懼、慾望，毫無意義地喪失過無數次。這些「死」並未換取任何法的進境，是純粹的成本損耗。</p>
</div>
<div class=&quot;col&quot;>
<div class=&quot;card-title&quot;>借假修真</div>
<p style=&quot;font-size:18px;line-height:1.85&quot;>Repurposing the Illusion——既然這身體本就必然敗壞，把它用在「供養法」的當下，就把<strong>虛誑和合的假身</strong>，轉換成了承載無上菩提的堅固基石。</p>
</div>
</div>
<div class=&quot;commentary&quot;>
<div class=&quot;card-title&quot;>解讀提示 · 為什麼這不是自虐</div>
<p>很多讀者讀到「刺身灑地」會直覺想到苦行宗教的自虐傾向。但論主在這裡很清楚地把它放在「<strong>價值重估</strong>」的框架下——這不是盲目的痛苦堆積，而是一場極度理性的會計運算：用必然敗壞的無常之身，換取無上菩提的堅固基石。下一章將進入這個運算的具體執行層。</p>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<div class=&quot;bridge-label&quot;>承上啟下</div>
<p>魔隱水的本質既然是「位階測試 + 逆緣觸發」，那麼菩薩的應對就不是「找更多水」，而是直接昇華供養的等級。下一章「刺血灑地」會回答兩個關鍵問題：(1)如果刺身死了，誰來聽法？(2)為什麼這次魔王最終敗退——也就是著名的「無瘡不受毒」邏輯。</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-3&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第五品 · 第三章</div>
<div class=&quot;ch-name&quot;>刺血灑地 — 中觀防護機制</div>
<div class=&quot;ch-sub&quot;>三柱式存活邏輯 · 無瘡不受毒的緣起防護 · 割截如斷草木</div>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;>
<div class=&quot;bridge-label&quot;>本章要旨</div>
<p>「自刺其身」是本品最戲劇性的情節，也是最容易被誤讀的場景。論主在此用三組互相支撐的中觀理路，回答了「刺身為何不死」「魔為何最終敗退」「割截為何不妨菩提」三個問題，建立起菩薩道上著名的「無瘡不受毒」防護機制。</p>
</div>
<h2>第一節　三柱式存活邏輯 · 為何刺身而不死</h2>
<p>經文簡短地描述：薩陀波崙與諸女皆自刺其身，以血灑地，而<strong>「皆無異心」、魔不得便</strong>。論主隨即問——若身死，誰聽法？答曰之中藏著三根支柱：</p>
<div class=&quot;qa&quot;>
<div class=&quot;q&quot;>
<span class=&quot;qa-label&quot;>問</span>
<p>若薩陀波崙愛法，刺身出血，若其身死，誰復聽法？</p>
</div>
<div class=&quot;a&quot;>
<span class=&quot;qa-label&quot;>答</span>
<p>是事如「破骨出髓」中答——諸天大菩薩守護，令不死；惡魔知其心不可沮壞，水即還出；皆無異心者，初習慈心、為般若不惜身命，得利刀割身亦不生悔恨。</p>
</div>
</div>
<div class=&quot;tri-pillar&quot;>
<div class=&quot;pillar&quot;>
<div class=&quot;pillar-num&quot;>1</div>
<div class=&quot;pillar-title&quot;>諸天守護</div>
<div class=&quot;pillar-desc&quot;>外在防護網——天龍鬼神不忍見菩薩為法捨身，自然來護持。</div>
</div>
<div class=&quot;pillar&quot;>
<div class=&quot;pillar-num&quot;>2</div>
<div class=&quot;pillar-title&quot;>惡魔退卻</div>
<div class=&quot;pillar-desc&quot;>心理戰勝利——魔王知其「心不可沮壞」，反而灰心而退，水即還出。</div>
</div>
<div class=&quot;pillar&quot;>
<div class=&quot;pillar-num&quot;>3</div>
<div class=&quot;pillar-title&quot;>皆無異心</div>
<div class=&quot;pillar-desc&quot;>核心主因——若刺身痛逼而生悔恨者為「異心」；菩薩無此，故安全。</div>
</div>
</div>
<div class=&quot;insight&quot;>
<div class=&quot;card-title&quot;>中觀洞見 · 生死由法不由魔</div>
<p>三柱中最關鍵的是第三柱「皆無異心」。論主在這裡建立了一個極震撼的命題——<strong>純粹的動機，能改變物理因果的最高權限</strong>。並非身體不會痛、不會流血，而是心識不被「痛覺 → 悔意 → 異心」這條反射弧綁架。</p>
</div>
<h2>第二節　無瘡不受毒 · 法不孤起，仗境方生</h2>
<p>論文視覺解析最精采的設計，是把這一段提煉為「<strong>無瘡不受毒</strong>」的醫學模型——蛋型的菩薩心識被外部毒素（魔王）攻擊時，能否中毒，完全取決於內部是否有「瘡」（貪欲、憂愁）。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經文原典</span>
<p>「魔不得其便者，如人有瘡則受毒；菩薩若有貪欲、憂愁瘡者，魔得其便。以出血灑地，心不憂愁故，魔不得便。」</p>
</div>
<div class=&quot;four-grid&quot;>
<div class=&quot;cell&quot;>
<div class=&quot;cell-title&quot;>緣（外因）· 惡魔</div>
<p>魔王波旬象徵一切外來的逆緣、誘惑、攻擊——這是中觀體系裡的<strong>「境」</strong>。</p>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;cell-title&quot;>因（內因）· 憂悔</div>
<p>貪欲與憂愁是內部的破口——這是中觀體系裡的<strong>「瘡」</strong>。</p>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;cell-title&quot;>果（破壞）· 著魔</div>
<p>必須內因與外緣同時具足，破壞之果才能成立——這是<strong>「果」</strong>。</p>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;cell-title&quot;>防護 · 不留破口</div>
<p>菩薩心無憂愁、無貪欲，內因不立，魔再強也無<strong>「縫可乘」</strong>。</p>
</div>
</div>
<div class=&quot;commentary&quot;>
<div class=&quot;card-title&quot;>論義闡釋 · 中觀醫學邏輯</div>
<p>這正是緣起法則「<strong>法不孤起，仗境方生</strong>」的反向應用——把外境視為不可控、把內因視為可訓練。菩薩道的所有防護機制，從根本上都是針對「內因」做減法工程，而不是針對「外緣」做加法防禦。</p>
</div>
<h2>第三節　破虛誑 · 割截其身如斷草木</h2>
<p>論主接著推進第三層論證：即使身體真的受了傷，為什麼這也「<strong>不妨阿耨多羅三藐三菩提</strong>」？答案在於對「身體」這個概念的徹底重新定義。</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論文節錄</span>
<p>「又復見諸法實相畢竟空故，知是身但是<strong>虛誑和合</strong>；破是虛誑故，割截身時，不妨阿耨多羅三藐三菩提。」</p>
</div>
<div class=&quot;three-col&quot;>
<div class=&quot;col&quot;>
<div class=&quot;col-title&quot;>慈母忍辱觀</div>
<p style=&quot;font-size:17.5px&quot;>深悲心愛念眾生，雖受種種苦惱，不以為難——這是菩薩的情感層支撐。</p>
</div>
<div class=&quot;col&quot;>
<div class=&quot;col-title&quot;>實相空性觀</div>
<p style=&quot;font-size:17.5px&quot;>見諸法實相畢竟空，知此身唯是「<strong>虛誑和合</strong>」——這是菩薩的見地層支撐。</p>
</div>
<div class=&quot;col&quot;>
<div class=&quot;col-title&quot;>中觀辯證觀</div>
<p style=&quot;font-size:17.5px&quot;>肉身與草木皆<strong>無自性</strong>，損壞假身完全不妨真實之菩提——這是菩薩的邏輯層收束。</p>
</div>
</div>
<div class=&quot;insight&quot;>
<div class=&quot;card-title&quot;>釋提桓因的「未曾有」讚歎</div>
<p>論文視覺解析也記下這段佳話：帝釋天目睹這一幕後驚歎，<strong>「此人未得無生忍、諸煩惱未斷，為供養法故不惜身命，如諸離欲人無異」</strong>——這是來自天界對菩薩境界的最高評價：尚未斷盡煩惱，行持已與離欲聖人完全等同。</p>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<div class=&quot;bridge-label&quot;>承上啟下</div>
<p>刺血灑地之後，故事並未轉緩，反而隨即進入另一場壓力測試——帝釋天的當面讚歎。在凡夫位上，這種神聖肯定極易誘發我慢與停滯；但菩薩如何將這份「讚譽」當成「酥油」，讓精進之火越燒越旺？這就是下一章「如火得酥」的主題。</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-4&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第五品 · 第四章</div>
<div class=&quot;ch-name&quot;>如火得酥 — 帝釋讚歎與精進轉化</div>
<div class=&quot;ch-sub&quot;>順緣與逆緣同樣會考驗菩薩 · 任何善緣皆不停留，全數轉化為動能</div>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;>
<div class=&quot;bridge-label&quot;>本章要旨</div>
<p>中觀道上有一個鮮少被討論的問題——當你已經能扛住逆境（魔王、刺身），順境（諸天讚歎、感應現前）會不會反而成為你的下一個陷阱？這一章用「如火得酥」這個極漂亮的譬喻，回答了菩薩如何處理「順緣」這項更微細的考驗。</p>
</div>
<h2>第一節　帝釋未曾有讚 · 順緣的雙刃性</h2>
<p>釋提桓因親眼目睹刺血灑地後，發出了「未曾有」的讚歎——並以過去諸佛在因地的種種勇猛行為例，安慰薩陀波崙的心。這原本是極大的善緣，但論主立即點出順緣的<strong>雙刃性</strong>：</p>
<div class=&quot;two-col&quot;>
<div class=&quot;col&quot; style=&quot;border-left:4px solid #aa3a3a&quot;>
<div class=&quot;card-title&quot; style=&quot;color:#aa3a3a&quot;>凡夫反應 · 順緣即停滯</div>
<p style=&quot;font-size:18px&quot;>外部肯定容易立即觸發「我慢」「滿足感」「自我認同強化」——一旦進入這個迴路，修行的勢能就被消耗掉了。讚歎變成了讓火熄滅的水。</p>
</div>
<div class=&quot;col&quot; style=&quot;border-left:4px solid var(--gold)&quot;>
<div class=&quot;card-title&quot;>菩薩轉化 · 如火得酥</div>
<p style=&quot;font-size:18px&quot;>薩陀波崙不停留在「我被肯定了」這個感受裡，而是<strong>立刻生起下一個念頭</strong>——「當於何處得名華莊嚴法處？」讚譽變成了讓火越燒越旺的酥油。</p>
</div>
</div>
<h2>第二節　如火得酥的精進邏輯</h2>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論文節錄</span>
<p>「薩陀波崙受帝釋安慰後，精進<strong>轉熾</strong>，乃念敷座灑地後當於何處得華莊嚴。」</p>
</div>
<div class=&quot;flow&quot;>
<div class=&quot;flow-box&quot;><strong>外部輸入</strong><small>釋提桓因讚歎 · 諸天感應</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot; style=&quot;border-color:#aa3a3a;background:#fff6f0&quot;><strong>凡夫迴路（被攔截）</strong><small>我慢 → 滿足 → 停滯</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>菩薩迴路</strong><small>不停留 → 即時轉念 → 求華莊嚴</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>精進轉熾</strong><small>火得酥而轉旺，徹底燒盡虛榮</small></div>
</div>
<div class=&quot;insight&quot;>
<div class=&quot;card-title&quot;>中觀洞見 · 任何善緣皆不停留</div>
<p>在中觀道途上，順境與逆境的處理方式其實是同一個原則——<strong>「不取於相，如如不動」</strong>。逆境不取「苦相」、順境不取「樂相」，全數轉化為趨向菩提的動能。停留在哪一邊，都是另一種形式的失去。</p>
</div>
<div class=&quot;commentary&quot;>
<div class=&quot;card-title&quot;>為何「酥」是最好的比喻</div>
<p>「酥」是純化過的乳脂肪，本身就極易燃燒。論主選這個喻而不選「柴」或「炭」，是因為要強調這一份順緣不是<strong>原始燃料</strong>（會慢慢消耗自我），而是<strong>催化劑</strong>（能讓既有的火瞬間轉熾）。火的本體是菩薩自身的菩提心；酥只是讓它釋放出更大威力的添加物。</p>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<div class=&quot;bridge-label&quot;>承上啟下</div>
<p>帝釋讚歎之後，薩陀波崙立刻面臨下一個現實問題——時間不夠遠求名華莊嚴。他能不能像「刺血代水」那樣，再次設計出一個「不假外求」的優雅解法？這就是下一章「四大互換」的中觀決策模型。</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-5&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第五品 · 第五章</div>
<div class=&quot;ch-name&quot;>四大互換 — 不假外求的決策邏輯</div>
<div class=&quot;ch-sub&quot;>識破魔障 · 就地取材 · 水與血在勝義中的等價互換</div>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;>
<div class=&quot;bridge-label&quot;>本章要旨</div>
<p>這一章回到「為什麼是血、而不是別的東西」這個技術細節，揭示薩陀波崙作出「自刺取血」決策時所執行的完整中觀運算：先識破魔障、止損外求、再運用四大互換模型，把外水與內血在勝義層上等價對換。這是整本論裡最展現「中觀＝邏輯」的一段。</p>
</div>
<h2>第一節　識破與止損 · 先有水處即時皆無</h2>
<p>論主問了一個極為現代的反向問題——薩陀波崙當初不見水時，為什麼不去更遠的地方找水？這個提問本身就是一條中觀邏輯的測試題：</p>
<div class=&quot;qa&quot;>
<div class=&quot;q&quot;>
<span class=&quot;qa-label&quot;>問</span>
<p>不見水時，何以不作是念——當於何處得水？</p>
</div>
<div class=&quot;a&quot;>
<span class=&quot;qa-label&quot;>答</span>
<p>先有水處皆無，已知<strong>魔所作</strong>；故自於<strong>四大分中</strong>「刺水分」（血是命之所在）灑地。</p>
</div>
</div>
<div class=&quot;flow&quot;>
<div class=&quot;flow-box&quot;><strong>① 觀察</strong><small>先有水處即時皆無</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>② 推論</strong><small>判斷為「魔所作」的系統性干擾</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot; style=&quot;border-color:#aa3a3a;background:#fff6f0&quot;><strong>③ 排除誤判（不假外求）</strong><small>遠求更多水 → 中魔調虎離山計 → 錯過師父出定時機</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>④ 重新分配</strong><small>就地取材 · 轉向自身四大</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>⑤ 即時供養</strong><small>Optimal · 不超時、不失緣、不誤事</small></div>
</div>
<div class=&quot;insight&quot;>
<div class=&quot;card-title&quot;>中觀洞見 · 系統性干擾的識別</div>
<p>注意論主這裡建立的決策模型——當外部資源出現「<strong>系統性</strong>」缺失時，再多投入時間外求只會掉進對手設計的陷阱。正確策略是<strong>「切換維度」</strong>——把問題從「資源在哪裡」改為「我自身即是資源」。</p>
</div>
<h2>第二節　四大互換模型 · 界與空的等價</h2>
<p>論文視覺解析中最精采的一頁，是用維恩圖把「水大」與「性空」的交集點命名為「<strong>命之所在</strong>」（Locator of Life）。這個交集點之所以能被識別，正是因為菩薩同時掌握了「界」與「空」兩種屬性的對應關係。</p>
<div class=&quot;venn-wrap&quot;>
<div class=&quot;venn-circle venn-a&quot;>
          水大　Water Element
          <br/>
<small>外水 External River</small>
</div>
<div class=&quot;venn-circle venn-b&quot;>
          性空　Emptiness
          <br/>
<small>內水 Internal Blood</small>
</div>
</div>
<div class=&quot;venn-label&quot;>交集點 · 命之所在</div>
<div class=&quot;three-col&quot;>
<div class=&quot;col&quot;>
<div class=&quot;col-title&quot;>物理屬性 · 界</div>
<p style=&quot;font-size:17.5px&quot;>水大具有「濕性」「流動性」「滋潤性」——血液亦同。在四大分中皆屬「<strong>水分</strong>」。</p>
</div>
<div class=&quot;col&quot;>
<div class=&quot;col-title&quot;>勝義屬性 · 空</div>
<p style=&quot;font-size:17.5px&quot;>無論外水或內血，皆<strong>無自性</strong>；兩者作為「水」的本質是空的，沒有任何一邊比另一邊「更實在」。</p>
</div>
<div class=&quot;col&quot;>
<div class=&quot;col-title&quot;>價值變數 · 用</div>
<p style=&quot;font-size:17.5px&quot;>兩者唯一的差別在「<strong>用</strong>」——以承載生命的熱血灑地，在法界中的清淨度與重量，遠勝凡水。</p>
</div>
</div>
<h2>第三節　血為命之所在 · 供養的勝義昇華</h2>
<p>論主明確指出，菩薩之所以選擇血而非汗、唾、淚等其他「水分」，是因為血是<strong>「命之所在」</strong>——它在物理層只是體液之一，但在心理層代表了「生命本身」。把命的等價物灑在師父將出定的座地上，是把「供養」這個動作的勝義權重推到最高。</p>
<div class=&quot;metaphor&quot;>
<div class=&quot;card-title&quot;>譬喻 · 為什麼差別不在「物」，而在「用」</div>
<p>同樣是 100 公克的水，倒進臉盆與用來救活一個垂危者，重量是相同的、化學成分是相同的、空性是相同的——但其「<strong>用</strong>」完全不同。中觀並不否定差別，只是堅持差別不在物的自性，而在因緣的方向與發心的純度。</p>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<div class=&quot;bridge-label&quot;>承上啟下</div>
<p>水的問題用「刺血」解決了，但接著還缺最關鍵的莊嚴——華。曇無竭即將出定，時間絕對不允許遠求；而薩陀波崙的解法甚至比刺血更不可思議——他什麼都沒做，僅僅「生起一念」，三千石曼陀羅華便從天而降。這就是下一章「感應道交」的緣起法則。</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-6&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第五品 · 第六章</div>
<div class=&quot;ch-name&quot;>感應道交 — 曼陀羅華降下</div>
<div class=&quot;ch-sub&quot;>純粹心念與緣起法則 · 莊嚴的雙層地基 · 血與花共織的中道</div>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;>
<div class=&quot;bridge-label&quot;>本章要旨</div>
<p>本章呈現本品最具感應色彩、卻也最被中觀邏輯精密支撐的一段——薩陀波崙僅起一念，釋提桓因即知其念，並將三千石曼陀羅華降下。這不是宗教神話，而是緣起法則在「<strong>純粹心念</strong>」與「<strong>不可思議外緣</strong>」之間達到完美共振的實際演示。</p>
</div>
<h2>第一節　緣起感應的四步法則</h2>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>事件流</span>
<p>① 時間緊迫不容遠求 → ② 薩陀波崙生起純粹悲念 → ③ 釋提桓因感知其念 → ④ 三千石曼陀羅華降下</p>
</div>
<div class=&quot;flow&quot;>
<div class=&quot;flow-box&quot;><strong>① 極限條件</strong><small>時間緊迫不容遠求華</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>② 純粹心念</strong><small>無夾雜、無目的、無自利</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>③ 感應道交</strong><small>釋提桓因感知 · Indra's Resonance</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>④ 物化現前</strong><small>三千石曼陀羅華降下 · Materialization</small></div>
</div>
<div class=&quot;insight&quot;>
<div class=&quot;card-title&quot;>中觀洞見 · 花非自生，非無因生</div>
<p>論主在這裡再次強調中觀對「奇蹟」的處理態度——曼陀羅華<strong>並非自生</strong>（非無故而有），也<strong>非無因生</strong>（非外力無中生有），而是<strong>「悲願」與「護法」因緣和合</strong>而有。空性並未排除感應的可能性，反而是感應之所以可能的根本理由——正因為一切無自性、緣起而現，所以心念才能成為極強的感應誘因。</p>
</div>
<h2>第二節　莊嚴的雙層地基 · 血與花的交織</h2>
<p>論文視覺解析在這一節給出了極漂亮的「<strong>雙層地基</strong>」結構——曇無竭即將升座的法地，表層是天界曼陀羅華的莊嚴，底層是菩薩鮮血的沉澱。兩者並非互不相干，而是同一道法地的兩面。</p>
<div class=&quot;two-col&quot;>
<div class=&quot;col&quot; style=&quot;background:linear-gradient(180deg,#fdf6e8,#fff);border-top:4px solid var(--goldL)&quot;>
<div class=&quot;card-title&quot;>表層 · 花</div>
<p style=&quot;font-size:18px&quot;>天界曼陀羅華覆蓋莊嚴——代表<strong>極樂</strong>、<strong>感應</strong>、<strong>諸天護持</strong>。</p>
</div>
<div class=&quot;col&quot; style=&quot;background:linear-gradient(180deg,#f7eee5,#fff);border-top:4px solid #aa3a3a&quot;>
<div class=&quot;card-title&quot; style=&quot;color:#aa3a3a&quot;>底層 · 血</div>
<p style=&quot;font-size:18px&quot;>菩薩之血沉澱厚土——代表<strong>極苦</strong>、<strong>捨身</strong>、<strong>不退轉願</strong>。</p>
</div>
</div>
<div class=&quot;commentary&quot;>
<div class=&quot;card-title&quot;>中觀洞見 · 悲智雙運的道場土</div>
<p>菩薩同時鋪陳上端的「極苦的血」與「極樂的花」，<strong>共同編織的中道</strong>，正是般若智慧的動能——苦樂不互相抵消，而是互相成就。沒有底層的血，表層的花只是空中樓閣；沒有表層的花，底層的血只是無意義的犧牲。兩者一齊到位，才形成完整的「悲智雙運道場土」。</p>
</div>
<h2>第三節　帝釋分華的兩份用法</h2>
<p>經文細節提到，帝釋天將三千石曼陀羅華以「<strong>兩份</strong>」處理——一份散供曇無竭，一份覆覆地。這個細節在中觀解構中對應到「<strong>主從同時莊嚴</strong>」的供養藝術。</p>
<div class=&quot;four-grid&quot;>
<div class=&quot;cell&quot;>
<div class=&quot;cell-title&quot;>一份 · 散供</div>
<p>直接撒向曇無竭——這是對<strong>主體（法師）</strong>的供養。</p>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;cell-title&quot;>一份 · 覆地</div>
<p>鋪覆在莊嚴法地上——這是對<strong>法的承載場域</strong>的供養。</p>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;cell-title&quot;>勝義義涵 · 不偏</div>
<p>不獨供「人」、不獨敬「場」——人與處同時莊嚴，<strong>主體與處所等量</strong>。</p>
</div>
<div class=&quot;cell&quot;>
<div class=&quot;cell-title&quot;>中觀對應 · 二諦</div>
<p>主體＝世俗諦的「人」，場域＝第一義諦的「法」；分華兩份即是<strong>二諦俱供</strong>。</p>
</div>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<div class=&quot;bridge-label&quot;>承上啟下</div>
<p>地已備、花已降、座已設，準備工作至此完備。剩下的問題只有一個——曇無竭如何「<strong>從三昧起</strong>」？這個看似簡單的細節，卻牽涉到聲聞乘與菩薩乘對「禪定」最根本的看法差異。下一章將藉一段比丘「失火十二年」的悲劇對照，揭示二諦圓融的禪定觀。</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-7&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第五品 · 第七章</div>
<div class=&quot;ch-name&quot;>三昧出入機制 — 二諦圓融</div>
<div class=&quot;ch-sub&quot;>自作限齊 vs. 常在定 · 滅盡定比丘的悲劇 · 呪術出龍的譬喻</div>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;>
<div class=&quot;bridge-label&quot;>本章要旨</div>
<p>本品最具理論張力的問答之一在這裡：菩薩入了「無量阿僧祇」這種微妙至極的三昧，誰能令他起定？論主用「自作限齊」與「常在定」雙線結構回答，並以一段聲聞滅盡定比丘「失火十二年後身散而死」的歷史對照，鮮明地襯托出菩薩三昧的根本差異。</p>
</div>
<h2>第一節　自作限齊 vs. 常在定 · 兩種出定邏輯</h2>
<div class=&quot;qa&quot;>
<div class=&quot;q&quot;>
<span class=&quot;qa-label&quot;>問</span>
<p>諸菩薩入微妙三昧，誰能令起？</p>
</div>
<div class=&quot;a&quot;>
<span class=&quot;qa-label&quot;>答</span>
<p>(a) 行者<strong>自作限齊</strong>，時至自在從定起；(b) 法身菩薩<strong>如諸佛常入三昧</strong>，以神通力說法飛行，世俗法故有出入相。</p>
</div>
</div>
<div class=&quot;two-col&quot;>
<div class=&quot;col&quot; style=&quot;border-top:4px solid #4a76a8&quot;>
<div class=&quot;card-title&quot; style=&quot;color:#4a76a8&quot;>(a) 修行初階 · 自作限齊</div>
<p style=&quot;font-size:18px&quot;>行者入定前先設定條件——例如「七日後出定」「聞犍搥當起」「日影至某處則出」。出定的觸發點是<strong>預設的外緣</strong>。</p>
</div>
<div class=&quot;col&quot; style=&quot;border-top:4px solid var(--gold)&quot;>
<div class=&quot;card-title&quot;>(b) 法身菩薩 · 常在定中</div>
<p style=&quot;font-size:18px&quot;>如諸佛<strong>常入三昧</strong>，但能以神通力說法飛行——「<strong>出入定</strong>」只是世俗諦上的方便相，於第一義諦中本無出入。</p>
</div>
</div>
<h2>第二節　滅盡定比丘的十二年悲劇 · 緣起的制約</h2>
<p>為了凸顯第一種出定邏輯的脆弱性，論主特別提出一段令人心驚的反例——一位入滅受定的比丘，因為僧坊失火而錯失出定的因緣：</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論文節錄 · 反例</span>
<p>「滅受定比丘自期『聞犍搥當起』；後僧坊失火，無人打犍搥，過<strong>十二歲</strong>後重打方起——即身散而死。」</p>
</div>
<div class=&quot;flow&quot;>
<div class=&quot;flow-box&quot;><strong>① 入定</strong><small>期約「聞犍搥當起」</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot; style=&quot;border-color:#aa3a3a;background:#fff6f0&quot;><strong>② 失火</strong><small>無人打鐘 · 過十二歲</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot; style=&quot;border-color:#aa3a3a;background:#fff6f0&quot;><strong>③ 重打鐘</strong><small>聞聲即起 · 身散而死</small></div>
</div>
<div class=&quot;insight&quot;>
<div class=&quot;card-title&quot;>中觀洞見 · 即使滅盡定亦是「依待而有」</div>
<p>這段反例的衝擊力在於——即使是被聲聞乘視為極高境界的<strong>滅受定</strong>（俗稱「滅盡定」），依然受制於兩個因緣：(1) 入定前的<strong>誓願</strong>（心法）、(2) 出定時的<strong>鐘聲</strong>（色法）。鐘不打，定境本身就無法自行退出——這直接證明<strong>定境本身亦無自性</strong>，依然落在緣起法則之內。</p>
</div>
<h2>第三節　呪術出龍 · 大悲心牽引的二諦圓融</h2>
<p>對照之下，菩薩三昧的「出入」是另一回事。論主借用「<strong>呪術出龍</strong>」這個極形象的譬喻來說明：</p>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>論文節錄</span>
<p>「譬如<strong>呪術出龍</strong>，大眾圍繞者，是內眷屬……為說般若波羅蜜故。」</p>
</div>
<div class=&quot;three-col&quot;>
<div class=&quot;col&quot;>
<div class=&quot;col-title&quot;>定無出入 · 第一義諦</div>
<p style=&quot;font-size:17.5px&quot;>法身菩薩<strong>如龍潛深淵</strong>——其體常寂，本不曾離開三昧。</p>
</div>
<div class=&quot;col&quot;>
<div class=&quot;col-title&quot;>隨緣起用 · 世俗諦</div>
<p style=&quot;font-size:17.5px&quot;>大悲心<strong>如呪術</strong>，將菩薩從甚深三昧中牽引而出，為眾說法。</p>
</div>
<div class=&quot;col&quot;>
<div class=&quot;col-title&quot;>語言本質 · 不二</div>
<p style=&quot;font-size:17.5px&quot;>「因世諦名字語言，欲示眾生<strong>第一義不動相</strong>」——說「出定」只是世諦的方便。</p>
</div>
</div>
<h2>第四節　三昧出入對照矩陣</h2>
<p>把以上對照清楚地表格化，可以看到聲聞乘的滅盡定與菩薩乘的常在定，在四個維度上呈現出完全不同的結構：</p>
<table class=&quot;matrix-table&quot;>
<thead>
<tr><th>維度</th><th>聲聞乘 · 滅盡定</th><th>菩薩乘 · 常在定</th></tr>
</thead>
<tbody>
<tr><td>觸發機制</td><td>預設外緣（聞犍搥當起、日影至某處）</td><td>內在牽引——大悲心如呪術</td></tr>
<tr><td>心識狀態</td><td>封閉 · 界限明確</td><td>開放 · 動靜一如</td></tr>
<tr><td>脆弱性</td><td>易受物理因緣破壞（失火、無人打鐘）</td><td>自在無礙 · 神通力</td></tr>
<tr><td>本質定位</td><td>暫時切斷世間聯繫</td><td>於第一義不動而示現世俗出入</td></tr>
</tbody>
</table>
<div class=&quot;commentary&quot;>
<div class=&quot;card-title&quot;>論義闡釋 · 二諦圓融的禪定觀</div>
<p>菩薩三昧的精髓不在於「能否入得多深」，而在於——<strong>定中能起用、用中不離定</strong>。滅盡定追求的是「斷」（切斷世間），菩薩三昧追求的是「即」（即世俗即勝義）。曇無竭七年入定卻能準時為大眾開講般若，正是「定無出入而示現出入」的活演示。</p>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<div class=&quot;bridge-label&quot;>承上啟下</div>
<p>曇無竭出定，薩陀波崙終於見到夢寐七年的師父。此刻他生起了難以形容的歡喜——而這份歡喜的「品質」是什麼？是世俗的興奮，還是法的真實安樂？論主在最後一章用「第三禪樂」這個極精細的譬喻，把這份歡喜的層次逐一切開，並引向「實相無受」的最終收束。</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-8&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第五品 · 第八章</div>
<div class=&quot;ch-name&quot;>第三禪樂之喻 — 法喜的昇華</div>
<div class=&quot;ch-sub&quot;>七年熱渴與清冷美水 · 樂有四種何以但說第三禪 · 覺、捨、淨三層轉化</div>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;>
<div class=&quot;bridge-label&quot;>本章要旨</div>
<p>本品最後一個論主問答聚焦在一個極微細的問題——為什麼經文形容薩陀波崙見師之樂「<strong>如比丘入於第三禪</strong>」？三禪不是最高的禪定，但論主指出它是「樂之極」——這個選擇背後藏著對眾生心理的精密拿捏。本章順帶引出「實相無受」的最終收束，準備進入第九章的整品總攬。</p>
</div>
<h2>第一節　七年熱渴與清冷美水 · 極致對比</h2>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>經文與論文對照</span>
<p>「薩陀波崙菩薩見曇無竭菩薩，即時得清淨歡喜，<strong>樂遍其身，如比丘入於三禪</strong>。」</p>
<p>論曰：「多欲眾生雖非淨妙得猶喜樂，何況見真功德莊嚴身？」回顧七年渴仰、「<strong>濁煖潦水</strong>尚歡喜，何況<strong>清冷美水</strong>」之對比。</p>
</div>
<div class=&quot;two-col&quot;>
<div class=&quot;col&quot;>
<div class=&quot;card-title&quot;>匱乏感 · 七年大欲</div>
<p style=&quot;font-size:18px&quot;>薩陀波崙七年經行住立、不坐不臥、不睡眠、無欲恚惱——對見師、聞法的渴望已經累積到極限。</p>
</div>
<div class=&quot;col&quot;>
<div class=&quot;card-title&quot;>圓滿法身 · 真功德莊嚴</div>
<p style=&quot;font-size:18px&quot;>曇無竭出定的莊嚴身與真實功德，是<strong>最高品質的「水」</strong>。</p>
</div>
</div>
<div class=&quot;insight&quot;>
<div class=&quot;card-title&quot;>中觀洞見 · 極致的快樂 = 極致的匱乏 × 極致的圓滿</div>
<p>論主在這裡建立了一個極漂亮的「<strong>樂的乘法</strong>」——快樂的強度不取決於對象的好壞，而取決於「匱乏感（內因）」與「圓滿法身（外緣）」的<strong>猛烈碰撞</strong>。沒有七年的熱渴，見師也只是平淡的相見；沒有曇無竭的莊嚴身，七年的熱渴也找不到真實的對象。</p>
</div>
<h2>第二節　樂有四種，何以但說第三禪？</h2>
<div class=&quot;qa&quot;>
<div class=&quot;q&quot;>
<span class=&quot;qa-label&quot;>問</span>
<p>樂有四種，何以但說第三禪樂？</p>
</div>
<div class=&quot;a&quot;>
<span class=&quot;qa-label&quot;>答</span>
<p>欲界眾生於三受中<strong>多貪樂受</strong>；說涅槃<strong>無所有</strong>則心不喜，說上四禪<strong>斷苦樂</strong>則亦不樂；第三禪「<strong>樂之極</strong>」最能誘引。</p>
</div>
</div>
<p>論文視覺解析將這段提煉為一個「倒金字塔的排除法」——層層排除其他選項，最終第三禪樂被選為「以欲勾牽」的最佳載體：</p>
<div class=&quot;flow&quot;>
<div class=&quot;flow-box&quot; style=&quot;border-color:#aa3a3a;background:#fff6f0&quot;><strong>選項排除 ①</strong><small>涅槃樂 · 無所有 → 眾生心生恐懼</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot; style=&quot;border-color:#aa3a3a;background:#fff6f0&quot;><strong>選項排除 ②</strong><small>第四禪以上 · 斷苦樂 → 眾生覺枯燥</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot; style=&quot;border-color:#aa3a3a;background:#fff6f0&quot;><strong>選項排除 ③</strong><small>初禪、二禪 · 樂未達極 → 不足以代表</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>
<div class=&quot;flow-box&quot;><strong>最佳載體 · 第三禪</strong><small>三界中「身心快樂之極」 · 激發欲界眾生對般若法的嚮往</small></div>
</div>
<div class=&quot;commentary&quot;>
<div class=&quot;card-title&quot;>論義闡釋 · 以欲勾牽的菩薩教學法</div>
<p>這正是中觀「<strong>以欲勾牽，後令入佛智</strong>」的典型操作——不直接拋出眾生無法接受的「涅槃」「斷受」，而是先用他們最熟悉、最嚮往的「樂」作為入口。等他們進入這道門之後，再逐步引向「實相無受」的徹底見地。</p>
</div>
<h2>第三節　法喜昇華漏斗 · 覺、捨、淨三層轉化</h2>
<p>論主接著補充另一種解讀——薩陀波崙是<strong>新發意菩薩</strong>，尚未入細深妙定，見師生大歡喜<strong>「似」</strong>三禪樂；但他<strong>自覺後即時捨喜</strong>，得到真正的「清淨法性遍身安樂」。這就把全章導向了一個三層昇華的漏斗結構：</p>
<div class=&quot;flow&quot;>
<div class=&quot;flow-box&quot; style=&quot;border-color:#aa3a3a;background:#fff6f0&quot;><strong>① 大歡喜　Coarse Joy</strong><small>粗糙的情緒激盪 · 興奮 · Excitement</small></div>
<div class=&quot;flow-arrow&quot;>↓</div>

<div class=&quot;flow-arrow&quot;>↓</div>

</div>
<div class=&quot;three-col&quot;>
<div class=&quot;col&quot;>
<div class=&quot;col-title&quot;>覺　Awareness</div>
<p style=&quot;font-size:17.5px&quot;>見師首生大歡喜，立刻「<strong>自覺</strong>」——這份歡喜是激盪的、不可長住的。</p>
</div>
<div class=&quot;col&quot;>
<div class=&quot;col-title&quot;>捨　Renunciation</div>
<p style=&quot;font-size:17.5px&quot;>不沉溺於激盪情緒，執行「<strong>即時捨喜</strong>」——主動切斷歡喜的延展。</p>
</div>
<div class=&quot;col&quot;>
<div class=&quot;col-title&quot;>淨　Transformation</div>
<p style=&quot;font-size:17.5px&quot;>剝離粗糙情緒波動後，證入<strong>微細穩定的清淨法性遍身安樂</strong>。</p>
</div>

<h2>第四節　受的空性 · 實相無受名法性</h2>
<p>整個第三禪樂的譬喻，最終必須收束到中觀的根本見地——<strong>「諸法實相中，無苦亦無樂」</strong>。論主在這裡用兩極球體的形象，把「世俗諦上的說樂」與「第一義諦上的無受」並列起來：</p>
<div class=&quot;two-col&quot;>
<div class=&quot;col&quot;>
<div class=&quot;card-title&quot;>世俗諦 · 說樂</div>
<p style=&quot;font-size:18px&quot;>為度眾生必須建立「最」的標準——以「<strong>第三禪</strong>」作為三界中的「樂之極」標竿。</p>
</div>
<div class=&quot;col&quot;>
<div class=&quot;card-title&quot;>第一義 · 無受</div>
<p style=&quot;font-size:18px&quot;>薩陀波崙的「<strong>即時捨喜</strong>」，已實證「不執著於受」——這是受蘊的空性。</p>
</div>
</div>
<div class=&quot;insight&quot;>
<div class=&quot;card-title&quot;>中觀根本句 · 實相無受名法性</div>
<p>真正的法樂，<strong>不是情緒的亢奮，而是與空性相應的絕對掌持</strong>。論主在這裡完成了本品最後一道收束——所有看似熱烈的事相（七年熱渴、見師歡喜、樂遍其身），最終都要被導回到「無受、無染、寂滅」的真如不動相，與第一章的「諸佛無來無去」遙相呼應，整個閉環完成。</p>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<div class=&quot;bridge-label&quot;>承上啟下</div>
<p>八章的事相層、論理層、實證層已全部展開。為了讓讀者能在離開本網頁時帶走一張「可隨身攜帶的中觀地圖」，最後一章將以兩個總攬性的視覺裝置——「五節點上升光帶」與「事件·心法·中觀理路三欄總表」——把整品的精華壓縮為單頁的可帶走藍圖。</p>
</div>
</div>
</section>

<section class=&quot;chapter&quot; id=&quot;chapter-9&quot;>
<div class=&quot;ch-head&quot;>
<div class=&quot;ch-num&quot;>卷九十九 · 第五品 · 第九章</div>
<div class=&quot;ch-name&quot;>中觀實踐總表 — 整品收束</div>
<div class=&quot;ch-sub&quot;>五節點上升光帶 · 事件·心法·中觀理路三欄總表 · 悲智雙運的幾何學</div>
</div>
<div class=&quot;ch-body&quot;>
<div class=&quot;bridge bridge-intro&quot;>
<div class=&quot;bridge-label&quot;>本章要旨</div>
<p>前八章逐節拆解，本章為總綱回收。沿用論文視覺解析最後三頁的「五節點上升光帶」與「三欄總表」兩個視覺裝置，把薩陀波崙菩薩在本品中走過的中觀實踐軌跡，壓縮為一張可帶走的單頁藍圖。</p>
</div>
<h2>第一節　五節點上升光帶 · 中觀壓力測試的軌跡</h2>
<p>薩陀波崙的旅程<strong>並非單純的苦行故事</strong>，而是一場連續的「中觀壓力測試」——每一次的極限挑戰，都透過「無自性」的認知，將逆境轉化為向上一路的階梯。下圖呈現整品最核心的五個轉折節點：</p>
<div class=&quot;ladder&quot;>
<div class=&quot;step&quot;><span class=&quot;num&quot;>1</span><span class=&quot;lab&quot;>確診魔障</span><span class=&quot;ar&quot;>→</span><span class=&quot;dx&quot;>先有水處皆無 · 識破系統性干擾 · 不假外求</span></div>
<div class=&quot;step&quot;><span class=&quot;num&quot;>2</span><span class=&quot;lab&quot;>四大互換</span><span class=&quot;ar&quot;>→</span><span class=&quot;dx&quot;>刺血為水 · 界與空的等價 · 命之所在</span></div>
<div class=&quot;step&quot;><span class=&quot;num&quot;>3</span><span class=&quot;lab&quot;>無瘡受毒</span><span class=&quot;ar&quot;>→</span><span class=&quot;dx&quot;>心無憂愁 · 不留破口 · 法不孤起</span></div>
<div class=&quot;step&quot;><span class=&quot;num&quot;>4</span><span class=&quot;lab&quot;>緣起感應</span><span class=&quot;ar&quot;>→</span><span class=&quot;dx&quot;>純粹悲念 · 招引天華 · 依待而有</span></div>
<div class=&quot;step&quot;><span class=&quot;num&quot;>5</span><span class=&quot;lab&quot;>捨喜得淨</span><span class=&quot;ar&quot;>→</span><span class=&quot;dx&quot;>即時捨離 · 證入法性 · 實相無受</span></div>
</div>
<h2>第二節　事件·心法·中觀理路三欄總表</h2>
<p>把上節五節點橫向展開，每一節點同時呈現「事件層」「心法層」「中觀理路層」三個維度，便構成本品的中觀實踐總表。這張表是讀完本品之後最重要的單頁帶走資產：</p>
<table class=&quot;summary-table&quot;>
<thead>
<tr><th>事件 · Event</th><th>核心心法 · Mind Method</th><th>中觀理路 · Madhyamaka Logic</th></tr>
</thead>
<tbody>
<tr>
<td>魔王隱水</td>
<td>不假外求 · 就地取材</td>
<td>界與空的互換（四大非我）</td>
</tr>
<tr>
<td>刺血灑地</td>
<td>心無憂愁 · 如斷草木</td>
<td>緣起防護（無瘡不受毒）</td>
</tr>
<tr>
<td>渴望莊嚴</td>
<td>悲心生念 · 發希有心</td>
<td>感應道交（依待而有）</td>
</tr>
<tr>
<td>師從定起</td>
<td>大悲牽引 · 常在定中</td>
<td>二諦圓融（不動而示現）</td>
</tr>
<tr>
<td>見師狂喜</td>
<td>自覺大喜 · 即時捨離</td>
<td>受無自性（實相無受）</td>
</tr>
</tbody>
</table>
<h2>第三節　悲智雙運的幾何學 · 整品結語</h2>
<div class=&quot;verse&quot;>
        在《大智度論》的精密拆解下，<br/>
        薩陀波崙菩薩的血、淚、花與狂喜，<br/>
        不再是神話的浪漫修辭。<br/>
        它們是依循「<strong>緣起性空</strong>」法則，精準運算的<strong>「中觀方程式」</strong>。<br/>
        無情剝離一切虛妄，只為承載最極致的大悲。
      </div>
<div class=&quot;classical-text&quot;>
<span class=&quot;text-label&quot;>尾引 · 全卷迴向</span>
<p>「行般若波羅蜜，近阿耨多羅三藐三菩提，名為<strong>真佛弟子</strong>。」</p>
</div>
<div class=&quot;insight&quot;>
<div class=&quot;card-title&quot;>與第一章遙相呼應 · 整品閉環</div>
<p>本品的開卷是「諸佛<strong>無來無去</strong>」的不動實相，本品的收束是「行般若波羅蜜，近阿耨多羅三藐三菩提」的動進實踐。<strong>不動而動、動而不離不動</strong>——正是悲智雙運的幾何學最簡潔的描述。薩陀波崙從事相層的刺血灑地，一直走到實證層的「實相無受名法性」，整段旅程證明了中觀道並非靜止的玄談，而是可以在血淚與狂喜中精確驗算的活實踐。</p>
</div>
<div class=&quot;bridge bridge-outro&quot;>
<div class=&quot;bridge-label&quot;>全品終</div>
<p>本品（卷九十九 · 第五品）至此九章俱足。讀者若願意進一步深入，可回頭重讀第一章的「五重實相塔」——此時當會發現，那五重比喻所要承擔的，不只是知識性的「諸法如幻」，更是本品所有事相層情節（魔、水、血、華、樂）共同指向的同一個底層真實：諸法畢竟空、緣起無自性、悲智雙運、無來無去。</p>
</div>
</div>

<script>

  var sbBrand=document.getElementById('sbBrand');

  // ===== 漢堡 =====
  var sbT=document.getElementById('sbToggle'),sb=document.getElementById('sb');

  // ===== 進度膠囊 =====

  }
  window.addEventListener('scroll',updateProgress,{passive:true});

  // ===== iframe 自動高度（body.scrollHeight, no buffer） =====
  function resizeFrame(f){
    try{
      var d=f.contentDocument||f.contentWindow.document;
      if(!d||!d.body)return;
      d.body.style.minHeight='0';d.body.style.height='auto';
      if(d.documentElement){d.documentElement.style.minHeight='0';d.documentElement.style.height='auto';}

      if(h>100){f.style.height=h+'px';f.style.minHeight='0';}
    }catch(e){}
  }
  function resizeAllFrames(){
    document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
    if(typeof updateProgress==='function')updateProgress();
  }
  function setupFrame(f){

    else{f.addEventListener('load',tick);}
  }
  document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
  var rzT;
  window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(resizeAllFrames,200);});

  // ===== 錨點點擊保險 =====
  document.addEventListener('click',function(e){
    var a=e.target;while(a&&a.tagName!=='A')a=a.parentElement;

  // ===== 持續輪詢 =====

    }
    items.forEach(function(it,i){it.classList.toggle('active',i===idx);});
  }
  window.addEventListener('scroll',updateActive,{passive:true});updateActive();
})();
</script>
